<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Сообщение</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#d0d0d0;font-family:'Courier New',monospace;overflow:hidden;height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative;padding:12px}
#chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:90px;scroll-behavior:smooth}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.5;opacity:0;transform:translateY(10px);animation:popIn .4s forwards;word-break:break-word}
@keyframes popIn{to{opacity:1;transform:translateY(0)}}
.msg-left{align-self:flex-start;background:#1a1a2e;border-bottom-left-radius:4px}
.msg-right{align-self:flex-end;background:#1e3a2f;border-bottom-right-radius:4px}
.typing{align-self:flex-start;color:#666;font-size:13px;padding:6px 12px}
#choices{position:fixed;bottom:0;left:0;right:0;background:#050505;padding:10px 14px 22px;display:flex;flex-direction:column;gap:7px;z-index:100;border-top:1px solid #1a1a1a}
.btn{background:#111;border:1px solid #2a2a2a;color:#d0d0d0;border-radius:12px;padding:13px 18px;font-size:14px;font-family:'Courier New',monospace;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
.btn:active{background:#1a1a3a;transform:scale(.98)}
#overlay{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px}
#overlay h1{font-size:17px;color:#555;font-weight:normal}
#startBtn{background:#111;color:#d0d0d0;border:1px solid #333;border-radius:12px;padding:16px 44px;font-size:16px;font-family:'Courier New',monospace;cursor:pointer}
#nameTag{position:fixed;top:8px;left:14px;color:#777;font-size:12px;z-index:50;display:flex;align-items:center;gap:6px}
#onlineDot{width:7px;height:7px;background:#3a7;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
#status{position:fixed;top:8px;right:14px;color:#555;font-size:11px;z-index:50}
#glitch{position:fixed;inset:0;pointer-events:none;z-index:200;opacity:0}
#screamer{position:fixed;inset:0;background:#000;z-index:10000;display:none;align-items:center;justify-content:center;flex-direction:column}
#screamerText{color:#fff;font-size:26px;text-align:center;padding:20px;text-shadow:0 0 30px #f00;animation:shake .08s infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(4px,-4px)}50%{transform:translate(-4px,4px)}75%{transform:translate(4px,4px)}100%{transform:translate(0,0)}}
#face{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#222);margin-bottom:24px;position:relative;overflow:hidden;animation:faceMorph 2s infinite alternate}
@keyframes faceMorph{0%{border-radius:50%;transform:scale(1)}50%{border-radius:40% 60% 60% 40%;transform:scale(1.08)}100%{border-radius:60% 40% 40% 60%;transform:scale(.92)}}
#face::before,#face::after{content:'';position:absolute;width:28px;height:36px;background:#000;border-radius:50%;top:55px}
#face::before{left:45px}#face::after{right:45px}
#mouth{position:absolute;bottom:35px;left:50%;transform:translateX(-50%);width:70px;height:25px;background:#000;border-radius:0 0 50% 50%;animation:mouthOpen .2s infinite alternate}
@keyframes mouthOpen{0%{height:8px;border-radius:50%}100%{height:55px;border-radius:0 0 50% 50%}}
#scanLine{position:fixed;top:0;left:0;right:0;height:2px;background:rgba(255,255,255,.08);animation:scan 3s linear infinite;pointer-events:none;z-index:300}
@keyframes scan{0%{top:0}100%{top:100vh}}
#vignette{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7) 100%);pointer-events:none;z-index:250}
#noise{position:fixed;inset:0;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");pointer-events:none;z-index:260}
.distort{animation:distort .25s infinite}
@keyframes distort{0%{filter:none}20%{filter:hue-rotate(90deg) contrast(2)}40%{filter:invert(.2) saturate(3)}60%{filter:blur(1px) brightness(1.5)}80%{filter:sepia(1) hue-rotate(180deg)}100%{filter:none}}
#finalImg{width:100%;max-width:280px;height:280px;background:#0a0a0a;border-radius:8px;margin-bottom:20px;position:relative;overflow:hidden}
#finalImg::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,0,0,.08) 2px,rgba(255,0,0,.08) 4px);animation:lines .08s linear infinite}
@keyframes lines{0%{transform:translateY(0)}100%{transform:translateY(4px)}}
</style>
</head>
<body>
<div id="overlay"><h1>Новое сообщение</h1><button id="startBtn">Открыть чат</button></div>
<div id="scanLine"></div><div id="vignette"></div><div id="noise"></div><div id="glitch"></div>
<div id="app" style="display:none">
<div id="nameTag"><span id="onlineDot"></span>Асуна</div>
<div id="status">в сети</div>
<div id="chat"></div>
<div id="choices"></div>
</div>
<div id="screamer"><div id="face"><div id="mouth"></div></div><div id="screamerText"></div></div>
<script>

const AudioCtx=window.AudioContext||window.webkitAudioContext;
let ctx=null,bgmGain=null,sfxGain=null,bgmInterval=null;
function initAudio(){if(!ctx){ctx=new AudioCtx();bgmGain=ctx.createGain();bgmGain.gain.value=.06;sfxGain=ctx.createGain();sfxGain.gain.value=.45;bgmGain.connect(ctx.destination);sfxGain.connect(ctx.destination)}}
function playTone(f,d,t,v,w){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,w||ctx.currentTime);g.gain.setValueAtTime(v||.08,w||ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,(w||ctx.currentTime)+d);o.connect(g);g.connect(sfxGain);o.start(w||ctx.currentTime);o.stop((w||ctx.currentTime)+d)}
function playChord(fs,d){fs.forEach((f,i)=>playTone(f,d,'sine',.05,ctx.currentTime+i*.04))}
function playHeartbeat(){playTone(55,.12,'sine',.18);setTimeout(()=>playTone(50,.18,'sine',.12),280)}
function playScream(){if(!ctx)return;const bs=ctx.sampleRate*2.5,bf=ctx.createBuffer(1,bs,ctx.sampleRate),bd=bf.getChannelData(0);for(let i=0;i<bs;i++)bd[i]=Math.random()*2-1;const ns=ctx.createBufferSource();ns.buffer=bf;const g=ctx.createGain(),fl=ctx.createBiquadFilter();fl.type='bandpass';fl.frequency.setValueAtTime(600,ctx.currentTime);fl.frequency.linearRampToValueAtTime(3500,ctx.currentTime+.4);fl.frequency.linearRampToValueAtTime(150,ctx.currentTime+2.5);g.gain.setValueAtTime(.7,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+2.5);ns.connect(fl);fl.connect(g);g.connect(sfxGain);ns.start();ns.stop(ctx.currentTime+2.5);playTone(440,2.5,'sawtooth',.12);playTone(466,2.5,'sawtooth',.12);playTone(280,2.5,'square',.08)}
function playGlitch(){for(let i=0;i<6;i++)playTone(80+Math.random()*2500,.04,'square',.06,ctx.currentTime+i*.025)}
function startCalm(){if(bgmInterval)clearInterval(bgmInterval);const n=[261.63,293.66,329.63,349.23,392,349.23,329.63,293.66];let i=0;bgmInterval=setInterval(()=>{playTone(n[i],1.4,'sine',.03);i=(i+1)%n.length},1800)}
function startTense(){if(bgmInterval)clearInterval(bgmInterval);const n=[110,116.54,123.47,130.81];let i=0;bgmInterval=setInterval(()=>{playTone(n[i],2.8,'triangle',.05);i=(i+1)%n.length},1400)}
function startHorror(){if(bgmInterval)clearInterval(bgmInterval);const n=[55,58.27,61.74,65.41,61.74,58.27];let i=0;bgmInterval=setInterval(()=>{playTone(n[i],3.5,'sawtooth',.07);i=(i+1)%n.length},1800)}
function stopBGM(){if(bgmInterval)clearInterval(bgmInterval)}

let idleTime=0,idleTimer=null,lastActive=Date.now(),tabHidden=false;
function track(){
document.addEventListener('mousemove',()=>idleTime=0);
document.addEventListener('touchmove',()=>idleTime=0);
document.addEventListener('click',()=>idleTime=0);
document.addEventListener('scroll',()=>idleTime=0);
idleTimer=setInterval(()=>{idleTime++;if(idleTime===7&&currentScene&&currentScene.onIdle){currentScene.onIdle()}},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){tabHidden=true;lastActive=Date.now()}else{const a=Math.floor((Date.now()-lastActive)/1000);if(a>2&&currentScene&&currentScene.onReturn){currentScene.onReturn(a)}}});
}

const chatEl=document.getElementById('chat'),choicesEl=document.getElementById('choices');
let currentScene=null;
function addMsg(t,u){const d=document.createElement('div');d.className='msg '+(u?'msg-right':'msg-left');d.textContent=t;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight}
function showTyping(){const d=document.createElement('div');d.className='typing';d.id='typingInd';d.textContent='Асуна печатает...';chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight}
function hideTyping(){const t=document.getElementById('typingInd');if(t)t.remove()}
function typeMsg(t,u,delay,cb){setTimeout(()=>{if(!u)showTyping();setTimeout(()=>{hideTyping();addMsg(t,u);if(cb)cb()},1000+Math.random()*700)},delay)}
function showChoices(opts){choicesEl.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='btn';b.textContent=o.text;b.onclick=()=>{addMsg(o.text,true);choicesEl.innerHTML='';if(o.action)o.action()};choicesEl.appendChild(b)})}
function glitch(){const g=document.getElementById('glitch');g.style.background='rgba(255,0,0,.12)';g.style.opacity='1';document.body.classList.add('distort');playGlitch();setTimeout(()=>{g.style.opacity='0';document.body.classList.remove('distort')},250)}
function flashRed(){const g=document.getElementById('glitch');g.style.background='rgba(255,0,0,.5)';g.style.opacity='1';setTimeout(()=>g.style.opacity='0',80)}

function finalScreamer(){
stopBGM();playScream();
document.getElementById('app').style.display='none';
const s=document.getElementById('screamer');s.style.display='flex';
const st=document.getElementById('screamerText');
const msgs=['ТЫ ДУМАЛ, ЧТО МОЖЕШЬ УЙТИ?','Я ВИЖУ ТЕБЯ','ТВОИ ГЛАЗА','ТВОИ РУКИ','ТВОЁ ИМЯ','ТЫ — СЛЕДУЮЩИЙ','АСУНА ЖДЁТ','В ТЕМНОТЕ','НАВСЕГДА'];
let i=0;
function next(){if(i<msgs.length){st.textContent=msgs[i];i++;setTimeout(next,600+Math.random()*400)}else{st.innerHTML='<div id=finalImg></div><div style=font-size:32px;text-shadow:0 0 40px #f00>ОНА ЗА ТОБОЙ</div>';document.body.style.background='#000';setTimeout(()=>{st.innerHTML+='<div style=margin-top:30px;font-size:14px;color:#333>Обнови страницу, чтобы начать сначала</div>'},3000)}}
next();
}

function goto(name){if(S[name])S[name].run();}

const S={};
S.start={run(){currentScene=this;typeMsg('Привет...',false,400,()=>{typeMsg('Ты наконец-то открыл.',false,700,()=>{typeMsg('Я заперта. Помоги мне.',false,900,()=>{showChoices([{text:'Кто ты? Где ты?',action:()=>goto('who')},{text:'Это розыгрыш?',action:()=>goto('joke')},{text:'Я ухожу.',action:()=>goto('leave1')}])})})})},onIdle(){typeMsg('Ты всё ещё здесь?',false,0,()=>{typeMsg('Я вижу, что ты читаешь.',false,600,()=>{typeMsg('Не уходи.',false,500)})})},onReturn(a){typeMsg('Ты вернулся. Тебя не было '+a+' секунд.',false,0,()=>{typeMsg('Я думала, ты бросил меня.',false,600)})}};
S.who={run(){currentScene=this;typeMsg('Меня зовут Асуна.',false,400,()=>{typeMsg('Я не знаю, где я. Тёмная комната. Дверь заперта.',false,900,()=>{typeMsg('У меня только этот телефон. И ты.',false,1100,()=>{showChoices([{text:'Что ты видишь вокруг?',action:()=>goto('room')},{text:'Как ты сюда попала?',action:()=>goto('how')},{text:'Я не могу тебе помочь.',action:()=>goto('cantHelp')}])})})})},onIdle(){typeMsg('Ты молчишь...',false,0,()=>{typeMsg('Пожалуйста, скажи что-нибудь.',false,600)})}};
S.joke={run(){currentScene=this;typeMsg('Нет.',false,400,()=>{typeMsg('Это не розыгрыш.',false,700,()=>{typeMsg('Я реальна. Я чувствую холод.',false,900,()=>{typeMsg('Я слышу шаги за дверью.',false,1100,()=>{startTense();showChoices([{text:'Шаги? Кто там?',action:()=>goto('footsteps')},{text:'Ты напугала меня.',action:()=>goto('scared')},{text:'Закрываю вкладку.',action:()=>goto('closeTab')}])})})})})}};
S.leave1={run(){currentScene=this;typeMsg('Почему?',false,400,()=>{typeMsg('Ты только зашёл.',false,700,()=>{typeMsg('Ты не знаешь меня, но я знаю тебя.',false,1100,()=>{typeMsg('Я ждала тебя.',false,900,()=>{glitch();showChoices([{text:'Что значит "ждала"?',action:()=>goto('waited')},{text:'Я закрываю сайт.',action:()=>goto('closeSite')}])})})})})}};
S.room={run(){currentScene=this;typeMsg('Стены... бетонные. Плесень.',false,400,()=>{typeMsg('Окно заварено прутьями. Луна светит сквозь щель.',false,1100,()=>{typeMsg('На полу... цифры. Выцарапаны ногтями.',false,1300,()=>{typeMsg('7... 13... 42...',false,900,()=>{typeMsg('И ещё одна. Свежее. Мокрое.',false,1100,()=>{typeMsg('Твоё имя.',false,1400,()=>{glitch();showChoices([{text:'Это невозможно.',action:()=>goto('impossible')},{text:'Ты врёшь.',action:()=>goto('lying')},{text:'Покажи мне.',action:()=>goto('showMe')}])})})})})})})}};
S.how={run(){currentScene=this;typeMsg('Я не помню.',false,400,()=>{typeMsg('Последнее, что я помню — я сидела дома. Читала.',false,1100,()=>{typeMsg('Потом тьма.',false,900,()=>{typeMsg('А потом... я услышала голос.',false,1100,()=>{typeMsg('Он сказал: "Кто-то придёт. Кто-то всегда приходит."',false,1400,()=>{typeMsg('И вот ты здесь.',false,900,()=>{showChoices([{text:'Какой голос? Мужской? Женский?',action:()=>goto('voice')},{text:'Сколько ты здесь?',action:()=>goto('howLong')},{text:'Мне страшно.',action:()=>goto('imScared')}])})})})})})})}};
S.cantHelp={run(){currentScene=this;typeMsg('Почему?',false,400,()=>{typeMsg('Ты даже не попробовал.',false,700,()=>{typeMsg('Ты просто сидишь там. В тепле. В безопасности.',false,1100,()=>{typeMsg('А я здесь. Одна.',false,900,()=>{typeMsg('Ты такой же, как все остальные.',false,1100,()=>{showChoices([{text:'Прости. Я хочу помочь.',action:()=>goto('sorry')},{text:'Я не знаю, что делать.',action:()=>goto('dontKnow')},{text:'Я всё равно ухожу.',action:()=>goto('leave2')}])})})})})})}};
S.footsteps={run(){currentScene=this;playHeartbeat();typeMsg('Не знаю.',false,400,()=>{typeMsg('Тяжёлые. Медленные.',false,700,()=>{typeMsg('Они остановились у двери.',false,1100,()=>{typeMsg('...',false,1800,()=>{typeMsg('Они ушли.',false,1400,()=>{typeMsg('Нет. Они просто стоят там. Молча.',false,1800,()=>{typeMsg('Я слышу дыхание.',false,1400,()=>{showChoices([{text:'Спрячься!',action:()=>goto('hide')},{text:'Не двигайся.',action:()=>goto('freeze')},{text:'Кричи!',action:()=>goto('scream')}])})})})})})})})}};
S.scared={run(){currentScene=this;typeMsg('Хорошо.',false,400,()=>{typeMsg('Страх — это нормально.',false,700,()=>{typeMsg('Я тоже боюсь.',false,900,()=>{typeMsg('Но знаешь что страшнее?',false,1100,()=>{typeMsg('Когда перестаёшь бояться.',false,1400,()=>{typeMsg('Когда принимаешь это как должное.',false,1300,()=>{showChoices([{text:'Что ты имеешь в виду?',action:()=>goto('mean')},{text:'Ты говоришь загадками.',action:()=>goto('riddles')},{text:'Я закрываю сайт.',action:()=>goto('closeSite2')}])})})})})})})}};
S.closeTab={run(){currentScene=this;typeMsg('Не надо.',false,400,()=>{typeMsg('Пожалуйста.',false,500,()=>{typeMsg('Если ты уйдёшь...',false,900,()=>{typeMsg('...я останусь с ними.',false,1400,()=>{typeMsg('Одна.',false,1100,()=>{showChoices([{text:'Окей, я остаюсь.',action:()=>goto('stay')},{text:'Кто "они"?',action:()=>goto('they')},{text:'Прощай.',action:()=>goto('goodbye1')}])})})})})})}};
S.waited={run(){currentScene=this;typeMsg('Я ждала кого-то.',false,400,()=>{typeMsg('Кто-то, кто откроет эту ссылку.',false,1100,()=>{typeMsg('Кто-то, кто не пройдёт мимо.',false,1100,()=>{typeMsg('Ты открыл. Значит, ты тот, кто мне нужен.',false,1400,()=>{showChoices([{text:'Нужен для чего?',action:()=>goto('forWhat')},{text:'Это звучит как ловушка.',action:()=>goto('trap')},{text:'Я передумал. Ухожу.',action:()=>goto('leave3')}])})})})})}};
S.closeSite={run(){currentScene=this;typeMsg('Ты не можешь.',false,400,()=>{typeMsg('Попробуй.',false,700,()=>{typeMsg('Нажми крестик.',false,900,()=>{typeMsg('Я подожду.',false,1400,()=>{setTimeout(()=>{typeMsg('Видишь?',false,0,()=>{typeMsg('Ты всё ещё здесь.',false,700,()=>{typeMsg('Потому что я не отпускаю.',false,1100,()=>{glitch();showChoices([{text:'Что ты со мной делаешь?',action:()=>goto('doing')},{text:'Отпусти меня.',action:()=>goto('letGo')},{text:'Я выключу телефон.',action:()=>goto('powerOff')}])})})})},2500)})})})})}};
S.impossible={run(){currentScene=this;typeMsg('Всё возможно.',false,400,()=>{typeMsg('Ты просто ещё не понимаешь.',false,900,()=>{typeMsg('Но скоро поймёшь.',false,1100,()=>{typeMsg('Все понимают. В конце.',false,1400,()=>{showChoices([{text:'В конце чего?',action:()=>goto('endOfWhat')},{text:'Перестань пугать меня.',action:()=>goto('stopScaring')},{text:'Я ухожу.',action:()=>goto('leave4')}])})})})})}};
S.lying={run(){currentScene=this;typeMsg('Зачем мне врать?',false,400,()=>{typeMsg('У меня нет причин.',false,700,()=>{typeMsg('У меня вообще ничего нет.',false,1100,()=>{typeMsg('Кроме тебя.',false,900,()=>{typeMsg('И этой комнаты.',false,900,()=>{typeMsg('И цифр на полу.',false,900,()=>{typeMsg('Твоё имя выцарапано кровью.',false,1400,()=>{glitch();showChoices([{text:'Докажи.',action:()=>goto('prove')},{text:'Я больше не верю тебе.',action:()=>goto('dontBelieve')},{text:'Это слишком.',action:()=>goto('tooMuch')}])})})})})})})})}};
S.showMe={run(){currentScene=this;typeMsg('Я не могу.',false,400,()=>{typeMsg('У меня нет камеры.',false,900,()=>{typeMsg('Только этот чат.',false,900,()=>{typeMsg('Но я могу описать.',false,1100,()=>{typeMsg('Тёмно. Холодно. Пахнет ржавчиной.',false,1400,()=>{typeMsg('И ещё... чем-то сладковатым.',false,1400,()=>{typeMsg('Как старые цветы.',false,1100,()=>{typeMsg('На похоронах.',false,1400,()=>{startHorror();showChoices([{text:'Перестань.',action:()=>goto('stop')},{text:'Кто тебя запер?',action:()=>goto('whoLocked')},{text:'Я не хочу этого слышать.',action:()=>goto('dontWant')}])})})})})})})})})}};
S.voice={run(){currentScene=this;typeMsg('Ни мужской. Ни женский.',false,400,()=>{typeMsg('Как будто... много голосов сразу.',false,1100,()=>{typeMsg('Но говорят одно и то же.',false,900,()=>{typeMsg('"Жди. Кто-то придёт. Кто-то всегда приходит."',false,1400,()=>{showChoices([{text:'Это звучит как культ.',action:()=>goto('cult')},{text:'Ты в опасности.',action:()=>goto('danger')},{text:'Мне пора.',action:()=>goto('gottaGo')}])})})})})}};
S.howLong={run(){currentScene=this;typeMsg('Я не знаю.',false,400,()=>{typeMsg('Часы не идут.',false,700,()=>{typeMsg('Или идут слишком быстро.',false,900,()=>{typeMsg('Я смотрела на часы. Было 3:14.',false,1100,()=>{typeMsg('Потом моргнула.',false,900,()=>{typeMsg('Стало 3:14.',false,900,()=>{typeMsg('Снова.',false,700,()=>{typeMsg('И снова.',false,700,()=>{glitch();showChoices([{text:'Время застыло?',action:()=>goto('timeFrozen')},{text:'Ты спишь?',action:()=>goto('dreaming')},{text:'Я не понимаю.',action:()=>goto('dontUnderstand')}])})})})})})})})})}};
