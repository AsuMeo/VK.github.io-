<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700;900&display=swap');

* {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
  touch-action: none;
}

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #000; font-family: 'Press Start 2P', monospace, sans-serif;
  color: #fff;
}

/* ===== AUTH & NICKNAME SCREEN ===== */
.auth-screen {
  position: fixed; inset: 0; z-index: 1000;
  background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" fill="%232e6f28"/><rect width="32" height="32" fill="%23388731"/><rect x="32" y="32" width="32" height="32" fill="%23388731"/></svg>');
  background-size: 64px 64px; image-rendering: pixelated;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 16px;
}

.auth-card {
  width: 100%; max-width: 380px; padding: 24px;
  background: rgba(40, 24, 12, 0.95);
  border: 4px solid #100a04;
  outline: 4px solid #5a381e;
  box-shadow: inset 0 0 0 2px #8b5a2b, 0 10px 30px rgba(0,0,0,0.9);
  text-align: center; border-radius: 4px;
}

.auth-title {
  font-size: 16px; color: #ffff55;
  text-shadow: 3px 3px #000; margin-bottom: 8px; line-height: 1.4;
}

.auth-subtitle {
  font-size: 8px; color: #aaa; margin-bottom: 20px; line-height: 1.5;
}

.auth-input {
  width: 100%; padding: 12px 14px; margin-bottom: 12px;
  background: #140d07; border: 3px solid #3a2211;
  color: #fff; font-family: 'Press Start 2P', monospace; font-size: 10px;
  outline: none; text-align: center; border-radius: 2px;
}
.auth-input:focus { border-color: #55ff55; }

.auth-btn {
  width: 100%; padding: 14px; margin-top: 6px;
  background: #55aa33; border: 3px solid #1f4212;
  box-shadow: inset 0 3px 0 #88dd55, inset 0 -3px 0 #2d5a19, 0 4px 0 #102209;
  color: #fff; font-family: 'Press Start 2P', monospace; font-size: 10px;
  cursor: pointer; text-shadow: 2px 2px #000;
}
.auth-btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 #88dd55, 0 2px 0 #102209; }

.auth-err {
  color: #ff5555; font-size: 8px; margin-top: 10px; min-height: 14px; text-shadow: 1px 1px #000;
}

/* ===== CANVAS ===== */
#gameCanvas {
  position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; touch-action: none;
}

/* ===== HUD OVERLAY ===== */
.hud-layer {
  position: fixed; inset: 0; z-index: 10; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between;
}

/* Crosshair */
.crosshair {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 18px; height: 18px; pointer-events: none; z-index: 15;
}
.crosshair::before, .crosshair::after {
  content: ''; position: absolute; background: rgba(255,255,255,0.8);
  box-shadow: 0 0 2px #000;
}
.crosshair::before { top: 8px; left: 0; width: 18px; height: 2px; }
.crosshair::after { top: 0; left: 8px; width: 2px; height: 18px; }

/* Top HUD Info */
.top-hud {
  padding: 10px; display: flex; justify-content: space-between; align-items: flex-start;
  pointer-events: auto;
}

.hud-info-box {
  background: rgba(0,0,0,0.6); padding: 8px 12px; border: 2px solid #333;
  font-size: 8px; color: #fff; text-shadow: 1px 1px #000; border-radius: 4px;
  display: flex; flex-direction: column; gap: 4px;
}
.hud-info-box span { color: #55ff55; }

.top-btns {
  display: flex; gap: 8px;
}

.mc-icon-btn {
  width: 36px; height: 36px; background: rgba(60, 60, 60, 0.85);
  border: 2px solid #111; box-shadow: inset 0 2px 0 #888, inset 0 -2px 0 #222;
  color: #fff; font-family: 'Press Start 2P', monospace; font-size: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border-radius: 4px; pointer-events: auto;
}
.mc-icon-btn:active { background: #222; transform: translateY(1px); }

/* Hotbar at Bottom */
.hotbar-container {
  position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 2px;
  background: rgba(0,0,0,0.7); padding: 4px; border: 3px solid #222;
  border-radius: 4px; pointer-events: auto; z-index: 20;
}

.hotbar-slot {
  width: 38px; height: 38px; background: #8b8b8b;
  border: 3px solid #373737; box-shadow: inset 0 2px 0 #ffffff, inset 0 -2px 0 #555555;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; position: relative;
}
.hotbar-slot.active {
  border-color: #ffffff; background: #a0a0a0;
  outline: 2px solid #ffff55; z-index: 2;
}

.slot-icon {
  width: 22px; height: 22px; image-rendering: pixelated; border-radius: 2px;
}
.slot-num {
  position: absolute; bottom: 1px; right: 2px; font-size: 6px; color: #fff; text-shadow: 1px 1px #000;

/* ===== MINECRAFT MOBILE TOUCH CONTROLS ===== */

/* D-PAD Left */

.dpad-btn {

/* Action Buttons Right Side */
.action-buttons {
  position: absolute; bottom: 20px; right: 16px;
  display: flex; flex-direction: column; gap: 12px; align-items: flex-end;
  pointer-events: auto;
}

.action-row { display: flex; gap: 10px; }

.mc-touch-btn {
  width: 58px; height: 58px; border-radius: 12px;

/* Touch Look Zone (Right upper half of screen) */

  position: fixed; top: 0; right: 0; width: 60vw; height: 75vh;
  pointer-events: auto; z-index: 12;
}

/* ===== CHAT OVERLAY ===== */
.chat-overlay {
  position: fixed; top: 50px; left: 10px; width: calc(100vw - 20px); max-width: 360px;
  max-height: 200px; background: rgba(0,0,0,0.75); border: 2px solid #3a2211;

.chat-messages {

/* ===== PLAYERS HUD ===== */
.players-list-modal {

.players-ul { list-style: none; font-size: 9px; display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; text-align: left; }
.players-li { padding: 6px; background: #1a0f05; border: 1px solid #3a2211; display: flex; justify-content: space-between; }

/* Loading */
.loading-box {

@keyframes pixelSpin { to { transform: rotate(360deg); } }
.loading-text { font-size: 10px; color: #ffff55; text-align: center; line-height: 1.6; }
</style>

<script>
// =========================================================================
// ===== FIREBASE CONFIGURATION =====
// =========================================================================
const firebaseConfig = {
  apiKey: "AIzaSyBm0mIvHVznIeF2PoFk6dtdaiT5r877wyA",
  authDomain: "meow-874ce.firebaseapp.com",
  databaseURL: "https://meow-874ce-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "meow-874ce",
  storageBucket: "meow-874ce.firebasestorage.app",
  messagingSenderId: "471541334599",
  appId: "1:471541334599:web:567af3e7dbe70a37572762"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// =========================================================================
// ===== GAME CONSTANTS & BLOCK TYPES =====
// =========================================================================
const BLOCK_SIZE = 1;
const WORLD_HEIGHT = 16;
const CHUNK_RADIUS = 16; // 33x33 area around center

// Minecraft Block Identifiers
const BLOCKS = {
  AIR: 0,
  GRASS: 1,
  DIRT: 2,
  STONE: 3,
  OAK_LOG: 4,
  OAK_LEAVES: 5,
  OAK_PLANKS: 6,
  COBBLESTONE: 7,
  GLASS: 8,
  BRICK: 9,
  DIAMOND: 10,
  GOLD: 11,
  TORCH: 12
};

const BLOCK_NAMES = {
  1: "Трава", 2: "Земля", 3: "Камень", 4: "Бревно",
  5: "Листва", 6: "Доски", 7: "Булыжник", 8: "Стекло",
  9: "Кирпич", 10: "Алмаз", 11: "Золото", 12: "Факел"
};

// Hotbar Items
const HOTBAR_SLOTS = [
  BLOCKS.GRASS, BLOCKS.DIRT, BLOCKS.STONE, BLOCKS.OAK_LOG,
  BLOCKS.OAK_PLANKS, BLOCKS.OAK_LEAVES, BLOCKS.COBBLESTONE,
  BLOCKS.GLASS, BLOCKS.DIAMOND
];

let selectedHotbarIndex = 0;

// =========================================================================
// ===== PROCEDURAL PIXEL TEXTURES ENGINE =====
// =========================================================================
function generatePixelTexture(baseHex, patternType) {
  const canvas = document.createElement('canvas');
  canvas.width = 16; canvas.height = 16;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = baseHex;
  ctx.fillRect(0, 0, 16, 16);

  function clamp(v) { return Math.max(0, Math.min(255, v)); }

  const baseR = parseInt(baseHex.slice(1,3), 16);
  const baseG = parseInt(baseHex.slice(3,5), 16);
  const baseB = parseInt(baseHex.slice(5,7), 16);

  for(let x=0; x<16; x++) {
    for(let y=0; y<16; y++) {
      const noise = (Math.random() - 0.5) * 35;
      ctx.fillStyle = `rgb(${clamp(baseR+noise)},${clamp(baseG+noise)},${clamp(baseB+noise)})`;
      ctx.fillRect(x, y, 1, 1);
    }
  }

  if (patternType === 'grass_side') {
    ctx.fillStyle = '#4b8b3b';
    for(let x=0; x<16; x++) {
      const depth = 3 + Math.floor(Math.random()*3);
      for(let y=0; y<depth; y++) {
        ctx.fillRect(x, y, 1, 1);
      }
    }
  } else if (patternType === 'planks') {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, 16, 1);
    ctx.fillRect(0, 8, 16, 1);
    ctx.fillRect(4, 0, 1, 8);
    ctx.fillRect(12, 8, 1, 8);
  } else if (patternType === 'cobble') {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(2,2,4,3); ctx.fillRect(8,1,5,3);
    ctx.fillRect(1,8,6,3); ctx.fillRect(9,9,5,4);
  } else if (patternType === 'brick') {
    ctx.fillStyle = '#d8d8d8';
    ctx.fillRect(0,4,16,1); ctx.fillRect(0,9,16,1); ctx.fillRect(0,14,16,1);
    ctx.fillRect(7,0,1,4); ctx.fillRect(15,5,1,4); ctx.fillRect(7,10,1,4);
  } else if (patternType === 'leaves') {
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    for(let i=0; i<30; i++) {
      ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 2, 2);
    }
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.magFilter = THREE.NearestFilter;
  texture.minFilter = THREE.NearestFilter;
  return texture;
}

// Materials Dictionary
const blockMaterials = {};

function initBlockMaterials() {
  const texGrassTop = generatePixelTexture('#55aa33', 'noise');
  const texGrassSide = generatePixelTexture('#8b5a2b', 'grass_side');
  const texDirt = generatePixelTexture('#8b5a2b', 'noise');
  const texStone = generatePixelTexture('#777777', 'cobble');
  const texLogSide = generatePixelTexture('#5c3a21', 'planks');
  const texLogTop = generatePixelTexture('#8b5a2b', 'noise');
  const texPlanks = generatePixelTexture('#a0703d', 'planks');
  const texLeaves = generatePixelTexture('#2d7a27', 'leaves');
  const texCobble = generatePixelTexture('#666666', 'cobble');
  const texGlass = generatePixelTexture('#aaccff', 'noise');
  const texBrick = generatePixelTexture('#963d2c', 'brick');
  const texDiamond = generatePixelTexture('#42f5e3', 'noise');
  const texGold = generatePixelTexture('#f5d142', 'noise');

  // Grass (Multi-material: [right, left, top, bottom, front, back])
  const matGrassTop = new THREE.MeshLambertMaterial({ map: texGrassTop });
  const matGrassSide = new THREE.MeshLambertMaterial({ map: texGrassSide });
  const matDirt = new THREE.MeshLambertMaterial({ map: texDirt });

  blockMaterials[BLOCKS.GRASS] = [
    matGrassSide, matGrassSide, matGrassTop, matDirt, matGrassSide, matGrassSide
  ];
  blockMaterials[BLOCKS.DIRT] = matDirt;
  blockMaterials[BLOCKS.STONE] = new THREE.MeshLambertMaterial({ map: texStone });
  
  const matLogSide = new THREE.MeshLambertMaterial({ map: texLogSide });
  const matLogTop = new THREE.MeshLambertMaterial({ map: texLogTop });
  blockMaterials[BLOCKS.OAK_LOG] = [
    matLogSide, matLogSide, matLogTop, matLogTop, matLogSide, matLogSide
  ];

  blockMaterials[BLOCKS.OAK_PLANKS] = new THREE.MeshLambertMaterial({ map: texPlanks });
  blockMaterials[BLOCKS.OAK_LEAVES] = new THREE.MeshLambertMaterial({ map: texLeaves, transparent: true, opacity: 0.9 });
  blockMaterials[BLOCKS.COBBLESTONE] = new THREE.MeshLambertMaterial({ map: texCobble });
  blockMaterials[BLOCKS.GLASS] = new THREE.MeshLambertMaterial({ map: texGlass, transparent: true, opacity: 0.4 });
  blockMaterials[BLOCKS.BRICK] = new THREE.MeshLambertMaterial({ map: texBrick });
  blockMaterials[BLOCKS.DIAMOND] = new THREE.MeshLambertMaterial({ map: texDiamond });
  blockMaterials[BLOCKS.GOLD] = new THREE.MeshLambertMaterial({ map: texGold });
  blockMaterials[BLOCKS.TORCH] = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
}

// =========================================================================
// ===== GAME STATE & MULTIPLAYER VARIABLES =====
// =========================================================================
let myUserId = null;
let myPlayerName = "Steve";

let scene, camera, renderer;
let worldBlocks = {}; // Key: `${x}_${y}_${z}` -> Mesh
let worldData = {};   // Key: `${x}_${y}_${z}` -> blockTypeId

let otherPlayers = {}; // Key: uid -> { mesh, nameMesh, targetPos, targetYaw }

// Physics & Player State
let playerPos = new THREE.Vector3(0, 10, 0);
let playerVelocity = new THREE.Vector3(0, 0, 0);
let cameraYaw = 0, cameraPitch = 0;
let isGrounded = false;
const PLAYER_HEIGHT = 1.62;
const PLAYER_RADIUS = 0.3;

// Touch Control States
const moveKeys = { forward: false, backward: false, left: false, right: false, jump: false };

// Raycaster for placing / breaking blocks
const raycaster = new THREE.Raycaster();
const centerVector = new THREE.Vector2(0, 0);
let blockSelectionOutline = null;

// =========================================================================
// ===== INITIALIZATION & START =====
// =========================================================================
function startGame() {
  const nick = document.getElementById('nicknameInput').value.trim();
  if(!nick) {
    document.getElementById('authErr').textContent = "Введите никнейм!";
    return;
  }
  myPlayerName = nick;
  document.getElementById('hudPlayerName').textContent = myPlayerName;

  document.getElementById('authScreen').style.display = 'none';

  // Login anonymously to Firebase
  firebase.auth().signInAnonymously().then(cred => {
    myUserId = cred.user.uid;
    init3DEngine();
    setupFirebaseListeners();
    setupTouchControls();
    renderHotbar();
    document.getElementById('loadingBox').style.display = 'none';
  }).catch(err => {
    document.getElementById('authErr').textContent = err.message;
  });
}

function renderHotbar() {
  const container = document.getElementById('hotbar');
  container.innerHTML = '';
  HOTBAR_SLOTS.forEach((blockId, idx) => {
    const slot = document.createElement('div');
    slot.className = `hotbar-slot ${idx === selectedHotbarIndex ? 'active' : ''}`;
    slot.onclick = () => selectHotbarSlot(idx);

    // Create Canvas Preview
    const previewCanvas = document.createElement('canvas');
    previewCanvas.width = 24; previewCanvas.height = 24;
    previewCanvas.className = 'slot-icon';
    drawBlockPreview(previewCanvas, blockId);

    const num = document.createElement('div');
    num.className = 'slot-num';
    num.textContent = idx + 1;

    slot.appendChild(previewCanvas);
    slot.appendChild(num);
    container.appendChild(slot);
  });
}

function selectHotbarSlot(index) {
  selectedHotbarIndex = index;
  renderHotbar();
}

function drawBlockPreview(canvas, blockId) {
  const ctx = canvas.getContext('2d');
  const colors = {
    1: '#55aa33', 2: '#8b5a2b', 3: '#777777', 4: '#5c3a21',
    5: '#2d7a27', 6: '#a0703d', 7: '#666666', 8: '#aaccff',
    9: '#963d2c', 10: '#42f5e3', 11: '#f5d142', 12: '#ffaa00'
  };
  ctx.fillStyle = colors[blockId] || '#fff';
  ctx.fillRect(0,0,24,24);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(0,0,24,24);
}

// =========================================================================
// ===== THREE.JS 3D ENGINE & SCENE SETUP =====
// =========================================================================
function init3DEngine() {
  const canvas = document.getElementById('gameCanvas');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb); // Minecraft Sky Blue
  scene.fog = new THREE.FogExp2(0x87ceeb, 0.018);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(playerPos.x, playerPos.y + PLAYER_HEIGHT, playerPos.z);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
  scene.add(ambientLight);

  const sunLight = new THREE.DirectionalLight(0xfffaed, 0.85);
  sunLight.position.set(20, 40, 10);
  scene.add(sunLight);

  initBlockMaterials();

  // Selection Box Wireframe for highlighted block
  const outlineGeo = new THREE.BoxGeometry(1.01, 1.01, 1.01);
  const outlineMat = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true });
  blockSelectionOutline = new THREE.Mesh(outlineGeo, outlineMat);
  blockSelectionOutline.visible = false;
  scene.add(blockSelectionOutline);

  window.addEventListener('resize', onWindowResize);

  // Start Loop
  requestAnimationFrame(gameLoop);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// =========================================================================
// ===== FIREBASE REALTIME DATABASE SYNC =====
// =========================================================================
function setupFirebaseListeners() {
  // 1. Sync World Blocks
  const worldRef = db.ref('world');
  worldRef.on('child_added', snapshot => {
    const key = snapshot.key;
    const type = snapshot.val();
    const [x, y, z] = key.split('_').map(Number);
    setBlockLocal(x, y, z, type, false);
  });

  worldRef.on('child_changed', snapshot => {
    const key = snapshot.key;
    const type = snapshot.val();
    const [x, y, z] = key.split('_').map(Number);
    setBlockLocal(x, y, z, type, false);
  });

  worldRef.on('child_removed', snapshot => {
    const key = snapshot.key;
    const [x, y, z] = key.split('_').map(Number);
    removeBlockLocal(x, y, z, false);
  });

  // Check if world is completely empty; if so, generate spawn island
  worldRef.once('value').then(snapshot => {
    if(!snapshot.exists()) {
      generateInitialMinecraftWorld();
    }
  });

  // 2. Sync Online Players
  const playersRef = db.ref('players');
  const myPlayerRef = db.ref(`players/${myUserId}`);

  // Presence system
  db.ref('.info/connected').on('value', snap => {
    if(snap.val() === true) {
      myPlayerRef.onDisconnect().remove();
      sendMyPlayerState();
    }
  });

  playersRef.on('child_added', snap => {
    const uid = snap.key;
    if(uid !== myUserId) {
      createOtherPlayerMesh(uid, snap.val());
    }
  });

  playersRef.on('child_changed', snap => {
    const uid = snap.key;
    if(uid !== myUserId) {
      updateOtherPlayerMesh(uid, snap.val());
    }
  });

  playersRef.on('child_removed', snap => {
    const uid = snap.key;
    if(otherPlayers[uid]) {
      scene.remove(otherPlayers[uid].mesh);
      delete otherPlayers[uid];
      updateOnlineCountHUD();
    }
  });

  // 3. Sync Chat
  db.ref('chat').limitToLast(20).on('child_added', snap => {
    const msg = snap.val();
    appendChatMessage(msg.author, msg.text);
  });

  // Periodically push position
  setInterval(sendMyPlayerState, 150);
}

function sendMyPlayerState() {
  if(!myUserId) return;
  db.ref(`players/${myUserId}`).set({
    name: myPlayerName,
    x: parseFloat(playerPos.x.toFixed(2)),
    y: parseFloat(playerPos.y.toFixed(2)),
    z: parseFloat(playerPos.z.toFixed(2)),
    yaw: parseFloat(cameraYaw.toFixed(2)),
    lastSeen: firebase.database.ServerValue.TIMESTAMP
  });
}

function generateInitialMinecraftWorld() {
  const updates = {};
  // Generate a 24x24 world platform with trees & house
  for(let x = -12; x <= 12; x++) {
    for(let z = -12; z <= 12; z++) {
      // Bedrock / Stone bottom
      updates[`${x}_0_${z}`] = BLOCKS.STONE;
      updates[`${x}_1_${z}`] = BLOCKS.DIRT;
      updates[`${x}_2_${z}`] = BLOCKS.DIRT;
      updates[`${x}_3_${z}`] = BLOCKS.GRASS;
    }
  }

  // Wooden Starter House
  for(let h = 4; h <= 6; h++) {
    for(let x = -3; x <= 3; x++) {
      for(let z = -3; z <= 3; z++) {
        if(Math.abs(x) === 3 || Math.abs(z) === 3) {
          if(!(h >= 4 && h <= 5 && x === 0 && z === -3)) { // Doorway
            updates[`${x}_${h}_${z}`] = BLOCKS.OAK_PLANKS;
          }
        }
      }
    }
  }
  // House Roof
  for(let x = -3; x <= 3; x++) {
    for(let z = -3; z <= 3; z++) {
      updates[`${x}_7_${z}`] = BLOCKS.COBBLESTONE;
    }
  }

  // Oak Trees
  [ [-7, -7], [7, 7], [-7, 7], [7, -7] ].forEach(([tx, tz]) => {
    for(let y = 4; y <= 7; y++) {
      updates[`${tx}_${y}_${tz}`] = BLOCKS.OAK_LOG;
    }
    for(let lx = tx - 2; lx <= tx + 2; lx++) {
      for(let lz = tz - 2; lz <= tz + 2; lz++) {
        for(let ly = 7; ly <= 8; ly++) {
          if(!(lx === tx && lz === tz && ly === 7)) {
            updates[`${lx}_${ly}_${lz}`] = BLOCKS.OAK_LEAVES;
          }
        }
      }
    }
  });

  db.ref('world').update(updates);
}

// =========================================================================
// ===== LOCAL BLOCK PLACING & BREAKING LOGIC =====
// =========================================================================
function setBlockLocal(x, y, z, type, updateDB = true) {
  const key = `${x}_${y}_${z}`;
  
  if (worldBlocks[key]) {
    scene.remove(worldBlocks[key]);
    delete worldBlocks[key];
  }

  if (type !== BLOCKS.AIR) {
    const geo = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
    const mat = blockMaterials[type] || blockMaterials[BLOCKS.DIRT];
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    mesh.userData = { x, y, z, type };
    scene.add(mesh);
    worldBlocks[key] = mesh;
    worldData[key] = type;
  } else {
    delete worldData[key];
  }

  if (updateDB && myUserId) {
    if (type === BLOCKS.AIR) {
      db.ref(`world/${key}`).remove();
    } else {
      db.ref(`world/${key}`).set(type);
    }
  }
}

function removeBlockLocal(x, y, z, updateDB = true) {
  setBlockLocal(x, y, z, BLOCKS.AIR, updateDB);
}

function handleBreakBlock() {
  raycaster.setFromCamera(centerVector, camera);
  const meshes = Object.values(worldBlocks);
  const intersects = raycaster.intersectObjects(meshes);

  if (intersects.length > 0) {
    const hit = intersects[0];
    if (hit.distance <= 5.5) {
      const { x, y, z } = hit.object.userData;
      removeBlockLocal(x, y, z, true);
    }
  }
}

function handlePlaceBlock() {
  raycaster.setFromCamera(centerVector, camera);
  const meshes = Object.values(worldBlocks);
  const intersects = raycaster.intersectObjects(meshes);

  if (intersects.length > 0) {
    const hit = intersects[0];
    if (hit.distance <= 5.5) {
      const norm = hit.face.normal;
      const px = hit.object.userData.x + norm.x;
      const py = hit.object.userData.y + norm.y;
      const pz = hit.object.userData.z + norm.z;

      // Prevent placing block inside player's body
      const playerBox = new THREE.Box3().setFromCenterAndSize(
        playerPos, new THREE.Vector3(PLAYER_RADIUS * 2, PLAYER_HEIGHT, PLAYER_RADIUS * 2)
      );
      const targetBox = new THREE.Box3().setFromCenterAndSize(
        new THREE.Vector3(px, py, pz), new THREE.Vector3(1, 1, 1)
      );

      if (!playerBox.intersectsBox(targetBox)) {
        const blockToPlace = HOTBAR_SLOTS[selectedHotbarIndex];
        setBlockLocal(px, py, pz, blockToPlace, true);
      }
    }
  }
}

// =========================================================================
// ===== OTHER PLAYERS 3D MODELS (STEVE AVATARS) =====
// =========================================================================
function createOtherPlayerMesh(uid, data) {
  const pGroup = new THREE.Group();

  // Head
  const headMat = new THREE.MeshLambertMaterial({ color: 0xd2b48c });
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), headMat);
  head.position.y = 1.4;
  pGroup.add(head);

  // Body
  const bodyMat = new THREE.MeshLambertMaterial({ color: 0x00aaaa }); // Cyan shirt
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.3), bodyMat);
  body.position.y = 0.8;
  pGroup.add(body);

  // Legs
  const legsMat = new THREE.MeshLambertMaterial({ color: 0x0000aa }); // Blue pants
  const legs = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.3), legsMat);
  legs.position.y = 0.15;
  pGroup.add(legs);

  // Name Tag
  const nameCanvas = document.createElement('canvas');
  nameCanvas.width = 128; nameCanvas.height = 32;
  const ctx = nameCanvas.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,128,32);
  ctx.fillStyle = '#ffffff'; ctx.font = '14px monospace'; ctx.textAlign = 'center';
  ctx.fillText(data.name || 'Steve', 64, 20);
  const nameTex = new THREE.CanvasTexture(nameCanvas);
  const nameMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.3), new THREE.MeshBasicMaterial({ map: nameTex, transparent: true, side: THREE.DoubleSide }));
  nameMesh.position.y = 1.85;
  pGroup.add(nameMesh);

  pGroup.position.set(data.x || 0, data.y || 10, data.z || 0);
  scene.add(pGroup);

  otherPlayers[uid] = {
    mesh: pGroup,
    targetPos: new THREE.Vector3(data.x || 0, data.y || 10, data.z || 0),
    targetYaw: data.yaw || 0
  };

  updateOnlineCountHUD();
}

function updateOtherPlayerMesh(uid, data) {
  if (otherPlayers[uid]) {
    otherPlayers[uid].targetPos.set(data.x, data.y, data.z);
    otherPlayers[uid].targetYaw = data.yaw;
  } else {
    createOtherPlayerMesh(uid, data);
  }
}

function updateOnlineCountHUD() {
  const count = Object.keys(otherPlayers).length + 1;
  document.getElementById('hudOnlineCount').textContent = count;
}

// =========================================================================
// ===== TOUCH CONTROLS (MINECRAFT MOBILE PE LAYOUT) =====
// =========================================================================
function setupTouchControls() {
  // D-Pad Touch Listeners
  const bindDPad = (elementId, keyName) => {
    const btn = document.getElementById(elementId);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); moveKeys[keyName] = true; btn.classList.add('active'); }, {passive:false});
    btn.addEventListener('touchend', (e) => { e.preventDefault(); moveKeys[keyName] = false; btn.classList.remove('active'); }, {passive:false});
    btn.addEventListener('touchcancel', () => { moveKeys[keyName] = false; btn.classList.remove('active'); });
  };

  bindDPad('btnForward', 'forward');
  bindDPad('btnBackward', 'backward');
  bindDPad('btnLeft', 'left');
  bindDPad('btnRight', 'right');

  // Jump
  const jumpBtn = document.getElementById('btnJump');
  jumpBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (isGrounded) playerVelocity.y = 7.5;
    jumpBtn.classList.add('active');
  }, {passive:false});
  jumpBtn.addEventListener('touchend', () => jumpBtn.classList.remove('active'));

  // Action Buttons
  const btnBreak = document.getElementById('btnBreakBlock');
  btnBreak.addEventListener('touchstart', (e) => {
    e.preventDefault(); handleBreakBlock(); btnBreak.classList.add('active');
  }, {passive:false});
  btnBreak.addEventListener('touchend', () => btnBreak.classList.remove('active'));

  const btnPlace = document.getElementById('btnPlaceBlock');
  btnPlace.addEventListener('touchstart', (e) => {
    e.preventDefault(); handlePlaceBlock(); btnPlace.classList.add('active');
  }, {passive:false});
  btnPlace.addEventListener('touchend', () => btnPlace.classList.remove('active'));

  // Touch Look Drag (Right upper screen)
  const lookZone = document.getElementById('touchLookZone');
  let lastTouchX = null, lastTouchY = null;

  lookZone.addEventListener('touchstart', (e) => {
    if(e.touches.length > 0) {
      lastTouchX = e.touches[0].clientX;
      lastTouchY = e.touches[0].clientY;
    }
  }, {passive:true});

  lookZone.addEventListener('touchmove', (e) => {
    if(e.touches.length > 0 && lastTouchX !== null) {
      const dx = e.touches[0].clientX - lastTouchX;
      const dy = e.touches[0].clientY - lastTouchY;

      cameraYaw -= dx * 0.005;
      cameraPitch -= dy * 0.005;
      cameraPitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, cameraPitch));

      lastTouchX = e.touches[0].clientX;
      lastTouchY = e.touches[0].clientY;
    }
  }, {passive:true});

  lookZone.addEventListener('touchend', () => { lastTouchX = null; lastTouchY = null; });

  // Keyboard controls fallback for PC testing
  window.addEventListener('keydown', (e) => {
    if(document.activeElement.tagName === 'INPUT') return;
    if (e.code === 'KeyW' || e.code === 'ArrowUp') moveKeys.forward = true;
    if (e.code === 'KeyS' || e.code === 'ArrowDown') moveKeys.backward = true;
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveKeys.left = true;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') moveKeys.right = true;
    if (e.code === 'Space' && isGrounded) playerVelocity.y = 7.5;
    if (e.code === 'KeyE') handlePlaceBlock();
    if (e.code === 'KeyQ') handleBreakBlock();
    if (e.code >= 'Digit1' && e.code <= 'Digit9') {
      selectHotbarSlot(parseInt(e.code.slice(5)) - 1);
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'KeyW' || e.code === 'ArrowUp') moveKeys.forward = false;
    if (e.code === 'KeyS' || e.code === 'ArrowDown') moveKeys.backward = false;
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveKeys.left = false;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') moveKeys.right = false;
  });
}

// =========================================================================
// ===== PHYSICS & VOXEL COLLISION ENGINE =====
// =========================================================================
function updatePhysics(delta) {
  // Gravity
  playerVelocity.y -= 22.0 * delta;

  // Horizontal Movement Speed
  const speed = 6.0;
  let moveX = 0, moveZ = 0;

  if (moveKeys.forward) moveZ -= 1;
  if (moveKeys.backward) moveZ += 1;
  if (moveKeys.left) moveX -= 1;
  if (moveKeys.right) moveX += 1;

  if (moveX !== 0 || moveZ !== 0) {
    const len = Math.hypot(moveX, moveZ);
    moveX /= len; moveZ /= len;

    const sin = Math.sin(cameraYaw);
    const cos = Math.cos(cameraYaw);

    playerVelocity.x = (moveX * cos - moveZ * sin) * speed;
    playerVelocity.z = (moveX * sin + moveZ * cos) * speed;
  } else {
    playerVelocity.x = 0;
    playerVelocity.z = 0;
  }

  // Y Collision & Movement
  playerPos.y += playerVelocity.y * delta;
  if (checkCollision(playerPos)) {
    if (playerVelocity.y < 0) {
      playerPos.y = Math.ceil(playerPos.y - 0.5);
      isGrounded = true;
    } else {
      playerPos.y = Math.floor(playerPos.y + PLAYER_HEIGHT) - PLAYER_HEIGHT;
    }
    playerVelocity.y = 0;
  } else {
    isGrounded = false;
  }

  // X Collision
  playerPos.x += playerVelocity.x * delta;
  if (checkCollision(playerPos)) {
    playerPos.x -= playerVelocity.x * delta;
  }

  // Z Collision
  playerPos.z += playerVelocity.z * delta;
  if (checkCollision(playerPos)) {
    playerPos.z -= playerVelocity.z * delta;
  }

  // Respawn void fall
  if (playerPos.y < -10) {
    playerPos.set(0, 12, 0);
    playerVelocity.set(0, 0, 0);
  }

  // Update Camera Target
  camera.position.set(playerPos.x, playerPos.y + PLAYER_HEIGHT, playerPos.z);
  
  const lookTarget = new THREE.Vector3(
    playerPos.x + Math.sin(cameraYaw) * Math.cos(cameraPitch),
    playerPos.y + PLAYER_HEIGHT + Math.sin(cameraPitch),
    playerPos.z + Math.cos(cameraYaw) * Math.cos(cameraPitch)
  );
  camera.lookAt(lookTarget);

  // Update Coordinates HUD
  document.getElementById('hudCoords').textContent = `${Math.floor(playerPos.x)}, ${Math.floor(playerPos.y)}, ${Math.floor(playerPos.z)}`;
}

function checkCollision(pos) {
  const minX = Math.floor(pos.x - PLAYER_RADIUS);
  const maxX = Math.floor(pos.x + PLAYER_RADIUS);
  const minY = Math.floor(pos.y);
  const maxY = Math.floor(pos.y + PLAYER_HEIGHT);
  const minZ = Math.floor(pos.z - PLAYER_RADIUS);
  const maxZ = Math.floor(pos.z + PLAYER_RADIUS);

  for (let x = minX; x <= maxX; x++) {
    for (let y = minY; y <= maxY; y++) {
      for (let z = minZ; z <= maxZ; z++) {
        if (worldData[`${x}_${y}_${z}`]) {
          return true;
        }
      }
    }
  }
  return false;
}

// Highlight targeted block
function updateBlockHighlight() {
  raycaster.setFromCamera(centerVector, camera);
  const meshes = Object.values(worldBlocks);
  const intersects = raycaster.intersectObjects(meshes);

  if (intersects.length > 0 && intersects[0].distance <= 5.5) {
    const hit = intersects[0];
    const { x, y, z } = hit.object.userData;
    blockSelectionOutline.position.set(x, y, z);
    blockSelectionOutline.visible = true;
  } else {
    blockSelectionOutline.visible = false;
  }
}

// Lerp Other Players Smoothly
function updateOtherPlayers(delta) {
  Object.values(otherPlayers).forEach(p => {
    p.mesh.position.lerp(p.targetPos, delta * 12);
    p.mesh.rotation.y = THREE.MathUtils.lerp(p.mesh.rotation.y, p.targetYaw, delta * 12);
  });
}

// =========================================================================
// ===== MAIN GAME RENDER LOOP =====
// =========================================================================
let lastFrameTime = performance.now();

function gameLoop(time) {
  requestAnimationFrame(gameLoop);

  const delta = Math.min((time - lastFrameTime) / 1000, 0.1);
  lastFrameTime = time;

  updatePhysics(delta);
  updateBlockHighlight();
  updateOtherPlayers(delta);

  renderer.render(scene, camera);
}

// =========================================================================
// ===== CHAT & PLAYERS MODAL =====
// =========================================================================
function toggleChat() {
  const chat = document.getElementById('chatOverlay');
  chat.classList.toggle('active');
  if(chat.classList.contains('active')) {
    document.getElementById('chatInput').focus();
  }
}

function sendChatMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;

  db.ref('chat').push({
    author: myPlayerName,
    text: text,
    timestamp: firebase.database.ServerValue.TIMESTAMP
  });

  input.value = '';
}

function appendChatMessage(author, text) {
  const box = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'chat-msg';
  div.innerHTML = `<span class="author">&lt;${escapeHtml(author)}&gt;</span> ${escapeHtml(text)}`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function togglePlayersModal() {
  const modal = document.getElementById('playersModal');
  modal.classList.toggle('active');
  if(modal.classList.contains('active')) {
    const ul = document.getElementById('playersUl');
    ul.innerHTML = '';

    // Add Me
    const liMe = document.createElement('li');
    liMe.className = 'players-li';
    liMe.innerHTML = `<span>${escapeHtml(myPlayerName)} (Вы)</span><span style="color:#55ff55;">Онлайн</span>`;
    ul.appendChild(liMe);

    // Add Others
    Object.values(otherPlayers).forEach(p => {
      const li = document.createElement('li');
      li.className = 'players-li';
      const name = p.mesh.children[3]?.children[0]?.material?.map?.image?.getContext('2d')?.canvas?.innerText || "Steve";
      li.innerHTML = `<span>${escapeHtml(name)}</span><span style="color:#55ff55;">Онлайн</span>`;
      ul.appendChild(li);
    });
  }
}

function toggleFullscreen() {
  const doc = document;
  if (!doc.fullscreenElement && !doc.webkitFullscreenElement) {
    const el = doc.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } else {
    if (doc.exitFullscreen) doc.exitFullscreen();
    else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
  }
}
