<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Frame FX — 4K Anime Effects</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #fff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .bg-particles {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .bg-particles canvas { width: 100%; height: 100%; }
  .container {
    position: relative; z-index: 1;
    max-width: 1400px; margin: 0 auto; padding: 40px 20px;
  }
  h1 {
    text-align: center; font-size: 2.8rem;
    background: linear-gradient(90deg, #ff6b9d, #c44569, #f8b500);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 10px; text-shadow: 0 0 40px rgba(255,107,157,0.3);
  }
  .subtitle {
    text-align: center; color: #888; font-size: 1rem; margin-bottom: 40px;
  }
  .upload-zone {
    border: 2px dashed #ff6b9d55;
    border-radius: 20px; padding: 60px 20px;
    text-align: center; cursor: pointer;
    background: rgba(255,255,255,0.02);
    transition: all 0.3s; position: relative; overflow: hidden;
  }
  .upload-zone:hover {
    border-color: #ff6b9d;
    background: rgba(255,107,157,0.05);
    box-shadow: 0 0 60px rgba(255,107,157,0.15);
  }
  .upload-zone.dragover {
    border-color: #f8b500;
    background: rgba(248,181,0,0.08);
  }
  .upload-zone input { display: none; }
  .upload-icon {
    font-size: 3rem; margin-bottom: 15px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px; margin-top: 40px;
  }
  .card {
    background: rgba(255,255,255,0.03);
    border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
    transition: transform 0.3s, box-shadow 0.3s;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 40px rgba(255,107,157,0.2);
    border-color: rgba(255,107,157,0.3);
  }
  .card img {
    width: 100%; height: 200px; object-fit: cover;
    display: block;
  }
  .card-info {
    padding: 15px;
  }
  .card-title {
    font-size: 0.95rem; color: #ddd;
  }
  .card-tags {
    display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
  }
  .tag {
    font-size: 0.7rem; padding: 4px 10px;
    border-radius: 20px; background: rgba(255,107,157,0.15);
    color: #ff6b9d; border: 1px solid rgba(255,107,157,0.3);
  }
  .editor {
    display: none;
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(5,5,10,0.98); z-index: 100;
    overflow-y: auto;
  }
  .editor.active { display: block; }
  .editor-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 40px; border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .editor-header h2 { font-size: 1.3rem; }
  .close-btn {
    background: none; border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 8px 20px; border-radius: 8px;
    cursor: pointer; font-size: 0.9rem; transition: 0.2s;
  }
  .close-btn:hover { background: rgba(255,255,255,0.1); }
  .editor-body {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 30px; padding: 30px 40px;
    max-width: 1600px; margin: 0 auto;
  }
  @media (max-width: 900px) {
    .editor-body { grid-template-columns: 1fr; }
  }
  .canvas-wrap {
    position: relative; border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
    background: #111;
  }
  .canvas-wrap canvas {
    width: 100%; display: block;
  }
  .controls {
    display: flex; flex-direction: column; gap: 20px;
  }
  .control-group {
    background: rgba(255,255,255,0.03);
    border-radius: 12px; padding: 18px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .control-group h3 {
    font-size: 0.85rem; color: #ff6b9d;
    margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;
  }
  .slider-row {
    display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
  }
  .slider-row label {
    font-size: 0.8rem; color: #aaa; min-width: 80px;
  }
  .slider-row input[type="range"] {
    flex: 1; -webkit-appearance: none; height: 4px;
    background: rgba(255,255,255,0.1); border-radius: 2px;
    outline: none;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    background: #ff6b9d; border-radius: 50%; cursor: pointer;
    box-shadow: 0 0 10px rgba(255,107,157,0.5);
  }
  .slider-row span {
    font-size: 0.75rem; color: #666; min-width: 30px; text-align: right;
  }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .fx-btn {
    flex: 1; min-width: 100px; padding: 10px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: #ccc; border-radius: 8px; cursor: pointer;
    font-size: 0.8rem; transition: 0.2s; text-align: center;
  }
  .fx-btn:hover, .fx-btn.active {
    background: rgba(255,107,157,0.15);
    border-color: #ff6b9d; color: #ff6b9d;
  }
  .action-btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #ff6b9d, #c44569);
    border: none; color: #fff; border-radius: 10px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: 0.3s; margin-top: 10px;
  }
  .action-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(255,107,157,0.4);
  }
  .action-btn.secondary {
    background: rgba(255,255,255,0.08);
  }
  .action-btn.secondary:hover {
    background: rgba(255,255,255,0.12);
    box-shadow: none;
  }
  .loading {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(5,5,10,0.95); z-index: 200;
    display: none; flex-direction: column;
    justify-content: center; align-items: center;
  }
  .loading.active { display: flex; }
  .spinner {
    width: 60px; height: 60px;
    border: 3px solid rgba(255,107,157,0.2);
    border-top-color: #ff6b9d; border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { margin-top: 20px; color: #ff6b9d; font-size: 1.1rem; font-weight: 500; }
  
  /* Стили для визуального прогресс-бара */
  .progress-container {
    width: 300px;
    height: 8px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    margin-top: 15px;
    overflow: hidden;
    border: 1px solid rgba(255, 107, 157, 0.2);
  }
  .progress-bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #ff6b9d, #f8b500);
    box-shadow: 0 0 10px rgba(255, 107, 157, 0.5);
    transition: width 0.1s ease-out;
  }
  .progress-percent {
    margin-top: 8px;
    font-size: 1.2rem;
    color: #ff6b9d;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(255, 107, 157, 0.3);
  }
  
  .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
</style>
</head>
<body>

<div class="bg-particles"><canvas id="particles"></canvas></div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <p id="loadingText">Обработка 4K аниме-эффектов...</p>
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="progress-percent" id="progressPercent">0%</div>
</div>

<div class="container">
  <h1>✦ Anime Frame FX</h1>
  <p class="subtitle">Выбери фото — получи настоящий аниме-кадр. Все эффекты локальные, в браузере.</p>

  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept="image/*" multiple>
    <div class="upload-icon">📁</div>
    <p style="font-size:1.1rem; margin-bottom:8px;"&gt;Перетащи фото сюда или кликни</p>
    <p style="color:#666; font-size:0.85rem;"&gt;Поддерживаются JPG, PNG, WEBP</p>
  </div>

  <div class="gallery" id="gallery"></div>
</div>

<div class="editor" id="editor">
  <div class="editor-header">
    <h2>🎨 Редактор аниме-эффектов</h2>
    <button class="close-btn" onclick="closeEditor()">✕ Закрыть</button>
  </div>
  <div class="editor-body">
    <div class="canvas-wrap">
      <canvas id="mainCanvas"></canvas>
    </div>
    <div class="controls">
      <div class="control-group">
        <h3>🎬 Пресеты</h3>
        <div class="preset-grid">
          <button class="fx-btn active" onclick="applyPreset('anime4k', this)">Anime 4K</button>
          <button class="fx-btn" onclick="applyPreset('celshade', this)">Cel Shading</button>
          <button class="fx-btn" onclick="applyPreset('vivid', this)">Vivid Anime</button>
          <button class="fx-btn" onclick="applyPreset('soft', this)">Soft Glow</button>
          <button class="fx-btn" onclick="applyPreset('night', this)">Night City</button>
          <button class="fx-btn" onclick="applyPreset('sakura', this)">Sakura Dream</button>
          <button class="fx-btn" onclick="applyPreset('cyber', this)">Cyberpunk</button>
          <button class="fx-btn" onclick="applyPreset('retro', this)">Retro 90s</button>
        </div>
      </div>

      <div class="control-group">
        <h3>⚡ Усиление</h3>
        <div class="slider-row">
          <label>Резкость</label>
          <input type="range" id="sharpness" min="0" max="200" value="80" oninput="updateEffect()">
          <span id="sharpVal">80</span>
        </div>
        <div class="slider-row">
          <label>Насыщенность</label>
          <input type="range" id="saturation" min="0" max="200" value="120" oninput="updateEffect()">
          <span id="satVal">120</span>
        </div>
        <div class="slider-row">
          <label>Контраст</label>
          <input type="range" id="contrast" min="50" max="200" value="110" oninput="updateEffect()">
          <span id="contVal">110</span>
        </div>
        <div class="slider-row">
          <label>Яркость</label>
          <input type="range" id="brightness" min="50" max="150" value="105" oninput="updateEffect()">
          <span id="brightVal">105</span>
        </div>
      </div>

      <div class="control-group">
        <h3>🌸 Эффекты</h3>
        <div class="slider-row">
          <label>Свечение</label>
          <input type="range" id="bloom" min="0" max="100" value="20" oninput="updateEffect()">
          <span id="bloomVal">20</span>
        </div>
        <div class="slider-row">
          <label>Зернистость</label>
          <input type="range" id="grain" min="0" max="100" value="10" oninput="updateEffect()">
          <span id="grainVal">10</span>
        </div>
        <div class="slider-row">
          <label>Виньетка</label>
          <input type="range" id="vignette" min="0" max="100" value="30" oninput="updateEffect()">
          <span id="vigVal">30</span>
        </div>
        <div class="slider-row">
          <label>Хроматическая аберрация</label>
          <input type="range" id="chromatic" min="0" max="50" value="5" oninput="updateEffect()">
          <span id="chromVal">5</span>
        </div>
      </div>

      <div class="control-group">
        <h3>🎨 Цветокоррекция</h3>
        <div class="slider-row">
          <label>Теплота</label>
          <input type="range" id="warmth" min="-50" max="50" value="10" oninput="updateEffect()">
          <span id="warmVal">10</span>
        </div>
        <div class="slider-row">
          <label>Оттенок</label>
          <input type="range" id="tint" min="-50" max="50" value="5" oninput="updateEffect()">
          <span id="tintVal">5</span>
        </div>
        <div class="slider-row">
          <label>Линейный контраст</label>
          <input type="range" id="levels" min="0" max="100" value="15" oninput="updateEffect()">
          <span id="levVal">15</span>
        </div>
      </div>

      <button class="action-btn" onclick="downloadImage()">⬇ Скачать 4K PNG</button>
      <button class="action-btn secondary" onclick="resetEffects()">↺ Сбросить</button>
    </div>
  </div>
</div>

<script>
// === PARTICLES BACKGROUND ===
const pCanvas = document.getElementById('particles');
const pCtx = pCanvas.getContext('2d');
let particles = [];
function resizeParticles() {
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
}
resizeParticles();
window.addEventListener('resize', resizeParticles);
for(let i=0;i<80;i++){
  particles.push({
    x: Math.random()*pCanvas.width, y: Math.random()*pCanvas.height,
    r: Math.random()*2+0.5, dx: (Math.random()-0.5)*0.3, dy: (Math.random()-0.5)*0.3,
    alpha: Math.random()*0.5+0.2, hue: Math.random()*60+320
  });
}
function drawParticles(){
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
  particles.forEach(p=>{
    p.x+=p.dx; p.y+=p.dy;
    if(p.x<0||p.x>pCanvas.width) p.dx*=-1;
    if(p.y<0||p.y>pCanvas.height) p.dy*=-1;
    pCtx.beginPath();
    pCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
    pCtx.fillStyle = `hsla(${p.hue},80%,60%,${p.alpha})`;
    pCtx.fill();
  });
  requestAnimationFrame(drawParticles);
}
drawParticles();

// === UPLOAD ===
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const gallery = document.getElementById('gallery');
let galleryImages = [];

uploadZone.addEventListener('click', ()=>fileInput.click());
uploadZone.addEventListener('dragover', e=>{e.preventDefault();uploadZone.classList.add('dragover');});
uploadZone.addEventListener('dragleave', ()=>uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e=>{
  e.preventDefault(); uploadZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e=>handleFiles(e.target.files));

function handleFiles(files){
  Array.from(files).forEach(file=>{
    if(!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        galleryImages.push({src: e.target.result, name: file.name, img: img});
        renderGallery();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderGallery(){
  gallery.innerHTML = galleryImages.map((item,i)=>`
    <div class="card" onclick="openEditor(${i})">
      <img src="${item.src}" alt="${item.name}">
      <div class="card-info">
        <div class="card-title">${item.name}</div>
        <div class="card-tags">
          <span class="tag">${item.img.width}x${item.img.height}</span>
          <span class="tag">Anime 4K</span>
        </div>
      </div>
    </div>
  `).join('');
}

// === EDITOR ===
let currentImg = null, currentIndex = -1;
let originalImageData = null;
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d', {willReadFrequently: true});
const editor = document.getElementById('editor');

let presets = {
  anime4k: {sharpness:80, saturation:120, contrast:110, brightness:105, bloom:20, grain:10, vignette:30, chromatic:5, warmth:10, tint:5, levels:15},
  celshade: {sharpness:150, saturation:140, contrast:140, brightness:100, bloom:5, grain:15, vignette:20, chromatic:8, warmth:5, tint:0, levels:35},
  vivid: {sharpness:60, saturation:180, contrast:100, brightness:110, bloom:35, grain:5, vignette:15, chromatic:3, warmth:20, tint:10, levels:10},
  soft: {sharpness:30, saturation:90, contrast:85, brightness:115, bloom:50, grain:20, vignette:40, chromatic:2, warmth:15, tint:8, levels:5},
  night: {sharpness:100, saturation:80, contrast:130, brightness:90, bloom:40, grain:25, vignette:60, chromatic:12, warmth:-10, tint:5, levels:25},
  sakura: {sharpness:50, saturation:150, contrast:95, brightness:112, bloom:45, grain:8, vignette:35, chromatic:4, warmth:25, tint:15, levels:8},
  cyber: {sharpness:120, saturation:160, contrast:125, brightness:100, bloom:30, grain:12, vignette:25, chromatic:15, warmth:-5, tint:-10, levels:30},
  retro: {sharpness:40, saturation:110, contrast:120, brightness:95, bloom:10, grain:40, vignette:50, chromatic:20, warmth:15, tint:-5, levels:20}
};

function openEditor(index){
  currentIndex = index;
  currentImg = galleryImages[index].img;
  editor.classList.add('active');
  document.body.style.overflow = 'hidden';
  
  setupCanvas();
  // Находим активную кнопку пресета и применяем её
  const activeBtn = document.querySelector('.preset-grid .fx-btn.active') || document.querySelector('.preset-grid .fx-btn');
  applyPreset('anime4k', activeBtn);
}

function closeEditor(){
  editor.classList.remove('active');
  document.body.style.overflow = '';
}

function setupCanvas(){
  const maxW = 1400, maxH = 900;
  let w = currentImg.width, h = currentImg.height;
  if(w > maxW || h > maxH){
    const ratio = Math.min(maxW/w, maxH/h);
    w = Math.round(w*ratio); h = Math.round(h*ratio);
  }
  canvas.width = w; canvas.height = h;
  ctx.drawImage(currentImg, 0, 0, w, h);
  originalImageData = ctx.getImageData(0,0,w,h);
}

function getSliderVals(){
  return {
    sharpness: +document.getElementById('sharpness').value,
    saturation: +document.getElementById('saturation').value,
    contrast: +document.getElementById('contrast').value,
    brightness: +document.getElementById('brightness').value,
    bloom: +document.getElementById('bloom').value,
    grain: +document.getElementById('grain').value,
    vignette: +document.getElementById('vignette').value,
    chromatic: +document.getElementById('chromatic').value,
    warmth: +document.getElementById('warmth').value,
    tint: +document.getElementById('tint').value,
    levels: +document.getElementById('levels').value
  };
}

function setSliders(v){
  Object.keys(v).forEach(k=>{
    const el = document.getElementById(k);
    if(el){ 
      el.value = v[k]; 
      const labelId = k.replace(/sharpness|saturation|contrast|brightness|bloom|grain|vignette|chromatic|warmth|tint|levels/, m=>{
        const map={sharpness:'sharp',saturation:'sat',contrast:'cont',brightness:'bright',bloom:'bloom',grain:'grain',vignette:'vig',chromatic:'chrom',warmth:'warm',tint:'tint',levels:'lev'};
        return map[m]+'Val';
      });
      const lbl = document.getElementById(labelId);
      if(lbl) lbl.textContent = v[k];
    }
  });
}

function applyPreset(name, element){
  document.querySelectorAll('.fx-btn').forEach(b=>b.classList.remove('active'));
  if (element) {
    element.classList.add('active');
  }
  setSliders(presets[name]);
  updateEffect();
}

// === DEBOUNCED & CHUNKED PIPELINE ===
let updateTimeout = null;
let currentProcessingToken = null;

function updateEffect(){
  const v = getSliderVals();
  // Мгновенное обновление числовых показателей в UI
  document.getElementById('sharpVal').textContent = v.sharpness;
  document.getElementById('satVal').textContent = v.saturation;
  document.getElementById('contVal').textContent = v.contrast;
  document.getElementById('brightVal').textContent = v.brightness;
  document.getElementById('bloomVal').textContent = v.bloom;
  document.getElementById('grainVal').textContent = v.grain;
  document.getElementById('vigVal').textContent = v.vignette;
  document.getElementById('chromVal').textContent = v.chromatic;
  document.getElementById('warmVal').textContent = v.warmth;
  document.getElementById('tintVal').textContent = v.tint;
  document.getElementById('levVal').textContent = v.levels;

  // Откладываем выполнение тяжелой фильтрации, пока пользователь двигает ползунок
  clearTimeout(updateTimeout);
  updateTimeout = setTimeout(() => {
    runProcessingPipeline();
  }, 150);
}

function updateProgressBar(percent, text) {
  const bar = document.getElementById('progressBar');
  const percentText = document.getElementById('progressPercent');
  const textEl = document.getElementById('loadingText');
  
  if (bar) bar.style.width = percent + '%';
  if (percentText) percentText.textContent = percent + '%';
  if (textEl && text) textEl.textContent = text;
}

function showProgress(show) {
  const loader = document.getElementById('loading');
  if (show) {
    loader.classList.add('active');
  } else {
    loader.classList.remove('active');
  }
}

// Основной асинхронный конвейер обработки изображения
async function runProcessingPipeline() {
  const token = Symbol('render');
  currentProcessingToken = token;

  showProgress(true);
  updateProgressBar(0, "Подготовка к рендерингу...");

  const w = canvas.width, h = canvas.height;
  const src = originalImageData.data;
  const dst = new Uint8ClampedArray(src);
  const v = getSliderVals();

  // Предварительные расчеты для ускорения математики в цикле
  const br = (v.brightness - 100) * 2.55;
  const ct = (v.contrast - 100) / 100;
  const ctFactor = (1 + ct) * (259/255);
  const ctOffset = 128 * (1 - ctFactor);
  const sat = v.saturation / 100;
  const wr = v.warmth * 1.5, wg = -v.warmth * 0.5;
  const tr = v.tint * 0.8, tb = -v.tint * 0.8;
  const lev = v.levels / 100;

  // Шаг 1: Цветокоррекция в 10 асинхронных чанков (чтобы UI не вис)
  const chunkSize = Math.ceil(h / 10);
  for (let step = 0; step < 10; step++) {
    if (currentProcessingToken !== token) return; // задача отменена новой прокруткой

    const startRow = step * chunkSize;
    const endRow = Math.min(h, (step + 1) * chunkSize);

    for (let y = startRow; y < endRow; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        let r = src[i], g = src[i+1], b = src[i+2];

        // Яркость
        r += br; g += br; b += br;

        // Контраст
        r = r * ctFactor + ctOffset;
        g = g * ctFactor + ctOffset;
        b = b * ctFactor + ctOffset;

        // Насыщенность
        const gray = 0.299*r + 0.587*g + 0.114*b;
        r = gray + (r - gray) * sat;
        g = gray + (g - gray) * sat;
        b = gray + (b - gray) * sat;

        // Теплота & Оттенок
        r += wr + tr;
        g += wg;
        b += tb;

        // Линейный контраст S-Curve
        if(lev > 0){
          r = r + (r - 128) * lev * 0.5;
          g = g + (g - 128) * lev * 0.5;
          b = b + (b - 128) * lev * 0.5;
        }

        dst[i] = Math.max(0, Math.min(255, r));
        dst[i+1] = Math.max(0, Math.min(255, g));
        dst[i+2] = Math.max(0, Math.min(255, b));
      }
    }

    const pct = Math.round((step + 1) * 3); // 0% -> 30%
    updateProgressBar(pct, `Коррекция цвета: ${pct}%`);
    await new Promise(resolve => requestAnimationFrame(resolve));
  }

  let imgData = new ImageData(dst, w, h);

  // Шаг 2: Усиление резкости (Unsharp Mask Blur) - тоже чанками
  if(v.sharpness > 0){
    updateProgressBar(30, "Повышение резкости...");
    if (currentProcessingToken !== token) return;
    imgData = await applyUnsharpAsync(imgData, v.sharpness, token);
    if (currentProcessingToken !== token) return;
  } else {
    updateProgressBar(60, "Пропуск резкости...");
  }

  // Отрисовка базового получившегося слоя
  ctx.putImageData(imgData, 0, 0);
  await new Promise(resolve => requestAnimationFrame(resolve));

  // Шаг 3: Bloom эффект
  if(v.bloom > 0){
    updateProgressBar(70, "Применение свечения (Bloom)...");
    if (currentProcessingToken !== token) return;
    applyBloom(v.bloom);
    await new Promise(resolve => requestAnimationFrame(resolve));
  }

  // Шаг 4: Хроматическая аберрация
  if(v.chromatic > 0){
    updateProgressBar(80, "Хроматическая аберрация...");
    if (currentProcessingToken !== token) return;
    applyChromatic(v.chromatic);
    await new Promise(resolve => requestAnimationFrame(resolve));
  }

  // Шаг 5: Виньетка & Зернистость аниме
  if(v.vignette > 0 || v.grain > 0){
    updateProgressBar(90, "Накладывание шумов и виньетки...");
    if (currentProcessingToken !== token) return;
    if (v.vignette > 0) applyVignette(v.vignette);
    if (v.grain > 0) applyGrain(v.grain);
    await new Promise(resolve => requestAnimationFrame(resolve));
  }

  // Финал
  updateProgressBar(100, "Готово!");
  setTimeout(() => {
    if (currentProcessingToken === token) {
      showProgress(false);
    }
  }, 150);
}

// Асинхронное размытие (Unsharp Mask) без зависания браузера
async function applyUnsharpAsync(imgData, strength, token){
  const w = imgData.width, h = imgData.height;
  const src = imgData.data;
  const blur = new Float32Array(w * h * 4);
  const radius = Math.max(1, Math.floor(strength / 40));

  const steps = 6;
  const chunkSize = Math.ceil(h / steps);

  for (let step = 0; step < steps; step++) {
    if (currentProcessingToken !== token) return imgData;

    const startY = step * chunkSize;
    const endY = Math.min(h, (step + 1) * chunkSize);

    for (let y = startY; y < endY; y++) {
      for (let x = 0; x < w; x++) {
        let r=0, g=0, b=0, c=0;
        // Ограниченный box blur
        for (let dy = -radius; dy <= radius; dy++) {
          const py = Math.min(h-1, Math.max(0, y+dy));
          for (let dx = -radius; dx <= radius; dx++) {
            const px = Math.min(w-1, Math.max(0, x+dx));
            const idx = (py*w+px)*4;
            r += src[idx];
            g += src[idx+1];
            b += src[idx+2];
            c++;
          }
        }
        const idx = (y*w+x)*4;
        blur[idx] = r/c;
        blur[idx+1] = g/c;
        blur[idx+2] = b/c;
      }
    }

    const pct = 30 + Math.round(((step + 1) / steps) * 25); // прогресс: 30% -> 55%
    updateProgressBar(pct, `Расчет контуров резкости: ${pct}%`);
    await new Promise(resolve => requestAnimationFrame(resolve));
  }

  // Применяем резкость обратно к исходному кадру
  const amount = strength / 100;
  for (let i = 0; i < src.length; i += 4) {
    src[i] = Math.min(255, Math.max(0, src[i] + (src[i] - blur[i]) * amount));
    src[i+1] = Math.min(255, Math.max(0, src[i+1] + (src[i+1] - blur[i+1]) * amount));
    src[i+2] = Math.min(255, Math.max(0, src[i+2] + (src[i+2] - blur[i+2]) * amount));
  }

  updateProgressBar(60, "Резкость применена!");
  return imgData;
}

function applyBloom(strength){
  const w = canvas.width, h = canvas.height;
  const temp = document.createElement('canvas');
  temp.width = w/4; temp.height = h/4;
  const tctx = temp.getContext('2d');
  tctx.drawImage(canvas, 0, 0, w/4, h/4);
  tctx.filter = `blur(${strength/5}px) brightness(${100+strength/2}%)`;
  tctx.drawImage(temp, 0, 0);
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = strength/150;
  ctx.drawImage(temp, 0, 0, w, h);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function applyChromatic(amount){
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0,0,w,h);
  const src = imgData.data;
  const dst = new Uint8ClampedArray(src);
  const shift = Math.round(amount/2);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const idx = (y*w+x)*4;
      const rx = Math.min(w-1, x+shift);
      const bx = Math.max(0, x-shift);
      const ridx = (y*w+rx)*4;
      const bidx = (y*w+bx)*4;
      dst[idx] = src[ridx];
      dst[idx+2] = src[bidx+2];
    }
  }
  ctx.putImageData(new ImageData(dst,w,h),0,0);
}

function applyVignette(strength){
  const w = canvas.width, h = canvas.height;
  const grad = ctx.createRadialGradient(w/2,h/2, Math.min(w,h)*0.3, w/2,h/2, Math.max(w,h)*0.8);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, `rgba(0,0,0,${strength/100})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
}

function applyGrain(strength){
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0,0,w,h);
  const data = imgData.data;
  const amt = strength/2;
  for(let i=0;i<data.length;i+=4){
    const noise = (Math.random()-0.5)*amt;
    data[i] = Math.min(255, Math.max(0, data[i]+noise));
    data[i+1] = Math.min(255, Math.max(0, data[i+1]+noise));
    data[i+2] = Math.min(255, Math.max(0, data[i+2]+noise));
  }
  ctx.putImageData(imgData,0,0);
}

function resetEffects(){
  const defaultBtn = document.querySelector('.preset-grid .fx-btn');
  applyPreset('anime4k', defaultBtn);
}

function downloadImage(){
  const link = document.createElement('a');
  link.download = 'anime-frame-fx.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// Keyboard shortcuts
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeEditor();
});
