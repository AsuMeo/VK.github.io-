<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>FontForge Mobile — Рисуй свой шрифт</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0d0d0d; color: #e0e0e0;
  overflow: hidden; height: 100vh; display: flex; flex-direction: column;
}
header {
  background: #1a1a2e; padding: 10px 15px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid #333; flex-shrink: 0;
}
header h1 { font-size: 16px; margin: 0; color: #00d4ff; }
header .btns { display: flex; gap: 8px; }
header button {
  background: #00d4ff; color: #000; border: none;
  padding: 8px 14px; border-radius: 8px; font-weight: bold;
  font-size: 13px; cursor: pointer; touch-action: manipulation;
}
header button.secondary { background: #333; color: #fff; }

.main { flex: 1; display: flex; overflow: hidden; }

.sidebar {
  width: 70px; background: #111; border-right: 1px solid #222;
  display: flex; flex-direction: column; align-items: center;
  padding: 5px 0; overflow-y: auto; flex-shrink: 0;
}
.char-btn {
  width: 52px; height: 52px; margin: 3px 0;
  background: #1a1a1a; border: 2px solid #333; border-radius: 10px;
  color: #888; font-size: 22px; display: flex; align-items: center;
  justify-content: center; cursor: pointer; transition: 0.15s;
  position: relative; touch-action: manipulation;
}
.char-btn.active { border-color: #00d4ff; color: #00d4ff; background: #0a1a2a; }
.char-btn.done::after {
  content: ""; position: absolute; bottom: 3px; right: 3px;
  width: 8px; height: 8px; background: #00ff88; border-radius: 50%;
}

.editor-area {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 10px; position: relative;
}

.canvas-wrap {
  position: relative; background: #fff; border-radius: 12px;
  box-shadow: 0 0 20px rgba(0,212,255,0.1);
  touch-action: none;
}
#glyphCanvas {
  background: #fff; border-radius: 12px;
  cursor: crosshair; touch-action: none;
}
.guides {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; border-radius: 12px; overflow: hidden;
}
.guide-line {
  position: absolute; left: 0; width: 100%; height: 1px;
  background: rgba(255,0,0,0.3);
}

.tools {
  display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;
  justify-content: center;
}
.tool-btn {
  background: #1a1a2e; border: 1px solid #333; color: #ccc;
  padding: 10px 18px; border-radius: 10px; font-size: 14px;
  cursor: pointer; touch-action: manipulation;
}
.tool-btn.active { background: #00d4ff; color: #000; border-color: #00d4ff; }

.bottom-bar {
  background: #1a1a2e; padding: 10px 15px; border-top: 1px solid #333;
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0; gap: 10px; flex-wrap: wrap;
}
.bottom-bar label { font-size: 13px; color: #888; }
.bottom-bar input[type="range"] { flex: 1; min-width: 80px; }

.preview-section {
  background: #111; padding: 15px; border-top: 1px solid #222;
  flex-shrink: 0;
}
.preview-section h3 { margin: 0 0 10px 0; font-size: 14px; color: #00d4ff; }
#previewText {
  width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff;
  padding: 10px; border-radius: 8px; font-size: 16px; resize: none;
}
#previewOutput {
  margin-top: 10px; font-size: 28px; color: #fff;
  min-height: 50px; word-break: break-word; line-height: 1.4;
}

.gallery-modal, .export-modal {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column;
  padding: 15px; overflow-y: auto;
}
.gallery-modal.active, .export-modal.active { display: flex; }
.gallery-modal h2, .export-modal h2 {
  color: #00d4ff; margin: 0 0 15px 0; font-size: 18px;
  display: flex; justify-content: space-between; align-items: center;
}
.gallery-modal h2 button, .export-modal h2 button {
  background: #ff4444; color: #fff; border: none;
  padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
}
.gallery-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
}
.gallery-item {
  background: #1a1a2e; border: 2px solid #333; border-radius: 10px;
  padding: 10px; text-align: center; cursor: pointer; transition: 0.2s;
}
.gallery-item:hover { border-color: #00d4ff; }
.gallery-item canvas { width: 100%; border-radius: 6px; background: #fff; }
.gallery-item span { display: block; margin-top: 5px; font-size: 12px; color: #888; }

.export-modal .export-btns {
  display: flex; flex-direction: column; gap: 10px; margin-top: 10px;
}
.export-modal button {
  background: #00d4ff; color: #000; border: none;
  padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold;
  cursor: pointer;
}
.export-modal button.secondary { background: #333; color: #fff; }

.hidden { display: none !important; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

@media (max-width: 400px) {
  .sidebar { width: 55px; }
  .char-btn { width: 42px; height: 42px; font-size: 18px; }
}
</style>
</head>
<body>

<header>
  <h1>🖌️ FontForge Mobile</h1>
  <div class="btns">
    <button onclick="showGallery()">📁 Галерея</button>
    <button onclick="exportFont()">⬇️ Скачать TTF</button>
  </div>
</header>

<div class="main">
  <div class="sidebar" id="charSidebar"></div>

  <div class="editor-area">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="glyphCanvas" width="300" height="400"></canvas>
      <div class="guides" id="guides"></div>
    </div>

    <div class="tools">
      <button class="tool-btn active" id="btnDraw" onclick="setTool('draw')">✏️ Рисовать</button>
      <button class="tool-btn" id="btnErase" onclick="setTool('erase')">🧹 Ластик</button>
      <button class="tool-btn" onclick="clearCanvas()">🗑️ Очистить</button>
      <button class="tool-btn" onclick="undo()">↩️ Отмена</button>
      <button class="tool-btn" onclick="importFromGallery()">📂 Из галереи</button>
    </div>
  </div>
</div>

<div class="bottom-bar">
  <label>Толщина:</label>
  <input type="range" id="brushSize" min="2" max="20" value="6">
  <label>Цвет:</label>
  <input type="color" id="brushColor" value="#000000">
  <button class="tool-btn secondary" onclick="toggleGuides()">📐 Направляющие</button>
</div>

<div class="preview-section">
  <h3>🔍 Предпросмотр шрифта</h3>
  <textarea id="previewText" rows="2" placeholder="Введите текст для предпросмотра...">Привет, мир! ABC 123</textarea>
  <div id="previewOutput"></div>
</div>

<!-- Gallery Modal -->
<div class="gallery-modal" id="galleryModal">
  <h2>📁 Галерея символов <button onclick="closeGallery()">✕ Закрыть</button></h2>
  <div class="gallery-grid" id="galleryGrid"></div>
</div>

<!-- Export Modal -->
<div class="export-modal" id="exportModal">
  <h2>⬇️ Экспорт <button onclick="closeExport()">✕</button></h2>
  <p style="color:#888; font-size:14px;">Выберите формат экспорта:</p>
  <div class="export-btns">
    <button onclick="downloadTTF()">📥 Скачать .TTF (настоящий формат)</button>
    <button class="secondary" onclick="downloadPNG()">🖼️ Скачать PNG изображение</button>
    <button class="secondary" onclick="downloadSVG()">📄 Скачать SVG набор</button>
    <button class="secondary" onclick="closeExport()">Отмена</button>
  </div>
</div>

<!-- Hidden file input for gallery import -->
<input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">

<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<script>
// ==================== STATE ====================
const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzАБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюя0123456789 .,!?;:—-"'()[]{}';
let glyphs = {}; // char -> ImageData
let currentChar = 'A';
let currentTool = 'draw';
let brushSize = 6;
let brushColor = '#000000';
let showGuidesFlag = true;
let undoStack = [];

const canvas = document.getElementById('glyphCanvas');
const ctx = canvas.getContext('2d');
const previewCtx = document.createElement('canvas').getContext('2d');

// ==================== INIT ====================
function init() {
  initSidebar();
  initCanvas();
  initGuides();
  loadChar('A');
  updatePreview();

  document.getElementById('brushSize').addEventListener('input', e => brushSize = +e.target.value);
  document.getElementById('brushColor').addEventListener('input', e => brushColor = e.target.value);
  document.getElementById('previewText').addEventListener('input', updatePreview);

  // Touch & mouse events
  let drawing = false;
  const getPos = e => {
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;
    return {
      x: (touch.clientX - rect.left) * (canvas.width / rect.width),
      y: (touch.clientY - rect.top) * (canvas.height / rect.height)
    };
  };

  const startDraw = e => {
    e.preventDefault();
    drawing = true;
    saveUndo();
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = brushSize;
    ctx.strokeStyle = currentTool === 'erase' ? '#ffffff' : brushColor;
  };

  const moveDraw = e => {
    if (!drawing) return;
    e.preventDefault();
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  };

  const endDraw = () => {
    if (!drawing) return;
    drawing = false;
    ctx.closePath();
    saveGlyph();
    updatePreview();
    markCharDone(currentChar);
  };

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', moveDraw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseleave', endDraw);

  canvas.addEventListener('touchstart', startDraw, {passive: false});
  canvas.addEventListener('touchmove', moveDraw, {passive: false});
  canvas.addEventListener('touchend', endDraw);
  canvas.addEventListener('touchcancel', endDraw);
}

function initSidebar() {
  const sb = document.getElementById('charSidebar');
  sb.innerHTML = '';
  for (const ch of CHARS) {
    const btn = document.createElement('div');
    btn.className = 'char-btn' + (ch === currentChar ? ' active' : '');
    btn.textContent = ch === ' ' ? '␣' : ch;
    btn.dataset.char = ch;
    btn.onclick = () => loadChar(ch);
    sb.appendChild(btn);
  }
}

function initCanvas() {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function initGuides() {
  const g = document.getElementById('guides');
  const h = canvas.height;
  const lines = [
    {y: h * 0.15, label: 'ascender'},
    {y: h * 0.35, label: 'x-height'},
    {y: h * 0.65, label: 'baseline'},
    {y: h * 0.85, label: 'descender'}
  ];
  g.innerHTML = '';
  for (const ln of lines) {
    const div = document.createElement('div');
    div.className = 'guide-line';
    div.style.top = ln.y + 'px';
    g.appendChild(div);
  }
}

// ==================== TOOLS ====================
function setTool(tool) {
  currentTool = tool;
  document.getElementById('btnDraw').classList.toggle('active', tool === 'draw');
  document.getElementById('btnErase').classList.toggle('active', tool === 'erase');
}

function clearCanvas() {
  saveUndo();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  saveGlyph();
  updatePreview();
}

function undo() {
  if (!undoStack.length) return;
  const data = undoStack.pop();
  ctx.putImageData(data, 0, 0);
  saveGlyph();
  updatePreview();
}

function saveUndo() {
  if (undoStack.length > 20) undoStack.shift();
  undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
}

function toggleGuides() {
  showGuidesFlag = !showGuidesFlag;
  document.getElementById('guides').style.display = showGuidesFlag ? 'block' : 'none';
}

// ==================== GLYPHS ====================
function loadChar(ch) {
  saveGlyph();
  currentChar = ch;

  // Update sidebar
  document.querySelectorAll('.char-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.char === ch);
  });

  // Load or init
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (glyphs[ch]) {
    ctx.putImageData(glyphs[ch], 0, 0);
  }
  undoStack = [];
}

function saveGlyph() {
  glyphs[currentChar] = ctx.getImageData(0, 0, canvas.width, canvas.height);
}

function markCharDone(ch) {
  const btn = document.querySelector(`.char-btn[data-char="${CSS.escape(ch)}"]`);
  if (btn) btn.classList.add('done');
}

// ==================== PREVIEW ====================
function updatePreview() {
  const text = document.getElementById('previewText').value;
  const out = document.getElementById('previewOutput');
  out.innerHTML = '';

  // Render each char as small canvas
  let html = '';
  for (const ch of text) {
    if (glyphs[ch]) {
      const c = document.createElement('canvas');
      c.width = 40; c.height = 50;
      const cx = c.getContext('2d');
      cx.drawImage(canvasFromImageData(glyphs[ch]), 0, 0, 40, 50);
      html += `<img src="${c.toDataURL()}" style="width:40px;height:50px;vertical-align:middle;margin:1px;">`;
    } else {
      html += `<span style="color:#555;font-size:28px;vertical-align:middle;">${ch}</span>`;
    }
  }
  out.innerHTML = html;
}

function canvasFromImageData(imgData) {
  const c = document.createElement('canvas');
  c.width = canvas.width; c.height = canvas.height;
  c.getContext('2d').putImageData(imgData, 0, 0);
  return c;
}

// ==================== GALLERY ====================
function showGallery() {
  const modal = document.getElementById('galleryModal');
  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '';

  for (const ch of CHARS) {
    if (!glyphs[ch]) continue;
    const item = document.createElement('div');
    item.className = 'gallery-item';
    const c = document.createElement('canvas');
    c.width = 100; c.height = 130;
    const cx = c.getContext('2d');
    cx.fillStyle = '#fff'; cx.fillRect(0,0,100,130);
    cx.drawImage(canvasFromImageData(glyphs[ch]), 0, 0, 100, 130);
    item.appendChild(c);
    const span = document.createElement('span');
    span.textContent = ch === ' ' ? 'Пробел' : ch;
    item.appendChild(span);
    item.onclick = () => { loadChar(ch); closeGallery(); };
    grid.appendChild(item);
  }

  if (!grid.children.length) {
    grid.innerHTML = '<p style="color:#888;grid-column:1/-1;text-align:center;">Нарисуйте символы, чтобы они появились здесь</p>';
  }

  modal.classList.add('active');
}

function closeGallery() {
  document.getElementById('galleryModal').classList.remove('active');
}

function importFromGallery() {
  document.getElementById('fileInput').click();
}

function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      saveUndo();
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      saveGlyph();
      markCharDone(currentChar);
      updatePreview();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ==================== EXPORT ====================
function exportFont() {
  document.getElementById('exportModal').classList.add('active');
}

function closeExport() {
  document.getElementById('exportModal').classList.remove('active');
}

// --- REAL TTF EXPORT via opentype.js ---
function downloadTTF() {
  const doneGlyphs = Object.keys(glyphs).filter(ch => glyphs[ch]);
  if (doneGlyphs.length === 0) {
    alert('Нарисуйте хотя бы один символ!');
    return;
  }

  // Build opentype.js paths from raster data
  const notdefPath = new opentype.Path();
  notdefPath.moveTo(0,0); notdefPath.lineTo(500,0);
  notdefPath.lineTo(500,700); notdefPath.lineTo(0,700); notdefPath.closePath();

  const fontGlyphs = [];
  fontGlyphs.push(new opentype.Glyph({
    name: '.notdef', unicode: 0, advanceWidth: 500,
    path: notdefPath
  }));

  for (const ch of doneGlyphs) {
    const path = rasterToPath(glyphs[ch], ch);
    const glyph = new opentype.Glyph({
      name: ch === ' ' ? 'space' : 'glyph_' + ch.charCodeAt(0),
      unicode: ch.charCodeAt(0),
      advanceWidth: 600,
      path: path
    });
    fontGlyphs.push(glyph);
  }

  const font = new opentype.Font({
    familyName: 'MyHandFont',
    styleName: 'Regular',
    unitsPerEm: 1000,
    ascender: 800,
    descender: -200,
    glyphs: fontGlyphs
  });

  font.download('MyHandFont.ttf');
  closeExport();
}

// Convert raster ImageData to opentype.js Path by tracing edges
function rasterToPath(imgData, ch) {
  const path = new opentype.Path();
  const w = canvas.width, h = canvas.height;
  const data = imgData.data;

  // Simple threshold: non-white pixels
  const isBlack = (x, y) => {
    if (x < 0 || x >= w || y < 0 || y >= h) return false;
    const i = (y * w + x) * 4;
    return data[i] < 200 || data[i+1] < 200 || data[i+2] < 200;
  };

  // Marching squares-ish: trace contours
  const visited = new Set();
  const key = (x,y) => x + ',' + y;

  // Find all black pixels and create small squares for each
  const scaleX = 600 / w;
  const scaleY = 700 / h;
  const offsetY = 650; // baseline

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (isBlack(x, y)) {
        const px = x * scaleX;
        const py = offsetY - y * scaleY;
        const pw = scaleX;
        const ph = scaleY;

        // Draw small rect for this pixel
        path.moveTo(px, py);
        path.lineTo(px + pw, py);
        path.lineTo(px + pw, py + ph);
        path.lineTo(px, py + ph);
        path.closePath();
      }
    }
  }

  return path;
}

function downloadPNG() {
  const link = document.createElement('a');
  link.download = 'glyph_' + currentChar + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  closeExport();
}

function downloadSVG() {
  let svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
';
  for (const ch of Object.keys(glyphs)) {
    if (!glyphs[ch]) continue;
    const c = canvasFromImageData(glyphs[ch]);
    svg += `  <image x="0" y="0" width="300" height="400" href="${c.toDataURL()}" data-char="${ch}"/>
`;
  }
  svg += '</svg>';
  const blob = new Blob([svg], {type: 'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = 'MyHandFont.svg';
  link.click();
  URL.revokeObjectURL(url);
  closeExport();
}

// ==================== START ====================
init();
</script>
</body>
</html>
