<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050508">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PhotoForge Pro</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#050508; color:#e0e0f0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  ::-webkit-scrollbar { display:none; }

  #app { width:100%; height:100%; display:flex; flex-direction:column; }

  /* ===== HEADER ===== */
  .header { flex-shrink:0; height:50px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; background:rgba(5,5,8,0.92); backdrop-filter:blur(24px); border-bottom:1px solid rgba(255,255,255,0.04); z-index:100; }
  .header-title { font-size:17px; font-weight:800; letter-spacing:0.8px; background:linear-gradient(135deg,#8b5cf6,#ec4899); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .header-actions { display:flex; gap:6px; align-items:center; }
  .btn-icon { width:36px; height:36px; border-radius:10px; border:none; background:rgba(255,255,255,0.05); color:#a0a0b8; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.12s; }
  .btn-icon:active { background:rgba(255,255,255,0.12); transform:scale(0.9); }
  .btn-icon svg { width:18px; height:18px; }
  .btn-primary { padding:8px 18px; border-radius:10px; border:none; background:linear-gradient(135deg,#8b5cf6,#ec4899); color:#fff; font-size:13px; font-weight:700; cursor:pointer; }
  .btn-primary:active { opacity:0.7; transform:scale(0.92); }

  /* ===== CANVAS ===== */
  .canvas-wrapper { flex:1; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at center,#0c0c18 0%,#050508 100%); }
  #canvas { max-width:100%; max-height:100%; touch-action:none; border-radius:4px; }

  .empty-state { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; }
  .empty-state svg { width:60px; height:60px; opacity:0.25; }
  .empty-state h2 { font-size:18px; color:#666680; font-weight:600; }
  .empty-state p { font-size:13px; color:#444; }
  .upload-btn { padding:14px 36px; border-radius:14px; border:none; background:linear-gradient(135deg,#8b5cf6,#ec4899); color:#fff; font-size:15px; font-weight:700; cursor:pointer; margin-top:4px; box-shadow:0 4px 20px rgba(139,92,246,0.3); }
  .upload-btn:active { transform:scale(0.95); }

  /* ===== TOOLS PANEL ===== */
  .tools-panel { flex-shrink:0; background:rgba(5,5,8,0.95); backdrop-filter:blur(24px); border-top:1px solid rgba(255,255,255,0.04); z-index:100; }

  .tool-tabs { display:flex; overflow-x:auto; padding:8px 12px; gap:4px; scrollbar-width:none; }
  .tool-tab { flex-shrink:0; padding:8px 14px; border-radius:10px; border:none; background:transparent; color:#666680; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; transition:all 0.15s; }
  .tool-tab.active { background:linear-gradient(135deg,#8b5cf6,#ec4899); color:#fff; }
  .tool-tab:active { transform:scale(0.95); }

  .tool-content { padding:8px 12px 12px; display:none; }
  .tool-content.active { display:block; }

  /* ===== BRUSH ===== */
  .brush-row { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .brush-preview-canvas { width:44px; height:44px; border-radius:10px; background:rgba(255,255,255,0.03); flex-shrink:0; }
  .brush-controls { flex:1; }
  .slider-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .slider-row label { font-size:11px; color:#666680; width:52px; flex-shrink:0; font-weight:500; }
  .slider-row input[type="range"] { flex:1; -webkit-appearance:none; height:5px; border-radius:3px; background:rgba(255,255,255,0.08); outline:none; }
  .slider-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:linear-gradient(135deg,#8b5cf6,#ec4899); cursor:pointer; box-shadow:0 2px 8px rgba(139,92,246,0.4); }
  .slider-row span { font-size:11px; color:#a0a0b8; width:32px; text-align:right; font-weight:600; }

  .color-palette { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
  .color-swatch { width:26px; height:26px; border-radius:8px; border:2px solid transparent; cursor:pointer; transition:all 0.15s; }
  .color-swatch.active { border-color:#8b5cf6; transform:scale(1.2); box-shadow:0 0 8px rgba(139,92,246,0.5); }
  .color-swatch:active { transform:scale(0.85); }

  /* ===== ADJUSTMENTS ===== */
  .adjust-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .adjust-item { background:rgba(255,255,255,0.025); border-radius:12px; padding:10px; }
  .adjust-item label { font-size:11px; color:#666680; display:block; margin-bottom:5px; font-weight:500; }
  .adjust-item input[type="range"] { width:100%; -webkit-appearance:none; height:5px; border-radius:3px; background:rgba(255,255,255,0.08); outline:none; }
  .adjust-item input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:linear-gradient(135deg,#8b5cf6,#ec4899); cursor:pointer; box-shadow:0 2px 8px rgba(139,92,246,0.4); }
  .adjust-value { font-size:11px; color:#a0a0b8; text-align:right; margin-top:3px; font-weight:600; }

  /* ===== FILTERS ===== */
  .filters-scroll { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .filter-item { flex-shrink:0; width:72px; background:rgba(255,255,255,0.025); border-radius:12px; padding:6px; text-align:center; cursor:pointer; transition:all 0.15s; border:2px solid transparent; }
  .filter-item.active { border-color:#8b5cf6; background:rgba(139,92,246,0.08); }
  .filter-item:active { transform:scale(0.95); }
  .filter-item .filter-preview { width:100%; aspect-ratio:1; border-radius:8px; overflow:hidden; margin-bottom:5px; position:relative; }
  .filter-item .filter-preview img, .filter-item .filter-preview div { width:100%; height:100%; object-fit:cover; }
  .filter-item span { font-size:9px; color:#8888a0; }

  /* ===== EFFECTS ===== */
  .effects-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .effect-item { background:rgba(255,255,255,0.025); border-radius:10px; padding:10px 4px; text-align:center; cursor:pointer; transition:all 0.15s; border:2px solid transparent; }
  .effect-item.active { border-color:#8b5cf6; background:rgba(139,92,246,0.08); }
  .effect-item:active { transform:scale(0.92); }
  .effect-item svg { width:20px; height:20px; margin-bottom:4px; color:#8b5cf6; }
  .effect-item span { font-size:9px; color:#8888a0; display:block; }

  /* ===== CROP ===== */
  .crop-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .crop-item { background:rgba(255,255,255,0.025); border-radius:10px; padding:10px 4px; text-align:center; cursor:pointer; transition:all 0.15s; }
  .crop-item:active { transform:scale(0.92); }
  .crop-item svg { width:18px; height:18px; color:#8888a0; }
  .crop-item span { font-size:9px; color:#8888a0; display:block; margin-top:3px; }

  /* ===== LOADING ===== */
  .loading-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:999; }
  .loading-overlay.active { display:flex; }
  .spinner { width:36px; height:36px; border:3px solid rgba(255,255,255,0.08); border-top-color:#8b5cf6; border-radius:50%; animation:spin 0.7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ===== TOAST ===== */
  .toast { position:fixed; bottom:120px; left:50%; transform:translateX(-50%) translateY(20px); background:rgba(20,20,35,0.95); color:#fff; padding:10px 22px; border-radius:12px; font-size:13px; opacity:0; pointer-events:none; transition:all 0.3s; z-index:1000; border:1px solid rgba(255,255,255,0.06); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  #fileInput { display:none; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-title">PhotoForge Pro</div>
    <div class="header-actions">
      <button class="btn-icon" onclick="uploadPhoto()" title="Загрузить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <button class="btn-icon" onclick="undo()" title="Отменить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      </button>
      <button class="btn-icon" onclick="redo()" title="Повторить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
      <button class="btn-icon" onclick="resetAll()" title="Сбросить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
      <button class="btn-primary" onclick="downloadImage()">Сохранить</button>
    </div>
  </div>

  <div class="canvas-wrapper" id="canvasWrapper">
    <canvas id="canvas"></canvas>
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <h2>Нет фото</h2>
      <p>Загрузите фото из галереи</p>
      <button class="upload-btn" onclick="uploadPhoto()">Выбрать фото</button>
    </div>
  </div>

  <div class="tools-panel">
    <div class="tool-tabs" id="toolTabs">
      <button class="tool-tab active" data-tab="brush">Кисть</button>
      <button class="tool-tab" data-tab="adjust">Настройки</button>
      <button class="tool-tab" data-tab="filters">Фильтры</button>
      <button class="tool-tab" data-tab="effects">Эффекты</button>
      <button class="tool-tab" data-tab="crop">Кадр</button>
      <button class="tool-tab" data-tab="more">Ещё</button>
    </div>

    <div class="tool-content active" id="tab-brush">
      <div class="brush-row">
        <canvas class="brush-preview-canvas" id="brushPreview"></canvas>
        <div class="brush-controls">
          <div class="slider-row">
            <label>Размер</label>
            <input type="range" id="brushSize" min="0.5" max="100" step="0.5" value="15" oninput="updateBrush()">
            <span id="brushSizeVal">15</span>
          </div>
          <div class="slider-row">
            <label>Непрозр.</label>
            <input type="range" id="brushOpacity" min="1" max="100" value="100" oninput="updateBrush()">
            <span id="brushOpacityVal">100</span>
          </div>
          <div class="slider-row">
            <label>Размытие</label>
            <input type="range" id="brushBlur" min="0" max="20" step="0.5" value="0" oninput="updateBrush()">
            <span id="brushBlurVal">0</span>
          </div>
        </div>
      </div>
      <div class="color-palette" id="colorPalette">
        <div class="color-swatch active" style="background:#ff0000" data-color="#ff0000"></div>
        <div class="color-swatch" style="background:#ff4400" data-color="#ff4400"></div>
        <div class="color-swatch" style="background:#ff8800" data-color="#ff8800"></div>
        <div class="color-swatch" style="background:#ffcc00" data-color="#ffcc00"></div>
        <div class="color-swatch" style="background:#88ff00" data-color="#88ff00"></div>
        <div class="color-swatch" style="background:#00ff00" data-color="#00ff00"></div>
        <div class="color-swatch" style="background:#00ff88" data-color="#00ff88"></div>
        <div class="color-swatch" style="background:#00ffff" data-color="#00ffff"></div>
        <div class="color-swatch" style="background:#0088ff" data-color="#0088ff"></div>
        <div class="color-swatch" style="background:#0000ff" data-color="#0000ff"></div>
        <div class="color-swatch" style="background:#8800ff" data-color="#8800ff"></div>
        <div class="color-swatch" style="background:#ff00ff" data-color="#ff00ff"></div>
        <div class="color-swatch" style="background:#ff0088" data-color="#ff0088"></div>
        <div class="color-swatch" style="background:#ffffff" data-color="#ffffff"></div>
        <div class="color-swatch" style="background:#aaaaaa" data-color="#aaaaaa"></div>
        <div class="color-swatch" style="background:#000000" data-color="#000000"></div>
      </div>
    </div>

    <div class="tool-content" id="tab-adjust">
      <div class="adjust-grid">
        <div class="adjust-item"><label>Яркость</label><input type="range" id="brightness" min="-100" max="100" step="0.5" value="0" oninput="debouncedAdjust()"><div class="adjust-value" id="brightnessVal">0</div></div>
        <div class="adjust-item"><label>Контраст</label><input type="range" id="contrast" min="-100" max="100" step="0.5" value="0" oninput="debouncedAdjust()"><div class="adjust-value" id="contrastVal">0</div></div>
        <div class="adjust-item"><label>Насыщенность</label><input type="range" id="saturation" min="-100" max="100" step="0.5" value="0" oninput="debouncedAdjust()"><div class="adjust-value" id="saturationVal">0</div></div>
        <div class="adjust-item"><label>Теплота</label><input type="range" id="warmth" min="-100" max="100" step="0.5" value="0" oninput="debouncedAdjust()"><div class="adjust-value" id="warmthVal">0</div></div>
        <div class="adjust-item"><label>Резкость</label><input type="range" id="sharpness" min="0" max="100" step="0.5" value="0" oninput="debouncedAdjust()"><div class="adjust-value" id="sharpnessVal">0</div></div>
        <div class="adjust-item"><label>Экспозиция</label><input type="range" id="exposure" min="-100" max="100" step="0.5" value="0" oninput="debouncedAdjust()"><div class="adjust-value" id="exposureVal">0</div></div>
        <div class="adjust-item"><label>Тени</label><input type="range" id="shadows" min="-100" max="100" step="0.5" value="0" oninput="debouncedAdjust()"><div class="adjust-value" id="shadowsVal">0</div></div>
        <div class="adjust-item"><label>Света</label><input type="range" id="highlights" min="-100" max="100" step="0.5" value="0" oninput="debouncedAdjust()"><div class="adjust-value" id="highlightsVal">0</div></div>
      </div>
    </div>

    <div class="tool-content" id="tab-filters">
      <div class="filters-scroll" id="filtersGrid"></div>
    </div>

    <div class="tool-content" id="tab-effects">
      <div class="effects-grid">
        <div class="effect-item" onclick="applyEffect('blur')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg><span>Размытие</span></div>
        <div class="effect-item" onclick="applyEffect('pixelate')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>Пиксель</span></div>
        <div class="effect-item" onclick="applyEffect('vignette')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/></svg><span>Виньетка</span></div>
        <div class="effect-item" onclick="applyEffect('noise')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg><span>Шум</span></div>
        <div class="effect-item" onclick="applyEffect('oil')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg><span>Масло</span></div>
        <div class="effect-item" onclick="applyEffect('sketch')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg><span>Эскиз</span></div>
        <div class="effect-item" onclick="applyEffect('invert')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20z"/></svg><span>Инверсия</span></div>
        <div class="effect-item" onclick="applyEffect('sepia')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span>Сепия</span></div>
        <div class="effect-item" onclick="applyEffect('emboss')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l16 16"/><path d="M4 20l16-16"/></svg><span>Тиснение</span></div>
        <div class="effect-item" onclick="applyEffect('edge')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 4l16 16"/></svg><span>Контуры</span></div>
        <div class="effect-item" onclick="applyEffect('posterize')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg><span>Постер</span></div>
        <div class="effect-item" onclick="applyEffect('threshold')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4" y1="12" x2="20" y2="12"/></svg><span>Порог</span></div>
      </div>
    </div>

    <div class="tool-content" id="tab-crop">
      <div class="crop-grid">
        <div class="crop-item" onclick="rotateImage(90)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg><span>90°</span></div>
        <div class="crop-item" onclick="rotateImage(-90)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg><span>-90°</span></div>
        <div class="crop-item" onclick="flipImage('h')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V4"/><path d="M5 10l7-6 7 6"/></svg><span>Гориз.</span></div>
        <div class="crop-item" onclick="flipImage('v')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16"/><path d="M14 6l6 6-6 6"/></svg><span>Верт.</span></div>
        <div class="crop-item" onclick="cropRatio(1,1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg><span>1:1</span></div>
        <div class="crop-item" onclick="cropRatio(4,3)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/></svg><span>4:3</span></div>
        <div class="crop-item" onclick="cropRatio(16,9)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="22" height="12" rx="2"/></svg><span>16:9</span></div>
        <div class="crop-item" onclick="cropRatio(3,4)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/></svg><span>3:4</span></div>
      </div>
    </div>

    <div class="tool-content" id="tab-more">
      <div class="adjust-grid">
        <div class="adjust-item"><label>Зернистость</label><input type="range" id="grain" min="0" max="100" step="0.5" value="0" oninput="debouncedAdjust()"><div class="adjust-value" id="grainVal">0</div></div>
        <div class="adjust-item"><label>Тональность</label><input type="range" id="tint" min="-100" max="100" step="0.5" value="0" oninput="debouncedAdjust()"><div class="adjust-value" id="tintVal">0</div></div>
        <div class="adjust-item"><label>Гамма</label><input type="range" id="gamma" min="50" max="200" step="0.5" value="100" oninput="debouncedAdjust()"><div class="adjust-value" id="gammaVal">100</div></div>
        <div class="adjust-item"><label>Виньетка</label><input type="range" id="vignetteAmount" min="0" max="100" step="0.5" value="0" oninput="debouncedAdjust()"><div class="adjust-value" id="vignetteAmountVal">0</div></div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)">
<div class="loading-overlay" id="loading"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<script>
// ===== STATE =====
let canvas, ctx, originalImage = null, currentImage = null;
let historyStack = [], historyIndex = -1;
let isDrawing = false, lastX = 0, lastY = 0;
let brushColor = '#ff0000', brushSize = 15, brushOpacity = 1, brushBlur = 0;
let adjustments = { brightness:0, contrast:0, saturation:0, warmth:0, sharpness:0, exposure:0, shadows:0, highlights:0, grain:0, tint:0, gamma:100, vignetteAmount:0 };
let currentFilter = 'none';
let rotation = 0, flipH = 1, flipV = 1;
let adjustTimeout = null;
let pendingAdjust = false;

// ===== INIT =====
window.onload = function() {
  canvas = document.getElementById('canvas');
  ctx = canvas.getContext('2d');
  initTabs();
  initColorPalette();
  updateBrush();
  generateFilterPreviews();

  canvas.addEventListener('touchstart', handleTouchStart, {passive:false});
  canvas.addEventListener('touchmove', handleTouchMove, {passive:false});
  canvas.addEventListener('touchend', handleTouchEnd, {passive:false});
  canvas.addEventListener('touchcancel', handleTouchEnd, {passive:false});
};

function initTabs() {
  document.querySelectorAll('.tool-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tool-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tool-content').forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
  });
}

function initColorPalette() {
  document.querySelectorAll('.color-swatch').forEach(swatch => {
    swatch.addEventListener('click', () => {
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      swatch.classList.add('active');
      brushColor = swatch.dataset.color;
      updateBrush();
    });
  });
}

// ===== FILE =====
function uploadPhoto() {
  document.getElementById('fileInput').click();
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  showLoading(true);
  const reader = new FileReader();
  reader.onload = function(evt) {
    const img = new Image();
    img.onload = function() {
      originalImage = img;
      currentImage = img;
      resetState();
      fitCanvas();
      renderCanvas();
      document.getElementById('emptyState').style.display = 'none';
      showLoading(false);
      showToast('Фото загружено!');
      pushHistory();
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
}

function fitCanvas() {
  if (!currentImage) return;
  const wrapper = document.getElementById('canvasWrapper');
  const maxW = wrapper.clientWidth - 16;
  const maxH = wrapper.clientHeight - 16;
  let w = currentImage.width;
  let h = currentImage.height;
  const ratio = Math.min(maxW / w, maxH / h, 1);
  canvas.width = w;
  canvas.height = h;
  canvas.style.width = Math.round(w * ratio) + 'px';
  canvas.style.height = Math.round(h * ratio) + 'px';
}

function renderCanvas() {
  if (!currentImage) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.rotate(rotation * Math.PI / 180);
  ctx.scale(flipH, flipV);
  ctx.translate(-canvas.width/2, -canvas.height/2);
  ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
  ctx.restore();
}

// ===== HISTORY =====
function pushHistory() {
  if (historyIndex < historyStack.length - 1) {
    historyStack = historyStack.slice(0, historyIndex + 1);
  }
  historyStack.push(canvas.toDataURL('image/jpeg', 0.92));
  historyIndex++;
  if (historyStack.length > 15) {
    historyStack.shift();
    historyIndex--;
  }
}

function undo() {
  if (historyIndex > 0) {
    historyIndex--;
    loadFromHistory();
  }
}

function redo() {
  if (historyIndex < historyStack.length - 1) {
    historyIndex++;
    loadFromHistory();
  }
}

function loadFromHistory() {
  const img = new Image();
  img.onload = function() {
    currentImage = img;
    fitCanvas();
    renderCanvas();
  };
  img.src = historyStack[historyIndex];
}

function resetAll() {
  if (!originalImage) return;
  currentImage = originalImage;
  resetState();
  fitCanvas();
  renderCanvas();
  pushHistory();
  showToast('Сброшено');
}

function resetState() {
  rotation = 0; flipH = 1; flipV = 1;
  adjustments = { brightness:0, contrast:0, saturation:0, warmth:0, sharpness:0, exposure:0, shadows:0, highlights:0, grain:0, tint:0, gamma:100, vignetteAmount:0 };
  currentFilter = 'none';
  document.querySelectorAll('.tool-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.tool-tab[data-tab="brush"]').classList.add('active');
  document.querySelectorAll('.tool-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-brush').classList.add('active');
  document.querySelectorAll('.filter-item').forEach(f => f.classList.remove('active'));
  document.querySelectorAll('.effect-item').forEach(e => e.classList.remove('active'));
  const ids = ['brightness','contrast','saturation','warmth','sharpness','exposure','shadows','highlights','grain','tint','gamma','vignetteAmount'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.value = id === 'gamma' ? 100 : 0; }
    const valEl = document.getElementById(id + 'Val');
    if (valEl) valEl.textContent = id === 'gamma' ? '100' : '0';
  });
}

// ===== BRUSH =====
function getTouchPos(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return { x: (touch.clientX - rect.left) * scaleX, y: (touch.clientY - rect.top) * scaleY };
}

function handleTouchStart(e) {
  if (!currentImage) return;
  if (document.querySelector('.tool-tab.active').dataset.tab !== 'brush') return;
  e.preventDefault();
  isDrawing = true;
  const pos = getTouchPos(e);
  lastX = pos.x; lastY = pos.y;
  drawPoint(pos.x, pos.y);
}

function handleTouchMove(e) {
  if (!isDrawing) return;
  e.preventDefault();
  const pos = getTouchPos(e);
  drawLine(lastX, lastY, pos.x, pos.y);
  lastX = pos.x; lastY = pos.y;
}

function handleTouchEnd(e) {
  if (isDrawing) { isDrawing = false; pushHistory(); }
}

function drawPoint(x, y) {
  ctx.save();
  ctx.globalAlpha = brushOpacity;
  if (brushBlur > 0) ctx.filter = 'blur(' + brushBlur + 'px)';
  ctx.beginPath();
  ctx.arc(x, y, brushSize / 2, 0, Math.PI * 2);
  ctx.fillStyle = brushColor;
  ctx.fill();
  ctx.restore();
}

function drawLine(x1, y1, x2, y2) {
  ctx.save();
  ctx.globalAlpha = brushOpacity;
  if (brushBlur > 0) ctx.filter = 'blur(' + brushBlur + 'px)';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = brushColor;
  ctx.lineWidth = brushSize;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.restore();
}

function updateBrush() {
  brushSize = parseFloat(document.getElementById('brushSize').value);
  brushOpacity = parseInt(document.getElementById('brushOpacity').value) / 100;
  brushBlur = parseFloat(document.getElementById('brushBlur').value);
  document.getElementById('brushSizeVal').textContent = brushSize;
  document.getElementById('brushOpacityVal').textContent = document.getElementById('brushOpacity').value;
  document.getElementById('brushBlurVal').textContent = brushBlur;

  const preview = document.getElementById('brushPreview');
  const pctx = preview.getContext('2d');
  preview.width = 44; preview.height = 44;
  pctx.clearRect(0, 0, 44, 44);
  pctx.save();
  pctx.globalAlpha = brushOpacity;
  if (brushBlur > 0) pctx.filter = 'blur(' + brushBlur + 'px)';
  pctx.beginPath();
  pctx.arc(22, 22, Math.min(brushSize/2, 18), 0, Math.PI * 2);
  pctx.fillStyle = brushColor;
  pctx.fill();
  pctx.restore();
}

// ===== ADJUSTMENTS (DEBOUNCED) =====
function debouncedAdjust() {
  pendingAdjust = true;
  if (adjustTimeout) clearTimeout(adjustTimeout);
  adjustTimeout = setTimeout(() => {
    if (pendingAdjust) {
      pendingAdjust = false;
      applyAdjustments();
    }
  }, 80);
}

function applyAdjustments() {
  if (!originalImage) return;
  adjustments.brightness = parseFloat(document.getElementById('brightness').value);
  adjustments.contrast = parseFloat(document.getElementById('contrast').value);
  adjustments.saturation = parseFloat(document.getElementById('saturation').value);
  adjustments.warmth = parseFloat(document.getElementById('warmth').value);
  adjustments.sharpness = parseFloat(document.getElementById('sharpness').value);
  adjustments.exposure = parseFloat(document.getElementById('exposure').value);
  adjustments.shadows = parseFloat(document.getElementById('shadows').value);
  adjustments.highlights = parseFloat(document.getElementById('highlights').value);

  const moreIds = ['grain','tint','gamma','vignetteAmount'];
  moreIds.forEach(id => {
    if (document.getElementById(id)) {
      adjustments[id] = parseFloat(document.getElementById(id).value);
    }
  });

  ['brightness','contrast','saturation','warmth','sharpness','exposure','shadows','highlights','grain','tint','gamma','vignetteAmount'].forEach(id => {
    const valEl = document.getElementById(id + 'Val');
    if (valEl && document.getElementById(id)) valEl.textContent = document.getElementById(id).value;
  });

  applyAllEffects();
}

// ===== FILTERS =====
const filters = [
  {name:'Оригинал', filter:'none'},
  {name:'Ч/Б', filter:'grayscale(100%)'},
  {name:'Сепия', filter:'sepia(100%)'},
  {name:'Винтаж', filter:'sepia(30%) contrast(1.2) brightness(0.9)'},
  {name:'Кино', filter:'contrast(1.3) saturate(1.2)'},
  {name:'Холодный', filter:'hue-rotate(180deg) saturate(0.7)'},
  {name:'Теплый', filter:'hue-rotate(-15deg) saturate(1.3)'},
  {name:'Неон', filter:'saturate(2) contrast(1.3) brightness(1.1)'},
  {name:'Пастель', filter:'saturate(0.5) brightness(1.1)'},
  {name:'Драма', filter:'contrast(1.5) brightness(0.8) saturate(0.8)'},
  {name:'Мягкий', filter:'brightness(1.1) contrast(0.9) saturate(0.9)'},
  {name:'HDR', filter:'contrast(1.4) saturate(1.3)'},
  {name:'Мороз', filter:'hue-rotate(180deg) brightness(1.1) saturate(0.8)'},
  {name:'Закат', filter:'hue-rotate(-30deg) saturate(1.5) contrast(1.1)'},
  {name:'Ночь', filter:'brightness(0.7) contrast(1.3) saturate(0.7)'},
  {name:'Поп', filter:'saturate(2.5) contrast(1.2)'}
];

function generateFilterPreviews() {
  const grid = document.getElementById('filtersGrid');
  filters.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'filter-item' + (i === 0 ? ' active' : '');
    div.innerHTML = '<div class="filter-preview" style="filter:' + f.filter + '"><div style="width:100%;height:100%;background:linear-gradient(135deg,#8b5cf6,#ec4899)"></div></div><span>' + f.name + '</span>';
    div.onclick = () => applyFilter(f.filter, div);
    grid.appendChild(div);
  });
}

function applyFilter(filterStr, el) {
  currentFilter = filterStr;
  document.querySelectorAll('.filter-item').forEach(f => f.classList.remove('active'));
  if (el) el.classList.add('active');
  applyAllEffects();
  pushHistory();
}

// ===== EFFECTS =====
function applyEffect(type) {
  if (!currentImage) { showToast('Сначала загрузите фото'); return; }
  showLoading(true);
  requestAnimationFrame(() => {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    const tctx = tempCanvas.getContext('2d');
    tctx.drawImage(canvas, 0, 0);

    switch(type) {
      case 'blur': tctx.filter = 'blur(5px)'; tctx.drawImage(tempCanvas, 0, 0); break;
      case 'pixelate': pixelate(tctx, tempCanvas.width, tempCanvas.height, 10); break;
      case 'vignette': applyVignette(tctx, tempCanvas.width, tempCanvas.height, 0.6); break;
      case 'noise': applyNoise(tctx, tempCanvas.width, tempCanvas.height); break;
      case 'invert': tctx.filter = 'invert(100%)'; tctx.drawImage(tempCanvas, 0, 0); break;
      case 'sepia': tctx.filter = 'sepia(100%)'; tctx.drawImage(tempCanvas, 0, 0); break;
      case 'emboss': applyEmboss(tctx, tempCanvas.width, tempCanvas.height); break;
      case 'sketch': applySketch(tctx, tempCanvas.width, tempCanvas.height); break;
      case 'oil': applyOil(tctx, tempCanvas.width, tempCanvas.height); break;
      case 'edge': applyEdge(tctx, tempCanvas.width, tempCanvas.height); break;
      case 'posterize': applyPosterize(tctx, tempCanvas.width, tempCanvas.height, 4); break;
      case 'threshold': applyThreshold(tctx, tempCanvas.width, tempCanvas.height, 128); break;
    }

    const img = new Image();
    img.onload = function() {
      currentImage = img;
      renderCanvas();
      pushHistory();
      showLoading(false);
      showToast('Эффект применен');
    };
    img.src = tempCanvas.toDataURL('image/jpeg', 0.92);
  });
}

function pixelate(ctx, w, h, blockSize) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  for (let y = 0; y < h; y += blockSize) {
    for (let x = 0; x < w; x += blockSize) {
      let r = 0, g = 0, b = 0, count = 0;
      for (let dy = 0; dy < blockSize && y + dy < h; dy++) {
        for (let dx = 0; dx < blockSize && x + dx < w; dx++) {
          const i = ((y + dy) * w + (x + dx)) * 4;
          r += data[i]; g += data[i+1]; b += data[i+2]; count++;
        }
      }
      r /= count; g /= count; b /= count;
      for (let dy = 0; dy < blockSize && y + dy < h; dy++) {
        for (let dx = 0; dx < blockSize && x + dx < w; dx++) {
          const i = ((y + dy) * w + (x + dx)) * 4;
          data[i] = r; data[i+1] = g; data[i+2] = b;
        }
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function applyVignette(ctx, w, h, strength) {
  const grad = ctx.createRadialGradient(w/2, h/2, w*0.25, w/2, h/2, w*0.75);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,' + strength + ')');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
}

function applyNoise(ctx, w, h) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const noise = (Math.random() - 0.5) * 35;
    data[i] = Math.min(255, Math.max(0, data[i] + noise));
    data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
    data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
  }
  ctx.putImageData(imgData, 0, 0);
}

function applyEmboss(ctx, w, h) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const copy = new Uint8ClampedArray(data);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = (y * w + x) * 4;
      const ul = ((y-1) * w + (x-1)) * 4;
      const dr = ((y+1) * w + (x+1)) * 4;
      for (let c = 0; c < 3; c++) data[i+c] = 128 + copy[ul+c] - copy[dr+c];
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function applySketch(ctx, w, h) {
  ctx.filter = 'grayscale(100%) contrast(200%)';
  ctx.drawImage(canvas, 0, 0);
  ctx.filter = 'none';
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const v = 255 - data[i];
    data[i] = data[i+1] = data[i+2] = v;
  }
  ctx.putImageData(imgData, 0, 0);
}

function applyOil(ctx, w, h) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const copy = new Uint8ClampedArray(data);
  const r = 3;
  for (let y = r; y < h - r; y++) {
    for (let x = r; x < w - r; x++) {
      const hist = new Array(256).fill(0);
      let maxC = 0, maxV = 0;
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          const i = ((y+dy)*w+(x+dx))*4;
          const g = Math.round((copy[i]+copy[i+1]+copy[i+2])/3);
          hist[g]++;
          if (hist[g] > maxC) { maxC = hist[g]; maxV = g; }
        }
      }
      const i = (y*w+x)*4;
      data[i] = data[i+1] = data[i+2] = maxV;
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function applyEdge(ctx, w, h) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const copy = new Uint8ClampedArray(data);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = (y*w+x)*4;
      for (let c = 0; c < 3; c++) {
        const gx = -copy[((y-1)*w+x-1)*4+c] + copy[((y-1)*w+x+1)*4+c]
                 -2*copy[(y*w+x-1)*4+c] + 2*copy[(y*w+x+1)*4+c]
                 -copy[((y+1)*w+x-1)*4+c] + copy[((y+1)*w+x+1)*4+c];
        const gy = -copy[((y-1)*w+x-1)*4+c] - 2*copy[((y-1)*w+x)*4+c] - copy[((y-1)*w+x+1)*4+c]
                 + copy[((y+1)*w+x-1)*4+c] + 2*copy[((y+1)*w+x)*4+c] + copy[((y+1)*w+x+1)*4+c];
        const val = Math.min(255, Math.sqrt(gx*gx + gy*gy));
        data[i+c] = 255 - val;
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function applyPosterize(ctx, w, h, levels) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const step = 255 / (levels - 1);
  for (let i = 0; i < data.length; i += 4) {
    data[i] = Math.round(data[i] / step) * step;
    data[i+1] = Math.round(data[i+1] / step) * step;
    data[i+2] = Math.round(data[i+2] / step) * step;
  }
  ctx.putImageData(imgData, 0, 0);
}

function applyThreshold(ctx, w, h, threshold) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const gray = (data[i] + data[i+1] + data[i+2]) / 3;
    const v = gray > threshold ? 255 : 0;
    data[i] = data[i+1] = data[i+2] = v;
  }
  ctx.putImageData(imgData, 0, 0);
}

// ===== APPLY ALL =====
function applyAllEffects() {
  if (!originalImage) return;
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = originalImage.width;
  tempCanvas.height = originalImage.height;
  const tctx = tempCanvas.getContext('2d');

  let filterStr = '';
  if (adjustments.brightness !== 0) filterStr += ' brightness(' + (100 + adjustments.brightness) + '%)';
  if (adjustments.contrast !== 0) filterStr += ' contrast(' + (100 + adjustments.contrast) + '%)';
  if (adjustments.saturation !== 0) filterStr += ' saturate(' + (100 + adjustments.saturation) + '%)';
  if (adjustments.exposure !== 0) filterStr += ' brightness(' + (100 + adjustments.exposure * 0.5) + '%)';
  if (adjustments.gamma !== 100) filterStr += ' brightness(' + adjustments.gamma + '%)';
  if (currentFilter !== 'none') filterStr += ' ' + currentFilter;

  tctx.filter = filterStr.trim() || 'none';
  tctx.drawImage(originalImage, 0, 0);
  tctx.filter = 'none';

  if (adjustments.sharpness > 0) applySharpen(tctx, tempCanvas.width, tempCanvas.height, adjustments.sharpness);
  if (adjustments.grain > 0) applyGrain(tctx, tempCanvas.width, tempCanvas.height, adjustments.grain);
  if (adjustments.vignetteAmount > 0) applyVignette(tctx, tempCanvas.width, tempCanvas.height, adjustments.vignetteAmount / 100);

  const img = new Image();
  img.onload = function() {
    currentImage = img;
    fitCanvas();
    renderCanvas();
  };
  img.src = tempCanvas.toDataURL('image/jpeg', 0.92);
}

function applySharpen(ctx, w, h, amount) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const copy = new Uint8ClampedArray(data);
  const f = amount / 100;
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = (y*w+x)*4;
      for (let c = 0; c < 3; c++) {
        const v = copy[i+c]*(1+4*f) - f*(copy[((y-1)*w+x)*4+c]+copy[((y+1)*w+x)*4+c]+copy[(y*w+x-1)*4+c]+copy[(y*w+x+1)*4+c]);
        data[i+c] = Math.min(255, Math.max(0, v));
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function applyGrain(ctx, w, h, amount) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const intensity = amount / 100 * 50;
  for (let i = 0; i < data.length; i += 4) {
    const noise = (Math.random() - 0.5) * intensity;
    data[i] = Math.min(255, Math.max(0, data[i] + noise));
    data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
    data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
  }
  ctx.putImageData(imgData, 0, 0);
}

// ===== CROP & ROTATE =====
function rotateImage(deg) {
  if (!currentImage) return;
  rotation = (rotation + deg) % 360;
  renderCanvas();
  pushHistory();
}

function flipImage(axis) {
  if (!currentImage) return;
  if (axis === 'h') flipH *= -1; else flipV *= -1;
  renderCanvas();
  pushHistory();
}

function cropRatio(w, h) {
  if (!currentImage) return;
  showLoading(true);
  requestAnimationFrame(() => {
    const cw = canvas.width, ch = canvas.height;
    const tr = w / h, cr = cw / ch;
    let nw, nh, sx, sy;
    if (cr > tr) { nh = ch; nw = ch * tr; sx = (cw - nw) / 2; sy = 0; }
    else { nw = cw; nh = cw / tr; sx = 0; sy = (ch - nh) / 2; }
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = nw; tempCanvas.height = nh;
    const tctx = tempCanvas.getContext('2d');
    tctx.drawImage(canvas, sx, sy, nw, nh, 0, 0, nw, nh);
    const img = new Image();
    img.onload = function() {
      currentImage = img; originalImage = img;
      fitCanvas(); renderCanvas(); pushHistory();
      showLoading(false); showToast('Обрезано ' + w + ':' + h);
    };
    img.src = tempCanvas.toDataURL('image/jpeg', 0.92);
  });
}

// ===== DOWNLOAD =====
function downloadImage() {
  if (!currentImage) { showToast('Нет фото для сохранения'); return; }
  const link = document.createElement('a');
  link.download = 'photoforge_' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  showToast('Фото сохранено!');
}

// ===== UTILS =====
function showLoading(show) {
  document.getElementById('loading').classList.toggle('active', show);
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}

let lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, false);
</script>
</body>
