  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #0b0e14;
      margin: 0;
      padding: 0;
      overflow: hidden;
      color: #f5f5f5;
    }
    
    /* Strict Mobile Viewport Optimization (No PC Version, 100% Mobile Phone layout on desktop/mobile) */
    .mobile-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      margin: 0 auto;
      background-color: #17212b;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 32px rgba(0, 0, 0, 0.8);
    }

    /* TG 2026 Ultimate Dark Chat Wallpaper Pattern */
    .tg-chat-wallpaper {
      background-color: #0e1621;
      background-image: 
        radial-gradient(rgba(82, 136, 193, 0.04) 1.5px, transparent 0),
        linear-gradient(135deg, #0e1621 0%, #080c14 100%);
      background-size: 24px 24px, 100% 100%;
    }

    /* Hide standard scrollbars yet allow smooth inertial scrolling on mobile */
    .scrollable-area {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
      min-height: 0;
    }

    /* Message Bubbles Tail effect */
    .bubble-out {
      background-color: #2b5278;
      border-radius: 14px 14px 0px 14px;
    }
    .bubble-in {
      background-color: #182533;
      border-radius: 14px 14px 14px 0px;
    }

    /* Pulse lock effect for security indicators */
    @keyframes lock-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .security-pulse {
      animation: lock-pulse 3s infinite;
    }
  </style>
</head>
<body>

  <div id="root" class="mobile-container"></div>

  <!-- React Application with Full Cryptographical Fixes -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Cryptographical Prefixes
    const PREFIX_KEY_EXCHANGE = "🔑[VKTG_KEY_V2]:";
    const PREFIX_E2EE_TEXT = "🔒[VKTG_E2EE_PFS]:";
    const PREFIX_E2EE_FILE = "🔒[VKTG_FILE_E2EE_PFS]:";

    // ================= INDEXEDDB SECURITY STORAGE =================
    const dbName = "vktg_secure_vault";
    const storeName = "crypto_keys";

    function openSecureDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(dbName, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(storeName)) {
            db.createObjectStore(storeName);
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function saveSecureKey(key, value) {
      const db = await openSecureDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readwrite");
        const store = tx.objectStore(storeName);
        const req = store.put(value, key);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function getSecureKey(key) {
      const db = await openSecureDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readonly");
        const store = tx.objectStore(storeName);
        const req = store.get(key);
        req.onsuccess = () => resolve(req.target ? req.target.result : req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function deleteSecureKey(key) {
      const db = await openSecureDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readwrite");
        const store = tx.objectStore(storeName);
        const req = store.delete(key);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    // ================= HELPER CRYPTOGRAPHICAL FUNCTIONS =================

    // Fix 7: PKCS#7 Padding implementation to protect against metadata size analysis
    function padData(text, blockSize = 512) {
      const encoder = new TextEncoder();
      const data = encoder.encode(text);
      const paddingLength = blockSize - (data.length % blockSize);
      const padded = new Uint8Array(data.length + paddingLength);
      padded.set(data);
      padded.fill(paddingLength, data.length);
      return padded;
    }

    function unpadData(paddedData) {
      const paddingLength = paddedData[paddedData.length - 1];
      if (paddingLength < 1 || paddingLength > paddedData.length) {
        throw new Error("Неверная длина выравнивания (Padding Error).");
      }
      for (let i = paddedData.length - paddingLength; i < paddedData.length; i++) {
        if (paddedData[i] !== paddingLength) {
          throw new Error("Неверная структура выравнивания (Padding Error).");
        }
      }
      const realData = paddedData.subarray(0, paddedData.length - paddingLength);
      return new TextDecoder().decode(realData);
    }

    // Fix 5: Cryptographically strong 60-digit safety number comparison (SHA-256)
    async function calcSafetyNumber(myPubKeyJWKB64, peerPubKeyJWKB64) {
      try {
        const myKeyStr = atob(myPubKeyJWKB64);
        const peerKeyStr = atob(peerPubKeyJWKB64);
        
        // Deterministic sorting to ensure both users compute identical hashes
        const sorted = [myKeyStr, peerKeyStr].sort();
        const combined = sorted[0] + sorted[1];
        
        const encoder = new TextEncoder();
        const data = encoder.encode(combined);
        const hashBuffer = await window.crypto.subtle.digest("SHA-256", data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        
        let digits = '';
        for (let i = 0; i < hashArray.length - 1; i += 2) {
          const val = (hashArray[i] << 8) | hashArray[i + 1];
          digits += val.toString().padStart(5, '0');
        }
        digits = digits.slice(0, 60);
        const groups = digits.match(/.{1,5}/g);
        return groups ? groups.join(' ') : digits;
      } catch (e) {
        console.error("Ошибка при генерации Safety Number: ", e);
        return "Ошибка генерации";
      }
    }

    // ================= CORE APP COMPONENT =================
    function App() {
      const [token, setToken] = useState(localStorage.getItem('vk_token') || '');
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [myProfile, setMyProfile] = useState(null);
      const [tokenInput, setTokenInput] = useState('');
      const [authError, setAuthError] = useState('');

      // Master password states (Fix 1.3: Prevent theft of private key via memory/localStorage)
      const [masterPassword, setMasterPassword] = useState('');
      const [isVaultLocked, setIsVaultLocked] = useState(true);
      const [passwordInput, setPasswordInput] = useState('');
      const [vaultError, setVaultError] = useState('');

      // Navigation states
      const [activeScreen, setActiveScreen] = useState('chats'); // 'chats' | 'chat_room'
      const [activeTab, setActiveTab] = useState('all'); // 'all' | 'secret'
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [newChatModal, setNewChatModal] = useState(false);
      const [safetyNumberModal, setSafetyNumberModal] = useState(false);
      const [safetyNumber, setSafetyNumber] = useState('');
      const [attachmentSheet, setAttachmentSheet] = useState(false);

      // Data states
      const [searchQuery, setSearchQuery] = useState('');
      const [conversations, setConversations] = useState([]);
      const [messages, setMessages] = useState([]);
      const [activePartner, setActivePartner] = useState(null);
      const [peerKeys, setPeerKeys] = useState(JSON.parse(localStorage.getItem('vktg_peer_keys') || '{}'));
      const [localContacts, setLocalContacts] = useState(JSON.parse(localStorage.getItem('vktg_contacts') || '{}'));

      const [targetUserId, setTargetUserId] = useState('');
      const [customName, setCustomName] = useState('');
      const [customAvatar, setCustomAvatar] = useState('');

      // Crypto instances
      const [identityKeyPair, setIdentityKeyPair] = useState(null); // Local ECDH identity key pair
      const [myPublicJWK, setMyPublicJWK] = useState('');

      const [messageInput, setMessageInput] = useState('');
      const [attachedFile, setAttachedFile] = useState(null);

      const messagesEndRef = useRef(null);

      // Verify Token on Load
      useEffect(() => {
        if (token) {
          checkVKSession(token);
        }
      }, [token]);

      // Polling for new chats/messages
      useEffect(() => {
        if (!isLoggedIn || isVaultLocked) return;

        refreshConversations();
        const interval = setInterval(() => {
          refreshConversations();
          if (activePartner) {
            refreshMessages(activePartner.id);
          }
        }, 3500);

        return () => clearInterval(interval);
      }, [isLoggedIn, isVaultLocked, activePartner]);

      // Auto scroll inside chat room
      useEffect(() => {
        if (messagesEndRef.current) {
          messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [messages]);

      // Fix 5: Asynchronous computation of Safety Numbers on opening modal
      useEffect(() => {
        if (safetyNumberModal && activePartner && peerKeys[activePartner.id]) {
          calcSafetyNumber(myPublicJWK, peerKeys[activePartner.id]).then(setSafetyNumber);
        } else {
          setSafetyNumber("Ключи не обменены");
        }
      }, [safetyNumberModal, activePartner, myPublicJWK, peerKeys]);

      // JSONP VK Requester
      const vkRequest = (method, params = {}) => {
        return new Promise((resolve, reject) => {
          const callbackName = 'vk_callback_' + Math.round(1000000 * Math.random());
          params.access_token = token || localStorage.getItem('vk_token');
          params.v = '5.131';
          params.callback = callbackName;

          const queryString = Object.keys(params)
            .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(params[key]))
            .join('&');

          const script = document.createElement('script');
          script.src = `https://api.vk.com/method/${method}?${queryString}`;

          window[callbackName] = function(data) {
            delete window[callbackName];
            document.body.removeChild(script);
            if (data.error) {
              reject(data.error);
            } else {
              resolve(data.response);
            }
          };

          script.onerror = function() {
            delete window[callbackName];
            document.body.removeChild(script);
            reject({ error_msg: 'Сетевая ошибка API VK.' });
          };

          document.body.appendChild(script);
        });
      };

      // ================= CRYPTO ENGINE (ECDH P-256 + HKDF + AES-GCM + PFS) =================
      
      // Derive PBKDF2 Key from Master Password to Encrypt/Decrypt Private Key
      // Fix 8: Raised iterations count to 600000 to defend against GPU brute force attacks (NIST/OWASP benchmark)
      async function deriveMasterKey(password, salt) {
        const encoder = new TextEncoder();
        const baseKey = await window.crypto.subtle.importKey(
          "raw",
          encoder.encode(password),
          { name: "PBKDF2" },
          false,
          ["deriveKey"]
        );
        return await window.crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: salt,
            iterations: 600000,
            hash: "SHA-256"
          },
          baseKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"]
        );
      }

      // Initialize or unlock Crypto Vault
      async function handleUnlockVault() {
        if (!passwordInput.trim()) {
          setVaultError("Пароль не может быть пустым!");
          return;
        }

        try {
          const storedSalt = await getSecureKey("vault_salt");
          const storedEncryptedPriv = await getSecureKey("encrypted_private_key");
          const storedPub = await getSecureKey("public_key_jwk");

          if (!storedEncryptedPriv || !storedSalt) {
            // Setup new vault
            const salt = window.crypto.getRandomValues(new Uint8Array(16));
            const newKeys = await window.crypto.subtle.generateKey(
              { name: "ECDH", namedCurve: "P-256" },
              true,
              ["deriveKey", "deriveBits"]
            );

            const pubJwk = await window.crypto.subtle.exportKey("jwk", newKeys.publicKey);
            const privJwk = await window.crypto.subtle.exportKey("jwk", newKeys.privateKey);

            const mKey = await deriveMasterKey(passwordInput, salt);
            const rawPrivBytes = new TextEncoder().encode(JSON.stringify(privJwk));
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const encryptedPriv = await window.crypto.subtle.encrypt(
              { name: "AES-GCM", iv: iv },
              mKey,
              rawPrivBytes
            );

            await saveSecureKey("vault_salt", salt);
            await saveSecureKey("encrypted_private_key", { ciphertext: encryptedPriv, iv: iv });
            await saveSecureKey("public_key_jwk", pubJwk);

            setIdentityKeyPair(newKeys);
            setMyPublicJWK(btoa(JSON.stringify(pubJwk)));
          } else {
            // Unlock existing vault
            const mKey = await deriveMasterKey(passwordInput, storedSalt);
            try {
              const decryptedPrivBytes = await window.crypto.subtle.decrypt(
                { name: "AES-GCM", iv: storedEncryptedPriv.iv },
                mKey,
                storedEncryptedPriv.ciphertext
              );
              
              const privJwk = JSON.parse(new TextDecoder().decode(decryptedPrivBytes));
              const pub = await window.crypto.subtle.importKey("jwk", storedPub, { name: "ECDH", namedCurve: "P-256" }, true, []);
              const priv = await window.crypto.subtle.importKey("jwk", privJwk, { name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey", "deriveBits"]);

              setIdentityKeyPair({ publicKey: pub, privateKey: priv });
              setMyPublicJWK(btoa(JSON.stringify(storedPub)));
            } catch (decErr) {
              setVaultError("Неверный пароль разблокировки!");
              return;
            }
          }

          setMasterPassword(passwordInput);
          setIsVaultLocked(false);
          setVaultError('');
        } catch (err) {
          setVaultError("Критическая ошибка хранилища: " + err.message);
        }
      }

      // Base helper to encrypt arbitrary binary data with ephemeral ECDH key (PFS)
      async function encryptDataPFS(recipientPubJWKB64, arrayBufferOrBytes) {
        const partnerJwk = JSON.parse(atob(recipientPubJWKB64));
        const partnerPublicKeyObj = await window.crypto.subtle.importKey(
          "jwk",
          partnerJwk,
          { name: "ECDH", namedCurve: "P-256" },
          true,
          []
        );

        // Generate Ephemeral Key Pair for absolute PFS
        const ephemeralKeyPair = await window.crypto.subtle.generateKey(
          { name: "ECDH", namedCurve: "P-256" },
          true,
          ["deriveKey", "deriveBits"]
        );

        // Derive Shared secret from Ephemeral Private Key + Partner's Public Identity Key
        const derivedKey = await window.crypto.subtle.deriveKey(
          { name: "ECDH", public: partnerPublicKeyObj },
          ephemeralKeyPair.privateKey,
          { name: "HMAC", hash: "SHA-256", length: 256 },
          true,
          ["deriveKey"]
        );

        // Derive actual AES-GCM Key using HKDF
        const aesGcmKey = await window.crypto.subtle.deriveKey(
          {
            name: "HKDF",
            hash: "SHA-256",
            salt: new Uint8Array(0),
            info: new TextEncoder().encode("VKTG_AES_GCM_PFS_BINDING")
          },
          derivedKey,
          { name: "AES-GCM", length: 256 },
          true,
          ["encrypt", "decrypt"]
        );

        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const ciphertext = await window.crypto.subtle.encrypt(
          { name: "AES-GCM", iv: iv },
          aesGcmKey,
          arrayBufferOrBytes
        );

        const ephemeralPubJWK = await window.crypto.subtle.exportKey("jwk", ephemeralKeyPair.publicKey);

        return {
          ephemeralPubJWKB64: btoa(JSON.stringify(ephemeralPubJWK)),
          ivB64: btoa(String.fromCharCode(...iv)),
          ciphertextBuffer: ciphertext
        };
      }

      // Perform Ephemeral Perfect Forward Secrecy encryption for text
      async function encryptPFS(recipientPubJWKB64, messageText, associatedMetadata = {}) {
        // Fix 10: Strict monotonic sequence sequence number to completely defeat replay attacks
        const lastSent = parseInt(localStorage.getItem('vktg_seq_sent_' + activePartner.id) || '0');
        const seq = lastSent + 1;
        localStorage.setItem('vktg_seq_sent_' + activePartner.id, seq.toString());

        const payloadData = {
          text: messageText,
          timestamp: Date.now(),
          sender_id: myProfile.id,
          recipient_id: activePartner.id,
          sequence: seq,
          ...associatedMetadata
        };

        // Fix 7: Apply 512-byte padding block to obfuscate metadata packet size
        const paddedBytes = padData(JSON.stringify(payloadData), 512);
        const encrypted = await encryptDataPFS(recipientPubJWKB64, paddedBytes);

        return {
          ephemeralPubJWKB64: encrypted.ephemeralPubJWKB64,
          ivB64: encrypted.ivB64,
          ciphertextB64: btoa(String.fromCharCode(...new Uint8Array(encrypted.ciphertextBuffer)))
        };
      }

      // PFS Decryption logic
      async function decryptPFS(ephemeralPubJWKB64, ivB64, ciphertextB64, item) {
        if (!identityKeyPair) return null;
        try {
          const partnerEphemeralJwk = JSON.parse(atob(ephemeralPubJWKB64));
          const partnerEphemeralPublicKeyObj = await window.crypto.subtle.importKey(
            "jwk",
            partnerEphemeralJwk,
            { name: "ECDH", namedCurve: "P-256" },
            true,
            []
          );

          // Compute shared secret using our Long-term Private Identity key + Partner's Ephemeral Public Key
          const derivedKey = await window.crypto.subtle.deriveKey(
            { name: "ECDH", public: partnerEphemeralPublicKeyObj },
            identityKeyPair.privateKey,
            { name: "HMAC", hash: "SHA-256", length: 256 },
            true,
            ["deriveKey"]
          );

          const aesGcmKey = await window.crypto.subtle.deriveKey(
            {
              name: "HKDF",
              hash: "SHA-256",
              salt: new Uint8Array(0),
              info: new TextEncoder().encode("VKTG_AES_GCM_PFS_BINDING")
            },
            derivedKey,
            { name: "AES-GCM", length: 256 },
            true,
            ["encrypt", "decrypt"]
          );

          const iv = new Uint8Array(atob(ivB64).split("").map(c => c.charCodeAt(0)));
          const ciphertext = new Uint8Array(atob(ciphertextB64).split("").map(c => c.charCodeAt(0)));

          const decryptedBytes = await window.crypto.subtle.decrypt(
            { name: "AES-GCM", iv: iv },
            aesGcmKey,
            ciphertext
          );

          // Fix 7: Unpad data after successful decryption
          const decryptedText = unpadData(new Uint8Array(decryptedBytes));
          const payload = JSON.parse(decryptedText);
          
          // Anti-replay and integrity verification
          if (payload.recipient_id !== myProfile.id) {
            return { error: "Нарушение адресации! Сообщение перехвачено или отправлено повторно." };
          }

          // Fix 10: Enforce strict monotonic sequence verification to completely eliminate replay attacks
          const partnerId = item.from_id;
          const lastVerifiedVkId = parseInt(localStorage.getItem(`vktg_last_verified_vk_id_${partnerId}`) || '0');
          const lastVerifiedSeq = parseInt(localStorage.getItem(`vktg_last_verified_seq_${partnerId}`) || '0');

          if (item.id > lastVerifiedVkId) {
            if (payload.sequence <= lastVerifiedSeq) {
              return { error: "Обнаружена атака повторного воспроизведения (Replay Attack)! Нарушена последовательность." };
            }
            // Atomically update tracking values
            localStorage.setItem(`vktg_last_verified_vk_id_${partnerId}`, item.id.toString());
            localStorage.setItem(`vktg_last_verified_seq_${partnerId}`, payload.sequence.toString());
          }

          return payload;
        } catch (e) {
          console.error("Дешифрование сообщения не удалось: ", e);
          return null;
        }
      }

      // ================= VK ACTIONS & SESSION MANAGEMENT =================
      const checkVKSession = async (rawTok) => {
        const cleanTok = parseToken(rawTok);
        if (!cleanTok) return;

        try {
          localStorage.setItem('vk_token', cleanTok);
          const profileResponse = await vkRequest('users.get', { fields: 'photo_100,status', access_token: cleanTok });
          if (profileResponse && profileResponse.length > 0) {
            setToken(cleanTok);
            setMyProfile(profileResponse[0]);
            setIsLoggedIn(true);
            setTokenInput('');
            setAuthError('');
            
            const over = localContacts[profileResponse[0].id] || {};
            setCustomName(over.name || `${profileResponse[0].first_name} ${profileResponse[0].last_name}`);
            setCustomAvatar(over.photo || profileResponse[0].photo_100);
          } else {
            setAuthError("Сессия не найдена. Попробуйте обновить токен.");
          }
        } catch (err) {
          setAuthError(`Ошибка сессии VK: ${err.error_msg || JSON.stringify(err)}`);
          localStorage.removeItem('vk_token');
        }
      };

      const refreshConversations = async () => {
        try {
          const response = await vkRequest('messages.getConversations', { count: 30, extended: 1 });
          if (!response || !response.items) return;

          const profilesMap = {};
          if (response.profiles) {
            response.profiles.forEach(p => { profilesMap[p.id] = p; });
          }

          const items = response.items.map(item => {
            const peer = item.conversation.peer;
            let partner = profilesMap[peer.id] || { id: peer.id, first_name: `Пользователь ${peer.id}`, last_name: '' };
            if (localContacts[peer.id]) {
              partner = { ...partner, ...localContacts[peer.id] };
            }
            return {
              id: peer.id,
              partner,
              lastMessage: item.last_message,
              unreadCount: item.conversation.unread_count || 0
            };
          });

          setConversations(items);
        } catch (e) {
          console.error("Диалоги не обновились: ", e);
        }
      };

      const refreshMessages = async (partnerId) => {
        try {
          const response = await vkRequest('messages.getHistory', { peer_id: partnerId, count: 40 });
          if (!response || !response.items) return;

          const decryptedMessages = [];
          for (let item of response.items) {
            const isMe = item.from_id === myProfile.id;
            let text = item.text || '';
            let payload = null;

            if (text.startsWith(PREFIX_KEY_EXCHANGE)) {
              const rawKey = text.replace(PREFIX_KEY_EXCHANGE, "").trim();
              peerKeys[item.from_id] = rawKey;
              localStorage.setItem('vktg_peer_keys', JSON.stringify(peerKeys));
              payload = { isSystem: true, text: "🔑 Синхронизирована новая пара асимметричных ключей E2EE. Канал связи полностью защищен!" };
              
              if (!isMe && !localStorage.getItem(`replied_${item.from_id}`)) {
                await sendKeyExchangeMessage(partnerId);
                localStorage.setItem(`replied_${item.from_id}`, 'true');
              }
            } else if (text.startsWith(PREFIX_E2EE_TEXT)) {
              const parts = text.replace(PREFIX_E2EE_TEXT, "").trim().split(":");
              if (parts.length === 3) {
                const [ephemeralPub, iv, cipher] = parts;
                const decryptedData = await decryptPFS(ephemeralPub, iv, cipher, item);
                if (decryptedData) {
                  if (decryptedData.error) {
                    payload = { isError: true, text: `⚠️ ${decryptedData.error}` };
                  } else {
                    payload = { isText: true, text: decryptedData.text };
                  }
                } else {
                  payload = { isError: true, text: "🔒 Ошибка расшифрования. Возможно, у вас нет подходящего ключа." };
                }
              }
            } else if (text.startsWith(PREFIX_E2EE_FILE)) {
              const parts = text.replace(PREFIX_E2EE_FILE, "").trim().split(":");
              if (parts.length >= 4) {
                const [ephemeralPub, iv, b64Name, mime] = parts;
                let docUrl = null;
                if (item.attachments) {
                  const docObj = item.attachments.find(a => a.type === 'doc');
                  if (docObj && docObj.doc) docUrl = docObj.doc.url;
                }
                payload = { isFile: true, name: atob(b64Name), mime, docUrl, ephemeralPub, iv };
              }
            }

            decryptedMessages.push({
              id: item.id,
              fromId: item.from_id,
              date: item.date,
              rawText: text,
              isMe,
              decrypted: payload
            });
          }

          setMessages(decryptedMessages);
        } catch (e) {
          console.error("Сообщения не обновились: ", e);
        }
      };

      const sendKeyExchangeMessage = async (peerId) => {
        if (!myPublicJWK) return;
        await vkRequest('messages.send', {
          peer_id: peerId,
          message: `${PREFIX_KEY_EXCHANGE}${myPublicJWK}`,
          random_id: Math.floor(Math.random() * 10000000)
        });
      };

      const handleSendMessage = async () => {
        if (!activePartner) return;
        const msgText = messageInput.trim();
        if (!msgText && !attachedFile) return;

        const partnerKeyB64 = peerKeys[activePartner.id];
        if (!partnerKeyB64) {
          alert("Для защиты диалога необходимо обменяться публичными ключами! Нажмите кнопку обмена вверху.");
          return;
        }

        try {
          if (attachedFile) {
            // Fix: Actually encrypt the raw file bytes using ECDH PFS instead of just metadata
            const encryptedFile = await encryptDataPFS(partnerKeyB64, attachedFile.arrayBuffer);
            
            // Uploading raw encrypted binary directly to VK
            const server = await vkRequest('docs.getMessagesUploadServer', { type: 'doc', peer_id: activePartner.id });
            
            const encBlob = new Blob([encryptedFile.ciphertextBuffer], { type: 'application/octet-stream' });
            const formData = new FormData();
            formData.append('file', encBlob, 'secure_doc.bin');

            const uploadResp = await fetch(server.upload_url, { method: 'POST', body: formData });
            const uploadData = await uploadResp.json();

            const saved = await vkRequest('docs.save', { file: uploadData.file, title: 'secure_payload.bin' });
            const docObj = saved.doc || saved[0];
            const attachStr = `doc${docObj.owner_id}_${docObj.id}`;

            const b64Name = btoa(attachedFile.name);
            const header = `${PREFIX_E2EE_FILE}${encryptedFile.ephemeralPubJWKB64}:${encryptedFile.ivB64}:${b64Name}:${attachedFile.type}`;

            await vkRequest('messages.send', {
              peer_id: activePartner.id,
              message: header,
              attachment: attachStr,
              random_id: Math.floor(Math.random() * 10000000)
            });

            setAttachedFile(null);
          } else {
            const encrypted = await encryptPFS(partnerKeyB64, msgText);
            const payload = `${PREFIX_E2EE_TEXT}${encrypted.ephemeralPubJWKB64}:${encrypted.ivB64}:${encrypted.ciphertextB64}`;

            await vkRequest('messages.send', {
              peer_id: activePartner.id,
              message: payload,
              random_id: Math.floor(Math.random() * 10000000)
            });

            setMessageInput('');
          }

          await refreshMessages(activePartner.id);
        } catch (e) {
          alert("Ошибка отправки: " + JSON.stringify(e));
        }
      };

      const handleSelectChat = (partner) => {
        setActivePartner(partner);
        setActiveScreen('chat_room');
        setMessages([]);
        refreshMessages(partner.id);
      };

      const handleFileSelection = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
          setAttachedFile({
            name: file.name,
            type: file.type || 'application/octet-stream',
            arrayBuffer: evt.target.result
          });
          setAttachmentSheet(false);
        };
        reader.readAsArrayBuffer(file);
      };

      const handleSaveLocalProfile = () => {
        if (!myProfile) return;
        const copy = { ...localContacts };
        copy[myProfile.id] = {
          id: myProfile.id,
          first_name: customName,
          last_name: '',
          photo_100: customAvatar || myProfile.photo_100
        };
        localStorage.setItem('vktg_contacts', JSON.stringify(copy));
        setLocalContacts(copy);
        setMyProfile(prev => ({
          ...prev,
          first_name: customName,
          photo_100: customAvatar
        }));
        setSettingsOpen(false);
        alert("Профиль успешно сохранен!");
      };

      const handleStartNewChat = async () => {
        const parsedId = parseInt(targetUserId);
        if (!parsedId || isNaN(parsedId)) {
          alert("Пожалуйста, введите корректный числовой ID");
          return;
        }

        try {
          const resp = await vkRequest('users.get', { user_ids: parsedId, fields: 'photo_100' });
          if (resp && resp.length > 0) {
            let partner = resp[0];
            if (localContacts[parsedId]) {
              partner = { ...partner, ...localContacts[parsedId] };
            }
            setNewChatModal(false);
            setTargetUserId('');
            handleSelectChat(partner);
          } else {
            alert("Пользователь не найден.");
          }
        } catch (e) {
          alert("Не удалось загрузить пользователя: " + JSON.stringify(e));
        }
      };

      const handleLogout = () => {
        if (confirm("Выйти из аккаунта? Все крипто-ключи будут удалены с устройства!")) {
          localStorage.removeItem('vk_token');
          deleteSecureKey("encrypted_private_key");
          deleteSecureKey("public_key_jwk");
          deleteSecureKey("vault_salt");
          setToken('');
          setIsLoggedIn(false);
          setMyProfile(null);
          setActivePartner(null);
          setActiveScreen('chats');

      };

      const parseToken = (input) => {
        input = input.trim();
        if (input.includes('access_token=')) {
          const normalized = input.replace('#', '?');
          try {
            const urlObj = new URL(normalized);
            const tok = urlObj.searchParams.get('access_token');
            if (tok) return tok;
          } catch (e) {
            const match = input.match(/access_token=([^&]+)/);
            if (match) return match[1];
          }
        }
        return input;
      };

      const filteredConversations = conversations.filter(item => {
        const name = `${item.partner.first_name} ${item.partner.last_name || ''}`.toLowerCase();
        const matchesQuery = name.includes(searchQuery.toLowerCase());
        if (activeTab === 'secret') {
          return matchesQuery && peerKeys[item.partner.id];

        return matchesQuery;

      // 1. MASTER PASSWORD WALL (Ensures absolute security of private keys in IndexedDB)
      if (isLoggedIn && isVaultLocked) {
        return (
          <div className="h-screen w-full flex items-center justify-center bg-[#0e1621] p-4 text-white">

                </p>
              </div>

              <input

              />

            </div>
          </div>

      // 2. MAIN OAUTH WALL
      if (!isLoggedIn) {

              <button

                <span className="material-icons-round text-lg">login</span>

              </button>

              {authError && (
                <div className="w-full mt-4 p-2.5 bg-red-950/40 border border-red-900/60 rounded-xl text-[10px] text-red-400 font-mono text-center">
                  {authError}
                </div>
              )}
            </div>
          </div>
        );
      }

      // 3. SECURE CHATS MAIN BOARD
      return (
        <div className="mobile-container relative">
          
          {/* CHATS SCREEN */}
          {activeScreen === 'chats' && (
            <div className="flex-1 flex flex-col overflow-hidden relative">
              
              {/* Telegram Custom Header */}
              <div className="bg-[#17212b] py-3.5 px-4 flex items-center justify-between shadow-md shrink-0">

                  </button>
                  <span className="text-lg font-bold text-white tracking-wide">Telegram 2026</span>
                </div>
                <div className="flex items-center gap-4 text-white">
                  <span className="material-icons-round text-2xl">search</span>
                </div>
              </div>

              {/* Chat Tabs */}
              <div className="bg-[#17212b] flex border-b border-[#0e1621] shrink-0 text-xs font-semibold uppercase tracking-wider text-[#7f91a4]">
                <button 
                  onClick={() => setActiveTab('all')}
                  className={`flex-1 py-3 text-center border-b-2 ${activeTab === 'all' ? 'text-[#5288c1] border-[#5288c1]' : 'border-transparent'}`}
                >
                  Все чаты
                </button>
                <button 
                  onClick={() => setActiveTab('secret')}
                  className={`flex-1 py-3 text-center border-b-2 ${activeTab === 'secret' ? 'text-emerald-400 border-emerald-400' : 'border-transparent'}`}
                >
                  🔒 Защищенные
                </button>
              </div>

              {/* Search Field */}
              <div className="bg-[#17212b]/60 p-2 border-b border-[#0e1621]/80 shrink-0">
                <input 
                  type="text" 
                  placeholder="Поиск диалогов..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full bg-[#0e1621] text-xs text-white rounded-lg px-3 py-2 focus:outline-none"
                />
              </div>

              {/* Dialogues List */}
              <div className="flex-1 overflow-y-auto scrollable-area">
                {filteredConversations.length === 0 ? (
                  <div className="p-12 text-center text-[#7f91a4] text-xs space-y-2">
                    <span className="material-icons-round text-4xl text-[#2b5278]">forum</span>
                    <p>Нет активных диалогов.</p>
                  </div>
                ) : (
                  filteredConversations.map(item => {
                    const avatar = item.partner.photo_100 || item.partner.photo;
                    const name = `${item.partner.first_name} ${item.partner.last_name || ''}`;
                    const time = item.lastMessage ? formatTimestamp(item.lastMessage.date) : '';
                    let preview = item.lastMessage ? item.lastMessage.text : '';
                    let isEnc = false;

                    if (preview.startsWith(PREFIX_KEY_EXCHANGE)) {
                      preview = "🔑 Крипто-ключи согласованы";
                    } else if (preview.startsWith(PREFIX_E2EE_TEXT) || preview.startsWith(PREFIX_E2EE_FILE)) {
                      preview = "🔒 Зашифрованное сообщение PFS";
                      isEnc = true;
                    }

                    return (
                      <div 
                        key={item.id}
                        onClick={() => handleSelectChat(item.partner)}
                        className="p-3.5 flex items-center gap-3 active:bg-[#203040] cursor-pointer transition duration-150 border-b border-[#0e1621]/30"
                      >
                        <div className="w-12 h-12 rounded-full relative shrink-0">
                          <img src={avatar} className="w-full h-full rounded-full object-cover" />
                          <div className={`absolute bottom-0 right-0 w-3 h-3 border-2 border-[#17212b] rounded-full ${item.partner.online ? 'bg-green-500' : 'bg-gray-500'}`}></div>
                        </div>

                        <div className="flex-1 min-w-0">
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-sm text-white truncate">{name}</span>
                            <span className="text-[10px] text-[#7f91a4]">{time}</span>
                          </div>
                          <p className={`text-xs ${isEnc ? 'text-emerald-400 font-semibold' : 'text-[#7f91a4]'} truncate mt-1`}>
                            {preview}
                          </p>
                        </div>

                        {item.unreadCount > 0 && (
                          <span className="bg-emerald-500 text-black font-bold text-[10px] px-1.5 py-0.5 rounded-full shrink-0">
                            {item.unreadCount}
                          </span>
                        )}
                      </div>
                    );
                  })
                )}
              </div>

              {/* Float Action Button */}
              <button 
                onClick={() => setNewChatModal(true)}
                className="absolute bottom-6 right-6 w-14 h-14 bg-[#5288c1] text-white rounded-full flex items-center justify-center shadow-lg active:scale-95 transition z-30"
              >
                <span className="material-icons-round text-2xl">edit</span>
              </button>
            </div>
          )}

          {/* CHAT ROOM SCREEN (Modern 2026 TG styling overhaul) */}
          {activeScreen === 'chat_room' && activePartner && (
            <div className="flex-1 flex flex-col overflow-hidden relative tg-chat-wallpaper">
              
              {/* Sleek Header with Partner Information */}
              <div className="bg-[#17212b] py-3 px-4 flex items-center justify-between shadow-md shrink-0 z-10">
                <div className="flex items-center gap-3">
                  <button onClick={() => setActiveScreen('chats')} className="text-white p-1">
                    <span className="material-icons-round text-2xl">arrow_back</span>
                  </button>
                  
                  {/* Dynamic Avatar */}
                  <div className="w-10 h-10 rounded-full relative">
                    <img src={activePartner.photo_100 || activePartner.photo} className="w-full h-full rounded-full object-cover" />
                    <div className={`absolute bottom-0 right-0 w-3 h-3 border-2 border-[#17212b] rounded-full ${activePartner.online ? 'bg-green-500' : 'bg-gray-500'}`}></div>
                  </div>

                  {/* Interlocutor Name & Status */}
                  <div className="min-w-0">
                    <h4 className="font-bold text-sm text-white truncate max-w-[150px]">
                      {activePartner.first_name} {activePartner.last_name || ''}
                    </h4>
                    <span className="text-[10px] text-[#7f91a4] block">
                      {activePartner.online ? 'в сети' : 'был(а) недавно'}
                    </span>
                  </div>
                </div>

                {/* E2EE Lock indicators */}
                <div className="flex items-center gap-2">
                  <div 
                    onClick={() => setSafetyNumberModal(true)}
                    className={`flex items-center gap-1 px-3 py-1.5 rounded-full text-[10px] font-bold cursor-pointer transition security-pulse ${peerKeys[activePartner.id] ? 'bg-emerald-500/10 text-emerald-400' : 'bg-yellow-500/10 text-yellow-500'}`}
                  >
                    <span className="material-icons-round text-xs">
                      {peerKeys[activePartner.id] ? 'lock' : 'lock_open'}
                    </span>
                    <span>{peerKeys[activePartner.id] ? 'E2EE' : 'Нет ключа'}</span>
                  </div>

                  <button 
                    onClick={() => {
                      sendKeyExchangeMessage(activePartner.id);
                      alert("Обмен публичными крипто-ключами инициирован!");
                    }}
                    className="p-1.5 text-blue-400 active:text-blue-300"
                    title="Запросить обмен ключами"
                  >
                    <span className="material-icons-round text-xl">sync</span>
                  </button>
                </div>
              </div>

              {/* Messages container */}
              <div className="flex-1 overflow-y-auto p-4 space-y-3.5 flex flex-col scrollable-area">
                {messages.length === 0 ? (
                  <div className="m-auto text-center max-w-[260px] bg-black/45 p-4 rounded-2xl border border-white/5 space-y-2">
                    <span className="material-icons-round text-3xl text-emerald-400">lock</span>
                    <h5 className="text-xs font-bold text-white">Сквозное шифрование PFS</h5>
                    <p className="text-[10px] text-[#7f91a4]">Все ваши сообщения надежно маскируются и шифруются одноразовыми сессионными ключами AES-256-GCM. Прослушивание на сервере ВК полностью исключено.</p>
                  </div>

                        <div key={msg.id} className="mx-auto my-1.5 bg-[#182533]/90 text-[10px] text-emerald-400 border border-emerald-900/30 px-3 py-1.5 rounded-xl text-center max-w-[280px]">

                    return (

                                <div className="min-w-0">
                                  <p className="text-[11px] font-bold truncate text-white">{msg.decrypted.name}</p>
                                  <p className="text-[9px] text-[#7f91a4] truncate">{msg.decrypted.mime}</p>
                                </div>
                              </div>
                              <button 
                                onClick={() => downloadAndDecryptFile(msg.decrypted.docUrl, msg.decrypted.ephemeralPub, msg.decrypted.iv, msg.decrypted.name, msg.decrypted.mime)}
                                className="w-full py-1.5 bg-[#5288c1] text-[10px] font-bold rounded-lg flex items-center justify-center gap-1"
                              >
                                <span className="material-icons-round text-sm">download_for_offline</span>

                      className="text-[#7f91a4] hover:text-white p-1"

                    <textarea

    // Direct direct-download bypass decryption
    async function downloadAndDecryptFile(docUrl, ephemeralPubJWKB64, ivB64, originalName, mimeType) {
      if (!docUrl) {
        alert("Документ недоступен. Проверьте права доступа.");
        return;
      }

      try {
        const response = await fetch(docUrl);
        const encryptedBuffer = await response.arrayBuffer();
        
        // Retrieve Long-term identity keys from IndexedDB
        const storedPub = await getSecureKey("public_key_jwk");
        const storedEncryptedPriv = await getSecureKey("encrypted_private_key");
        const storedSalt = await getSecureKey("vault_salt");

        // Request Master password once to decrypt key (or use prompt if memory is clean)
        const password = prompt("Введите ваш Мастер-пароль для расшифрования этого файла:");
        if (!password) return;

        // Derive pbkdf2 key (Fix 8: Raised iterations count to 600000)
        const encoder = new TextEncoder();
        const baseKey = await window.crypto.subtle.importKey("raw", encoder.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]);
        const mKey = await window.crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: storedSalt, iterations: 600000, hash: "SHA-256" },
          baseKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );

        const decryptedPrivBytes = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: storedEncryptedPriv.iv },
          mKey,
          storedEncryptedPriv.ciphertext
        );
        const privJwk = JSON.parse(new TextDecoder().decode(decryptedPrivBytes));
        const privateKeyObj = await window.crypto.subtle.importKey("jwk", privJwk, { name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey", "deriveBits"]);

        // Derive PFS key for decryption
        const partnerEphemeralJwk = JSON.parse(atob(ephemeralPubJWKB64));
        const partnerEphemeralPublicKeyObj = await window.crypto.subtle.importKey(
          "jwk",
          partnerEphemeralJwk,
          { name: "ECDH", namedCurve: "P-256" },
          true,
          []
        );

        const derivedKey = await window.crypto.subtle.deriveKey(
          { name: "ECDH", public: partnerEphemeralPublicKeyObj },
          privateKeyObj,
          { name: "HMAC", hash: "SHA-256", length: 256 },
          true,
          ["deriveKey"]
        );

        const aesGcmKey = await window.crypto.subtle.deriveKey(
          {
            name: "HKDF",
            hash: "SHA-256",
            salt: new Uint8Array(0),
            info: new TextEncoder().encode("VKTG_AES_GCM_PFS_BINDING")
          },
          derivedKey,
          { name: "AES-GCM", length: 256 },
          true,
          ["encrypt", "decrypt"]
        );

        const iv = new Uint8Array(atob(ivB64).split("").map(c => c.charCodeAt(0)));
        const decryptedBytes = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv },
          aesGcmKey,
          encryptedBuffer
        );

        const blob = new Blob([decryptedBytes], { type: mimeType });
        const blobUrl = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = originalName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (err) {
        alert("Ошибка дешифрования файла. Убедитесь, что вы ввели верный Мастер-пароль.");
      }
    }

    function formatTimestamp(timestamp) {
      const date = new Date(timestamp * 1000);
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${hours}:${minutes}`;
    }
