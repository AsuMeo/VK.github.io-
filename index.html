    // Chunked Base64 converters to avoid maximum call stack size exceeded on large files
    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      const len = bytes.byteLength;
      for (let i = 0; i < len; i += 8192) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + 8192, len)));
      }
      return btoa(binary);
    }

    function base64ToArrayBuffer(base64) {
      const binaryString = atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    // ================= SEEDABLE PRNG FOR OBSTACLED STEGANOGRAPHY =================
    function mulberry32(a) {
      return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
    }

    function getPRNG(seedString) {
      let h = 2166136261;
      for (let i = 0; i < seedString.length; i++) {
        h = Math.imul(h ^ seedString.charCodeAt(i), 16777619);
      }
      return mulberry32(h >>> 0);
    }

    // ================= INDEXEDDB SECURITY STORAGE =================
    const dbName = "vktg_secure_vault_v3";
    const storeName = "crypto_keys_v3";

    function openSecureDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(dbName, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(storeName)) {
            db.createObjectStore(storeName);
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function saveSecureKey(key, value) {
      const db = await openSecureDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readwrite");
        const store = tx.objectStore(storeName);
        const req = store.put(value, key);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function getSecureKey(key) {
      const db = await openSecureDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readonly");
        const store = tx.objectStore(storeName);
        const req = store.get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    // ================= HIGH-PERFORMANCE CRYPTO UTILS =================

    async function calcSafetyNumber(myPubKeyJWKB64, peerPubKeyJWKB64) {
      try {
        const myKeyStr = atob(myPubKeyJWKB64);
        const peerKeyStr = atob(peerPubKeyJWKB64);
        const sorted = [myKeyStr, peerKeyStr].sort();
        const combined = sorted[0] + sorted[1];
        
        const encoder = new TextEncoder();
        const data = encoder.encode(combined);
        const hashBuffer = await window.crypto.subtle.digest("SHA-256", data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        
        let digits = '';
        for (let i = 0; i < hashArray.length - 1; i += 2) {
          const val = (hashArray[i] << 8) | hashArray[i + 1];
          digits += val.toString().padStart(5, '0');
        }
        digits = digits.slice(0, 60);
        const groups = digits.match(/.{1,5}/g);
        return groups ? groups.join(' ') : digits;
      } catch (e) {
        console.error("Safety number calculation failed: ", e);
        return "ERROR GENERATING FINGERPRINT";
      }
    }

    // ================= ADVANCED DETERMINISTIC STEGANOGRAPHY ENGINE =================
    async function embedKeyInImage(imgDataUrl, textPayload, seedString) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const imgData = ctx.getImageData(0, 0, img.width, img.height);
          const data = imgData.data;

          const payloadBytes = new TextEncoder().encode(textPayload);
          const totalLength = payloadBytes.length;
          
          const buffer = new Uint8Array(4 + totalLength);
          buffer[0] = (totalLength >> 24) & 0xFF;
          buffer[1] = (totalLength >> 16) & 0xFF;
          buffer[2] = (totalLength >> 8) & 0xFF;
          buffer[3] = totalLength & 0xFF;
          buffer.set(payloadBytes, 4);

          const totalBits = buffer.length * 8;
          if (totalBits > (data.length * 3) / 4) {
            reject(new Error("Картинка слишком мала для скрытия ключа!"));
            return;
          }

          const prng = getPRNG(seedString);
          let bitPtr = 0;
          let pixelIdx = 0;

          while (bitPtr < totalBits) {
            const jump = Math.floor(prng() * 4) + 1;
            pixelIdx += jump;
            const channel = Math.floor(prng() * 3);
            
            const dataIdx = (pixelIdx * 4) + channel;
            if (dataIdx >= data.length) {
              reject(new Error("Изображение переполнено. Возьмите картинку большего разрешения!"));
              return;
            }

            const byteIdx = Math.floor(bitPtr / 8);
            const bitShift = 7 - (bitPtr % 8);
            const bit = (buffer[byteIdx] >> bitShift) & 1;

            data[dataIdx] = (data[dataIdx] & 0xFE) | bit;
            bitPtr++;
          }

          ctx.putImageData(imgData, 0, 0);
          resolve(canvas.toDataURL("image/png"));
        };
        img.onerror = () => reject(new Error("Не удалось прочитать исходную картинку."));
        img.src = imgDataUrl;
      });
    }

    async function extractKeyFromImage(imgDataUrl, seedString) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const imgData = ctx.getImageData(0, 0, img.width, img.height);
          const data = imgData.data;

          const prng = getPRNG(seedString);
          let pixelIdx = 0;

          const headerBuffer = new Uint8Array(4);
          let bitPtr = 0;
          while (bitPtr < 32) {
            const jump = Math.floor(prng() * 4) + 1;
            pixelIdx += jump;
            const channel = Math.floor(prng() * 3);
            const dataIdx = (pixelIdx * 4) + channel;
            if (dataIdx >= data.length) {
              reject(new Error("Не удалось прочитать заголовок стего-контейнера!"));
              return;
            }
            const bit = data[dataIdx] & 1;
            const byteIdx = Math.floor(bitPtr / 8);
            const bitShift = 7 - (bitPtr % 8);
            headerBuffer[byteIdx] |= (bit << bitShift);
            bitPtr++;
          }

          const payloadLength = (headerBuffer[0] << 24) | (headerBuffer[1] << 16) | (headerBuffer[2] << 8) | headerBuffer[3];
          if (payloadLength <= 0 || payloadLength > 100000) {
            reject(new Error("Ключ не найден. Проверьте правильность ID (Seed) или целостность картинки."));
            return;
          }

          const payloadBuffer = new Uint8Array(payloadLength);
          let payloadBitPtr = 0;
          const totalPayloadBits = payloadLength * 8;
          while (payloadBitPtr < totalPayloadBits) {
            const jump = Math.floor(prng() * 4) + 1;
            pixelIdx += jump;
            const channel = Math.floor(prng() * 3);
            const dataIdx = (pixelIdx * 4) + channel;
            if (dataIdx >= data.length) {
              reject(new Error("Стего-изображение повреждено или обрезано!"));
              return;
            }
            const bit = data[dataIdx] & 1;
            const byteIdx = Math.floor(payloadBitPtr / 8);
            const bitShift = 7 - (payloadBitPtr % 8);
            payloadBuffer[byteIdx] |= (bit << bitShift);
            payloadBitPtr++;
          }

          try {
            const decoded = new TextDecoder().decode(payloadBuffer);
            resolve(decoded);
          } catch (e) {
            reject(new Error("Сбой декодирования байт."));
          }
        };
        img.onerror = () => reject(new Error("Не удалось открыть стего-файл."));
        img.src = imgDataUrl;
      });
    }

    // ================= DECRYPTED MEDIA VIEWER CORE COMPONENT (100% E2EE Base64) =================
    function DecryptedMediaViewer({ msgId, docUrl, sequence, iv, name, mime, myId, partnerId, peerKeyB64, privKeyObj, computeSharedSecret, deriveRatchetMessageKey }) {
      const [localUrl, setLocalUrl] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(false);

      useEffect(() => {
        let isMounted = true;
        async function decrypt() {
          if (!docUrl || !peerKeyB64 || !privKeyObj) {
            setLoading(false);
            return;
          }
          try {
            // 1. Download Base64 text file
            const response = await fetch(docUrl);
            const base64Text = await response.text();

            // 2. Derive key
            const sharedBits = await computeSharedSecret(peerKeyB64, privKeyObj);
            const aesKey = await deriveRatchetMessageKey(sharedBits, parseInt(sequence), myId, partnerId);

            // 3. Decode Base64 string back to encrypted ArrayBuffer
            const encryptedBuffer = base64ToArrayBuffer(base64Text);

            // 4. Decrypt
            const ivBytes = new Uint8Array(atob(iv).split("").map(c => c.charCodeAt(0)));
            const decryptedBytes = await window.crypto.subtle.decrypt(
              { name: "AES-GCM", iv: ivBytes },
              aesKey,
              encryptedBuffer
            );

            let finalMime = mime;
            if (name.endsWith('.mur')) finalMime = 'image/png';
            else if (name.endsWith('.meow')) finalMime = 'video/mp4';
            else if (name.endsWith('.meo')) finalMime = 'audio/webm';
            else if (name.endsWith('.me')) finalMime = 'video/webm';

            const blob = new Blob([decryptedBytes], { type: finalMime });
            const localObjUrl = URL.createObjectURL(blob);
            if (isMounted) {
              setLocalUrl(localObjUrl);
              setLoading(false);
            }
          } catch (e) {
            console.error("Inline decryption failed:", e);
            if (isMounted) {
              setError(true);
              setLoading(false);
            }
          }
        }
        decrypt();
        return () => {
          isMounted = false;
        };
      }, [docUrl, sequence, iv, name, mime, peerKeyB64, privKeyObj, myId, partnerId]);

      if (loading) {
        return (
          <div className="flex items-center gap-2.5 p-3.5 bg-[#05070a]/40 rounded-xl border border-white/5 animate-pulse text-xs text-sky-400">
            <span className="w-4.5 h-4.5 rounded-full border-2 border-t-transparent border-sky-400 animate-spin"></span>
            <span>Расшифровка секретного медиа...</span>
          </div>
        );
      }

      if (error || !localUrl) {
        return (
          <div className="p-3 bg-rose-950/20 border border-rose-900/30 rounded-xl text-xs text-rose-400 font-bold">
            🔒 Ошибка сквозного расшифрования файла.
          </div>
        );
      }

      if (name.endsWith('.mur')) {
        return (
          <div className="rounded-xl overflow-hidden border border-white/5 shadow-inner">
            <img src={localUrl} className="max-w-full rounded-xl max-h-72 object-cover cursor-pointer hover:opacity-90 transition" onClick={() => window.open(localUrl, '_blank')} />
          </div>
        );
      }

      if (name.endsWith('.meow')) {
        return (
          <div className="rounded-xl overflow-hidden border border-white/5 bg-black">
            <video src={localUrl} controls className="w-full rounded-xl max-h-72" />
          </div>
        );
      }

      if (name.endsWith('.meo')) {
        return (
          <div className="flex items-center gap-3 bg-slate-900/40 p-3 rounded-2xl border border-sky-500/10 max-w-full">
            <div className="w-9 h-9 rounded-full bg-sky-500/10 flex items-center justify-center text-sky-400 shrink-0">

      // CAMERA WEBCAM QR SCANNER ENGINE

        async function startCamera() {

            if (videoRef.current) {
              videoRef.current.srcObject = stream;

        function scanTick() {
          if (videoRef.current && videoRef.current.readyState === videoRef.current.HAVE_ENOUGH_DATA) {
            const canvas = document.createElement('canvas');
            canvas.width = videoRef.current.videoWidth;
            canvas.height = videoRef.current.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imgData.data, imgData.width, imgData.height, {
              inversionAttempts: "dontInvert",
            });

            if (code) {
              const decodedKey = code.data;
              try {
                JSON.parse(atob(decodedKey));
                handleImportPeerKeyDirect(decodedKey);
                stopCamera();
                return;
              } catch (e) {
                // Keep looking
              }
            }
          }
          if (isCameraActive) {
            animationId = requestAnimationFrame(scanTick);
          }
        }

        function stopCamera() {
          if (stream) {
            stream.getTracks().forEach(track => track.stop());
          }
          cancelAnimationFrame(animationId);
          setIsCameraActive(false);
        }

        if (isCameraActive) {

      // ================= VK ACTIONS & SESSION MANAGEMENT =================
      const vkRequest = (method, params = {}) => {
        return new Promise((resolve, reject) => {
          const callbackName = 'vk_callback_' + Math.round(1000000 * Math.random());
          params.access_token = token || localStorage.getItem('vk_token');
          params.v = '5.131';
          params.callback = callbackName;

          const queryString = Object.keys(params)
            .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(params[key]))
            .join('&');

          const script = document.createElement('script');
          script.src = `https://api.vk.com/method/${method}?${queryString}`;

          window[callbackName] = function(data) {
            delete window[callbackName];
            document.body.removeChild(script);
            if (data.error) {
              reject(data.error);
            } else {
              resolve(data.response);
            }
          };

          script.onerror = function() {
            delete window[callbackName];
            document.body.removeChild(script);
            reject({ error_msg: 'Сетевая ошибка API VK.' });
          };

          document.body.appendChild(script);
        });
      };

      // ================= CRYPTOGRAPHIC ADVANCED ENGINE (HASH-CHAIN RATCHET) =================

      async function deriveMasterKey(password, salt) {
        const encoder = new TextEncoder();
        const baseKey = await window.crypto.subtle.importKey(
          "raw",
          encoder.encode(password),
          { name: "PBKDF2" },
          false,
          ["deriveKey"]
        );
        return await window.crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: salt,
            iterations: 600000,
            hash: "SHA-256"
          },
          baseKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"]
        );
      }

      async function computeSharedSecret(peerPubKeyB64, myPrivKeyObj) {
        const partnerJwk = JSON.parse(atob(peerPubKeyB64));
        const partnerPublicKeyObj = await window.crypto.subtle.importKey(
          "jwk",
          partnerJwk,
          { name: "ECDH", namedCurve: "P-256" },
          true,
          []
        );
        return await window.crypto.subtle.deriveBits(
          { name: "ECDH", public: partnerPublicKeyObj },
          myPrivKeyObj,
          256
        );
      }

      async function deriveRatchetMessageKey(initialSharedSecret, sequenceNum, myId, peerId) {
        const salt = new TextEncoder().encode(`ratchet-salt-${Math.min(myId, peerId)}`);
        const info = new TextEncoder().encode(`vktg-msg-chain|${Math.min(myId, peerId)}|${Math.max(myId, peerId)}|${sequenceNum}`);
        
        const rawSecretKey = await window.crypto.subtle.importKey(
          "raw",
          initialSharedSecret,
          { name: "HKDF" },
          false,
          ["deriveKey"]
        );
        
        const chainStartKey = await window.crypto.subtle.deriveKey(
          {
            name: "HKDF",
            hash: "SHA-256",
            salt: salt,
            info: info
          },
          rawSecretKey,
          { name: "HMAC", hash: "SHA-256", length: 256 },
          true,
          ["sign"]
        );
        
        const exportedChainKey = await window.crypto.subtle.exportKey("raw", chainStartKey);
        let currentChainKeyBytes = new Uint8Array(exportedChainKey);
        
        const enc = new TextEncoder();
        const msgConstant = enc.encode("msg-key");
        const chainConstant = enc.encode("chain-key");
        
        let lastMsgKeyBytes = null;
        
        for (let i = 0; i < sequenceNum; i++) {
          const keyObj = await window.crypto.subtle.importKey(
            "raw",
            currentChainKeyBytes,
            { name: "HMAC", hash: "SHA-256" },
            false,
            ["sign"]
          );
          
          const msgSignature = await window.crypto.subtle.sign("HMAC", keyObj, msgConstant);
          lastMsgKeyBytes = new Uint8Array(msgSignature);
          
          const chainSignature = await window.crypto.subtle.sign("HMAC", keyObj, chainConstant);
          currentChainKeyBytes = new Uint8Array(chainSignature);
        }
        
        return await window.crypto.subtle.importKey(
          "raw",
          lastMsgKeyBytes,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"]
        );
      }

      async function handleUnlockVault() {
        if (!passwordInput.trim()) {
          setVaultError("Пароль не может быть пустым!");
          return;
        }

        try {
          const storedSalt = await getSecureKey("vault_salt");
          const storedEncryptedPriv = await getSecureKey("encrypted_private_key");
          const storedPub = await getSecureKey("public_key_jwk");

          const db = await openSecureDB();
          const tx = db.transaction(storeName, "readonly");
          const store = tx.objectStore(storeName);
          const cachedKeys = {};
          
          store.openCursor().onsuccess = (event) => {
            const cursor = event.target.result;
            if (cursor) {
              if (cursor.key.startsWith("trusted_key_")) {
                const pId = cursor.key.replace("trusted_key_", "");
                cachedKeys[pId] = cursor.value;
              }
              cursor.continue();
            } else {
              setPeerKeys(cachedKeys);
            }
          };

          if (!storedEncryptedPriv || !storedSalt) {
            const salt = window.crypto.getRandomValues(new Uint8Array(16));
            const newKeys = await window.crypto.subtle.generateKey(
              { name: "ECDH", namedCurve: "P-256" },
              true,
              ["deriveKey", "deriveBits"]
            );

            const pubJwk = await window.crypto.subtle.exportKey("jwk", newKeys.publicKey);
            const privJwk = await window.crypto.subtle.exportKey("jwk", newKeys.privateKey);

            const mKey = await deriveMasterKey(passwordInput, salt);
            const rawPrivBytes = new TextEncoder().encode(JSON.stringify(privJwk));
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const encryptedPriv = await window.crypto.subtle.encrypt(
              { name: "AES-GCM", iv: iv },
              mKey,
              rawPrivBytes
            );

            await saveSecureKey("vault_salt", salt);
            await saveSecureKey("encrypted_private_key", { ciphertext: encryptedPriv, iv: iv });
            await saveSecureKey("public_key_jwk", pubJwk);

            setIdentityKeyPair(newKeys);
            setMyPublicJWK(btoa(JSON.stringify(pubJwk)));
          } else {
            const mKey = await deriveMasterKey(passwordInput, storedSalt);
            try {
              const decryptedPrivBytes = await window.crypto.subtle.decrypt(
                { name: "AES-GCM", iv: storedEncryptedPriv.iv },
                mKey,
                storedEncryptedPriv.ciphertext
              );
              
              const privJwk = JSON.parse(new TextDecoder().decode(decryptedPrivBytes));
              const pub = await window.crypto.subtle.importKey("jwk", storedPub, { name: "ECDH", namedCurve: "P-256" }, true, []);
              const priv = await window.crypto.subtle.importKey("jwk", privJwk, { name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey", "deriveBits"]);

              setIdentityKeyPair({ publicKey: pub, privateKey: priv });
              setMyPublicJWK(btoa(String(JSON.stringify(storedPub))));
            } catch (decErr) {
              setVaultError("Неверный пароль разблокировки!");
              return;
            }
          }

          setMasterPassword(passwordInput);
          setIsVaultLocked(false);
          setVaultError('');
        } catch (err) {
          setVaultError("Критическая ошибка хранилища: " + err.message);
        }
      }

      async function encryptDataPFS(recipientPubJWKB64, arrayBufferOrBytes, sequenceNum) {
        if (!identityKeyPair || !myProfile) throw new Error("Ключ шифрования не разблокирован или профиль не загружен.");
        const sharedBits = await computeSharedSecret(recipientPubJWKB64, identityKeyPair.privateKey);
        const aesKey = await deriveRatchetMessageKey(sharedBits, sequenceNum, myProfile.id, activePartner.id);

        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const ciphertext = await window.crypto.subtle.encrypt(
          { name: "AES-GCM", iv: iv },
          aesKey,
          arrayBufferOrBytes
        );

        return {
          ivB64: btoa(String.fromCharCode(...iv)),
          ciphertextBuffer: ciphertext
        };
      }

      async function encryptPFS(recipientPubJWKB64, messageText) {
        const savedSeq = await getSecureKey(`seq_sent_${activePartner.id}`);
        const sequence = (savedSeq ? parseInt(savedSeq) : 0) + 1;
        await saveSecureKey(`seq_sent_${activePartner.id}`, sequence);

        const randomPadBytes = window.crypto.getRandomValues(new Uint8Array(Math.floor(Math.random() * 128) + 16));
        const payloadData = {
          text: messageText,
          timestamp: Date.now(),
          sender_id: myProfile.id,
          recipient_id: activePartner.id,
          sequence: sequence,
          _pad: btoa(String.fromCharCode(...randomPadBytes))
        };

        const payloadBytes = new TextEncoder().encode(JSON.stringify(payloadData));
        const encrypted = await encryptDataPFS(recipientPubJWKB64, payloadBytes, sequence);

        return {
          sequence,
          ivB64: encrypted.ivB64,
          ciphertextB64: btoa(String.fromCharCode(...new Uint8Array(encrypted.ciphertextBuffer)))
        };
      }

      async function decryptPFS(sequence, ivB64, ciphertextB64, item) {
        if (!identityKeyPair || !myProfile) return null;
        try {
          const partnerId = item.from_id;
          const partnerKeyB64 = peerKeys[partnerId];
          if (!partnerKeyB64) return null;

          const sharedBits = await computeSharedSecret(partnerKeyB64, identityKeyPair.privateKey);
          const aesKey = await deriveRatchetMessageKey(sharedBits, parseInt(sequence), myProfile.id, partnerId);

          const iv = new Uint8Array(atob(ivB64).split("").map(c => c.charCodeAt(0)));
          const ciphertext = new Uint8Array(atob(ciphertextB64).split("").map(c => c.charCodeAt(0)));

          const decryptedBytes = await window.crypto.subtle.decrypt(
            { name: "AES-GCM", iv: iv },
            aesKey,
            ciphertext
          );

          const payload = JSON.parse(new TextDecoder().decode(decryptedBytes));
          
          if (payload.recipient_id !== myProfile.id) {
            return { error: "Нарушение адресации! Сообщение заблокировано." };
          }

          const lastVerifiedVkIdKey = `vktg_last_verified_vk_id_${partnerId}`;
          const lastVerifiedSeqKey = `vktg_last_verified_seq_${partnerId}`;

          const lastVerifiedVkId = parseInt(await getSecureKey(lastVerifiedVkIdKey) || '0');
          const lastVerifiedSeq = parseInt(await getSecureKey(lastVerifiedSeqKey) || '0');

          if (item.id > lastVerifiedVkId) {
            if (payload.sequence <= lastVerifiedSeq) {
              return { error: "Обнаружена атака повторного воспроизведения (Replay Attack)!" };
            }
            await saveSecureKey(lastVerifiedVkIdKey, item.id.toString());
            await saveSecureKey(lastVerifiedSeqKey, payload.sequence.toString());
          }

          return payload;
        } catch (e) {
          console.error("Decryption failed", e);
          return null;
        }
      }

      const checkVKSession = async (rawTok) => {
        const cleanTok = parseToken(rawTok);
        if (!cleanTok) return;

        try {
          localStorage.setItem('vk_token', cleanTok);
          const profileResponse = await vkRequest('users.get', { fields: 'photo_100,status', access_token: cleanTok });
          if (profileResponse && profileResponse.length > 0) {
            setToken(cleanTok);
            setMyProfile(profileResponse[0]);
            setIsLoggedIn(true);
            setTokenInput('');
            setAuthError('');
            
            const over = localContacts[profileResponse[0].id] || {};
            setCustomName(over.name || `${profileResponse[0].first_name} ${profileResponse[0].last_name}`);
            setCustomAvatar(over.photo || profileResponse[0].photo_100);
          } else {
            setAuthError("Сессия не найдена. Попробуйте обновить токен.");
          }
        } catch (err) {
          setAuthError(`Ошибка сессии VK: ${err.error_msg || JSON.stringify(err)}`);
          localStorage.removeItem('vk_token');
        }
      };

      const refreshConversations = async () => {
        try {
          const response = await vkRequest('messages.getConversations', { count: 30, extended: 1 });
          if (!response || !response.items) return;

          const profilesMap = {};
          if (response.profiles) {
            response.profiles.forEach(p => { profilesMap[p.id] = p; });
          }

          const items = [];
          for (let item of response.items) {
            const peer = item.conversation.peer;
            let partner = profilesMap[peer.id] || { id: peer.id, first_name: `Пользователь ${peer.id}`, last_name: '' };
            if (localContacts[peer.id]) {
              partner = { ...partner, ...localContacts[peer.id] };
            }
            items.push({
              id: peer.id,
              partner,
              lastMessage: item.last_message,
              unreadCount: item.conversation.unread_count || 0
            });
          }

          setConversations(items);
        } catch (e) {
          console.error("Failed to load conversations: ", e);
        }
      };

      const refreshMessages = async (partnerId) => {
        try {
          const response = await vkRequest('messages.getHistory', { peer_id: partnerId, count: 40 });
          if (!response || !response.items) return;

          const decryptedMessages = [];
          for (let item of response.items) {
            const isMe = item.from_id === myProfile.id;
            let text = item.text || '';
            let payload = null;

            if (text.startsWith(PREFIX_KEY_EXCHANGE)) {
              const rawKey = text.replace(PREFIX_KEY_EXCHANGE, "").trim();
              
              peerKeys[item.from_id] = rawKey;
              setPeerKeys({ ...peerKeys });

              payload = { isSystem: true, text: "🔑 Синхронизирована новая пара асимметричных ключей E2EE." };
              
              if (!isMe && !localStorage.getItem(`replied_${item.from_id}`)) {
                await sendKeyExchangeMessage(partnerId);
                localStorage.setItem(`replied_${item.from_id}`, 'true');
              }
            } else if (text.startsWith(PREFIX_E2EE_TEXT)) {
              const parts = text.replace(PREFIX_E2EE_TEXT, "").trim().split(":");
              if (parts.length === 3) {
                const [sequence, iv, cipher] = parts;
                const decryptedData = await decryptPFS(sequence, iv, cipher, item);
                if (decryptedData) {
                  if (decryptedData.error) {
                    payload = { isError: true, text: `⚠️ ${decryptedData.error}` };
                  } else {
                    payload = { isText: true, text: decryptedData.text };
                  }
                } else {
                  payload = { isError: true, text: "🔒 Ошибка расшифрования." };
                }
              }
            } else if (text.startsWith(PREFIX_E2EE_FILE)) {
              const parts = text.replace(PREFIX_E2EE_FILE, "").trim().split(":");
              if (parts.length >= 4) {
                const [sequence, iv, b64Name, mime] = parts;
                let docUrl = null;
                if (item.attachments) {
                  const docObj = item.attachments.find(a => a.type === 'doc');
                  if (docObj && docObj.doc) docUrl = docObj.doc.url;
                }
                payload = { isFile: true, name: atob(b64Name), mime, docUrl, sequence, iv };
              }
            }

            decryptedMessages.push({
              id: item.id,
              fromId: item.from_id,
              date: item.date,
              rawText: text,
              isMe,
              decrypted: payload
            });
          }

          setMessages(decryptedMessages);
        } catch (e) {
          console.error("Messages failed to refresh: ", e);
        }
      };

      const sendKeyExchangeMessage = async (peerId) => {
        if (!myPublicJWK) return;
        await vkRequest('messages.send', {
          peer_id: peerId,
          message: `${PREFIX_KEY_EXCHANGE}${myPublicJWK}`,
          random_id: Math.floor(Math.random() * 10000000)
        });
      };

      // Unified 100% E2EE VK Doc Sender Engine with Base64 Transport wrapper!
      const sendEncryptedFileDirectly = async (arrayBuffer, filename, mimeType) => {
        if (!activePartner) return;
        const partnerKeyB64 = peerKeys[activePartner.id];
        if (!partnerKeyB64) {
          alert("Необходимо обменяться ключами E2EE!");
          return;
        }

        try {
          const savedSeq = await getSecureKey(`seq_sent_${activePartner.id}`);
          const sequence = (savedSeq ? parseInt(savedSeq) : 0) + 1;
          await saveSecureKey(`seq_sent_${activePartner.id}`, sequence);

          // 1. Encrypt file raw payload locally
          const encryptedFile = await encryptDataPFS(partnerKeyB64, arrayBuffer, sequence);
          
          // 2. Convert encrypted buffer to safe Base64 String
          const encryptedBase64Str = arrayBufferToBase64(encryptedFile.ciphertextBuffer);

          // 3. Prepare upload server
          const server = await vkRequest('docs.getMessagesUploadServer', { type: 'doc', peer_id: activePartner.id });
          
          // 4. Create text blob with Base64 content (Guarantees no CORS binary corruption)
          const transportBlob = new Blob([encryptedBase64Str], { type: 'text/plain' });
          const formData = new FormData();
          formData.append('file', transportBlob, 'payload.txt');

          const uploadResp = await fetch(server.upload_url, { method: 'POST', body: formData });
          const uploadData = await uploadResp.json();

          // 5. Save on VK servers as text document
          const saved = await vkRequest('docs.save', { file: uploadData.file, title: 'payload.txt' });
          const docObj = saved.doc || saved[0];
          const attachStr = `doc${docObj.owner_id}_${docObj.id}`;

          const b64Name = btoa(filename);
          const header = `${PREFIX_E2EE_FILE}${sequence}:${encryptedFile.ivB64}:${b64Name}:${mimeType}`;

          await vkRequest('messages.send', {
            peer_id: activePartner.id,
            message: header,
            attachment: attachStr,
            random_id: Math.floor(Math.random() * 10000000)
          });

          await refreshMessages(activePartner.id);
        } catch (e) {
          alert("Ошибка отправки зашифрованного медиафайла: " + JSON.stringify(e));
        }
      };

      const handleSendMessage = async () => {
        if (!activePartner) return;
        const msgText = messageInput.trim();
        if (!msgText) return;

        const partnerKeyB64 = peerKeys[activePartner.id];
        if (!partnerKeyB64) {
          alert("Необходимо обменяться ключами E2EE!");
          return;
        }

        try {
          const encrypted = await encryptPFS(partnerKeyB64, msgText);
          const payload = `${PREFIX_E2EE_TEXT}${encrypted.sequence}:${encrypted.ivB64}:${encrypted.ciphertextB64}`;

          await vkRequest('messages.send', {
            peer_id: activePartner.id,
            message: payload,
            random_id: Math.floor(Math.random() * 10000000)
          });

          setMessageInput('');
          await refreshMessages(activePartner.id);
        } catch (e) {
          alert("Ошибка отправки: " + JSON.stringify(e));
        }
      };

      // Voice Recorder Engine (.meo)
      const startAudioRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const chunks = [];
          const recorder = new MediaRecorder(stream);
          
          recorder.ondataavailable = e => {
            if (e.data.size > 0) chunks.push(e.data);
          };
          
          recorder.onstop = async () => {
            const blob = new Blob(chunks, { type: 'audio/webm' });
            const arrBuffer = await blob.arrayBuffer();
            await sendEncryptedFileDirectly(arrBuffer, 'voice.meo', 'audio/webm');
            stream.getTracks().forEach(t => t.stop());
          };

          setAudioRecorder(recorder);
          recorder.start();
          setIsRecordingAudio(true);
        } catch (e) {
          alert("Не удалось получить доступ к микрофону: " + e.message);
        }
      };

      const stopAudioRecording = () => {
        if (audioRecorder && audioRecorder.state !== 'inactive') {
          audioRecorder.stop();
        }
        setIsRecordingAudio(false);
      };

      // Video Note / Circular Video Recorder Engine (.me)
      const startCircleRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 480, height: 480 }, audio: true });
          setCircleStream(stream);

          setTimeout(() => {
            if (circlePreviewRef.current) {
              circlePreviewRef.current.srcObject = stream;
            }
          }, 150);

          const chunks = [];
          const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8,opus' });
          
          recorder.ondataavailable = e => {
            if (e.data.size > 0) chunks.push(e.data);
          };
          
          recorder.onstop = async () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const arrBuffer = await blob.arrayBuffer();
            await sendEncryptedFileDirectly(arrBuffer, 'circle.me', 'video/webm');
            stream.getTracks().forEach(t => t.stop());
          };

          setCircleRecorder(recorder);
          recorder.start();
          setIsRecordingCircle(true);
        } catch (e) {
          alert("Ошибка запуска видеозаписи: " + e.message);
        }
      };

      const stopCircleRecording = () => {
        if (circleRecorder && circleRecorder.state !== 'inactive') {
          circleRecorder.stop();
        }
        setIsRecordingCircle(false);
        setCircleStream(null);
      };

      const handleSelectChat = (partner) => {
        setActivePartner(partner);
        setActiveScreen('chat_room');
        setMessages([]);
        refreshMessages(partner.id);
      };

      const handleSaveLocalProfile = () => {
        if (!myProfile) return;
        const copy = { ...localContacts };
        copy[myProfile.id] = {
          id: myProfile.id,
          first_name: customName,
          last_name: '',
          photo_100: customAvatar || myProfile.photo_100
        };
        localStorage.setItem('vktg_contacts', JSON.stringify(copy));
        setLocalContacts(copy);
        setMyProfile(prev => ({
          ...prev,
          first_name: customName,
          photo_100: customAvatar
        }));
        setSettingsOpen(false);
        alert("Профиль успешно сохранен!");
      };

      const handleStartNewChat = async () => {
        const parsedId = parseInt(targetUserId);
        if (!parsedId || isNaN(parsedId)) {
          alert("Пожалуйста, введите корректный числовой ID");
          return;
        }

        try {
          const resp = await vkRequest('users.get', { user_ids: parsedId, fields: 'photo_100' });
          if (resp && resp.length > 0) {
            let partner = resp[0];
            if (localContacts[parsedId]) {
              partner = { ...partner, ...localContacts[parsedId] };
            }
            setNewChatModal(false);
            setTargetUserId('');
            handleSelectChat(partner);
          } else {
            alert("Пользователь не найден.");
          }
        } catch (e) {
          alert("Не удалось загрузить пользователя: " + JSON.stringify(e));
        }
      };

      const parseToken = (input) => {
        input = input.trim();
        if (input.includes('access_token=')) {
          const normalized = input.replace('#', '?');
          try {
            const urlObj = new URL(normalized);
            const tok = urlObj.searchParams.get('access_token');
            if (tok) return tok;
          } catch (e) {
            const match = input.match(/access_token=([^&]+)/);
            if (match) return match[1];
          }
        }
        return input;
      };

      const handleLogout = () => {
        localStorage.removeItem('vk_token');
        setToken('');
        setIsLoggedIn(false);
        setMyProfile(null);
        setDrawerOpen(false);
      };

      // File Selection direct router
      const handleFileSelectionDirect = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async function(evt) {
          let filename = file.name;
          const mimeType = file.type || 'application/octet-stream';

          if (mimeType.startsWith('image/')) {
            filename = 'image.mur';
          } else if (mimeType.startsWith('video/')) {
            filename = 'video.meow';
          } else if (mimeType.startsWith('audio/')) {
            filename = 'voice.meo';
          }

          await sendEncryptedFileDirectly(evt.target.result, filename, mimeType);
          setAttachmentSheet(false);
        };
        reader.readAsArrayBuffer(file);
      };

      // Handle Stego Encryption File Selection
      const handleStegoEncryptSourceFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
          setStegoBaseImg(evt.target.result);
        };
        reader.readAsDataURL(file);
      };

      const runStegoEncryption = async () => {
        if (!stegoBaseImg) {
          alert("Загрузите исходную картинку-контейнер!");
          return;
        }
        if (!myProfile || !myPublicJWK || !activePartner) {
          alert("Ошибка: профиль не загружен или ключи не готовы.");
          return;
        }
        const seed = stegoCustomSeed.trim() || String(Math.min(myProfile.id, activePartner.id)) + String(Math.max(myProfile.id, activePartner.id));
        try {
          const outPngUrl = await embedKeyInImage(stegoBaseImg, myPublicJWK, seed);
          setGeneratedStegoUrl(outPngUrl);
          alert("Ключ успешно спрятан в пикселях картинки! Скачайте её и отправьте собеседнику.");
        } catch (e) {
          alert("Сбой стеганографии: " + e.message);
        }
      };

      // Handle Stego Decryption File Selection
      const handleStegoDecryptFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
          setStegoExtractImg(evt.target.result);
        };
        reader.readAsDataURL(file);
      };

      const runStegoDecryption = async () => {
        if (!stegoExtractImg) {
          alert("Загрузите полученную картинку-контейнер!");
          return;
        }
        if (!myProfile || !activePartner) {
          alert("Ошибка: профиль не загружен.");
          return;
        }
        const seed = stegoExtractSeed.trim() || String(Math.min(myProfile.id, activePartner.id)) + String(Math.max(myProfile.id, activePartner.id));
        try {
          const extractedKey = await extractKeyFromImage(stegoExtractImg, seed);
          handleImportPeerKeyDirect(extractedKey);
          alert("Ключ успешно извлечен из пикселей и импортирован!");
        } catch (e) {
          alert("Не удалось извлечь ключ: " + e.message + "\nУбедитесь, что ID (Seed) указан верно или картинка не повреждена (например, сжатием).");
        }
      };

      const filteredConversations = conversations.filter(item => {
        const name = `${item.partner.first_name} ${item.partner.last_name || ''}`.toLowerCase();
        const matchesQuery = name.includes(searchQuery.toLowerCase());
        if (activeTab === 'secret') {
          return matchesQuery && peerKeys[item.partner.id];
        }
        return matchesQuery;
      });

      // ================= UI RENDER IMPLEMENTATION =================

      // 1. MASTER PASSWORD WALL
      if (isLoggedIn && isVaultLocked) {
        return (
          <div className="h-screen w-full flex items-center justify-center bg-[#070a0e] p-4 text-white">
            <div className="w-full max-w-sm bg-[#0e141c] rounded-2xl p-6 border border-[#223145] shadow-2xl flex flex-col items-center space-y-5">
              <div className="w-14 h-14 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center">
                <Icons.Lock className="w-7 h-7" />
              </div>
              
              <div className="text-center">
                <h2 className="text-lg font-bold">Сейф шифрования</h2>
                <p className="text-xs text-[#738294] mt-2 leading-relaxed">
                  Введите пароль для дешифрования приватных ключей E2EE. Если вы запускаете клиент впервые — придумайте новый пароль (PBKDF2-600k).
                </p>
              </div>

              <input 
                type="password"
                placeholder="Мастер-Пароль"
                value={passwordInput}
                onChange={(e) => setPasswordInput(e.target.value)}
                className="w-full bg-[#05070a] text-sm text-white px-4 py-3 rounded-xl border border-[#1b2533] focus:outline-none focus:border-emerald-500 text-center tracking-wider transition"
              />

              {vaultError && (
                <div className="text-xs text-rose-400 text-center bg-rose-950/20 py-1.5 px-3 rounded-lg w-full border border-rose-900/30">
                  {vaultError}
                </div>
              )}

              <button 
                onClick={handleUnlockVault}
                className="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl text-xs font-bold tracking-wider transition duration-150 flex items-center justify-center gap-2 shadow-lg shadow-emerald-950/40"
              >
                <Icons.Lock className="w-4 h-4" />
                РАЗБЛОКИРОВАТЬ
              </button>
            </div>
          </div>
        );
      }

      // 2. MAIN OAUTH WALL
      if (!isLoggedIn) {
        return (
          <div className="h-screen w-full flex items-center justify-center bg-[#070a0e] p-4 text-white">
            <div className="w-full max-w-sm bg-[#0e141c] rounded-2xl p-6 border border-[#223145] shadow-2xl flex flex-col items-center">
              <div className="w-16 h-16 bg-[#213043] rounded-2xl flex items-center justify-center mb-5 border border-[#304662] shadow-inner">
                <Icons.Lock className="w-8 h-8 text-sky-400" />
              </div>
              
              <h2 className="text-xl font-bold tracking-tight mb-1 text-center">VKTG Messenger</h2>
              <p className="text-xs text-[#738294] mb-6 text-center leading-relaxed">Безопасное сквозное шифрование поверх API ВКонтакте</p>

              <div className="w-full space-y-4">
                <div>
                  <label className="block text-[10px] text-[#738294] font-semibold mb-1.5 uppercase tracking-wider">Шаг 1: Авторизуйтесь в ВК (Вечный токен)</label>
                  <a 
                    href="https://oauth.vk.com/authorize?client_id=2685278&scope=messages,audio,photos,video,docs,notes,pages,status,wall,groups,email,stats,notifications,offline&redirect_uri=https://oauth.vk.com/blank.html&display=page&response_type=token"
                    target="_blank"
                    className="w-full flex items-center justify-center gap-2 bg-[#213043] hover:bg-[#2e435d] text-white py-3 rounded-xl font-bold text-xs border border-[#304662] transition duration-150"
                  >
                    <Icons.Key />
                    ПОЛУЧИТЬ ВЕЧНЫЙ ТОКЕН
                  </a>
                </div>

                <div>
                  <label className="block text-[10px] text-[#738294] font-semibold mb-1.5 uppercase tracking-wider">Шаг 2: Вставьте токен</label>
                  <textarea 
                    value={tokenInput}
                    onChange={(e) => setTokenInput(e.target.value)}
                    onFocus={handleInputFocusAndAutoPaste}
                    rows={3}
                    placeholder="Вставьте ссылку из браузера или скопируйте её — приложение авто-распознает её при тапе сюда!"
                    className="w-full bg-[#05070a] text-xs text-white p-3.5 rounded-xl border border-[#1b2533] focus:outline-none focus:border-sky-500 resize-none transition"
                  />
                </div>
              </div>

              <button 
                onClick={() => checkVKSession(tokenInput)}
                className="w-full mt-6 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-xl text-xs tracking-wider flex items-center justify-center gap-2 transition duration-150 shadow-lg shadow-emerald-950/40"
              >
                <Icons.Send />
                ПОДКЛЮЧИТЬСЯ
              </button>

              {authError && (
                <div className="w-full mt-4 p-3 bg-rose-950/20 border border-rose-900/40 rounded-xl text-[10px] text-rose-400 font-mono text-center leading-relaxed">
                  {authError}
                </div>
              )}
            </div>
          </div>
        );
      }

      // 3. SECURE CHATS MAIN BOARD
      return (
        <div className="mobile-container relative bg-[#080c10]">
          
          {/* CHATS SCREEN */}
          {activeScreen === 'chats' && (
            <div className="flex-1 flex flex-col overflow-hidden relative">
              
              {/* Custom Header */}
              <div className="bg-[#0e141c] py-4 px-4 flex items-center justify-between border-b border-[#1b2533] shadow-md shrink-0">
                <div className="flex items-center gap-4">
                  <button onClick={() => setDrawerOpen(true)} className="text-gray-300 hover:text-white transition">
                    <Icons.Menu />
                  </button>
                  <span className="text-lg font-bold text-white tracking-wide">VKTG Premium</span>
                </div>
                <div className="text-gray-400">
                  <Icons.Search />
                </div>
              </div>

              {/* Chat Tabs */}
              <div className="bg-[#0e141c] flex border-b border-[#1b2533] shrink-0 text-xs font-semibold uppercase tracking-wider text-[#738294]">
                <button 
                  onClick={() => setActiveTab('all')}
                  className={`flex-1 py-3 text-center border-b-2 transition ${activeTab === 'all' ? 'text-sky-400 border-sky-400 bg-white/5' : 'border-transparent hover:text-white'}`}
                >
                  Все чаты
                </button>
                <button 
                  onClick={() => setActiveTab('secret')}
                  className={`flex-1 py-3 text-center border-b-2 transition flex items-center justify-center gap-1.5 ${activeTab === 'secret' ? 'text-emerald-400 border-emerald-400 bg-white/5' : 'border-transparent hover:text-white'}`}
                >
                  <Icons.Lock className="w-3.5 h-3.5" />
                  ЗАЩИЩЕННЫЕ
                </button>
              </div>

              {/* Search Field */}
              <div className="bg-[#0e141c]/60 p-2.5 border-b border-[#1b2533] shrink-0">
                <input 
                  type="text" 
                  placeholder="Поиск собеседника..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full bg-[#05070a] text-xs text-white rounded-lg px-3.5 py-2.5 focus:outline-none border border-transparent focus:border-[#213043] transition"
                />
              </div>

              {/* Dialogues List */}
              <div className="flex-1 overflow-y-auto scrollable-area">
                {filteredConversations.length === 0 ? (
                  <div className="p-12 text-center text-[#738294] text-xs space-y-3">
                    <div className="w-12 h-12 bg-[#16212e] rounded-full flex items-center justify-center mx-auto text-sky-400">
                      <Icons.Sync />
                    </div>
                    <p>Нет активных секретных диалогов.</p>
                  </div>
                ) : (
                  filteredConversations.map(item => {
                    const avatar = item.partner.photo_100 || item.partner.photo;
                    const name = `${item.partner.first_name} ${item.partner.last_name || ''}`;
                    const time = item.lastMessage ? formatTimestamp(item.lastMessage.date) : '';
                    let preview = item.lastMessage ? item.lastMessage.text : '';
                    let isEnc = false;

                    if (preview.startsWith(PREFIX_KEY_EXCHANGE)) {
                      preview = "🔑 Крипто-ключи согласованы";
                    } else if (preview.startsWith(PREFIX_E2EE_TEXT) || preview.startsWith(PREFIX_E2EE_FILE)) {
                      preview = "🔒 Зашифровано сквозным PFS";
                      isEnc = true;
                    }

                    return (
                      <div 
                        key={item.id}
                        onClick={() => handleSelectChat(item.partner)}
                        className="p-3.5 flex items-center gap-3.5 active:bg-[#121a24] cursor-pointer transition duration-150 border-b border-[#1b2533]/40"
                      >
                        <div className="w-12 h-12 rounded-full relative shrink-0">
                          <img src={avatar} className="w-full h-full rounded-full object-cover border border-[#1b2533]" />
                          <div className={`absolute bottom-0 right-0 w-3 h-3 border-2 border-[#0b0e14] rounded-full ${item.partner.online ? 'bg-emerald-500' : 'bg-gray-500'}`}></div>
                        </div>

                        <div className="flex-1 min-w-0">
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-sm text-white truncate">{name}</span>
                            <span className="text-[10px] text-[#738294]">{time}</span>
                          </div>
                          <p className={`text-xs ${isEnc ? 'text-emerald-400 font-semibold' : 'text-[#738294]'} truncate mt-1`}>
                            {preview}
                          </p>
                        </div>

                        {item.unreadCount > 0 && (
                          <span className="bg-emerald-500 text-black font-bold text-[10px] px-2 py-0.5 rounded-full shrink-0">
                            {item.unreadCount}
                          </span>
                        )}
                      </div>
                    );
                  })
                )}
              </div>

              {/* FAB */}
              <button 
                onClick={() => setNewChatModal(true)}
                className="absolute bottom-6 right-6 w-14 h-14 bg-sky-600 hover:bg-sky-500 text-white rounded-full flex items-center justify-center shadow-2xl active:scale-95 transition duration-150 z-30 shadow-sky-950/40 border border-sky-400/20"
              >
                <Icons.Edit />
              </button>
            </div>
          )}

          {/* CHAT ROOM SCREEN */}

                </p>

                <div>
                  <label className="block text-[10px] text-gray-400 mb-1.5 uppercase tracking-wider">ID пользователя VK</label>
                  <input 
                    type="number" 
                    value={targetUserId}
                    onChange={(e) => setTargetUserId(e.target.value)}
                    placeholder="Например: 12345678"
                    className="w-full bg-[#05070a] text-xs text-white p-3.5 rounded-xl border border-[#1b2533] focus:outline-none"
                  />
                </div>

                <div className="flex justify-end gap-2 text-xs pt-2">
                  <button 
                    onClick={() => setNewChatModal(false)}
                    className="px-4 py-2 text-gray-400 hover:bg-white/5 rounded-lg transition"
                  >
                    Отмена
                  </button>
                  <button 
                    onClick={handleStartNewChat}
                    className="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-lg transition"
                  >
                    ОТКРЫТЬ
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= SAFETY NUMBERS MODAL ================= */}
          {safetyNumberModal && activePartner && (
            <div className="absolute inset-0 bg-black/85 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-[#0e141c] w-full max-w-sm rounded-2xl p-5 border border-emerald-950 text-center space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-[#1b2533]">
                  <span className="text-xs font-bold text-emerald-400 flex items-center gap-1.5 uppercase">
                    <Icons.Lock className="w-3.5 h-3.5" />
                    ВЕРИФИКАЦИЯ КАНАЛА
                  </span>
                  <button onClick={() => setSafetyNumberModal(false)} className="text-gray-400 p-1">
                    <Icons.Close />
                  </button>
                </div>

                <p className="text-[11px] text-[#738294] leading-relaxed">
                  Для предотвращения атак перехвата сравните эти 60 чисел с числами на экране собеседника {activePartner.first_name}:
                </p>

                <div className="bg-[#05070a] p-4 rounded-xl border border-[#1b2533] font-mono text-xs text-emerald-400 tracking-widest break-words leading-relaxed select-all">
                  {safetyNumber}
                </div>

                <div className="text-[9px] text-gray-500 leading-relaxed">
                  Протокол: Forward-Secure Symmetric Ratchet on ECDH (P-256) + HMAC-SHA256 + AES-GCM 256.
                </div>
              </div>
            </div>
          )}

          {/* ================= ATTACHMENT BOTTOM SHEET ================= */}
          {attachmentSheet && (
            <div className="absolute inset-0 bg-black/75 z-50 flex flex-col justify-end">
              <div onClick={() => setAttachmentSheet(false)} className="flex-1 w-full"></div>
              
              <div className="bg-[#0e141c] rounded-t-3xl p-5 space-y-4 border-t border-[#1b2533] shadow-2xl relative animate-slide-up">
                <div className="w-12 h-1 bg-white/10 rounded-full mx-auto mb-1"></div>
                <h4 className="text-xs font-bold text-white uppercase tracking-wider text-center">Шифрованная отправка E2EE</h4>
                
                <div className="grid grid-cols-2 gap-4 pt-2">
                  <label className="flex flex-col items-center justify-center p-4 bg-[#05070a] hover:bg-[#121822] rounded-xl cursor-pointer border border-[#1b2533] space-y-1.5 transition">
                    <span className="text-emerald-400"><Icons.Edit /></span>
                    <span className="text-[10px] text-white font-semibold">Галерея / Файлы</span>
                    <input type="file" onChange={handleFileSelectionDirect} className="hidden" />
                  </label>

                  <div 
                    onClick={() => { setAttachmentSheet(false); startCircleRecording(); }}
                    className="flex flex-col items-center justify-center p-4 bg-[#05070a] hover:bg-[#121822] rounded-xl cursor-pointer border border-[#1b2533] space-y-1.5 transition text-center"
                  >
                    <Icons.CircleVideo />
                    <span className="text-[10px] text-white font-semibold">Записать кружочек (.me)</span>
                  </div>
                </div>

                <button 
                  onClick={() => setAttachmentSheet(false)}
                  className="w-full py-3 bg-[#1b2533] hover:bg-[#28384d] text-white text-xs font-bold rounded-xl transition"
                >
                  ОТМЕНА
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    function formatTimestamp(timestamp) {
      const date = new Date(timestamp * 1000);
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
