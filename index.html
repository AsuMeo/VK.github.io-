<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>FilterCam Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;height:100vh;width:100vw;position:fixed}
#app{height:100vh;display:flex;flex-direction:column;position:relative}
.header{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,15,.95);backdrop-filter:blur(30px);border-bottom:1px solid rgba(255,255,255,.04);z-index:100}
.header h1{font-size:16px;font-weight:800;background:linear-gradient(135deg,#ff6b9d 0%,#c44569 50%,#8e44ad 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px}
.header-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.06);border:none;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.header-btn:active{transform:scale(.88);background:rgba(255,255,255,.12)}
.canvas-area{flex:1;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(ellipse at center,#12121a 0%,#050508 100%);overflow:hidden}
#mainCanvas,#faceCanvas{max-width:100%;max-height:100%;object-fit:contain;position:absolute;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
#videoElement{display:none}
.upload-zone{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:10}
.upload-zone.hidden{display:none}
.upload-icon{width:90px;height:90px;border-radius:28px;background:linear-gradient(135deg,#ff6b9d,#c44569,#8e44ad);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 12px 48px rgba(255,107,157,.35),0 0 80px rgba(255,107,157,.1);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.upload-text{font-size:15px;color:rgba(255,255,255,.45);text-align:center;line-height:1.6}
.upload-btn{padding:14px 36px;border-radius:28px;background:linear-gradient(135deg,#ff6b9d,#c44569);border:none;color:#fff;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 24px rgba(255,107,157,.3)}
.upload-btn:active{transform:scale(.95)}
.cam-btn{position:absolute;bottom:20px;right:16px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 20px rgba(102,126,234,.4);z-index:20;transition:.2s}
.cam-btn:active{transform:scale(.9)}
.filter-strip{padding:10px 8px;background:rgba(10,10,15,.95);backdrop-filter:blur(30px);border-top:1px solid rgba(255,255,255,.04);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;z-index:100}
.filter-strip::-webkit-scrollbar{display:none}
.filter-item{flex-shrink:0;width:66px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;padding:4px;border-radius:14px;transition:.2s}
.filter-item.active{background:rgba(255,107,157,.12)}
.filter-item:active{transform:scale(.92)}
.filter-thumb{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid transparent;transition:.2s;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.filter-item.active .filter-thumb{border-color:#ff6b9d;box-shadow:0 0 16px rgba(255,107,157,.35)}
.filter-name{font-size:9px;color:rgba(255,255,255,.5);text-align:center;white-space:nowrap;font-weight:500}
.filter-item.active .filter-name{color:#ff6b9d;font-weight:600}
.bottom-actions{padding:10px 14px 24px;background:rgba(10,10,15,.95);display:flex;gap:10px;justify-content:center;z-index:100}
.action-btn{flex:1;max-width:150px;padding:12px 18px;border-radius:26px;border:none;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.action-btn:active{transform:scale(.95)}
.btn-primary{background:linear-gradient(135deg,#ff6b9d,#c44569);color:#fff;box-shadow:0 4px 20px rgba(255,107,157,.25)}
.btn-secondary{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.08)}
.sliders-panel{position:absolute;bottom:0;left:0;right:0;background:rgba(10,10,15,.98);backdrop-filter:blur(40px);padding:20px 16px 32px;border-radius:28px 28px 0 0;transform:translateY(110%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:200;max-height:70vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.5)}
.sliders-panel.open{transform:translateY(0)}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.panel-title{font-size:18px;font-weight:700;background:linear-gradient(135deg,#ff6b9d,#c44569);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.panel-close{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.slider-label{width:70px;font-size:12px;color:rgba(255,255,255,.5);font-weight:500}
.slider-input{flex:1;-webkit-appearance:none;height:5px;border-radius:3px;background:rgba(255,255,255,.06);outline:none}
.slider-input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#ff6b9d,#c44569);cursor:pointer;box-shadow:0 2px 12px rgba(255,107,157,.4);border:2px solid rgba(255,255,255,.2)}
.slider-value{width:32px;font-size:12px;color:#ff6b9d;text-align:right;font-weight:600}
.sticker-panel{position:absolute;bottom:0;left:0;right:0;background:rgba(10,10,15,.98);backdrop-filter:blur(40px);padding:20px 16px 32px;border-radius:28px 28px 0 0;transform:translateY(110%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:200;box-shadow:0 -8px 40px rgba(0,0,0,.5)}
.sticker-panel.open{transform:translateY(0)}
.sticker-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding-top:10px}
.sticker-item{font-size:32px;text-align:center;padding:8px;border-radius:12px;background:rgba(255,255,255,.04);cursor:pointer;transition:.15s}
.sticker-item:active{transform:scale(.9);background:rgba(255,255,255,.08)}
.zoom-controls{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:20;opacity:0;transition:opacity .3s}
.zoom-controls.show{opacity:1}
.zoom-btn{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(10px)}
.loading{position:absolute;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:300}
.loading.show{display:flex}
.spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,.08);border-top-color:#ff6b9d;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-120px);background:rgba(20,20,30,.95);padding:12px 28px;border-radius:28px;font-size:14px;z-index:400;transition:transform .35s;backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 32px rgba(0,0,0,.4);font-weight:500}
.toast.show{transform:translateX(-50%) translateY(0)}
#fileInput{display:none}
</style>
</head>
<body>
<div id="app">
<div class="header">
<button class="header-btn" onclick="toggleSliders()">&#9881;</button>
<h1>FilterCam Pro</h1>
<button class="header-btn" onclick="toggleStickers()">&#128512;</button>
</div>
<div class="canvas-area" id="canvasArea">
<canvas id="mainCanvas"></canvas>
<canvas id="faceCanvas"></canvas>
<video id="videoElement" autoplay playsinline></video>
<div class="upload-zone" id="uploadZone">
<div class="upload-icon">&#128247;</div>
<div class="upload-text">Drop photo or video here<br>or tap to browse</div>
<button class="upload-btn" onclick="document.getElementById('fileInput').click()">Choose File</button>
</div>
<button class="cam-btn" id="camBtn" onclick="toggleCamera()">&#128247;</button>
<div class="zoom-controls" id="zoomControls">
<button class="zoom-btn" onclick="zoomIn()">+</button>
<button class="zoom-btn" onclick="zoomOut()">-</button>
<button class="zoom-btn" onclick="rotateImage()">&#8635;</button>
<button class="zoom-btn" onclick="flipImage()">&#8646;</button>
</div>
</div>
<div class="filter-strip" id="filterStrip"></div>
<div class="bottom-actions">
<button class="action-btn btn-secondary" onclick="document.getElementById('fileInput').click()">&#128444; Load</button>
<button class="action-btn btn-primary" onclick="saveImage()">&#128190; Save</button>
</div>
<div class="sliders-panel" id="slidersPanel">
<div class="panel-header"><span class="panel-title">Adjustments</span><button class="panel-close" onclick="toggleSliders()">&#10005;</button></div>
<div class="slider-row"><span class="slider-label">Brightness</span><input type="range" class="slider-input" id="brightness" min="-100" max="100" value="0" oninput="updateFilter()"><span class="slider-value" id="brightnessVal">0</span></div>
<div class="slider-row"><span class="slider-label">Contrast</span><input type="range" class="slider-input" id="contrast" min="-100" max="100" value="0" oninput="updateFilter()"><span class="slider-value" id="contrastVal">0</span></div>
<div class="slider-row"><span class="slider-label">Saturation</span><input type="range" class="slider-input" id="saturate" min="-100" max="100" value="0" oninput="updateFilter()"><span class="slider-value" id="saturateVal">0</span></div>
<div class="slider-row"><span class="slider-label">Warmth</span><input type="range" class="slider-input" id="warmth" min="-100" max="100" value="0" oninput="updateFilter()"><span class="slider-value" id="warmthVal">0</span></div>
<div class="slider-row"><span class="slider-label">Tint</span><input type="range" class="slider-input" id="tint" min="-50" max="50" value="0" oninput="updateFilter()"><span class="slider-value" id="tintVal">0</span></div>
<div class="slider-row"><span class="slider-label">Exposure</span><input type="range" class="slider-input" id="exposure" min="-50" max="50" value="0" oninput="updateFilter()"><span class="slider-value" id="exposureVal">0</span></div>
<div class="slider-row"><span class="slider-label">Highlights</span><input type="range" class="slider-input" id="highlights" min="-100" max="100" value="0" oninput="updateFilter()"><span class="slider-value" id="highlightsVal">0</span></div>
<div class="slider-row"><span class="slider-label">Shadows</span><input type="range" class="slider-input" id="shadows" min="-100" max="100" value="0" oninput="updateFilter()"><span class="slider-value" id="shadowsVal">0</span></div>
<div class="slider-row"><span class="slider-label">Blur</span><input type="range" class="slider-input" id="blur" min="0" max="30" value="0" oninput="updateFilter()"><span class="slider-value" id="blurVal">0</span></div>
<div class="slider-row"><span class="slider-label">Grain</span><input type="range" class="slider-input" id="grain" min="0" max="100" value="0" oninput="updateFilter()"><span class="slider-value" id="grainVal">0</span></div>
<div class="slider-row"><span class="slider-label">Vignette</span><input type="range" class="slider-input" id="vignette" min="0" max="100" value="0" oninput="updateFilter()"><span class="slider-value" id="vignetteVal">0</span></div>
<div class="slider-row"><span class="slider-label">Fade</span><input type="range" class="slider-input" id="fade" min="0" max="100" value="0" oninput="updateFilter()"><span class="slider-value" id="fadeVal">0</span></div>
<div class="slider-row"><span class="slider-label">Sharpen</span><input type="range" class="slider-input" id="sharpen" min="0" max="100" value="0" oninput="updateFilter()"><span class="slider-value" id="sharpenVal">0</span></div>
<div class="slider-row"><span class="slider-label">Hue</span><input type="range" class="slider-input" id="hue" min="-180" max="180" value="0" oninput="updateFilter()"><span class="slider-value" id="hueVal">0</span></div>
</div>
<div class="sticker-panel" id="stickerPanel">
<div class="panel-header"><span class="panel-title">Stickers</span><button class="panel-close" onclick="toggleStickers()">&#10005;</button></div>
<div class="sticker-grid" id="stickerGrid"></div>
</div>
<div class="loading" id="loading"><div class="spinner"></div><span>Processing...</span></div>
<div class="toast" id="toast"></div>
</div>
<input type="file" id="fileInput" accept="image/*,video/*" onchange="handleFile(event)">
<script>
let currentImage=null,currentVideo=null,currentFilter='normal',isCameraActive=false,stream=null,animationId=null,zoomLevel=1,rotation=0,isFlipped=false,stickers=[];
const canvas=document.getElementById('mainCanvas');
const ctx=canvas.getContext('2d');
const faceCanvas=document.getElementById('faceCanvas');
const faceCtx=faceCanvas.getContext('2d');
const video=document.getElementById('videoElement');
const stickersList=['ὠ8','ὃ1','ὃ6','❤','ὅ1','ὗ6','ὠA','✨','ὒ5','ὈB','Ὂ6','ἱF','ἳ8','ἴ0','ὈE','Ἰ0','Ἰ9','Ἲ4','Ἳ5','Ἳ6','Ἲ7','὏7','὏9','☀','ἱ9','⭐','ἰA','ὒ5','Ὂ5','ὊB','ὊD','ὉA','Ὁ9','ὉC','὚4','ᾐD','Ὁ6','Ὁ5','ὉE','ὈC','Ὂ8','Ὂ4','Ὂ3','Ὂ6','Ὂ7','ἰ8','ἲA','ἲB','☁','⚡','Ὂ1','ὒ5','ᾜA','❄','ὈA','Ἰ0','Ἰ1','Ἰ8','Ἰ9','ἸA','ἸB','ἸC','ἸD','ἸE','ἸF'];
const filters=[
{id:'normal',name:'Original',icon:'✨'},{id:'clarendon',name:'Clarendon',icon:'ὈE'},{id:'gingham',name:'Gingham',icon:'ἳ8'},{id:'moon',name:'Moon',icon:'ἱ9'},{id:'lark',name:'Lark',icon:'ἳF'},{id:'reyes',name:'Reyes',icon:'Ἵ6'},{id:'juno',name:'Juno',icon:'☀'},{id:'slumber',name:'Slumber',icon:'ὣ4'},{id:'crema',name:'Crema',icon:'☕'},{id:'ludwig',name:'Ludwig',icon:'Ἲ8'},{id:'aden',name:'Aden',icon:'ἲB'},{id:'perpetua',name:'Perpetua',icon:'⛰'},{id:'amaro',name:'Amaro',icon:'ὉB'},{id:'mayfair',name:'Mayfair',icon:'ἳ9'},{id:'rise',name:'Rise',icon:'ἰ5'},{id:'hudson',name:'Hudson',icon:'❄'},{id:'valencia',name:'Valencia',icon:'ᾐD'},{id:'xpro2',name:'X-Pro II',icon:'ἺC'},{id:'sierra',name:'Sierra',icon:'⛰'},{id:'willow',name:'Willow',icon:'ᾚD'},{id:'lofi',name:'Lo-Fi',icon:'Ἳ8'},{id:'inkwell',name:'Inkwell',icon:'὚4'},{id:'nashville',name:'Nashville',icon:'Ἳ5'},{id:'stinson',name:'Stinson',icon:'ἰA'},{id:'vesper',name:'Vesper',icon:'ἰ3'},{id:'earlybird',name:'Earlybird',icon:'ὂ6'},{id:'brannan',name:'Brannan',icon:'὏7'},{id:'sutro',name:'Sutro',icon:'ἲB'},{id:'toaster',name:'Toaster',icon:'ἵE'},{id:'walden',name:'Walden',icon:'ἳ3'},{id:'1977',name:'1977',icon:'὏C'},{id:'kelvin',name:'Kelvin',icon:'ὒ5'},{id:'face_devil',name:'Devil',icon:'ὠ8'},{id:'face_cat',name:'Cat',icon:'ὃ1'},{id:'face_dog',name:'Dog',icon:'ὃ6'},{id:'face_heart',name:'Hearts',icon:'❤'},{id:'face_crown',name:'Crown',icon:'ὅ1'},{id:'face_glasses',name:'Glasses',icon:'ὗ6'},{id:'face_blush',name:'Blush',icon:'ὠA'},{id:'face_neon',name:'Neon',icon:'✨'},{id:'face_butterfly',name:'Butterfly',icon:'ᾘB'},{id:'face_flower',name:'Flower',icon:'ἳC'},{id:'face_star',name:'Star',icon:'⭐'},{id:'face_rainbow',name:'Rainbow',icon:'ἰ8'},{id:'glitch',name:'Glitch',icon:'὇E'},{id:'vhs',name:'VHS',icon:'὏9'},{id:'pixel',name:'Pixel',icon:'὇E'},{id:'duotone',name:'Duotone',icon:'ἺD'},{id:'cyber',name:'Cyber',icon:'ὉC'},{id:'retro',name:'Retro',icon:'὏A'},{id:'dream',name:'Dream',icon:'ὊB'},{id:'moody',name:'Moody',icon:'ἱ1'},{id:'golden',name:'Golden',icon:'✨'},{id:'pastel',name:'Pastel',icon:'ἶC'},{id:'noir',name:'Noir',icon:'Ἲ9'},{id:'sunset',name:'Sunset',icon:'ἰ7'},{id:'ocean',name:'Ocean',icon:'ἰA'},{id:'berry',name:'Berry',icon:'ᾭ0'},{id:'lime',name:'Lime',icon:'ἴB'},{id:'cherry',name:'Cherry',icon:'ἵ2'},{id:'toxic',name:'Toxic',icon:'☢'},{id:'frost',name:'Frost',icon:'❄'},{id:'inferno',name:'Inferno',icon:'ὒ5'},{id:'matrix',name:'Matrix',icon:'ὉA'},{id:'synthwave',name:'Synth',icon:'ἰ6'},{id:'anime',name:'Anime',icon:'ἳ8'},{id:'sketch',name:'Sketch',icon:'✏'},{id:'oil',name:'Oil',icon:'Ἲ8'},{id:'watercolor',name:'Water',icon:'Ὂ7'}
];
function initFilters(){const strip=document.getElementById('filterStrip');strip.innerHTML='';filters.forEach(function(f){const div=document.createElement('div');div.className='filter-item'+(f.id==='normal'?' active':'');div.innerHTML='<div class="filter-thumb">'+f.icon+'</div><span class="filter-name">'+f.name+'</span>';div.onclick=function(){selectFilter(f.id);};strip.appendChild(div);});}
function initStickers(){const grid=document.getElementById('stickerGrid');grid.innerHTML='';stickersList.forEach(function(s){const div=document.createElement('div');div.className='sticker-item';div.textContent=s;div.onclick=function(){addSticker(s);};grid.appendChild(div);});}
initFilters();initStickers();
function selectFilter(id){currentFilter=id;document.querySelectorAll('.filter-item').forEach(function(el,i){el.classList.toggle('active',filters[i].id===id);});if(currentImage)renderImage();}
function addSticker(s){stickers.push({emoji:s,x:canvas.width/2,y:canvas.height/2,size:80});if(currentImage)renderImage();showToast('Sticker added!');}
function handleFile(e){const file=e.target.files[0];if(!file)return;stopCamera();document.getElementById('uploadZone').classList.add('hidden');document.getElementById('zoomControls').classList.add('show');document.getElementById('camBtn').textContent='὏7';if(file.type.startsWith('video/')){const url=URL.createObjectURL(file);currentVideo=document.createElement('video');currentVideo.src=url;currentVideo.loop=true;currentVideo.muted=true;currentVideo.play();currentVideo.onloadeddata=function(){canvas.width=currentVideo.videoWidth;canvas.height=currentVideo.videoHeight;faceCanvas.width=canvas.width;faceCanvas.height=canvas.height;renderVideo();};currentImage=null;}else{const img=new Image();img.onload=function(){currentImage=img;currentVideo=null;canvas.width=img.width;canvas.height=img.height;faceCanvas.width=canvas.width;faceCanvas.height=canvas.height;renderImage();};img.src=URL.createObjectURL(file);}}
async function toggleCamera(){const btn=document.getElementById('camBtn');if(isCameraActive){stopCamera();btn.textContent='὏7';document.getElementById('zoomControls').classList.remove('show');return;}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;video.onloadedmetadata=function(){canvas.width=video.videoWidth;canvas.height=video.videoHeight;faceCanvas.width=canvas.width;faceCanvas.height=canvas.height;video.play();isCameraActive=true;document.getElementById('uploadZone').classList.add('hidden');document.getElementById('zoomControls').classList.add('show');btn.textContent='⏹';renderCamera();};}catch(err){showToast('Camera unavailable');}}
function stopCamera(){if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}isCameraActive=false;if(animationId)cancelAnimationFrame(animationId);}
function renderImage(){if(!currentImage)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(rotation*Math.PI/180);ctx.scale(isFlipped?-zoomLevel:zoomLevel,zoomLevel);ctx.translate(-canvas.width/2,-canvas.height/2);applyFilter(ctx,canvas.width,canvas.height,function(){ctx.drawImage(currentImage,0,0,canvas.width,canvas.height);});ctx.restore();applyFaceOverlay();drawStickers();}
function renderVideo(){if(!currentVideo||currentVideo.paused)return;ctx.clearRect(0,0,canvas.width,canvas.height);applyFilter(ctx,canvas.width,canvas.height,function(){ctx.drawImage(currentVideo,0,0,canvas.width,canvas.height);});applyFaceOverlay();drawStickers();animationId=requestAnimationFrame(renderVideo);}
function renderCamera(){if(!isCameraActive)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();ctx.translate(canvas.width,0);ctx.scale(-1,1);applyFilter(ctx,canvas.width,canvas.height,function(){ctx.drawImage(video,0,0,canvas.width,canvas.height);});ctx.restore();applyFaceOverlay();drawStickers();animationId=requestAnimationFrame(renderCamera);}
function zoomIn(){zoomLevel=Math.min(zoomLevel+.2,3);if(currentImage)renderImage();}
function zoomOut(){zoomLevel=Math.max(zoomLevel-.2,.5);if(currentImage)renderImage();}
function rotateImage(){rotation=(rotation+90)%360;if(currentImage)renderImage();}

function applyFaceOverlay(){faceCtx.clearRect(0,0,faceCanvas.width,faceCanvas.height);if(!currentFilter.startsWith('face_'))return;var w=faceCanvas.width;var h=faceCanvas.height;var cx=w/2;var cy=h/3;var size=Math.min(w,h)*.35;faceCtx.save();switch(currentFilter){case'face_devil':faceCtx.fillStyle='#ff4444';faceCtx.beginPath();faceCtx.moveTo(cx-size*.3,cy-size*.4);faceCtx.lineTo(cx-size*.5,cy-size*.9);faceCtx.lineTo(cx-size*.1,cy-size*.5);faceCtx.fill();faceCtx.beginPath();faceCtx.moveTo(cx+size*.3,cy-size*.4);faceCtx.lineTo(cx+size*.5,cy-size*.9);faceCtx.lineTo(cx+size*.1,cy-size*.5);faceCtx.fill();for(var i=0;i<5;i++){var hx=cx+Math.sin(Date.now()/1000+i)*size*.6;var hy=cy-size*.8-i*size*.15;faceCtx.fillStyle='rgba(255,50,80,'+(.6-i*.1)+')';faceCtx.font=(size*.15)+'px Arial';faceCtx.fillText('❤',hx-size*.05,hy);}break;case'face_cat':faceCtx.fillStyle='#ffb6c1';faceCtx.beginPath();faceCtx.moveTo(cx-size*.35,cy-size*.35);faceCtx.lineTo(cx-size*.5,cy-size*.8);faceCtx.lineTo(cx-size*.15,cy-size*.45);faceCtx.fill();faceCtx.beginPath();faceCtx.moveTo(cx+size*.35,cy-size*.35);faceCtx.lineTo(cx+size*.5,cy-size*.8);faceCtx.lineTo(cx+size*.15,cy-size*.45);faceCtx.fill();faceCtx.fillStyle='#ff69b4';faceCtx.beginPath();faceCtx.moveTo(cx-size*.35,cy-size*.4);faceCtx.lineTo(cx-size*.45,cy-size*.7);faceCtx.lineTo(cx-size*.2,cy-size*.45);faceCtx.fill();faceCtx.beginPath();faceCtx.moveTo(cx+size*.35,cy-size*.4);faceCtx.lineTo(cx+size*.45,cy-size*.7);faceCtx.lineTo(cx+size*.2,cy-size*.45);faceCtx.fill();faceCtx.strokeStyle='rgba(0,0,0,.3)';faceCtx.lineWidth=2;for(var side=-1;side<=1;side+=2){for(var j=0;j<3;j++){faceCtx.beginPath();faceCtx.moveTo(cx+side*size*.25,cy+j*size*.08);faceCtx.lineTo(cx+side*size*.6,cy+j*size*.08-size*.05);faceCtx.stroke();}}faceCtx.fillStyle='#ff69b4';faceCtx.beginPath();faceCtx.ellipse(cx,cy+size*.05,size*.06,size*.04,0,0,Math.PI*2);faceCtx.fill();break;case'face_dog':faceCtx.fillStyle='#8B4513';faceCtx.beginPath();faceCtx.ellipse(cx-size*.4,cy-size*.1,size*.15,size*.35,-.3,0,Math.PI*2);faceCtx.fill();faceCtx.beginPath();faceCtx.ellipse(cx+size*.4,cy-size*.1,size*.15,size*.35,.3,0,Math.PI*2);faceCtx.fill();faceCtx.fillStyle='#333';faceCtx.beginPath();faceCtx.ellipse(cx,cy+size*.05,size*.08,size*.06,0,0,Math.PI*2);faceCtx.fill();faceCtx.fillStyle='#ff6b6b';faceCtx.beginPath();faceCtx.ellipse(cx,cy+size*.2,size*.05,size*.1,0,0,Math.PI*2);faceCtx.fill();break;case'face_heart':faceCtx.fillStyle='rgba(255,50,100,.4)';for(var k=0;k<8;k++){var angle=(Date.now()/2000+k/8)*Math.PI*2;var r=size*(.5+Math.sin(Date.now()/1000+k)*.1);var hx=cx+Math.cos(angle)*r;var hy=cy+Math.sin(angle)*r*.6-size*.2;faceCtx.font=(size*.12)+'px Arial';faceCtx.fillText('Ὁ6',hx,hy);}faceCtx.fillStyle='rgba(255,150,180,.3)';faceCtx.beginPath();faceCtx.arc(cx-size*.35,cy+size*.1,size*.12,0,Math.PI*2);faceCtx.fill();faceCtx.beginPath();faceCtx.arc(cx+size*.35,cy+size*.1,size*.12,0,Math.PI*2);faceCtx.fill();break;case'face_crown':faceCtx.fillStyle='#FFD700';faceCtx.beginPath();faceCtx.moveTo(cx-size*.4,cy-size*.35);faceCtx.lineTo(cx-size*.3,cy-size*.7);faceCtx.lineTo(cx-size*.15,cy-size*.5);faceCtx.lineTo(cx,cy-size*.8);faceCtx.lineTo(cx+size*.15,cy-size*.5);faceCtx.lineTo(cx+size*.3,cy-size*.7);faceCtx.lineTo(cx+size*.4,cy-size*.35);faceCtx.closePath();faceCtx.fill();faceCtx.fillStyle='#ff4444';faceCtx.beginPath();faceCtx.arc(cx,cy-size*.65,size*.04,0,Math.PI*2);faceCtx.fill();faceCtx.fillStyle='#4444ff';faceCtx.beginPath();faceCtx.arc(cx-size*.22,cy-size*.6,size*.03,0,Math.PI*2);faceCtx.fill();faceCtx.beginPath();faceCtx.arc(cx+size*.22,cy-size*.6,size*.03,0,Math.PI*2);faceCtx.fill();break;case'face_glasses':faceCtx.fillStyle='rgba(0,0,0,.7)';faceCtx.beginPath();faceCtx.moveTo(cx-size*.35,cy-size*.1);faceCtx.lineTo(cx-size*.05,cy-size*.1);faceCtx.lineTo(cx-size*.05,cy+size*.05);faceCtx.lineTo(cx-size*.35,cy+size*.05);faceCtx.quadraticCurveTo(cx-size*.4,cy-size*.02,cx-size*.35,cy-size*.1);faceCtx.fill();faceCtx.beginPath();faceCtx.moveTo(cx+size*.05,cy-size*.1);faceCtx.lineTo(cx+size*.35,cy-size*.1);faceCtx.lineTo(cx+size*.35,cy+size*.05);faceCtx.lineTo(cx+size*.05,cy+size*.05);faceCtx.quadraticCurveTo(cx+size*0,cy-size*.02,cx+size*.05,cy-size*.1);faceCtx.fill();faceCtx.strokeStyle='rgba(0,0,0,.7)';faceCtx.lineWidth=3;faceCtx.beginPath();faceCtx.moveTo(cx-size*.05,cy-size*.05);faceCtx.lineTo(cx+size*.05,cy-size*.05);faceCtx.stroke();faceCtx.fillStyle='rgba(255,255,255,.2)';faceCtx.beginPath();faceCtx.moveTo(cx-size*.3,cy-size*.08);faceCtx.lineTo(cx-size*.15,cy-size*.08);faceCtx.lineTo(cx-size*.2,cy+size*.02);faceCtx.lineTo(cx-size*.32,cy+size*.02);faceCtx.fill();break;case'face_blush':faceCtx.fillStyle='rgba(255,150,180,.4)';faceCtx.beginPath();faceCtx.arc(cx-size*.3,cy+size*.15,size*.15,0,Math.PI*2);faceCtx.fill();faceCtx.beginPath();faceCtx.arc(cx+size*.3,cy+size*.15,size*.15,0,Math.PI*2);faceCtx.fill();faceCtx.fillStyle='#fff';for(var m=0;m<6;m++){var sx=cx+(Math.random()-.5)*size;var sy=cy+(Math.random()-.5)*size*.5;faceCtx.font=(size*.08)+'px Arial';faceCtx.fillText('✨',sx,sy);}break;case'face_neon':faceCtx.strokeStyle='#ff00ff';faceCtx.lineWidth=3;faceCtx.shadowColor='#ff00ff';faceCtx.shadowBlur=20;faceCtx.beginPath();faceCtx.arc(cx,cy,size*.55,0,Math.PI*2);faceCtx.stroke();faceCtx.strokeStyle='#00ffff';faceCtx.shadowColor='#00ffff';faceCtx.beginPath();faceCtx.arc(cx,cy,size*.5,0,Math.PI*2);faceCtx.stroke();faceCtx.shadowBlur=0;faceCtx.fillStyle='#ffff00';faceCtx.shadowColor='#ffff00';faceCtx.shadowBlur=15;for(var n=0;n<4;n++){var angle=(Date.now()/3000+n/4)*Math.PI*2;var sx2=cx+Math.cos(angle)*size*.7;var sy2=cy+Math.sin(angle)*size*.5;faceCtx.font=(size*.1)+'px Arial';faceCtx.fillText('⭐',sx2,sy2);}faceCtx.shadowBlur=0;break;case'face_butterfly':faceCtx.fillStyle='rgba(255,150,200,.6)';faceCtx.beginPath();faceCtx.ellipse(cx-size*.25,cy-size*.2,size*.2,size*.15,-.5,0,Math.PI*2);faceCtx.fill();faceCtx.beginPath();faceCtx.ellipse(cx+size*.25,cy-size*.2,size*.2,size*.15,.5,0,Math.PI*2);faceCtx.fill();faceCtx.fillStyle='rgba(200,150,255,.6)';faceCtx.beginPath();faceCtx.ellipse(cx-size*.2,cy+size*.05,size*.15,size*.2,-.3,0,Math.PI*2);faceCtx.fill();faceCtx.beginPath();faceCtx.ellipse(cx+size*.2,cy+size*.05,size*.15,size*.2,.3,0,Math.PI*2);faceCtx.fill();faceCtx.fillStyle='#333';faceCtx.beginPath();faceCtx.ellipse(cx,cy-size*.1,size*.03,size*.15,0,0,Math.PI*2);faceCtx.fill();break;case'face_flower':faceCtx.fillStyle='rgba(255,200,100,.7)';for(var fi=0;fi<8;fi++){var fa=(fi/8)*Math.PI*2;var fx=cx+Math.cos(fa)*size*.25;var fy=cy-size*.3+Math.sin(fa)*size*.25;faceCtx.beginPath();faceCtx.arc(fx,fy,size*.08,0,Math.PI*2);faceCtx.fill();}faceCtx.fillStyle='#FFD700';faceCtx.beginPath();faceCtx.arc(cx,cy-size*.3,size*.06,0,Math.PI*2);faceCtx.fill();break;case'face_star':faceCtx.fillStyle='rgba(255,220,0,.7)';for(var si=0;si<5;si++){var sa=(si/5)*Math.PI*2-Math.PI/2;var sx=cx+Math.cos(sa)*size*.4;var sy=cy-size*.2+Math.sin(sa)*size*.3;faceCtx.font=(size*.15)+'px Arial';faceCtx.fillText('⭐',sx,sy);}faceCtx.fillStyle='rgba(255,200,0,.3)';faceCtx.beginPath();faceCtx.arc(cx,cy-size*.2,size*.25,0,Math.PI*2);faceCtx.fill();break;case'face_rainbow':for(var ri=0;ri<7;ri++){var colors=['#ff0000','#ff7f00','#ffff00','#00ff00','#0000ff','#4b0082','#9400d3'];faceCtx.strokeStyle=colors[ri];faceCtx.lineWidth=4;faceCtx.beginPath();var ry=cy-size*.5+ri*size*.06;faceCtx.arc(cx,ry,size*.4+ri*5,Math.PI,0);faceCtx.stroke();}break;}faceCtx.restore();}
function updateFilter(){document.getElementById('brightnessVal').textContent=document.getElementById('brightness').value;document.getElementById('contrastVal').textContent=document.getElementById('contrast').value;document.getElementById('saturateVal').textContent=document.getElementById('saturate').value;document.getElementById('warmthVal').textContent=document.getElementById('warmth').value;document.getElementById('tintVal').textContent=document.getElementById('tint').value;document.getElementById('exposureVal').textContent=document.getElementById('exposure').value;document.getElementById('highlightsVal').textContent=document.getElementById('highlights').value;document.getElementById('shadowsVal').textContent=document.getElementById('shadows').value;document.getElementById('blurVal').textContent=document.getElementById('blur').value;document.getElementById('grainVal').textContent=document.getElementById('grain').value;document.getElementById('vignetteVal').textContent=document.getElementById('vignette').value;document.getElementById('fadeVal').textContent=document.getElementById('fade').value;document.getElementById('sharpenVal').textContent=document.getElementById('sharpen').value;document.getElementById('hueVal').textContent=document.getElementById('hue').value;if(currentImage)renderImage();}
function toggleSliders(){document.getElementById('slidersPanel').classList.toggle('open');document.getElementById('stickerPanel').classList.remove('open');}
function toggleStickers(){document.getElementById('stickerPanel').classList.toggle('open');document.getElementById('slidersPanel').classList.remove('open');}
function resetAll(){document.getElementById('brightness').value=0;document.getElementById('contrast').value=0;document.getElementById('saturate').value=0;document.getElementById('warmth').value=0;document.getElementById('tint').value=0;document.getElementById('exposure').value=0;document.getElementById('highlights').value=0;document.getElementById('shadows').value=0;document.getElementById('blur').value=0;document.getElementById('grain').value=0;document.getElementById('vignette').value=0;document.getElementById('fade').value=0;document.getElementById('sharpen').value=0;document.getElementById('hue').value=0;zoomLevel=1;rotation=0;isFlipped=false;stickers=[];selectFilter('normal');updateFilter();}
function saveImage(){if(!currentImage&&!isCameraActive){showToast('Load photo first');return;}var link=document.createElement('a');link.download='filtercam_'+Date.now()+'.png';var tempCanvas=document.createElement('canvas');tempCanvas.width=canvas.width;tempCanvas.height=canvas.height;var tctx=tempCanvas.getContext('2d');tctx.drawImage(canvas,0,0);tctx.drawImage(faceCanvas,0,0);link.href=tempCanvas.toDataURL('image/png');link.click();showToast('Saved!');}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}
