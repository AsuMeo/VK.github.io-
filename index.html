<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Онлайн Кинотеатр - Mobile RTDB</title>
  
  <!-- CDN Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <!-- CDN Firebase Compat (v9.23.0) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    #webgl-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Auth Screen Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 15, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      text-align: center;
    }

    .auth-card h2 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #00e5ff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .auth-card p {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 20px;
    }

    .tab-buttons {
      display: flex;
      margin-bottom: 16px;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: #888;
      font-weight: bold;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #00e5ff;
      color: #000;
    }

    .form-group {
      margin-bottom: 12px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      color: #ccc;
      margin-bottom: 4px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .form-input:focus {
      border-color: #00e5ff;
    }

    .btn-action {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #00e5ff, #0077ff);
      color: #fff;
      font-weight: bold;
      font-size: 15px;
      margin-top: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    .error-msg {
      color: #ff4d4d;
      font-size: 12px;
      margin-top: 10px;
      min-height: 16px;
    }

    /* HUD and Controls overlay for Android */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: none;
    }

    .top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
    }

    .badge {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      color: #00e5ff;
    }

    .btn-icon {
      background: rgba(0, 229, 255, 0.2);
      border: 1px solid #00e5ff;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Touch Controls */
    #joystick-zone {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 130px;
      height: 130px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      pointer-events: auto;
    }

    #joystick-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50px;
      height: 50px;
      margin-top: -25px;
      margin-left: -25px;
      background: rgba(0, 229, 255, 0.6);
      border-radius: 50%;
      box-shadow: 0 0 15px #00e5ff;
      pointer-events: none;
    }

    #touch-look-zone {
      position: absolute;
      top: 60px;
      right: 0;
      bottom: 0;
      width: 55%;
      pointer-events: auto;
    }

    #btn-jump {
      position: absolute;
      bottom: 40px;
      right: 35px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(0, 229, 255, 0.6);
      color: #fff;
      font-weight: bold;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      box-shadow: 0 0 10px rgba(0,229,255,0.3);
    }

    #btn-jump:active {
      background: rgba(0, 229, 255, 0.5);
    }

    #btn-screen-interact {
      position: absolute;
      bottom: 125px;
      right: 35px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(255, 0, 100, 0.2);
      border: 2px solid #ff0066;
      color: #fff;
      font-weight: bold;
      font-size: 11px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    /* Video Selector Modal */
    #video-modal {
      display: none;
    }

    .video-option {
      margin-bottom: 15px;
      text-align: left;
    }

    .video-option h4 {
      font-size: 13px;
      margin-bottom: 5px;
      color: #00e5ff;
    }

    /* Player Nametags */
    .nametag {
      position: absolute;
      color: white;
      font-size: 11px;
      font-weight: bold;
      background: rgba(0,0,0,0.6);
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.3);
      pointer-events: none;
      transform: translate(-50%, -100%);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- 3D Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Nametags Container -->
  <div id="nametags-container" style="position:fixed; inset:0; pointer-events:none; z-index:5;"></div>

  <!-- AUTH MODAL -->
  <div class="modal-overlay" id="auth-modal">
    <div class="auth-card">
      <h2>3D Cinema RTDB</h2>
      <p>Вход и Регистрация только по почте</p>

      <div class="tab-buttons">
        <button class="tab-btn active" id="tab-login-btn" onclick="switchTab('login')">Вход</button>
        <button class="tab-btn" id="tab-register-btn" onclick="switchTab('register')">Регистрация</button>
      </div>

      <div class="form-group" id="group-username" style="display:none;">
        <label>Никнейм игрока</label>
        <input type="text" id="auth-username" class="form-input" placeholder="Например: Viewer3D">
      </div>

      <div class="form-group">
        <label>Электронная почта (Email)</label>
        <input type="email" id="auth-email" class="form-input" placeholder="user@domain.com">
      </div>

      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="auth-password" class="form-input" placeholder="••••••••">
      </div>

      <button class="btn-action" id="auth-submit-btn" onclick="handleAuthSubmit()">Войти в кинотеатр</button>
      <div class="error-msg" id="auth-error"></div>
    </div>
  </div>

  <!-- VIDEO MODAL -->
  <div class="modal-overlay" id="video-modal">
    <div class="auth-card">
      <h2>Экран Кинотеатра</h2>
      <p>Выберите видео для синхронного показа всем игрокам</p>

      <div class="video-option">
        <h4>1. Из галереи (Загрузка в Base64)</h4>
        <input type="file" id="local-video-input" class="form-input" accept="video/mp4,video/webm">
      </div>

      <div style="margin: 10px 0; font-size: 12px; color: #777;">— ИЛИ —</div>

      <div class="video-option">
        <h4>2. Прямая ссылка на видео (MP4 / WebM)</h4>
        <input type="text" id="direct-url-input" class="form-input" placeholder="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4">
      </div>

      <button class="btn-action" onclick="applyVideoChoice()">Транслировать на Экран</button>
      <button class="btn-action" style="background:#444; margin-top:8px;" onclick="closeVideoModal()">Отмена</button>
    </div>
  </div>

  <!-- HUD ANDROID CONTROLS -->
  <div id="hud">
    <div class="top-bar">
      <div class="badge" id="online-count">Игроков: 1</div>
      <button class="btn-icon" onclick="openVideoModal()">🎬 Выбрать Видео</button>
    </div>

    <!-- Left Joystick -->
    <div id="joystick-zone">
      <div id="joystick-knob"></div>
    </div>

    <!-- Touch Look Zone -->
    <div id="touch-look-zone"></div>

    <!-- Action Buttons -->
    <div id="btn-jump">ПРЫЖОК</div>
    <div id="btn-screen-interact" onclick="openVideoModal()">ВЫБОР ВИДЕО</div>
  </div>

  <script>
    // ----------------------------------------------------------------
    // 1. FIREBASE CONFIG & INITIALIZATION (RTDB ONLY)
    // ----------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyBm0mIvHVznIeF2PoFk6dtdaiT5r877wyA",
      authDomain: "meow-874ce.firebaseapp.com",
      databaseURL: "https://meow-874ce-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "meow-874ce",
      storageBucket: "meow-874ce.firebasestorage.app",
      messagingSenderId: "471541334599",
      appId: "1:471541334599:web:567af3e7dbe70a37572762"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let authMode = 'login'; // 'login' or 'register'

    function switchTab(mode) {
      authMode = mode;
      document.getElementById('tab-login-btn').classList.toggle('active', mode === 'login');
      document.getElementById('tab-register-btn').classList.toggle('active', mode === 'register');
      document.getElementById('group-username').style.display = (mode === 'register') ? 'block' : 'none';
      document.getElementById('auth-submit-btn').innerText = (mode === 'login') ? 'Войти в кинотеатр' : 'Зарегистрироваться';
      document.getElementById('auth-error').innerText = '';
    }

    async function handleAuthSubmit() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      const username = document.getElementById('auth-username').value.trim() || 'Зритель';
      const errorDiv = document.getElementById('auth-error');
      errorDiv.innerText = '';

      if (!email || !password) {
        errorDiv.innerText = 'Заполните email и пароль';
        return;
      }

      try {
        if (authMode === 'register') {
          const userCred = await auth.createUserWithEmailAndPassword(email, password);
          await userCred.user.updateProfile({ displayName: username });
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (err) {
        errorDiv.innerText = err.message;
      }
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        document.getElementById('auth-modal').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        initMultiplayerPresence();
        initCinemaVideoSync();
      } else {
        document.getElementById('auth-modal').style.display = 'flex';
        document.getElementById('hud').style.display = 'none';
      }
    });

    // ----------------------------------------------------------------
    // 2. THREE.JS 3D CINEMA ENVIRONMENT SETUP
    // ----------------------------------------------------------------
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050508);
    scene.fog = new THREE.FogExp2(0x050508, 0.03);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    const screenLight = new THREE.PointLight(0x00e5ff, 1.2, 30);
    screenLight.position.set(0, 7, -14);
    scene.add(screenLight);

    // Cinema Room Geometry
    const roomWidth = 24, roomHeight = 12, roomDepth = 34;

    // Floor
    const floorGeo = new THREE.PlaneGeometry(roomWidth, roomDepth);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Walls
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x0a0a10, roughness: 0.9 });
    
    // Back Wall (where screen is placed)
    const backWallGeo = new THREE.PlaneGeometry(roomWidth, roomHeight);
    const backWall = new THREE.Mesh(backWallGeo, wallMat);
    backWall.position.set(0, roomHeight / 2, -roomDepth / 2);
    scene.add(backWall);

    // Side Walls
    const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, roomHeight), wallMat);
    leftWall.rotation.y = Math.PI / 2;
    leftWall.position.set(-roomWidth / 2, roomHeight / 2, 0);
    scene.add(leftWall);

    const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, roomHeight), wallMat);
    rightWall.rotation.y = -Math.PI / 2;
    rightWall.position.set(roomWidth / 2, roomHeight / 2, 0);
    scene.add(rightWall);

    // Cinema Seats Setup
    const seatGeo = new THREE.BoxGeometry(1.2, 1.0, 1.0);
    const seatMat = new THREE.MeshStandardMaterial({ color: 0x880015, roughness: 0.6 });
    for (let r = -2; r <= 5; r++) {
      for (let c = -4; c <= 4; c++) {
        const seat = new THREE.Mesh(seatGeo, seatMat);
        seat.position.set(c * 2.2, 0.5 + (r + 2) * 0.3, r * 2.5 + 4);
        scene.add(seat);
      }
    }

    // CINEMA SCREEN & VIDEO TEXTURE
    const videoElement = document.createElement('video');
    videoElement.crossOrigin = 'anonymous';
    videoElement.playsInline = true;
    videoElement.muted = false;
    videoElement.loop = true;

    // Default sample video
    videoElement.src = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";

    const videoTexture = new THREE.VideoTexture(videoElement);
    videoTexture.minFilter = THREE.LinearFilter;
    videoTexture.magFilter = THREE.LinearFilter;
    videoTexture.format = THREE.RGBFormat;

    const screenWidth = 18, screenHeight = 9.5;
    const screenGeo = new THREE.PlaneGeometry(screenWidth, screenHeight);
    const screenMat = new THREE.MeshBasicMaterial({ map: videoTexture });
    const cinemaScreen = new THREE.Mesh(screenGeo, screenMat);
    cinemaScreen.position.set(0, 6.5, -roomDepth / 2 + 0.1);
    scene.add(cinemaScreen);

    // Border around screen
    const borderGeo = new THREE.BoxGeometry(screenWidth + 0.4, screenHeight + 0.4, 0.1);
    const borderMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
    const screenBorder = new THREE.Mesh(borderGeo, borderMat);
    screenBorder.position.set(0, 6.5, -roomDepth / 2 + 0.05);
    scene.add(screenBorder);

    // ----------------------------------------------------------------
    // 3. PLAYER CONTROLLER & TOUCH JOYSTICK FOR ANDROID MOBILE
    // ----------------------------------------------------------------
    const player = {
      pos: new THREE.Vector3(0, 1.6, 10),
      velY: 0,
      yaw: 0,
      pitch: 0,
      isGrounded: true,
      color: '#' + Math.floor(Math.random()*16777215).toString(16)
    };

    camera.position.copy(player.pos);

    // Joystick Touch Handler
    let joyTouchId = null;
    let joyCenter = { x: 0, y: 0 };
    let joyVector = { x: 0, y: 0 };

    const joyZone = document.getElementById('joystick-zone');
    const joyKnob = document.getElementById('joystick-knob');

    joyZone.addEventListener('touchstart', e => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      joyTouchId = touch.identifier;
      const rect = joyZone.getBoundingClientRect();
      joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      updateJoystick(touch);
    });

    joyZone.addEventListener('touchmove', e => {
      e.preventDefault();
      for (let touch of e.changedTouches) {
        if (touch.identifier === joyTouchId) {
          updateJoystick(touch);
          break;
        }
      }
    });

    const resetJoystick = () => {
      joyTouchId = null;
      joyVector = { x: 0, y: 0 };
      joyKnob.style.transform = `translate(0px, 0px)`;
    };

    joyZone.addEventListener('touchend', resetJoystick);
    joyZone.addEventListener('touchcancel', resetJoystick);

    function updateJoystick(touch) {
      const dx = touch.clientX - joyCenter.x;
      const dy = touch.clientY - joyCenter.y;
      const dist = Math.hypot(dx, dy);
      const maxR = 40;
      const angle = Math.atan2(dy, dx);
      const clampedDist = Math.min(dist, maxR);

      joyVector.x = (clampedDist / maxR) * Math.cos(angle);
      joyVector.y = (clampedDist / maxR) * Math.sin(angle);

      const knobX = clampedDist * Math.cos(angle);
      const knobY = clampedDist * Math.sin(angle);
      joyKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;
    }

    // Touch Look (Camera Rotation) Handler
    let lookTouchId = null;
    let lastLookPos = { x: 0, y: 0 };

    const lookZone = document.getElementById('touch-look-zone');

    lookZone.addEventListener('touchstart', e => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      lookTouchId = touch.identifier;
      lastLookPos = { x: touch.clientX, y: touch.clientY };
    });

    lookZone.addEventListener('touchmove', e => {
      e.preventDefault();
      for (let touch of e.changedTouches) {
        if (touch.identifier === lookTouchId) {
          const dx = touch.clientX - lastLookPos.x;
          const dy = touch.clientY - lastLookPos.y;
          lastLookPos = { x: touch.clientX, y: touch.clientY };

          player.yaw -= dx * 0.005;
          player.pitch -= dy * 0.005;
          player.pitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, player.pitch));
          break;
        }
      }
    });

    const resetLook = () => { lookTouchId = null; };
    lookZone.addEventListener('touchend', resetLook);
    lookZone.addEventListener('touchcancel', resetLook);

    // Jump Control
    const btnJump = document.getElementById('btn-jump');
    btnJump.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (player.isGrounded) {
        player.velY = 0.18;
        player.isGrounded = false;
      }
    });

    // Player Movement Update loop
    const speed = 0.15;
    const gravity = 0.008;

    function updatePlayerPhysics() {
      // Rotate camera
      camera.rotation.set(0, 0, 0);
      camera.rotation.y = player.yaw;
      camera.rotation.x = player.pitch;

      // Calculate direction from joystick
      if (Math.hypot(joyVector.x, joyVector.y) > 0.05) {
        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);
        const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);

        player.pos.addScaledVector(forward, -joyVector.y * speed);
        player.pos.addScaledVector(right, joyVector.x * speed);
      }

      // Vertical movement / Gravity
      player.pos.y += player.velY;
      if (!player.isGrounded) {
        player.velY -= gravity;
      }

      // Floor boundary check
      if (player.pos.y <= 1.6) {
        player.pos.y = 1.6;
        player.velY = 0;
        player.isGrounded = true;
      }

      // Room boundaries
      player.pos.x = Math.max(-roomWidth/2 + 1, Math.min(roomWidth/2 - 1, player.pos.x));
      player.pos.z = Math.max(-roomDepth/2 + 1, Math.min(roomDepth/2 - 1, player.pos.z));

      camera.position.copy(player.pos);
    }

    // ----------------------------------------------------------------
    // 4. REALTIME MULTIPLAYER SYSTEM (FIREBASE RTDB ONLY)
    // ----------------------------------------------------------------
    const otherPlayers = {};
    const nametagsContainer = document.getElementById('nametags-container');

    function createPlayerAvatar(uid, data) {
      const group = new THREE.Group();

      // Body Capsule/Box
      const bodyGeo = new THREE.CylinderGeometry(0.3, 0.3, 1.2, 12);
      const bodyMat = new THREE.MeshStandardMaterial({ color: data.color || 0x00e5ff });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.6;
      group.add(body);

      // Head
      const headGeo = new THREE.SphereGeometry(0.25, 12, 12);
      const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 1.4;
      group.add(head);

      scene.add(group);

      // DOM Nametag UI
      const tag = document.createElement('div');
      tag.className = 'nametag';
      tag.innerText = data.username || 'Зритель';
      nametagsContainer.appendChild(tag);

      return { mesh: group, nametag: tag };
    }

    function initMultiplayerPresence() {
      if (!currentUser) return;

      const userRef = db.ref(`users/${currentUser.uid}`);

      // Setup Disconnect Cleanup
      userRef.onDisconnect().remove();

      // Broadcast position loop (20 FPS)
      setInterval(() => {
        if (!currentUser) return;
        userRef.set({
          username: currentUser.displayName || 'Зритель',
          x: player.pos.x,
          y: player.pos.y,
          z: player.pos.z,
          yaw: player.yaw,
          color: player.color,
          lastSeen: firebase.database.ServerValue.TIMESTAMP
        });
      }, 50);

      // Listen for all users
      db.ref('users').on('value', snapshot => {
        const users = snapshot.val() || {};
        const count = Object.keys(users).length;
        document.getElementById('online-count').innerText = `Игроков: ${count}`;

        // Update or Add players
        for (let uid in users) {
          if (uid === currentUser.uid) continue;
          const uData = users[uid];

          if (!otherPlayers[uid]) {
            otherPlayers[uid] = createPlayerAvatar(uid, uData);
          }

          // Smooth position interpolation
          const avatar = otherPlayers[uid];
          avatar.mesh.position.set(uData.x, uData.y - 1.6, uData.z);
          avatar.mesh.rotation.y = uData.yaw || 0;
        }

        // Remove disconnected players
        for (let uid in otherPlayers) {
          if (!users[uid]) {
            scene.remove(otherPlayers[uid].mesh);
            nametagsContainer.removeChild(otherPlayers[uid].nametag);
            delete otherPlayers[uid];
          }
        }
      });
    }

    function updateNametags() {
      const tempV = new THREE.Vector3();
      for (let uid in otherPlayers) {
        const avatar = otherPlayers[uid];
        tempV.setFromMatrixPosition(avatar.mesh.matrixWorld);
        tempV.y += 1.8; // place tag above head

        tempV.project(camera);

        const x = (tempV.x * .5 + .5) * window.innerWidth;
        const y = (-(tempV.y * .5) + .5) * window.innerHeight;

        if (tempV.z < 1) {
          avatar.nametag.style.display = 'block';
          avatar.nametag.style.left = `${x}px`;
          avatar.nametag.style.top = `${y}px`;
        } else {
          avatar.nametag.style.display = 'none';
        }
      }
    }

    // ----------------------------------------------------------------
    // 5. REALTIME VIDEO SYNC (BASE64 & DIRECT URL) VIA RTDB
    // ----------------------------------------------------------------
    function openVideoModal() {
      document.getElementById('video-modal').style.display = 'flex';
    }

    function closeVideoModal() {
      document.getElementById('video-modal').style.display = 'none';
    }

    async function applyVideoChoice() {
      const fileInput = document.getElementById('local-video-input');
      const urlInput = document.getElementById('direct-url-input').value.trim();
      const videoRef = db.ref('cinema/video');

      if (fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
          const base64Video = e.target.result; // Base64 Data URL
          videoRef.set({
            src: base64Video,
            timestamp: Date.now(),
            updatedBy: currentUser.displayName || 'Пользователь'
          });
          closeVideoModal();
        };

        reader.readAsDataURL(file);
      } else if (urlInput !== '') {
        videoRef.set({
          src: urlInput,
          timestamp: Date.now(),
          updatedBy: currentUser.displayName || 'Пользователь'
        });
        closeVideoModal();
      }
    }

    function initCinemaVideoSync() {
      const videoRef = db.ref('cinema/video');
      videoRef.on('value', snapshot => {
        const data = snapshot.val();
        if (data && data.src) {
          if (videoElement.src !== data.src) {
            videoElement.src = data.src;
            videoElement.play().catch(e => console.log('Autoplay handled:', e));
          }
        }
      });
    }

    // ----------------------------------------------------------------
    // 6. MAIN RENDER LOOP & WINDOW RESIZE
    // ----------------------------------------------------------------
    function animate() {
      requestAnimationFrame(animate);

      updatePlayerPhysics();
      updateNametags();

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
