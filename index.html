  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Cryptographical Prefixes
    const PREFIX_KEY_EXCHANGE = "🔑[VKTG_KEY_V3]:";
    const PREFIX_E2EE_TEXT = "🔒[VKTG_E2EE_V3]:";
    const PREFIX_E2EE_FILE = "🔒[VKTG_FILE_E2EE_V3]:";

    // ================= INDEXEDDB SECURITY STORAGE =================
    const dbName = "vktg_secure_vault_v3";
    const storeName = "crypto_keys_v3";

    function openSecureDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(dbName, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(storeName)) {
            db.createObjectStore(storeName);
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function saveSecureKey(key, value) {
      const db = await openSecureDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readwrite");
        const store = tx.objectStore(storeName);
        const req = store.put(value, key);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function getSecureKey(key) {
      const db = await openSecureDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readonly");
        const store = tx.objectStore(storeName);
        const req = store.get(key);
        req.onsuccess = () => resolve(req.target ? req.target.result : req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function deleteSecureKey(key) {
      const db = await openSecureDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readwrite");
        const store = tx.objectStore(storeName);
        const req = store.delete(key);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    // ================= HIGH-PERFORMANCE CRYPTO UTILS =================

    // Fix 5: Async SHA-256 for Safety Numbers
    async function calcSafetyNumber(myPubKeyJWKB64, peerPubKeyJWKB64) {
      try {
        const myKeyStr = atob(myPubKeyJWKB64);
        const peerKeyStr = atob(peerPubKeyJWKB64);
        const sorted = [myKeyStr, peerKeyStr].sort();
        const combined = sorted[0] + sorted[1];
        
        const encoder = new TextEncoder();
        const data = encoder.encode(combined);
        const hashBuffer = await window.crypto.subtle.digest("SHA-256", data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        
        let digits = '';
        for (let i = 0; i < hashArray.length - 1; i += 2) {
          const val = (hashArray[i] << 8) | hashArray[i + 1];
          digits += val.toString().padStart(5, '0');
        }
        digits = digits.slice(0, 60);
        const groups = digits.match(/.{1,5}/g);
        return groups ? groups.join(' ') : digits;
      } catch (e) {
        console.error("Safety number calculation failed: ", e);
        return "ERROR GENERATING FINGERPRINT";
      }
    }

    // ================= MAIN CORE APP COMPONENT =================
    function App() {
      const [token, setToken] = useState(localStorage.getItem('vk_token') || '');
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [myProfile, setMyProfile] = useState(null);
      const [tokenInput, setTokenInput] = useState('');
      const [authError, setAuthError] = useState('');

      // Master password & Lock (Fix 8: 600,000 PBKDF2 iterations)
      const [masterPassword, setMasterPassword] = useState('');
      const [isVaultLocked, setIsVaultLocked] = useState(true);
      const [passwordInput, setPasswordInput] = useState('');
      const [vaultError, setVaultError] = useState('');

      // Dynamic navigation & UI States
      const [activeScreen, setActiveScreen] = useState('chats'); // 'chats' | 'chat_room'
      const [activeTab, setActiveTab] = useState('all'); // 'all' | 'secret'
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [newChatModal, setNewChatModal] = useState(false);
      const [safetyNumberModal, setSafetyNumberModal] = useState(false);
      const [safetyNumber, setSafetyNumber] = useState('');
      const [attachmentSheet, setAttachmentSheet] = useState(false);

      // MITM / TOFU Warnings
      const [tofuViolation, setTofuViolation] = useState(false);

      // Core secure storage state
      const [conversations, setConversations] = useState([]);
      const [messages, setMessages] = useState([]);
      const [activePartner, setActivePartner] = useState(null);
      const [peerKeys, setPeerKeys] = useState({});
      const [localContacts, setLocalContacts] = useState(JSON.parse(localStorage.getItem('vktg_contacts') || '{}'));

      const [targetUserId, setTargetUserId] = useState('');
      const [customName, setCustomName] = useState('');
      const [customAvatar, setCustomAvatar] = useState('');

      const [identityKeyPair, setIdentityKeyPair] = useState(null);
      const [myPublicJWK, setMyPublicJWK] = useState('');

      const [messageInput, setMessageInput] = useState('');
      const [attachedFile, setAttachedFile] = useState(null);

      const messagesEndRef = useRef(null);

      // Verify Token on Load
      useEffect(() => {
        if (token) {
          checkVKSession(token);
        }
      }, [token]);

      // Polling for E2EE context
      useEffect(() => {
        if (!isLoggedIn || isVaultLocked) return;

        refreshConversations();
        const interval = setInterval(() => {
          refreshConversations();
          if (activePartner) {
            refreshMessages(activePartner.id);
          }
        }, 3500);

        return () => clearInterval(interval);
      }, [isLoggedIn, isVaultLocked, activePartner]);

      // Auto scroll inside chat
      useEffect(() => {
        if (messagesEndRef.current) {
          messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [messages]);

      // Safety number modal effect
      useEffect(() => {
        if (safetyNumberModal && activePartner && peerKeys[activePartner.id]) {
          calcSafetyNumber(myPublicJWK, peerKeys[activePartner.id]).then(setSafetyNumber);
        } else {
          setSafetyNumber("Ключи не обменены");
        }
      }, [safetyNumberModal, activePartner, myPublicJWK, peerKeys]);

      // TOFU (Trust On First Use) Check
      const checkTOFU = async (partnerId, receivedPubKeyB64) => {
        const storedTrustedKey = await getSecureKey(`trusted_key_${partnerId}`);
        if (!storedTrustedKey) {
          await saveSecureKey(`trusted_key_${partnerId}`, receivedPubKeyB64);
          setTofuViolation(false);
          return true;
        }
        if (storedTrustedKey !== receivedPubKeyB64) {
          setTofuViolation(true);
          return false;
        }
        setTofuViolation(false);
        return true;
      };

      const handleOverrideTOFU = async () => {
        if (!activePartner) return;
        const currentPubKey = peerKeys[activePartner.id];
        if (currentPubKey) {
          await saveSecureKey(`trusted_key_${activePartner.id}`, currentPubKey);
          setTofuViolation(false);
          alert("Новый ключ успешно авторизован! Канал снова в безопасности.");
        }
      };

      // JSONP VK API Requester
      const vkRequest = (method, params = {}) => {
        return new Promise((resolve, reject) => {
          const callbackName = 'vk_callback_' + Math.round(1000000 * Math.random());
          params.access_token = token || localStorage.getItem('vk_token');
          params.v = '5.131';
          params.callback = callbackName;

          const queryString = Object.keys(params)
            .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(params[key]))
            .join('&');

          const script = document.createElement('script');
          script.src = `https://api.vk.com/method/${method}?${queryString}`;

          window[callbackName] = function(data) {
            delete window[callbackName];
            document.body.removeChild(script);
            if (data.error) {
              reject(data.error);
            } else {
              resolve(data.response);
            }
          };

          script.onerror = function() {
            delete window[callbackName];
            document.body.removeChild(script);
            reject({ error_msg: 'Сетевая ошибка API VK.' });
          };

          document.body.appendChild(script);
        });
      };

      // ================= CRYPTOGRAPHIC FIXED ENGINE =================

      // Fix 8: Raised iterations count to 600000 to defend against GPU brute force (OWASP compliance)
      async function deriveMasterKey(password, salt) {
        const encoder = new TextEncoder();
        const baseKey = await window.crypto.subtle.importKey(
          "raw",
          encoder.encode(password),
          { name: "PBKDF2" },
          false,
          ["deriveKey"]
        );
        return await window.crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: salt,
            iterations: 600000,
            hash: "SHA-256"
          },
          baseKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"]
        );
      }

      async function handleUnlockVault() {
        if (!passwordInput.trim()) {
          setVaultError("Пароль не может быть пустым!");
          return;
        }

        try {
          const storedSalt = await getSecureKey("vault_salt");
          const storedEncryptedPriv = await getSecureKey("encrypted_private_key");
          const storedPub = await getSecureKey("public_key_jwk");

          // Sync trusted peer keys from IndexedDB cache
          const db = await openSecureDB();
          const tx = db.transaction(storeName, "readonly");
          const store = tx.objectStore(storeName);
          const cachedKeys = {};
          
          store.openCursor().onsuccess = (event) => {
            const cursor = event.target.result;
            if (cursor) {
              if (cursor.key.startsWith("trusted_key_")) {
                const pId = cursor.key.replace("trusted_key_", "");
                cachedKeys[pId] = cursor.value;
              }
              cursor.continue();
            } else {
              setPeerKeys(cachedKeys);
            }
          };

          if (!storedEncryptedPriv || !storedSalt) {
            const salt = window.crypto.getRandomValues(new Uint8Array(16));
            const newKeys = await window.crypto.subtle.generateKey(
              { name: "ECDH", namedCurve: "P-256" },
              true,
              ["deriveKey", "deriveBits"]
            );

            const pubJwk = await window.crypto.subtle.exportKey("jwk", newKeys.publicKey);
            const privJwk = await window.crypto.subtle.exportKey("jwk", newKeys.privateKey);

            const mKey = await deriveMasterKey(passwordInput, salt);
            const rawPrivBytes = new TextEncoder().encode(JSON.stringify(privJwk));
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const encryptedPriv = await window.crypto.subtle.encrypt(
              { name: "AES-GCM", iv: iv },
              mKey,
              rawPrivBytes
            );

            await saveSecureKey("vault_salt", salt);
            await saveSecureKey("encrypted_private_key", { ciphertext: encryptedPriv, iv: iv });
            await saveSecureKey("public_key_jwk", pubJwk);

            setIdentityKeyPair(newKeys);
            setMyPublicJWK(btoa(JSON.stringify(pubJwk)));
          } else {
            const mKey = await deriveMasterKey(passwordInput, storedSalt);
            try {
              const decryptedPrivBytes = await window.crypto.subtle.decrypt(
                { name: "AES-GCM", iv: storedEncryptedPriv.iv },
                mKey,
                storedEncryptedPriv.ciphertext
              );
              
              const privJwk = JSON.parse(new TextDecoder().decode(decryptedPrivBytes));
              const pub = await window.crypto.subtle.importKey("jwk", storedPub, { name: "ECDH", namedCurve: "P-256" }, true, []);
              const priv = await window.crypto.subtle.importKey("jwk", privJwk, { name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey", "deriveBits"]);

              setIdentityKeyPair({ publicKey: pub, privateKey: priv });
              setMyPublicJWK(btoa(JSON.stringify(storedPub)));
            } catch (decErr) {
              setVaultError("Неверный пароль разблокировки!");
              return;
            }
          }

          setMasterPassword(passwordInput);
          setIsVaultLocked(false);
          setVaultError('');
        } catch (err) {
          setVaultError("Критическая ошибка хранилища: " + err.message);
        }
      }

      // Fix 1 & 2 & 3: W3C compliant deriveBits -> importKey -> HKDF with salt & dynamic info binding
      async function encryptDataPFS(recipientPubJWKB64, arrayBufferOrBytes, sequenceNum) {
        const partnerJwk = JSON.parse(atob(recipientPubJWKB64));
        const partnerPublicKeyObj = await window.crypto.subtle.importKey(
          "jwk",
          partnerJwk,
          { name: "ECDH", namedCurve: "P-256" },
          true,
          []
        );

        // Generate Ephemeral Key Pair
        const ephemeralKeyPair = await window.crypto.subtle.generateKey(
          { name: "ECDH", namedCurve: "P-256" },
          true,
          ["deriveKey", "deriveBits"]
        );

        // Fix 1: Derive RAW shared bits (deriveBits) instead of direct HMAC mapping
        const sharedBits = await window.crypto.subtle.deriveBits(
          { name: "ECDH", public: partnerPublicKeyObj },
          ephemeralKeyPair.privateKey,
          256
        );

        // Import Shared Bits as raw master HKDF key material
        const hkdfKey = await window.crypto.subtle.importKey(
          "raw",
          sharedBits,
          { name: "HKDF" },
          false,
          ["deriveKey"]
        );

        // Fix 2: Cryptographically secure 32-byte dynamic random Salt
        const salt = window.crypto.getRandomValues(new Uint8Array(32));

        // Fix 3: Cryptographically separate context info binding
        const infoStr = `VKTG-v3|msg|${myProfile.id}|${activePartner.id}|${sequenceNum}`;
        const info = new TextEncoder().encode(infoStr);

        const aesKey = await window.crypto.subtle.deriveKey(
          {
            name: "HKDF",
            hash: "SHA-256",
            salt: salt,
            info: info
          },
          hkdfKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"]
        );

        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const ciphertext = await window.crypto.subtle.encrypt(
          { name: "AES-GCM", iv: iv },
          aesKey,
          arrayBufferOrBytes
        );

        const ephemeralPubJWK = await window.crypto.subtle.exportKey("jwk", ephemeralKeyPair.publicKey);

        return {
          ephemeralPubJWKB64: btoa(JSON.stringify(ephemeralPubJWK)),
          ivB64: btoa(String.fromCharCode(...iv)),
          saltB64: btoa(String.fromCharCode(...salt)),
          ciphertextBuffer: ciphertext
        };
      }

      // Perform Ephemeral PFS encryption for Text messages
      async function encryptPFS(recipientPubJWKB64, messageText) {
        // Fix 9: Sequence loaded from highly secure IndexedDB
        const savedSeq = await getSecureKey(`seq_sent_${activePartner.id}`);
        const sequence = (savedSeq ? parseInt(savedSeq) : 0) + 1;
        await saveSecureKey(`seq_sent_${activePartner.id}`, sequence);

        // Fix 4 & 7: Add dynamically varying padding parameter inside message text payload
        const randomPadBytes = window.crypto.getRandomValues(new Uint8Array(Math.floor(Math.random() * 128) + 16));
        const payloadData = {
          text: messageText,
          timestamp: Date.now(),
          sender_id: myProfile.id,
          recipient_id: activePartner.id,
          sequence: sequence,
          _pad: btoa(String.fromCharCode(...randomPadBytes))
        };

        const payloadBytes = new TextEncoder().encode(JSON.stringify(payloadData));
        const encrypted = await encryptDataPFS(recipientPubJWKB64, payloadBytes, sequence);

        return {
          sequence,
          ephemeralPubJWKB64: encrypted.ephemeralPubJWKB64,
          ivB64: encrypted.ivB64,
          saltB64: encrypted.saltB64,
          ciphertextB64: btoa(String.fromCharCode(...new Uint8Array(encrypted.ciphertextBuffer)))
        };
      }

      // Decrypt incoming E2EE text messages with strict dynamic binding
      async function decryptPFS(sequence, saltB64, ephemeralPubJWKB64, ivB64, ciphertextB64, item) {
        if (!identityKeyPair) return null;
        try {
          const partnerEphemeralJwk = JSON.parse(atob(ephemeralPubJWKB64));
          const partnerEphemeralPublicKeyObj = await window.crypto.subtle.importKey(
            "jwk",
            partnerEphemeralJwk,
            { name: "ECDH", namedCurve: "P-256" },
            true,
            []
          );

          // Fix 1: deriveBits
          const sharedBits = await window.crypto.subtle.deriveBits(
            { name: "ECDH", public: partnerEphemeralPublicKeyObj },
            identityKeyPair.privateKey,
            256
          );

          const hkdfKey = await window.crypto.subtle.importKey(
            "raw",
            sharedBits,
            { name: "HKDF" },
            false,
            ["deriveKey"]
          );

          const salt = new Uint8Array(atob(saltB64).split("").map(c => c.charCodeAt(0)));
          const partnerId = item.from_id;

          // Fix 3: Recompute context specific info using verified sequence
          const infoStr = `VKTG-v3|msg|${partnerId}|${myProfile.id}|${sequence}`;
          const info = new TextEncoder().encode(infoStr);

          const aesKey = await window.crypto.subtle.deriveKey(
            {
              name: "HKDF",
              hash: "SHA-256",
              salt: salt,
              info: info
            },
            hkdfKey,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt", "decrypt"]
          );

          const iv = new Uint8Array(atob(ivB64).split("").map(c => c.charCodeAt(0)));
          const ciphertext = new Uint8Array(atob(ciphertextB64).split("").map(c => c.charCodeAt(0)));

          const decryptedBytes = await window.crypto.subtle.decrypt(
            { name: "AES-GCM", iv: iv },
            aesKey,
            ciphertext
          );

          const payload = JSON.parse(new TextDecoder().decode(decryptedBytes));
          
          if (payload.recipient_id !== myProfile.id) {
            return { error: "Нарушение адресации! Сообщение заблокировано." };
          }

          // Fix 9: Load received sequence from secure IndexedDB cache to prevent bypass
          const lastVerifiedVkIdKey = `vktg_last_verified_vk_id_${partnerId}`;
          const lastVerifiedSeqKey = `vktg_last_verified_seq_${partnerId}`;

          const lastVerifiedVkId = parseInt(await getSecureKey(lastVerifiedVkIdKey) || '0');
          const lastVerifiedSeq = parseInt(await getSecureKey(lastVerifiedSeqKey) || '0');

          if (item.id > lastVerifiedVkId) {
            if (payload.sequence <= lastVerifiedSeq) {
              return { error: "Обнаружена атака повторного воспроизведения (Replay Attack)!" };
            }
            await saveSecureKey(lastVerifiedVkIdKey, item.id.toString());
            await saveSecureKey(lastVerifiedSeqKey, payload.sequence.toString());
          }

          return payload;
        } catch (e) {
          console.error("Decryption failed", e);
          return null;
        }
      }

      // ================= VK ACTIONS & SESSION MANAGEMENT =================
      const checkVKSession = async (rawTok) => {
        const cleanTok = parseToken(rawTok);
        if (!cleanTok) return;

        try {
          localStorage.setItem('vk_token', cleanTok);
          const profileResponse = await vkRequest('users.get', { fields: 'photo_100,status', access_token: cleanTok });
          if (profileResponse && profileResponse.length > 0) {
            setToken(cleanTok);
            setMyProfile(profileResponse[0]);
            setIsLoggedIn(true);
            setTokenInput('');
            setAuthError('');
            
            const over = localContacts[profileResponse[0].id] || {};
            setCustomName(over.name || `${profileResponse[0].first_name} ${profileResponse[0].last_name}`);
            setCustomAvatar(over.photo || profileResponse[0].photo_100);
          } else {
            setAuthError("Сессия не найдена. Попробуйте обновить токен.");
          }
        } catch (err) {
          setAuthError(`Ошибка сессии VK: ${err.error_msg || JSON.stringify(err)}`);
          localStorage.removeItem('vk_token');
        }
      };

      const refreshConversations = async () => {
        try {
          const response = await vkRequest('messages.getConversations', { count: 30, extended: 1 });
          if (!response || !response.items) return;

          const profilesMap = {};
          if (response.profiles) {
            response.profiles.forEach(p => { profilesMap[p.id] = p; });
          }

          const items = [];
          for (let item of response.items) {
            const peer = item.conversation.peer;
            let partner = profilesMap[peer.id] || { id: peer.id, first_name: `Пользователь ${peer.id}`, last_name: '' };
            if (localContacts[peer.id]) {
              partner = { ...partner, ...localContacts[peer.id] };
            }
            items.push({
              id: peer.id,
              partner,
              lastMessage: item.last_message,
              unreadCount: item.conversation.unread_count || 0
            });
          }

          setConversations(items);
        } catch (e) {
          console.error("Failed to load conversations: ", e);
        }
      };

      const refreshMessages = async (partnerId) => {
        try {
          const response = await vkRequest('messages.getHistory', { peer_id: partnerId, count: 40 });
          if (!response || !response.items) return;

          const decryptedMessages = [];
          for (let item of response.items) {
            const isMe = item.from_id === myProfile.id;
            let text = item.text || '';
            let payload = null;

            if (text.startsWith(PREFIX_KEY_EXCHANGE)) {
              const rawKey = text.replace(PREFIX_KEY_EXCHANGE, "").trim();
              
              // TOFU Check before saving keys
              const isTrusted = await checkTOFU(item.from_id, rawKey);
              if (isTrusted) {
                peerKeys[item.from_id] = rawKey;
                setPeerKeys({ ...peerKeys });
              }

              payload = { isSystem: true, text: "🔑 Синхронизирована новая пара асимметричных ключей E2EE." };
              
              if (!isMe && !localStorage.getItem(`replied_${item.from_id}`)) {
                await sendKeyExchangeMessage(partnerId);
                localStorage.setItem(`replied_${item.from_id}`, 'true');
              }
            } else if (text.startsWith(PREFIX_E2EE_TEXT)) {
              // Format: PREFIX + seq + ":" + salt + ":" + ephemeralPub + ":" + iv + ":" + cipher
              const parts = text.replace(PREFIX_E2EE_TEXT, "").trim().split(":");
              if (parts.length === 5) {
                const [sequence, salt, ephemeralPub, iv, cipher] = parts;
                const decryptedData = await decryptPFS(sequence, salt, ephemeralPub, iv, cipher, item);
                if (decryptedData) {
                  if (decryptedData.error) {
                    payload = { isError: true, text: `⚠️ ${decryptedData.error}` };
                  } else {
                    payload = { isText: true, text: decryptedData.text };
                  }
                } else {
                  payload = { isError: true, text: "🔒 Ошибка расшифрования." };
                }
              }
            } else if (text.startsWith(PREFIX_E2EE_FILE)) {
              // Format: PREFIX + seq + ":" + salt + ":" + ephemeralPub + ":" + iv + ":" + b64Name + ":" + mime
              const parts = text.replace(PREFIX_E2EE_FILE, "").trim().split(":");
              if (parts.length >= 6) {
                const [sequence, salt, ephemeralPub, iv, b64Name, mime] = parts;
                let docUrl = null;
                if (item.attachments) {
                  const docObj = item.attachments.find(a => a.type === 'doc');
                  if (docObj && docObj.doc) docUrl = docObj.doc.url;
                }
                payload = { isFile: true, name: atob(b64Name), mime, docUrl, sequence, salt, ephemeralPub, iv };
              }
            }

            decryptedMessages.push({
              id: item.id,
              fromId: item.from_id,
              date: item.date,
              rawText: text,
              isMe,
              decrypted: payload
            });
          }

          setMessages(decryptedMessages);
        } catch (e) {
          console.error("Messages failed to refresh: ", e);
        }
      };

      const sendKeyExchangeMessage = async (peerId) => {
        if (!myPublicJWK) return;
        await vkRequest('messages.send', {
          peer_id: peerId,
          message: `${PREFIX_KEY_EXCHANGE}${myPublicJWK}`,
          random_id: Math.floor(Math.random() * 10000000)
        });
      };

      const handleSendMessage = async () => {
        if (!activePartner) return;
        const msgText = messageInput.trim();
        if (!msgText && !attachedFile) return;

        // Block outgoing messages during TOFU keys change warning
        if (tofuViolation) {
          alert("Действие заблокировано! Ключ собеседника изменился. Пожалуйста, подтвердите его легитимность для снятия блокировки.");
          return;
        }

        const partnerKeyB64 = peerKeys[activePartner.id];
        if (!partnerKeyB64) {
          alert("Необходимо обменяться ключами E2EE!");
          return;
        }

        try {
          if (attachedFile) {
            const savedSeq = await getSecureKey(`seq_sent_${activePartner.id}`);
            const sequence = (savedSeq ? parseInt(savedSeq) : 0) + 1;
            await saveSecureKey(`seq_sent_${activePartner.id}`, sequence);

            // Fully Encrypt file bytes (Fix PFS)
            const encryptedFile = await encryptDataPFS(partnerKeyB64, attachedFile.arrayBuffer, sequence);
            
            const server = await vkRequest('docs.getMessagesUploadServer', { type: 'doc', peer_id: activePartner.id });
            
            const encBlob = new Blob([encryptedFile.ciphertextBuffer], { type: 'application/octet-stream' });
            const formData = new FormData();
            formData.append('file', encBlob, 'secure_doc.bin');

            const uploadResp = await fetch(server.upload_url, { method: 'POST', body: formData });
            const uploadData = await uploadResp.json();

            const saved = await vkRequest('docs.save', { file: uploadData.file, title: 'secure_payload.bin' });
            const docObj = saved.doc || saved[0];
            const attachStr = `doc${docObj.owner_id}_${docObj.id}`;

            const b64Name = btoa(attachedFile.name);
            const header = `${PREFIX_E2EE_FILE}${sequence}:${encryptedFile.saltB64}:${encryptedFile.ephemeralPubJWKB64}:${encryptedFile.ivB64}:${b64Name}:${attachedFile.type}`;

            await vkRequest('messages.send', {
              peer_id: activePartner.id,
              message: header,
              attachment: attachStr,
              random_id: Math.floor(Math.random() * 10000000)
            });

            setAttachedFile(null);
          } else {
            const encrypted = await encryptPFS(partnerKeyB64, msgText);
            const payload = `${PREFIX_E2EE_TEXT}${encrypted.sequence}:${encrypted.saltB64}:${encrypted.ephemeralPubJWKB64}:${encrypted.ivB64}:${encrypted.ciphertextB64}`;

            await vkRequest('messages.send', {
              peer_id: activePartner.id,
              message: payload,
              random_id: Math.floor(Math.random() * 10000000)
            });

            setMessageInput('');
          }

          await refreshMessages(activePartner.id);
        } catch (e) {
          alert("Ошибка отправки: " + JSON.stringify(e));
        }
      };

      // Fix 10: Seamless file decryption using current decrypted identity key in memory
      async function downloadAndDecryptFile(docUrl, sequence, saltB64, ephemeralPubJWKB64, ivB64, originalName, mimeType) {
        if (!docUrl) {
          alert("Документ недоступен.");
          return;
        }
        if (!identityKeyPair) {
          alert("Ошибка: Сейф не расшифрован!");
          return;
        }

        try {
          const response = await fetch(docUrl);
          const encryptedBuffer = await response.arrayBuffer();

          const partnerEphemeralJwk = JSON.parse(atob(ephemeralPubJWKB64));
          const partnerEphemeralPublicKeyObj = await window.crypto.subtle.importKey(
            "jwk",
            partnerEphemeralJwk,
            { name: "ECDH", namedCurve: "P-256" },
            true,
            []
          );

          // deriveBits
          const sharedBits = await window.crypto.subtle.deriveBits(
            { name: "ECDH", public: partnerEphemeralPublicKeyObj },
            identityKeyPair.privateKey,
            256
          );

          const hkdfKey = await window.crypto.subtle.importKey(
            "raw",
            sharedBits,
            { name: "HKDF" },
            false,
            ["deriveKey"]
          );

          const salt = new Uint8Array(atob(saltB64).split("").map(c => c.charCodeAt(0)));
          const infoStr = `VKTG-v3|msg|${activePartner.id}|${myProfile.id}|${sequence}`;
          const info = new TextEncoder().encode(infoStr);

          const aesKey = await window.crypto.subtle.deriveKey(
            {
              name: "HKDF",
              hash: "SHA-256",
              salt: salt,
              info: info
            },
            hkdfKey,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt", "decrypt"]
          );

          const iv = new Uint8Array(atob(ivB64).split("").map(c => c.charCodeAt(0)));
          const decryptedBytes = await window.crypto.subtle.decrypt(
            { name: "AES-GCM", iv: iv },
            aesKey,
            encryptedBuffer
          );

          const blob = new Blob([decryptedBytes], { type: mimeType });
          const blobUrl = URL.createObjectURL(blob);

          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = originalName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        } catch (err) {
          alert("Ошибка расшифрования файла: " + err.message);
        }
      }

      const handleSelectChat = (partner) => {
        setActivePartner(partner);
        setActiveScreen('chat_room');
        setMessages([]);
        refreshMessages(partner.id);
        
        // Trigger TOFU checks on chat selection
        if (peerKeys[partner.id]) {
          checkTOFU(partner.id, peerKeys[partner.id]);
        } else {
          setTofuViolation(false);
        }
      };

      const handleSaveLocalProfile = () => {
        if (!myProfile) return;
        const copy = { ...localContacts };
        copy[myProfile.id] = {
          id: myProfile.id,
          first_name: customName,
          last_name: '',
          photo_100: customAvatar || myProfile.photo_100
        };
        localStorage.setItem('vktg_contacts', JSON.stringify(copy));
        setLocalContacts(copy);
        setMyProfile(prev => ({
          ...prev,
          first_name: customName,
          photo_100: customAvatar
        }));
        setSettingsOpen(false);
        alert("Профиль успешно сохранен!");
      };

      const handleStartNewChat = async () => {
        const parsedId = parseInt(targetUserId);
        if (!parsedId || isNaN(parsedId)) {
          alert("Пожалуйста, введите корректный числовой ID");
          return;
        }

        try {
          const resp = await vkRequest('users.get', { user_ids: parsedId, fields: 'photo_100' });
          if (resp && resp.length > 0) {
            let partner = resp[0];
            if (localContacts[parsedId]) {
              partner = { ...partner, ...localContacts[parsedId] };
            }
            setNewChatModal(false);
            setTargetUserId('');
            handleSelectChat(partner);
          } else {
            alert("Пользователь не найден.");
          }
        } catch (e) {
          alert("Не удалось загрузить пользователя: " + JSON.stringify(e));
        }
      };

      const parseToken = (input) => {
        input = input.trim();
        if (input.includes('access_token=')) {
          const normalized = input.replace('#', '?');
          try {
            const urlObj = new URL(normalized);
            const tok = urlObj.searchParams.get('access_token');
            if (tok) return tok;
          } catch (e) {
            const match = input.match(/access_token=([^&]+)/);
            if (match) return match[1];
          }
        }
        return input;
      };

      const filteredConversations = conversations.filter(item => {
        const name = `${item.partner.first_name} ${item.partner.last_name || ''}`.toLowerCase();
        const matchesQuery = name.includes(searchQuery.toLowerCase());
        if (activeTab === 'secret') {
          return matchesQuery && peerKeys[item.partner.id];
        }
        return matchesQuery;
      });

      // ================= UI RENDER IMPLEMENTATION =================

      // 1. MASTER PASSWORD WALL
      if (isLoggedIn && isVaultLocked) {
        return (
          <div className="h-screen w-full flex items-center justify-center bg-[#070a0e] p-4 text-white">
            <div className="w-full max-w-sm bg-[#0e141c] rounded-2xl p-6 border border-[#223145] shadow-2xl flex flex-col items-center space-y-5">

              <div className="text-center">

                  Введите пароль для дешифрования приватных ключей E2EE. Если вы запускаете клиент впервые — придумайте новый пароль (PBKDF2-600k).
                </p>
              </div>

              <input 
                type="password"
                placeholder="Мастер-Пароль"
                value={passwordInput}
                onChange={(e) => setPasswordInput(e.target.value)}
                className="w-full bg-[#05070a] text-sm text-white px-4 py-3 rounded-xl border border-[#1b2533] focus:outline-none focus:border-emerald-500 text-center tracking-wider transition"
              />

              {vaultError && (
                <div className="text-xs text-rose-400 text-center bg-rose-950/20 py-1.5 px-3 rounded-lg w-full border border-rose-900/30">
                  {vaultError}

              <button

                className="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl text-xs font-bold tracking-wider transition duration-150 flex items-center justify-center gap-2 shadow-lg shadow-emerald-950/40"
              >
                <Icons.Lock className="w-4 h-4" />
                РАЗБЛОКИРОВАТЬ
              </button>
            </div>
          </div>
        );
      }

      // 2. MAIN OAUTH WALL
      if (!isLoggedIn) {
        return (
          <div className="h-screen w-full flex items-center justify-center bg-[#070a0e] p-4 text-white">
            <div className="w-full max-w-sm bg-[#0e141c] rounded-2xl p-6 border border-[#223145] shadow-2xl flex flex-col items-center">
              <div className="w-16 h-16 bg-[#213043] rounded-2xl flex items-center justify-center mb-5 border border-[#304662] shadow-inner">
                <Icons.Lock className="w-8 h-8 text-sky-400" />
              </div>
              
              <h2 className="text-xl font-bold tracking-tight mb-1 text-center">VKTG Messenger</h2>
              <p className="text-xs text-[#738294] mb-6 text-center leading-relaxed">Безопасное сквозное шифрование поверх API ВКонтакте</p>

              <div className="w-full space-y-4">
                <div>
                  <label className="block text-[10px] text-[#738294] font-semibold mb-1.5 uppercase tracking-wider">Шаг 1: Авторизуйтесь в ВК</label>
                  <a 
                    href="https://oauth.vk.com/authorize?client_id=2685278&scope=messages,audio,photos,video,docs,notes,pages,status,wall,groups,email,stats,notifications,offline&redirect_uri=https://oauth.vk.com/blank.html&display=page&response_type=token"
                    target="_blank"
                    className="w-full flex items-center justify-center gap-2 bg-[#213043] hover:bg-[#2e435d] text-white py-3 rounded-xl font-bold text-xs border border-[#304662] transition duration-150"
                  >
                    <Icons.Key />
                    ЗАПРОСИТЬ ТОКЕН
                  </a>
                </div>

                <div>
                  <label className="block text-[10px] text-[#738294] font-semibold mb-1.5 uppercase tracking-wider">Шаг 2: Вставьте токен</label>
                  <textarea 
                    value={tokenInput}
                    onChange={(e) => setTokenInput(e.target.value)}
                    rows={3}
                    placeholder="Вставьте ссылку oauth.vk.com/blank.html#access_token=... или токен напрямую"
                    className="w-full bg-[#05070a] text-xs text-white p-3.5 rounded-xl border border-[#1b2533] focus:outline-none focus:border-sky-500 resize-none transition"
                  />
                </div>
              </div>

              <button 
                onClick={() => checkVKSession(tokenInput)}
                className="w-full mt-6 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-xl text-xs tracking-wider flex items-center justify-center gap-2 transition duration-150 shadow-lg shadow-emerald-950/40"
              >
                <Icons.Send />
                ПОДКЛЮЧИТЬСЯ
              </button>

              {authError && (
                <div className="w-full mt-4 p-3 bg-rose-950/20 border border-rose-900/40 rounded-xl text-[10px] text-rose-400 font-mono text-center leading-relaxed">
                  {authError}
                </div>
              )}
            </div>
          </div>
        );
      }

      // 3. SECURE CHATS MAIN BOARD
      return (
        <div className="mobile-container relative bg-[#080c10]">
          
          {/* CHATS SCREEN */}
          {activeScreen === 'chats' && (
            <div className="flex-1 flex flex-col overflow-hidden relative">
              
              {/* Custom Header */}
              <div className="bg-[#0e141c] py-4 px-4 flex items-center justify-between border-b border-[#1b2533] shadow-md shrink-0">
                <div className="flex items-center gap-4">
                  <button onClick={() => setDrawerOpen(true)} className="text-gray-300 hover:text-white transition">
                    <Icons.Menu />
                  </button>
                  <span className="text-lg font-bold text-white tracking-wide">VKTG Premium</span>
                </div>
                <div className="text-gray-400">
                  <Icons.Search />
                </div>
              </div>

              {/* Chat Tabs */}
              <div className="bg-[#0e141c] flex border-b border-[#1b2533] shrink-0 text-xs font-semibold uppercase tracking-wider text-[#738294]">
                <button 
                  onClick={() => setActiveTab('all')}
                  className={`flex-1 py-3 text-center border-b-2 transition ${activeTab === 'all' ? 'text-sky-400 border-sky-400 bg-white/5' : 'border-transparent hover:text-white'}`}
                >
                  Все чаты
                </button>
                <button 
                  onClick={() => setActiveTab('secret')}
                  className={`flex-1 py-3 text-center border-b-2 transition flex items-center justify-center gap-1.5 ${activeTab === 'secret' ? 'text-emerald-400 border-emerald-400 bg-white/5' : 'border-transparent hover:text-white'}`}
                >
                  <Icons.Lock className="w-3.5 h-3.5" />
                  ЗАЩИЩЕННЫЕ
                </button>
              </div>

              {/* Search Field */}
              <div className="bg-[#0e141c]/60 p-2.5 border-b border-[#1b2533] shrink-0">
                <input 
                  type="text" 
                  placeholder="Поиск собеседника..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full bg-[#05070a] text-xs text-white rounded-lg px-3.5 py-2.5 focus:outline-none border border-transparent focus:border-[#213043] transition"
                />
              </div>

              {/* Dialogues List */}
              <div className="flex-1 overflow-y-auto scrollable-area">
                {filteredConversations.length === 0 ? (
                  <div className="p-12 text-center text-[#738294] text-xs space-y-3">
                    <div className="w-12 h-12 bg-[#16212e] rounded-full flex items-center justify-center mx-auto text-sky-400">
                      <Icons.Sync />
                    </div>
                    <p>Нет активных секретных диалогов.</p>
                  </div>
                ) : (
                  filteredConversations.map(item => {
                    const avatar = item.partner.photo_100 || item.partner.photo;
                    const name = `${item.partner.first_name} ${item.partner.last_name || ''}`;
                    const time = item.lastMessage ? formatTimestamp(item.lastMessage.date) : '';
                    let preview = item.lastMessage ? item.lastMessage.text : '';
                    let isEnc = false;

                    if (preview.startsWith(PREFIX_KEY_EXCHANGE)) {
                      preview = "🔑 Крипто-ключи согласованы";
                    } else if (preview.startsWith(PREFIX_E2EE_TEXT) || preview.startsWith(PREFIX_E2EE_FILE)) {
                      preview = "🔒 Зашифровано сквозным PFS";
                      isEnc = true;
                    }

                    return (
                      <div 
                        key={item.id}
                        onClick={() => handleSelectChat(item.partner)}
                        className="p-3.5 flex items-center gap-3.5 active:bg-[#121a24] cursor-pointer transition duration-150 border-b border-[#1b2533]/40"
                      >
                        <div className="w-12 h-12 rounded-full relative shrink-0">
                          <img src={avatar} className="w-full h-full rounded-full object-cover border border-[#1b2533]" />
                          <div className={`absolute bottom-0 right-0 w-3 h-3 border-2 border-[#0b0e14] rounded-full ${item.partner.online ? 'bg-emerald-500' : 'bg-gray-500'}`}></div>
                        </div>

                        <div className="flex-1 min-w-0">
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-sm text-white truncate">{name}</span>
                            <span className="text-[10px] text-[#738294]">{time}</span>
                          </div>
                          <p className={`text-xs ${isEnc ? 'text-emerald-400 font-semibold' : 'text-[#738294]'} truncate mt-1`}>
                            {preview}
                          </p>
                        </div>

                        {item.unreadCount > 0 && (
                          <span className="bg-emerald-500 text-black font-bold text-[10px] px-2 py-0.5 rounded-full shrink-0">
                            {item.unreadCount}
                          </span>
                        )}
                      </div>
                    );
                  })
                )}
              </div>

              {/* FAB */}
              <button 
                onClick={() => setNewChatModal(true)}
                className="absolute bottom-6 right-6 w-14 h-14 bg-sky-600 hover:bg-sky-500 text-white rounded-full flex items-center justify-center shadow-2xl active:scale-95 transition duration-150 z-30 shadow-sky-950/40 border border-sky-400/20"
              >
                <Icons.Edit />
              </button>
            </div>
          )}

          {/* CHAT ROOM SCREEN */}
          {activeScreen === 'chat_room' && activePartner && (
            <div className="flex-1 flex flex-col overflow-hidden relative tg-chat-wallpaper">
              
              {/* Header Container */}
              <div className="bg-[#0e141c] py-3.5 px-4 flex items-center justify-between border-b border-[#1b2533] shadow-md shrink-0 z-20">
                <div className="flex items-center gap-3 min-w-0">
                  <button onClick={() => setActiveScreen('chats')} className="text-gray-300 hover:text-white p-1 transition">
                    <Icons.Back />
                  </button>
                  
                  <div className="w-10 h-10 rounded-full relative shrink-0">
                    <img src={activePartner.photo_100 || activePartner.photo} className="w-full h-full rounded-full object-cover border border-[#1b2533]" />
                    <div className={`absolute bottom-0 right-0 w-3 h-3 border-2 border-[#0e141c] rounded-full ${activePartner.online ? 'bg-emerald-500' : 'bg-gray-500'}`}></div>
                  </div>

                  <div className="min-w-0">
                    <h4 className="font-bold text-sm text-white truncate max-w-[150px]">
                      {activePartner.first_name} {activePartner.last_name || ''}
                    </h4>
                    <span className="text-[10px] text-emerald-400 font-semibold block mt-0.5">
                      {activePartner.online ? 'в сети' : 'был(а) недавно'}
                    </span>
                  </div>
                </div>

                {/* Secure Badge Actions */}
                <div className="flex items-center gap-2 shrink-0">
                  <div 
                    onClick={() => setSafetyNumberModal(true)}
                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[10px] font-bold cursor-pointer transition duration-150 ${peerKeys[activePartner.id] ? (tofuViolation ? 'bg-rose-500/10 text-rose-400 border border-rose-500/30' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30') : 'bg-yellow-500/10 text-yellow-400 border border-yellow-500/30'}`}
                  >
                    {peerKeys[activePartner.id] ? (tofuViolation ? <Icons.Warning className="w-3.5 h-3.5" /> : <Icons.Lock className="w-3 h-3" />) : <Icons.LockOpen className="w-3.5 h-3.5" />}
                    <span>{peerKeys[activePartner.id] ? (tofuViolation ? 'MITM WARNING' : 'E2EE СЕЙФ') : 'НЕТ КЛЮЧА'}</span>
                  </div>

                  <button 
                    onClick={() => {
                      sendKeyExchangeMessage(activePartner.id);
                      alert("Обмен публичными ключами запущен!");
                    }}
                    className="p-1.5 hover:bg-white/5 rounded-full transition"
                    title="Синхронизировать ключи"
                  >
                    <Icons.Sync />
                  </button>
                </div>
              </div>

              {/* TOFU VIOLATION DANGER ALERT */}
              {tofuViolation && (
                <div className="bg-rose-950/90 border-b border-rose-800/60 p-3 flex flex-col items-center gap-2 z-10 text-center animate-slide-up">
                  <div className="flex items-center gap-2">
                    <Icons.Warning className="w-5 h-5 text-rose-400" />
                    <span className="text-xs font-bold text-rose-300">КРИТИЧЕСКОЕ ИЗМЕНЕНИЕ КЛЮЧА (Возможен перехват MITM)</span>
                  </div>
                  <p className="text-[10px] text-rose-200 max-w-sm">
                    Публичный ключ шифрования собеседника изменился по сравнению с сохраненным ранее. 
                  </p>
                  <button 
                    onClick={handleOverrideTOFU}
                    className="bg-rose-700 hover:bg-rose-600 text-white font-bold text-[10px] px-4 py-1.5 rounded-lg transition"
                  >
                    Доверять новому ключу
                  </button>
                </div>
              )}

              {/* Messages viewport */}
              <div className="flex-1 overflow-y-auto p-4 space-y-4 flex flex-col scrollable-area">
                {messages.length === 0 ? (
                  <div className="m-auto text-center max-w-[280px] bg-black/50 p-5 rounded-2xl border border-white/5 space-y-3 backdrop-blur-md">
                    <div className="w-10 h-10 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto">
                      <Icons.Lock className="w-5 h-5" />
                    </div>
                    <h5 className="text-xs font-bold text-white uppercase tracking-wider">Защищенный PFS Сейф</h5>
                    <p className="text-[10px] text-[#738294] leading-relaxed">
                      Все данные шифруются на базе протокола ECDH P-256 + HKDF SHA256. Взломать переписку через сервера VK невозможно.
                    </p>
                  </div>
                ) : (
                  messages.slice().reverse().map(msg => {
                    const timeStr = formatTimestamp(msg.date);
                    
                    if (msg.decrypted && msg.decrypted.isSystem) {
                      return (
                        <div key={msg.id} className="mx-auto my-1 bg-[#101721] text-[10px] text-emerald-400 border border-emerald-950/80 px-4 py-1.5 rounded-full text-center max-w-[320px] font-medium tracking-wide">
                          {msg.decrypted.text}
                        </div>
                      );
                    }

                    const bubbleClass = msg.isMe ? 'bubble-out self-end' : 'bubble-in self-start';

                    return (
                      <div 
                        key={msg.id} 
                        className={`max-w-[85%] p-3 shadow-xl ${bubbleClass} text-white space-y-1`}
                      >
                        {msg.decrypted ? (
                          msg.decrypted.isText ? (
                            <p className="text-xs leading-relaxed break-words">{msg.decrypted.text}</p>
                          ) : msg.decrypted.isFile ? (
                            <div className="space-y-2">
                              <div className="flex items-center gap-2 bg-black/20 p-2.5 rounded-xl border border-white/5">
                                <Icons.Key />
                                <div className="min-w-0">
                                  <p className="text-[11px] font-bold truncate text-white">{msg.decrypted.name}</p>
                                  <p className="text-[9px] text-[#738294] truncate">{msg.decrypted.mime}</p>
                                </div>
                              </div>
                              <button 
                                onClick={() => downloadAndDecryptFile(msg.decrypted.docUrl, msg.decrypted.sequence, msg.decrypted.salt, msg.decrypted.ephemeralPub, msg.decrypted.iv, msg.decrypted.name, msg.decrypted.mime)}
                                className="w-full py-2 bg-[#5288c1] hover:bg-[#3d83c4] text-[10px] font-bold rounded-lg flex items-center justify-center gap-1 transition"
                              >
                                Скачать файл
                              </button>
                            </div>
                          ) : (
                            <p className="text-xs text-rose-400 font-bold">{msg.decrypted.text}</p>
                          )
                        ) : (
                          <p className="text-xs leading-relaxed break-words">{msg.rawText}</p>
                        )}

                        <div className="flex items-center justify-end gap-1.5 text-[9px] text-white/40 pt-0.5">
                          {msg.decrypted && <Icons.Lock className="w-3 h-3 text-emerald-400" />}
                          <span>{timeStr}</span>
                          {msg.isMe && <span className="text-emerald-400">✓✓</span>}
                        </div>
                      </div>
                    );
                  })
                )}
                <div ref={messagesEndRef} />
              </div>

              {/* Message Input Box */}
              <div className="p-3 bg-[#0e141c] border-t border-[#1b2533] shrink-0 space-y-2.5 z-10">
                
                {attachedFile && (
                  <div className="flex items-center justify-between bg-[#05070a] p-2.5 rounded-xl text-xs border border-[#1b2533]">
                    <div className="flex items-center gap-2">
                      <Icons.Attach />
                      <span className="truncate max-w-[200px] text-white text-[11px]">{attachedFile.name}</span>
                    </div>
                    <button onClick={() => setAttachedFile(null)} className="text-rose-400 p-1">
                      <Icons.Close />
                    </button>
                  </div>
                )}

                <div className="flex items-end gap-2.5">
                  <div className="flex-1 bg-[#05070a] rounded-2xl flex items-end px-3 py-2 border border-[#1b2533]">
                    
                    <button 
                      onClick={() => setAttachmentSheet(true)}
                      className="p-1 text-gray-400 hover:text-white transition"
                    >
                      <Icons.Attach />
                    </button>

                    <textarea 
                      value={messageInput}
                      onChange={(e) => setMessageInput(e.target.value)}
                      placeholder="Написать зашифрованное сообщение..."
                      rows={1}
                      className="flex-1 bg-transparent border-0 outline-none text-xs text-white max-h-24 resize-none px-2 py-1 placeholder-gray-500 focus:ring-0"
                    />
                  </div>

                  <button 
                    onClick={handleSendMessage}
                    className="w-10 h-10 bg-sky-600 hover:bg-sky-500 text-white rounded-full flex items-center justify-center shrink-0 active:scale-95 transition duration-150 border border-sky-400/20"
                  >
                    <Icons.Send />
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= ANDROID DRAWER MENU ================= */}
          {drawerOpen && (
            <div className="absolute inset-0 bg-black/75 z-50 flex">
              <div className="w-[80%] max-w-[300px] bg-[#0e141c] h-full flex flex-col border-r border-[#1c2a3d] shadow-2xl relative animate-slide-right">
                
                {/* Drawer Header Banner */}
                <div className="bg-[#121b26] p-5 space-y-3.5 border-b border-[#1c2a3d]">
                  <div className="w-16 h-16 rounded-full overflow-hidden bg-sky-950 border-2 border-sky-500/25">
                    <img src={customAvatar || (myProfile && myProfile.photo_100)} className="w-full h-full object-cover" />
                  </div>
                  <div>
                    <h3 className="font-bold text-white text-sm truncate">
                      {customName || (myProfile && `${myProfile.first_name} ${myProfile.last_name}`)}
                    </h3>
                    <p className="text-xs text-emerald-400 font-semibold truncate mt-0.5">VK ID: {myProfile && myProfile.id}</p>
                  </div>
                </div>

                {/* Navigation Options */}
                <div className="flex-1 py-4 overflow-y-auto space-y-1">
                  <div 
                    onClick={() => { setDrawerOpen(false); setSettingsOpen(true); }}
                    className="flex items-center gap-4 px-5 py-3.5 text-gray-300 text-xs font-semibold hover:bg-white/5 active:bg-white/10 cursor-pointer transition"
                  >
                    <Icons.Settings />
                    Настройки профиля
                  </div>

                  <div 
                    onClick={() => {
                      if (identityKeyPair) {
                        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(myPublicJWK));
                        const dl = document.createElement('a');
                        dl.setAttribute("href", dataStr);
                        dl.setAttribute("download", `pub_identity_${myProfile.id}.json`);
                        dl.click();
                      }
                    }}
                    className="flex items-center gap-4 px-5 py-3.5 text-gray-300 text-xs font-semibold hover:bg-white/5 active:bg-white/10 cursor-pointer transition"
                  >
                    <Icons.Key />
                    Резервная копия ключей
                  </div>

                  <div 
                    onClick={handleLogout}
                    className="flex items-center gap-4 px-5 py-3.5 text-rose-400 text-xs font-semibold hover:bg-rose-950/20 active:bg-rose-950/30 cursor-pointer transition border-t border-[#1b2533]/40"
                  >
                    <Icons.Logout />
                    Выйти из аккаунта
                  </div>
                </div>

                <div className="p-4 border-t border-[#1b2533]/80 text-center text-[10px] text-gray-500 font-medium">
                  VKTG Mobile v3.0 Ultimate PFS
                </div>

              </div>
              <div onClick={() => setDrawerOpen(false)} className="flex-1 h-full"></div>
            </div>
          )}

          {/* ================= PROFILE SETTINGS MODAL ================= */}
          {settingsOpen && (
            <div className="absolute inset-0 bg-black/85 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-[#0e141c] w-full max-w-sm rounded-2xl p-5 border border-[#1b2533] space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-[#1b2533] pb-2">
                  <h3 className="font-bold text-white text-sm">Профиль</h3>
                  <button onClick={() => setSettingsOpen(false)} className="text-gray-400 p-1">
                    <Icons.Close />
                  </button>
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="block text-[10px] text-gray-400 mb-1.5 font-bold uppercase tracking-wider">Никнейм</label>
                    <input 
                      type="text" 
                      value={customName}
                      onChange={(e) => setCustomName(e.target.value)}
                      className="w-full bg-[#05070a] text-xs text-white p-3 rounded-xl border border-[#1b2533] focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-[10px] text-gray-400 mb-1.5 font-bold uppercase tracking-wider">Кастомный аватар (URL)</label>
                    <input 
                      type="text" 
                      value={customAvatar}
                      onChange={(e) => setCustomAvatar(e.target.value)}
                      className="w-full bg-[#05070a] text-xs text-white p-3 rounded-xl border border-[#1b2533] focus:outline-none"
                    />
                  </div>
                  <button 
                    onClick={handleSaveLocalProfile}
                    className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl transition mt-2"
                  >
                    СОХРАНИТЬ ИЗМЕНЕНИЯ
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= NEW CHAT MODAL ================= */}
          {newChatModal && (
            <div className="absolute inset-0 bg-black/85 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-[#0e141c] w-full max-w-sm rounded-2xl p-5 border border-[#1b2533] space-y-4">
                <div className="flex items-center justify-between border-b border-[#1b2533] pb-2">
                  <h3 className="font-bold text-white text-sm">Новый чат E2EE</h3>
                  <button onClick={() => setNewChatModal(false)} className="text-gray-400 p-1">
                    <Icons.Close />
                  </button>
                </div>

                <p className="text-[11px] text-[#738294] leading-relaxed">
                  Введите цифровой ID аккаунта ВКонтакте, чтобы открыть прямой зашифрованный чат.
                </p>

                <div>
                  <label className="block text-[10px] text-gray-400 mb-1.5 uppercase tracking-wider">ID пользователя VK</label>
                  <input 
                    type="number" 
                    value={targetUserId}
                    onChange={(e) => setTargetUserId(e.target.value)}
                    placeholder="Например: 12345678"
                    className="w-full bg-[#05070a] text-xs text-white p-3.5 rounded-xl border border-[#1b2533] focus:outline-none"
                  />
                </div>

                <div className="flex justify-end gap-2 text-xs pt-2">
                  <button 
                    onClick={() => setNewChatModal(false)}
                    className="px-4 py-2 text-gray-400 hover:bg-white/5 rounded-lg transition"
                  >
                    Отмена
                  </button>
                  <button 
                    onClick={handleStartNewChat}
                    className="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-lg transition"
                  >
                    ОТКРЫТЬ
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= SAFETY NUMBERS MODAL ================= */}
          {safetyNumberModal && activePartner && (
            <div className="absolute inset-0 bg-black/85 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-[#0e141c] w-full max-w-sm rounded-2xl p-5 border border-emerald-950 text-center space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-[#1b2533]">
                  <span className="text-xs font-bold text-emerald-400 flex items-center gap-1.5 uppercase">
                    <Icons.Lock className="w-3.5 h-3.5" />
                    ВЕРИФИКАЦИЯ КАНАЛА
                  </span>
                  <button onClick={() => setSafetyNumberModal(false)} className="text-gray-400 p-1">
                    <Icons.Close />
                  </button>
                </div>

                <p className="text-[11px] text-[#738294] leading-relaxed">
                  Для предотвращения атак перехвата сравните эти 60 чисел с числами на экране собеседника {activePartner.first_name}:
                </p>

                <div className="bg-[#05070a] p-4 rounded-xl border border-[#1b2533] font-mono text-xs text-emerald-400 tracking-widest break-words leading-relaxed select-all">
                  {safetyNumber}
                </div>

                <div className="text-[9px] text-gray-500 leading-relaxed">
                  Протокол: ECDH (P-256) + HKDF-SHA256 Extract-and-Expand + AES-GCM 256.
                </div>
              </div>
            </div>
          )}

          {/* ================= ATTACHMENT BOTTOM SHEET ================= */}
          {attachmentSheet && (
            <div className="absolute inset-0 bg-black/75 z-50 flex flex-col justify-end">
              <div onClick={() => setAttachmentSheet(false)} className="flex-1 w-full"></div>
              
              <div className="bg-[#0e141c] rounded-t-3xl p-5 space-y-4 border-t border-[#1b2533] shadow-2xl relative animate-slide-up">
                <div className="w-12 h-1 bg-white/10 rounded-full mx-auto mb-1"></div>
                <h4 className="text-xs font-bold text-white uppercase tracking-wider text-center">Зашифровать файл PFS</h4>
                
                <div className="grid grid-cols-2 gap-4 pt-2">
                  <label className="flex flex-col items-center justify-center p-4 bg-[#05070a] hover:bg-[#121822] rounded-xl cursor-pointer border border-[#1b2533] space-y-1.5 transition">
                    <span className="text-emerald-400"><Icons.Edit /></span>
                    <span className="text-[10px] text-white font-semibold">Изображения</span>
                    <input type="file" onChange={handleFileSelection} className="hidden" accept="image/*,video/*" />
                  </label>

                  <label className="flex flex-col items-center justify-center p-4 bg-[#05070a] hover:bg-[#121822] rounded-xl cursor-pointer border border-[#1b2533] space-y-1.5 transition">
                    <span className="text-sky-400"><Icons.Key /></span>
                    <span className="text-[10px] text-white font-semibold">Документы</span>
                    <input type="file" onChange={handleFileSelection} className="hidden" />
                  </label>
                </div>

                <button 
                  onClick={() => setAttachmentSheet(false)}
                  className="w-full py-3 bg-[#1b2533] hover:bg-[#28384d] text-white text-xs font-bold rounded-xl transition"
                >
                  ОТМЕНА
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    function formatTimestamp(timestamp) {
      const date = new Date(timestamp * 1000);
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
