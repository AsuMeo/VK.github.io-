<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ultra Secure E2EE Messenger</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone to compile JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase Legacy SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #05070a;
      color: #e2e8f0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .mobile-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      background-color: #0a0f1d;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
      border-left: 1px solid #1e293b;
      border-right: 1px solid #1e293b;
    }
    @media (max-width: 640px) {
      .mobile-container {
        max-width: 100% !important;
        height: 100vh;
        border: none;
      }
    }
    .chat-bg {
      background-color: #070a13;
      background-image: radial-gradient(rgba(16, 185, 129, 0.02) 1px, transparent 0);
      background-size: 24px 24px;
    }
    .scroll-hidden::-webkit-scrollbar {
      display: none;
    }
    .scroll-hidden {
      scrollbar-width: none;
    }
  </style>
</head>
<body>

  <div id="root" class="mobile-container"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyBm0mIvHVznIeF2PoFk6dtdaiT5r877wyA",
      authDomain: "meow-874ce.firebaseapp.com",
      databaseURL: "https://meow-874ce-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "meow-874ce",
      storageBucket: "meow-874ce.firebasestorage.app",
      messagingSenderId: "471541334599",
      appId: "1:471541334599:web:567af3e7dbe70a37572762"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const rtdb = firebase.database();

    // Cryptographic Prefixes
    const PREFIX_E2EE_TEXT = "🔒[E2EE_V5]:";

    // ================= HIGH-PERFORMANCE CRYPTO UTILS =================

    function bufferToBase64(buf) {
      return btoa(String.fromCharCode(...new Uint8Array(buf)));
    }

    function base64ToBuffer(b64) {
      return Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer;
    }

    // Zero-knowledge padding to prevent length metadata leaks
    function padPlaintext(text) {
      const encoder = new TextEncoder();
      const encoded = encoder.encode(text);
      const blockSize = 128; // Pad messages to multiples of 128 bytes
      const padLength = blockSize - (encoded.length % blockSize);
      const padded = new Uint8Array(encoded.length + padLength);
      padded.set(encoded);
      padded[encoded.length] = 0x80; // Start of padding byte
      return padded;
    }

    function unpadPlaintext(paddedBytes) {
      const bytes = new Uint8Array(paddedBytes);
      let i = bytes.length - 1;
      while (i >= 0 && bytes[i] === 0x00) {
        i--;
      }
      if (i < 0 || bytes[i] !== 0x80) {
        throw new Error("Критическая ошибка дешифрования: целостность нарушена.");
      }
      const unpadded = bytes.subarray(0, i);
      return new TextDecoder().decode(unpadded);
    }

    // Safety Number calculation for Out-Of-Band authentication
    async function calcSafetyNumber(myPubKeyJWK, peerPubKeyJWK) {
      try {
        const sorted = [myPubKeyJWK, peerPubKeyJWK].sort();
        const combined = sorted[0] + sorted[1];
        const data = new TextEncoder().encode(combined);
        const hashBuffer = await window.crypto.subtle.digest("SHA-256", data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        let digits = '';
        for (let i = 0; i < hashArray.length - 1; i += 2) {
          const val = (hashArray[i] << 8) | hashArray[i + 1];
          digits += val.toString().padStart(5, '0');
        }
        return digits.slice(0, 30).match(/.{1,5}/g).join(' ');
      } catch (e) {
        return "ERROR_GENERATING_FINGERPRINT";
      }
    }

    // ================= PBKDF2 & SYSTEM KEY GENERATION =================

    async function deriveMasterKey(password, saltBytes) {
      const encoder = new TextEncoder();
      const baseKey = await window.crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );
      return await window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: saltBytes,
          iterations: 600000, // Сверхмощная защита от брутфорса
          hash: "SHA-256"
        },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function computeSharedSecret(peerPubKeyB64, myPrivKeyObj) {
      const partnerJwk = JSON.parse(atob(peerPubKeyB64));
      const partnerPublicKeyObj = await window.crypto.subtle.importKey(
        "jwk",
        partnerJwk,
        { name: "ECDH", namedCurve: "P-256" },
        true,
        []
      );
      return await window.crypto.subtle.deriveBits(
        { name: "ECDH", public: partnerPublicKeyObj },
        myPrivKeyObj,
        256
      );
    }

    // PFS: Deriving ratchet keys based on unique sequence counters
    async function deriveRatchetMessageKey(initialSharedSecret, sequenceNum, myId, peerId) {
      const sorted = [myId, peerId].sort();
      const salt = new TextEncoder().encode(`saltr-${sorted[0]}-${sorted[1]}`);
      const info = new TextEncoder().encode(`ratchet-info-${sorted[0]}-${sorted[1]}-${sequenceNum}`);
      
      const rawSecretKey = await window.crypto.subtle.importKey(
        "raw",
        initialSharedSecret,
        { name: "HKDF" },
        false,
        ["deriveKey"]
      );
      
      return await window.crypto.subtle.deriveKey(
        {
          name: "HKDF",
          hash: "SHA-256",
          salt: salt,
          info: info
        },
        rawSecretKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    // ================= MAIN REACT COMPONENT =================

    function App() {
      // Auth States
      const [userId, setUserId] = useState(localStorage.getItem('e2ee_uid') || '');
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [myProfile, setMyProfile] = useState(null);
      const [password, setPassword] = useState('');
      const [authError, setAuthError] = useState('');
      const [isRegister, setIsRegister] = useState(false);
      const [regName, setRegName] = useState('');

      // Decrypted Session Keys (Kept strictly only in RAM state!)
      const [privateKeyObj, setPrivateKeyObj] = useState(null);
      const [myPublicJWK, setMyPublicJWK] = useState('');

      // UI States
      const [chats, setChats] = useState([]);
      const [messages, setMessages] = useState([]);
      const [activeChat, setActiveChat] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [messageInput, setMessageInput] = useState('');
      const [safetyCode, setSafetyCode] = useState('');

      const messagesEndRef = useRef(null);

      // Verify Session status on mount
      useEffect(() => {
        if (userId) {
          verifyDatabaseProfile();
        }
      }, []);

      // Realtime listener for Chat List (Conversations index)
      useEffect(() => {
        if (!isLoggedIn || !userId) return;

        const convsRef = rtdb.ref(`/users/${userId}/conversations`);
        const listener = convsRef.on('value', async (snapshot) => {
          if (!snapshot.exists()) {
            setChats([]);
            return;
          }
          const activeIds = Object.keys(snapshot.val());
          const chatList = [];

          for (const partnerId of activeIds) {
            const partnerSnap = await rtdb.ref(`/users/${partnerId}`).once('value');
            if (partnerSnap.exists()) {
              const pData = partnerSnap.val();
              
              // Get last message in background
              const room = [userId, partnerId].sort().join("_");
              const lastMsgSnap = await rtdb.ref(`/rooms/${room}/messages`).orderByKey().limitToLast(1).once('value');
              let lastMsgText = "Нет сообщений";
              if (lastMsgSnap.exists()) {
                const item = Object.values(lastMsgSnap.val())[0];
                lastMsgText = item.text.startsWith(PREFIX_E2EE_TEXT) ? "🔒 Зашифрованное E2EE" : item.text;
              }

              chatList.push({
                id: partnerId,
                name: pData.name,
                publicKey: pData.publicKey,
                lastMsgText
              });
            }
          }
          setChats(chatList);
        });

        return () => convsRef.off('value', listener);
      }, [isLoggedIn, userId]);

      // Realtime listener for Active Room Messages
      useEffect(() => {
        if (!isLoggedIn || !activeChat || !privateKeyObj) return;

        const room = [userId, activeChat.id].sort().join("_");
        const roomRef = rtdb.ref(`/rooms/${room}/messages`);

        const listener = roomRef.on('value', async (snapshot) => {
          if (!snapshot.exists()) {
            setMessages([]);
            return;
          }
          
          const rawList = Object.entries(snapshot.val()).map(([key, val]) => ({ id: key, ...val }));
          const decryptedList = [];

          for (const msg of rawList) {
            let text = msg.text;
            let secure = false;

            if (text.startsWith(PREFIX_E2EE_TEXT)) {
              try {
                const parts = text.replace(PREFIX_E2EE_TEXT, "").split(":");
                if (parts.length === 3) {
                  const [seq, ivB64, cipherB64] = parts;
                  
                  // Replay attack validation
                  const lastSeqKey = `replay_seq_${activeChat.id}`;
                  const storedSeq = parseInt(localStorage.getItem(lastSeqKey) || '0');
                  const currentSeq = parseInt(seq);

                  if (msg.from !== userId && currentSeq <= storedSeq) {
                    text = "⚠️ Замечена атака повтора (Replay Attack)! Сообщение скомпрометировано.";
                  } else {
                    const sharedSecret = await computeSharedSecret(activeChat.publicKey, privateKeyObj);
                    const aesKey = await deriveRatchetMessageKey(sharedSecret, currentSeq, userId, activeChat.id);
                    
                    const decryptedBuffer = await window.crypto.subtle.decrypt(
                      { name: "AES-GCM", iv: new Uint8Array(base64ToBuffer(ivB64)) },
                      aesKey,
                      base64ToBuffer(cipherB64)
                    );
                    
                    text = unpadPlaintext(decryptedBuffer);
                    secure = true;

                    // Update replay check counter
                    if (msg.from !== userId) {
                      localStorage.setItem(lastSeqKey, seq);
                    }
                  }
                }
              } catch (err) {
                text = "🔒 Сбой расшифрования PFS сессии.";
              }
            }

            decryptedList.push({
              id: msg.id,
              from: msg.from,
              text,
              date: msg.date,
              secure
            });
          }
          setMessages(decryptedList);
          setTimeout(() => messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 50);
        });

        // Compute fingerprint safety code in RAM
        calcSafetyNumber(myPublicJWK, activeChat.publicKey).then(setSafetyCode);

        return () => roomRef.off('value', listener);
      }, [activeChat?.id, isLoggedIn, privateKeyObj]);

      // Verify profile logic
      const verifyDatabaseProfile = async () => {
        const uid = localStorage.getItem('e2ee_uid');
        if (!uid) return;
        try {
          const snap = await rtdb.ref(`/users/${uid}`).once('value');
          if (snap.exists()) {
            setMyProfile(snap.val());
          } else {
            handleLogout();
          }
        } catch (e) {
          setAuthError("Ошибка доступа к базе данных.");
        }
      };

      // Handle Authentication (Zero-Knowledge Validation)
      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthError('');
        const cleanUid = (isRegister ? regName : userId).trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
        
        if (!cleanUid || password.length < 6) {
          setAuthError("Идентификатор обязателен, пароль должен быть от 6 символов.");
          return;
        }

        try {
          const snap = await rtdb.ref(`/users/${cleanUid}`).once('value');

          if (isRegister) {
            // Sign-up process
            if (snap.exists()) {
              setAuthError("Данный ID пользователя уже занят.");
              return;
            }

            // 1. Generate master asymmetric ECDH keypair
            const keyPair = await window.crypto.subtle.generateKey(
              { name: "ECDH", namedCurve: "P-256" },
              true,
              ["deriveKey", "deriveBits"]
            );

            const pubJwk = await window.crypto.subtle.exportKey("jwk", keyPair.publicKey);
            const privJwk = await window.crypto.subtle.exportKey("jwk", keyPair.privateKey);

            // 2. Encrypt Private key using derived key from master password
            const salt = window.crypto.getRandomValues(new Uint8Array(16));
            const masterKey = await deriveMasterKey(password, salt);
            const rawPrivBytes = new TextEncoder().encode(JSON.stringify(privJwk));
            const iv = window.crypto.getRandomValues(new Uint8Array(12));

            const encPriv = await window.crypto.subtle.encrypt(
              { name: "AES-GCM", iv: iv },
              masterKey,
              rawPrivBytes
            );

            const b64PubKey = btoa(JSON.stringify(pubJwk));

            // 3. Write profile packet to Firebase
            const profile = {
              id: cleanUid,
              name: cleanUid.toUpperCase(),
              publicKey: b64PubKey,
              salt: bufferToBase64(salt),
              iv: bufferToBase64(iv),
              vault: bufferToBase64(encPriv)
            };

            await rtdb.ref(`/users/${cleanUid}`).set(profile);
            
            // Set session RAM state
            setPrivateKeyObj(keyPair.privateKey);
            setMyPublicJWK(b64PubKey);
            setMyProfile(profile);
            setUserId(cleanUid);
            localStorage.setItem('e2ee_uid', cleanUid);
            setIsLoggedIn(true);
          } else {
            // Login process
            if (!snap.exists()) {
              setAuthError("Пользователь не найден.");
              return;
            }

            const profile = snap.val();
            const salt = new Uint8Array(base64ToBuffer(profile.salt));
            const iv = new Uint8Array(base64ToBuffer(profile.iv));
            const vault = base64ToBuffer(profile.vault);

            // Derive key to decrypt master key inside client sandbox
            const masterKey = await deriveMasterKey(password, salt);

            try {
              const decryptedPrivBytes = await window.crypto.subtle.decrypt(
                { name: "AES-GCM", iv: iv },
                masterKey,
                vault
              );

              const privJwk = JSON.parse(new TextDecoder().decode(decryptedPrivBytes));
              
              const pubObj = await window.crypto.subtle.importKey(
                "jwk",
                JSON.parse(atob(profile.publicKey)),
                { name: "ECDH", namedCurve: "P-256" },
                true,
                []
              );
              
              const privObj = await window.crypto.subtle.importKey(
                "jwk",
                privJwk,
                { name: "ECDH", namedCurve: "P-256" },
                true,
                ["deriveKey", "deriveBits"]
              );

              setPrivateKeyObj(privObj);
              setMyPublicJWK(profile.publicKey);
              setMyProfile(profile);
              setUserId(cleanUid);
              localStorage.setItem('e2ee_uid', cleanUid);
              setIsLoggedIn(true);
            } catch (decErr) {
              setAuthError("Неверный пароль авторизации.");
            }
          }
        } catch (e) {
          setAuthError("Системная ошибка: " + e.message);
        }
      };

      // Search and Add new Chat
      const handleSearchUser = async (e) => {
        e.preventDefault();
        const target = searchQuery.trim().toLowerCase();
        if (!target || target === userId) return;

        try {
          const snap = await rtdb.ref(`/users/${target}`).once('value');
          if (snap.exists()) {
            const partner = snap.val();
            // Store reference locally inside user directory on Firebase DB
            await rtdb.ref(`/users/${userId}/conversations/${target}`).set(true);
            await rtdb.ref(`/users/${target}/conversations/${userId}`).set(true);
            
            setActiveChat({
              id: target,
              name: partner.name,
              publicKey: partner.publicKey
            });
            setSearchQuery('');
          } else {
            alert("Пользователь с таким ID не зарегистрирован.");
          }
        } catch (e) {
          alert("Ошибка поиска.");
        }
      };

      // Send Message with Perfect Forward Secrecy encryption
      const handleSendMessage = async (e) => {
        e.preventDefault();
        const input = messageInput.trim();
        if (!input || !activeChat || !privateKeyObj) return;

        try {
          // 1. Get next sequence key
          const seqKey = `seq_counter_${activeChat.id}`;
          const currentSeq = parseInt(localStorage.getItem(seqKey) || '0') + 1;
          localStorage.setItem(seqKey, currentSeq.toString());

          // 2. Encrypt plaintext payload with Padding (hiding metadata)
          const sharedSecret = await computeSharedSecret(activeChat.publicKey, privateKeyObj);
          const aesKey = await deriveRatchetMessageKey(sharedSecret, currentSeq, userId, activeChat.id);
          
          const paddedBytes = padPlaintext(input);
          const iv = window.crypto.getRandomValues(new Uint8Array(12));

          const ciphertextBuffer = await window.crypto.subtle.encrypt(
            { name: "AES-GCM", iv: iv },
            aesKey,
            paddedBytes
          );

          const payload = `${PREFIX_E2EE_TEXT}${currentSeq}:${bufferToBase64(iv)}:${bufferToBase64(ciphertextBuffer)}`;

          // 3. Write encrypted packet directly to Firebase
          const room = [userId, activeChat.id].sort().join("_");
          await rtdb.ref(`/rooms/${room}/messages`).push({
            from: userId,
            text: payload,
            date: Math.floor(Date.now() / 1000)
          });

          setMessageInput('');
        } catch (err) {
          alert("Ошибка безопасной отправки: " + err.message);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('e2ee_uid');
        setUserId('');
        setPrivateKeyObj(null);
        setMyPublicJWK('');
        setMyProfile(null);
        setIsLoggedIn(false);
        setActiveChat(null);
        setChats([]);
        setMessages([]);
      };

      // UI RENDER: LOGIN / REGISTRATION SCREEN
      if (!isLoggedIn) {
        return (
          <div className="flex-1 flex flex-col justify-center px-6 py-12 bg-[#060913]">
            <div className="w-full max-w-md mx-auto space-y-6">
              <div className="text-center space-y-2">
                <div className="inline-flex p-3 bg-emerald-500/10 text-emerald-400 rounded-2xl border border-emerald-500/20">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                </div>
                <h2 className="text-2xl font-bold tracking-tight text-white">E2EE Realtime Core</h2>
                <p className="text-xs text-slate-400">Шифрованная E2EE коммуникация без следов на сервере</p>
              </div>

              <div className="bg-[#0b1021] p-6 rounded-3xl border border-slate-800 shadow-xl space-y-4">
                <div className="flex bg-[#070b16] p-1 rounded-xl text-xs font-semibold">
                  <button 
                    onClick={() => { setIsRegister(false); setAuthError(''); }}
                    className={`flex-1 py-2.5 rounded-lg transition ${!isRegister ? 'bg-[#151f38] text-emerald-400 shadow' : 'text-slate-400 hover:text-white'}`}
                  >
                    Вход по ID
                  </button>
                  <button 
                    onClick={() => { setIsRegister(true); setAuthError(''); }}
                    className={`flex-1 py-2.5 rounded-lg transition ${isRegister ? 'bg-[#151f38] text-emerald-400 shadow' : 'text-slate-400 hover:text-white'}`}
                  >
                    Регистрация
                  </button>
                </div>

                <form onSubmit={handleAuth} className="space-y-4">
                  {!isRegister ? (
                    <div>
                      <label className="block text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-1.5">Ваш уникальный ID</label>
                      <input 
                        type="text"
                        placeholder="alice"
                        value={userId}
                        onChange={(e) => setUserId(e.target.value)}
                        className="w-full bg-[#050811] text-sm text-white px-4 py-3 rounded-xl border border-slate-800 focus:outline-none focus:border-emerald-500 transition"
                      />
                    </div>
                  ) : (
                    <div>
                      <label className="block text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-1.5">Придумайте ваш ID</label>
                      <input 
                        type="text"
                        placeholder="Например: bob_pfs"
                        value={regName}
                        onChange={(e) => setRegName(e.target.value)}
                        className="w-full bg-[#050811] text-sm text-white px-4 py-3 rounded-xl border border-slate-800 focus:outline-none focus:border-emerald-500 transition"
                      />
                    </div>
                  )}

                  <div>
                    <label className="block text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-1.5">Мастер-Пароль (Для ключа PBKDF2)</label>
                    <input 
                      type="password"
                      placeholder="••••••••••••"
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      className="w-full bg-[#050811] text-sm text-white px-4 py-3 rounded-xl border border-slate-800 focus:outline-none focus:border-emerald-500 transition"
                    />
                  </div>

                  {authError && (
                    <div className="p-3 bg-red-950/20 border border-red-900/30 text-[11px] text-red-400 rounded-xl">
                      {authError}
                    </div>
                  )}

                  <button 
                    type="submit"
                    className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-black font-bold rounded-xl text-xs uppercase tracking-widest transition shadow-lg shadow-emerald-950/50"
                  >
                    {!isRegister ? "Авторизоваться" : "Зарегистрировать ID"}
                  </button>
                </form>
              </div>
            </div>
          </div>
        );
      }

      // UI RENDER: MAIN APPLICATION WORKSPACE
      return (
        <div className="flex-1 flex flex-col overflow-hidden relative">
          
          {/* Active Chat room UI */}
          {activeChat ? (
            <div className="flex-1 flex flex-col overflow-hidden chat-bg">
              
              {/* Chat Header */}
              <div className="bg-[#0b1021] border-b border-slate-800 px-4 py-3 flex items-center justify-between shrink-0">
                <div className="flex items-center gap-3">
                  <button onClick={() => setActiveChat(null)} className="p-1 text-slate-400 hover:text-white transition">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                  </button>
                  <div>
                    <h3 className="text-sm font-bold text-white">{activeChat.name}</h3>
                    <p className="text-[9px] text-emerald-400 font-bold tracking-widest uppercase mt-0.5">E2EE Активен</p>
                  </div>
                </div>
                
                {/* Out of Band Safety fingerprint validation code */}
                <div className="text-right">
                  <span className="text-[9px] text-slate-500 block uppercase tracking-wider">Fingerprint</span>
                  <span className="text-[10px] text-emerald-400 font-mono font-semibold tracking-wide block">{safetyCode}</span>
                </div>
              </div>

              {/* Chat Viewport */}
              <div className="flex-1 overflow-y-auto p-4 space-y-4 scroll-hidden">
                {messages.length === 0 ? (
                  <div className="h-full flex flex-col items-center justify-center text-center p-6 space-y-3">
                    <div className="w-12 h-12 bg-emerald-950/20 text-emerald-500 rounded-full flex items-center justify-center border border-emerald-900/30">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                      </svg>
                    </div>
                    <h4 className="text-xs font-bold uppercase tracking-widest text-emerald-500">Защищенный Канал</h4>
                    <p className="text-[10px] text-slate-500 max-w-[240px] leading-relaxed">
                      История ваших сообщений шифруется на устройстве и сохраняется в базе. Расшифровать её невозможно без вашего мастер-пароля.
                    </p>
                  </div>
                ) : (
                  messages.map(msg => {
                    const isMe = msg.from === userId;
                    return (
                      <div key={msg.id} className={`flex ${isMe ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-[80%] rounded-2xl p-3.5 shadow-md ${isMe ? 'bg-[#18233c] text-white border border-slate-700/50' : 'bg-[#0f1526] text-white border border-slate-800'}`}>
                          <p className="text-xs leading-relaxed break-words whitespace-pre-wrap">{msg.text}</p>
                          <div className="flex items-center justify-end gap-1 mt-1 text-[9px] text-slate-500">
                            {msg.secure && (
                              <svg className="w-3 h-3 text-emerald-500" fill="currentColor" viewBox="0 0 20 20">
                                <path fillRule="evenodd" d="M2.166 4.9L10 1.154l7.834 3.746a1 1 0 01.597.91v4.356a12.001 12.001 0 01-5.187 9.816l-3.02 2.057a1 1 0 01-1.155 0l-3.02-2.057A12.001 12.001 0 011.573 10.16V5.81a1 1 0 01.593-.91zM10 12a2 2 0 100-4 2 2 0 000 4z" clipRule="evenodd" />
                              </svg>
                            )}
                            <span>{new Date(msg.date * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                          </div>
                        </div>
                      </div>
                    );
                  })
                )}
                <div ref={messagesEndRef} />
              </div>

              {/* Chat Input Bar */}
              <form onSubmit={handleSendMessage} className="bg-[#0b1021] border-t border-slate-800 p-3 shrink-0 flex items-center gap-2">
                <input 
                  type="text"
                  placeholder="Шифрованное E2EE сообщение..."
                  value={messageInput}
                  onChange={(e) => setMessageInput(e.target.value)}
                  className="flex-1 bg-[#060913] text-sm text-white px-4 py-3 rounded-xl border border-slate-800 focus:outline-none focus:border-emerald-500 transition"
                />
                <button 
                  type="submit"
                  className="w-11 h-11 bg-emerald-600 hover:bg-emerald-500 text-black rounded-xl flex items-center justify-center shrink-0 active:scale-95 transition"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                    <path strokeLinecap="round" strokeLinejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                </button>
              </form>

            </div>
          ) : (
            // Chat Room List View
            <div className="flex-1 flex flex-col overflow-hidden">
              
              {/* Main Header */}
              <div className="bg-[#0b1021] border-b border-slate-800 px-4 py-4 flex items-center justify-between shrink-0">
                <div className="flex items-center gap-2">
                  <div className="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></div>
                  <span className="text-md font-bold text-white tracking-wide">E2EE Core Cloud</span>
                </div>
                <button 
                  onClick={handleLogout}
                  className="p-1.5 hover:bg-red-950/20 text-red-400 rounded-lg border border-transparent hover:border-red-900/30 transition text-xs font-semibold uppercase tracking-wider"
                >
                  Выйти
                </button>
              </div>

              {/* Secure Chat Finder */}
              <form onSubmit={handleSearchUser} className="bg-[#0a0f1d] p-3.5 border-b border-slate-800/80 shrink-0 space-y-2">
                <label className="block text-[10px] text-slate-500 uppercase font-bold tracking-widest">Найти собеседника по ID</label>
                <div className="flex gap-2">
                  <input 
                    type="text"
                    placeholder="Например: bob_pfs"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="flex-1 bg-[#050811] text-xs text-white px-3.5 py-2.5 rounded-xl border border-slate-800 focus:outline-none focus:border-emerald-500 transition"
                  />
                  <button 
                    type="submit"
                    className="px-4 py-2.5 bg-[#151f38] hover:bg-[#1a2849] text-xs font-bold text-emerald-400 border border-slate-800 rounded-xl transition uppercase tracking-wider"
                  >
                    Поиск
                  </button>
                </div>
              </form>

              {/* active Chats Area */}
              <div className="flex-1 overflow-y-auto divide-y divide-slate-800/40 scroll-hidden">
                {chats.length === 0 ? (
                  <div className="p-12 text-center text-slate-500 text-xs space-y-2">
                    <svg className="w-10 h-10 text-slate-600 mx-auto" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z" />
                    </svg>
                    <p>Нет активных секретных чатов.</p>
                  </div>
                ) : (
                  chats.map(chat => (
                    <div 
                      key={chat.id}
                      onClick={() => setActiveChat(chat)}
                      className="p-4 flex items-center gap-3.5 active:bg-[#111a31] cursor-pointer transition border-b border-slate-900"
                    >
                      <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-600 to-teal-700 text-black font-extrabold flex items-center justify-center text-sm shrink-0 uppercase">
                        {chat.name.slice(0, 2)}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center justify-between">
                          <span className="font-bold text-xs text-white truncate">{chat.name}</span>
                          <span className="text-[9px] text-emerald-400 uppercase font-bold tracking-wider">E2EE</span>
                        </div>
                        <p className="text-[11px] text-slate-400 truncate mt-1">{chat.lastMsgText}</p>
                      </div>
                    </div>
                  ))
                )}
              </div>

            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
