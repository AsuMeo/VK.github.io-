</head>

<script>
// ═══════════════════════════════════════════════════════════════

let currentUser = null;
let playerId = null;

let velocity = { x: 0, z: 0 };
let isJumping = false;

const GRAVITY = 0.015;

// ═══════════════════════════════════════════════════════════════
// PATCH 3: AUTH FUNCTIONS
// ═══════════════════════════════════════════════════════════════
function showError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.style.display = 'block';
}

function login() {
    const email = document.getElementById('email').value;
    const pass = document.getElementById('password').value;
    if(!email || !pass) { showError('Введите email и пароль'); return; }
    auth.signInWithEmailAndPassword(email, pass).catch(e => showError(e.message));
}

function register() {
    const email = document.getElementById('email').value;
    const pass = document.getElementById('password').value;
    if(!email || !pass) { showError('Введите email и пароль'); return; }
    if(pass.length < 6) { showError('Пароль минимум 6 символов'); return; }
    auth.createUserWithEmailAndPassword(email, pass).catch(e => showError(e.message));
}

// ═══════════════════════════════════════════════════════════════
// PATCH 4: THREE.JS SCENE SETUP
// ═══════════════════════════════════════════════════════════════
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a15);
scene.fog = new THREE.Fog(0x0a0a15, 10, 40);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 1.7, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// ═══════════════════════════════════════════════════════════════
// PATCH 5: BUILD CINEMA
// ═══════════════════════════════════════════════════════════════
function buildCinema() {
    // Floor
    const floorGeo = new THREE.PlaneGeometry(30, 30);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI/2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Floor grid pattern
    const gridHelper = new THREE.GridHelper(30, 30, 0x333355, 0x222244);
    scene.add(gridHelper);

    // Walls
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x16213e, roughness: 0.9 });

    // Back wall
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(30, 10), wallMat);
    backWall.position.set(0, 5, -15);
    backWall.receiveShadow = true;
    scene.add(backWall);

    // Side walls
    const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(30, 10), wallMat);
    leftWall.position.set(-15, 5, 0);
    leftWall.rotation.y = Math.PI/2;
    leftWall.receiveShadow = true;
    scene.add(leftWall);

    const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(30, 10), wallMat);
    rightWall.position.set(15, 5, 0);
    rightWall.rotation.y = -Math.PI/2;
    rightWall.receiveShadow = true;
    scene.add(rightWall);

    // Ceiling
    const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x0f0f1a }));
    ceiling.position.y = 10;
    ceiling.rotation.x = Math.PI/2;
    scene.add(ceiling);

    // BIG SCREEN
    const screenGeo = new THREE.PlaneGeometry(14, 8);
    videoElement = document.createElement('video');
    videoElement.crossOrigin = 'anonymous';
    videoElement.loop = true;
    videoElement.muted = true;
    videoElement.playsInline = true;

    videoTexture = new THREE.VideoTexture(videoElement);
    videoTexture.minFilter = THREE.LinearFilter;
    videoTexture.magFilter = THREE.LinearFilter;

    const screenMat = new THREE.MeshBasicMaterial({ map: videoTexture });
    screenMesh = new THREE.Mesh(screenGeo, screenMat);
    screenMesh.position.set(0, 4.5, -14.8);
    scene.add(screenMesh);

    // Screen frame
    const frameGeo = new THREE.BoxGeometry(14.4, 8.4, 0.2);
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
    const frame = new THREE.Mesh(frameGeo, frameMat);
    frame.position.set(0, 4.5, -14.9);
    scene.add(frame);

    // Screen glow
    const glowGeo = new THREE.PlaneGeometry(14.5, 8.5);
    const glowMat = new THREE.MeshBasicMaterial({ color: 0x3344aa, transparent: true, opacity: 0.15, side: THREE.BackSide });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    glow.position.set(0, 4.5, -14.7);
    scene.add(glow);

    // Seats rows
    const seatMat = new THREE.MeshStandardMaterial({ color: 0x8b0000 });
    const seatBackMat = new THREE.MeshStandardMaterial({ color: 0x660000 });

    for(let row = 0; row < 5; row++) {
        for(let col = -4; col <= 4; col++) {
            // Seat base
            const seat = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.3, 1), seatMat);
            seat.position.set(col * 1.8, 0.5, 5 - row * 2.5);
            seat.castShadow = true;
            scene.add(seat);

            // Seat back
            const back = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 0.15), seatBackMat);
            back.position.set(col * 1.8, 1.1, 5.4 - row * 2.5);
            back.castShadow = true;
            scene.add(back);
        }
    }

    // Lights
    const ambient = new THREE.AmbientLight(0x404060, 0.5);
    scene.add(ambient);

    const spot = new THREE.SpotLight(0xffffff, 0.8);
    spot.position.set(0, 9, -5);
    spot.angle = Math.PI/4;
    spot.penumbra = 0.5;
    spot.castShadow = true;
    scene.add(spot);

    // Screen light reflection
    const screenLight = new THREE.PointLight(0x6688ff, 0.3, 20);
    screenLight.position.set(0, 4.5, -10);
    scene.add(screenLight);
}

buildCinema();

// ═══════════════════════════════════════════════════════════════
// PATCH 6: PLAYER MESH CREATOR
// ═══════════════════════════════════════════════════════════════
function createPlayerMesh(pid, isLocal) {
    const group = new THREE.Group();

    // Body
    const bodyGeo = new THREE.CapsuleGeometry(0.3, 0.8, 4, 8);
    const bodyMat = new THREE.MeshStandardMaterial({ 
        color: isLocal ? 0xe94560 : 0x44aa88,
        emissive: isLocal ? 0x331111 : 0x002211,
        emissiveIntensity: 0.3
    });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.7;
    body.castShadow = true;
    group.add(body);

    // Head
    const headGeo = new THREE.SphereGeometry(0.25, 16, 16);
    const head = new THREE.Mesh(headGeo, bodyMat);
    head.position.y = 1.45;
    head.castShadow = true;
    group.add(head);

    // Name label
    if(!isLocal) {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.roundRect(0, 0, 256, 64, 16);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(pid.substring(0, 8), 128, 40);

        const tex = new THREE.CanvasTexture(canvas);
        const labelGeo = new THREE.PlaneGeometry(1.5, 0.375);
        const labelMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
        const label = new THREE.Mesh(labelGeo, labelMat);
        label.position.y = 2.1;
        label.rotation.x = -0.2;
        group.add(label);
    }

    scene.add(group);
    return group;
}

// ═══════════════════════════════════════════════════════════════
// PATCH 7: MOBILE CONTROLS (ANDROID ONLY)
// ═══════════════════════════════════════════════════════════════
function setupMobileControls() {
    const joystickArea = document.getElementById('joystick-area');
    const joystickKnob = document.getElementById('joystick-knob');
    const btnJump = document.getElementById('btn-jump');
    const btnScreen = document.getElementById('btn-screen');

    let joyStart = { x: 0, y: 0 };
    let joyCenter = { x: 0, y: 0 };

    joystickArea.addEventListener('touchstart', e => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = joystickArea.getBoundingClientRect();
        joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
        joyStart = { x: touch.clientX, y: touch.clientY };
        joystickData.active = true;
    }, {passive:false});

    joystickArea.addEventListener('touchmove', e => {
        e.preventDefault();
        if(!joystickData.active) return;
        const touch = e.touches[0];
        const dx = touch.clientX - joyCenter.x;
        const dy = touch.clientY - joyCenter.y;
        const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 35);
        const angle = Math.atan2(dy, dx);

        joystickKnob.style.transform = `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px))`;
        joystickData.dx = (Math.cos(angle) * dist) / 35;
        joystickData.dy = (Math.sin(angle) * dist) / 35;
    }, {passive:false});

    const endJoy = e => {
        e.preventDefault();
        joystickData.active = false;
        joystickData.dx = 0;
        joystickData.dy = 0;
        joystickKnob.style.transform = 'translate(-50%, -50%)';
    };
    joystickArea.addEventListener('touchend', endJoy, {passive:false});
    joystickArea.addEventListener('touchcancel', endJoy, {passive:false});

    btnJump.addEventListener('touchstart', e => {
        e.preventDefault();
        if(!isJumping) { isJumping = true; jumpVelocity = JUMP_FORCE; }
    }, {passive:false});

    btnScreen.addEventListener('touchstart', e => {
        e.preventDefault();
        openVideoSelector();
    }, {passive:false});
}

// ═══════════════════════════════════════════════════════════════
// PATCH 8: VIDEO SYSTEM (BASE64 + RTDB SYNC)
// ═══════════════════════════════════════════════════════════════

function loadGallery() {

function playFromUrl() {
    const url = document.getElementById('video-url').value.trim();
    if(!url) return;
    setVideo(url);
}

function setVideo(url) {
    closeVideoSelector();
    // Sync to Firebase RTDB
    db.ref('cinema/video').set({
        url: url,
        timestamp: Date.now(),
        action: 'play',
        seek: 0,
        by: playerId
    });
}

function syncVideo(data) {
    if(!data || !data.url) return;
    if(videoElement.src === data.url) {
        // Same video, sync time
        const diff = Math.abs(videoElement.currentTime - (data.seek || 0));
        if(diff > 2) videoElement.currentTime = data.seek || 0;
        if(data.action === 'play' && videoElement.paused) videoElement.play();
        if(data.action === 'pause' && !videoElement.paused) videoElement.pause();
    } else {
        videoElement.src = data.url;
        videoElement.currentTime = data.seek || 0;
        videoElement.play().catch(()=>{});
    }
}

// ═══════════════════════════════════════════════════════════════
// PATCH 9: FIREBASE RTDB REALTIME PLAYERS
// ═══════════════════════════════════════════════════════════════
function initRealtime() {
    playerId = currentUser.uid;
    const name = currentUser.email.split('@')[0];
    document.getElementById('player-name').textContent = name;

    // My player ref
    const myRef = db.ref('cinema/players/' + playerId);

    // On disconnect remove
    myRef.onDisconnect().remove();

    // Update my position loop
    setInterval(() => {
        if(!currentUser) return;
        myRef.set({
            x: myPos.x,
            y: myPos.y,
            z: myPos.z,
            ry: myRot.y,
            name: name,
            lastSeen: Date.now()
        });
    }, 100);

    // Listen all players
    db.ref('cinema/players').on('value', snap => {
        const data = snap.val() || {};
        const now = Date.now();

        Object.keys(data).forEach(pid => {
            if(pid === playerId) return;
            const p = data[pid];

            // Remove inactive (>5sec)
            if(now - p.lastSeen > 5000) {
                if(playerMeshes[pid]) {
                    scene.remove(playerMeshes[pid]);
                    delete playerMeshes[pid];
                }
                delete players[pid];
                return;
            }

            if(!playerMeshes[pid]) {
                playerMeshes[pid] = createPlayerMesh(pid, false);
            }

            // Smooth lerp
            const mesh = playerMeshes[pid];
            mesh.position.x += (p.x - mesh.position.x) * 0.2;
            mesh.position.y += (p.y - mesh.position.y) * 0.2;
            mesh.position.z += (p.z - mesh.position.z) * 0.2;
            mesh.rotation.y = p.ry || 0;

            players[pid] = p;
        });

        // Cleanup disconnected
        Object.keys(playerMeshes).forEach(pid => {
            if(!data[pid] || pid === playerId) {
                scene.remove(playerMeshes[pid]);
                delete playerMeshes[pid];
                delete players[pid];
            }
        });

        document.getElementById('online-count').textContent = 'Онлайн: ' + (Object.keys(data).length);
    });

    // Listen video sync
    db.ref('cinema/video').on('value', snap => {
        syncVideo(snap.val());
    });

    // Sync video time periodically
    setInterval(() => {
        if(videoElement && !videoElement.paused && videoElement.src) {
            db.ref('cinema/video/seek').set(videoElement.currentTime);
        }
    }, 2000);
}

// ═══════════════════════════════════════════════════════════════
// PATCH 10: GAME LOOP & PHYSICS
// ═══════════════════════════════════════════════════════════════
function updatePhysics() {
    // Movement from joystick
    if(joystickData.active) {
        const forward = -joystickData.dy;
        const right = joystickData.dx;

        myPos.x += Math.sin(myRot.y) * forward * SPEED + Math.cos(myRot.y) * right * SPEED;
        myPos.z += Math.cos(myRot.y) * forward * SPEED - Math.sin(myRot.y) * right * SPEED;

        // Rotate towards movement
        if(Math.abs(forward) > 0.1 || Math.abs(right) > 0.1) {
            myRot.y = Math.atan2(Math.sin(myRot.y) * forward + Math.cos(myRot.y) * right,
                                 Math.cos(myRot.y) * forward - Math.sin(myRot.y) * right);
        }
    }

    // Bounds
    myPos.x = Math.max(-13, Math.min(13, myPos.x));
    myPos.z = Math.max(-13, Math.min(13, myPos.z));

    // Jump physics
    if(isJumping) {
        myPos.y += jumpVelocity;
        jumpVelocity -= GRAVITY;
        if(myPos.y <= 1.7) {
            myPos.y = 1.7;
            isJumping = false;
            jumpVelocity = 0;
        }
    }

    // Camera follow
    camera.position.set(myPos.x, myPos.y, myPos.z);
    camera.rotation.y = myRot.y;

    // Check near screen
    const distToScreen = Math.sqrt(myPos.x*myPos.x + (myPos.z + 14.8)*(myPos.z + 14.8));
    isNearScreen = distToScreen < 6;
    document.getElementById('screen-hint').style.display = isNearScreen ? 'block' : 'none';
}

// ═══════════════════════════════════════════════════════════════
// PATCH 11: RENDER LOOP
// ═══════════════════════════════════════════════════════════════
function animate() {
    requestAnimationFrame(animate);

    if(videoTexture) videoTexture.update();
    updatePhysics();
    renderer.render(scene, camera);
}

// ═══════════════════════════════════════════════════════════════
// PATCH 12: AUTH STATE & INIT
// ═══════════════════════════════════════════════════════════════
auth.onAuthStateChanged(user => {
    if(user) {
        currentUser = user;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        document.getElementById('mobile-controls').style.display = 'block';
        document.getElementById('loading').style.display = 'none';

        setupMobileControls();
        initRealtime();
        animate();
    } else {
        document.getElementById('loading').style.display = 'none';
    }
});

// Resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
