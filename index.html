<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D Messenger — Miside Style</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.0/firebase-database-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.0/firebase-storage-compat.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#0a0a0f; font-family:'Inter',sans-serif; }

/* ===== AUTH SCREEN ===== */
.auth-screen {
  position:fixed; inset:0; z-index:1000;
  background:radial-gradient(ellipse at 30% 20%, #1a0a2e 0%, #0a0a0f 60%, #050508 100%);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  transition:opacity 0.8s ease;
}
.auth-screen.hidden { opacity:0; pointer-events:none; }
.auth-container {
  width:min(90vw,420px); padding:clamp(24px,4vw,48px);
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:24px; backdrop-filter:blur(20px);
  box-shadow:0 0 60px rgba(120,80,255,0.1), inset 0 0 60px rgba(120,80,255,0.02);
}
.auth-logo {
  font-family:'Orbitron',sans-serif; font-size:clamp(28px,5vw,42px);
  font-weight:900; text-align:center; margin-bottom:8px;
  background:linear-gradient(135deg,#ff6b6b,#4ecdc4,#a855f7);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text; letter-spacing:2px;
}
.auth-sub { text-align:center; color:rgba(255,255,255,0.4); font-size:14px; margin-bottom:32px; }
.auth-input {
  width:100%; padding:14px 18px; margin-bottom:16px;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
  border-radius:14px; color:#fff; font-size:15px; outline:none;
  transition:all 0.3s; font-family:'Inter',sans-serif;
}
.auth-input:focus { border-color:rgba(120,80,255,0.5); box-shadow:0 0 20px rgba(120,80,255,0.15); }
.auth-input::placeholder { color:rgba(255,255,255,0.25); }
.auth-btn {
  width:100%; padding:16px; border:none; border-radius:14px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff; font-size:16px; font-weight:600; cursor:pointer;
  transition:all 0.3s; margin-top:8px; font-family:'Inter',sans-serif;
}
.auth-btn:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(102,126,234,0.4); }
.auth-btn:active { transform:translateY(0); }
.auth-toggle { text-align:center; color:rgba(255,255,255,0.4); font-size:13px; margin-top:20px; cursor:pointer; }
.auth-toggle span { color:#667eea; font-weight:600; }
.auth-error { color:#ff6b6b; font-size:13px; text-align:center; margin-top:12px; min-height:20px; }
.auth-mode { display:none; }
.auth-mode.active { display:block; }

/* ===== MAIN UI ===== */
.main-ui { display:none; width:100%; height:100%; position:relative; }
.main-ui.active { display:block; }

/* Top Bar */
.top-bar {
  position:fixed; top:0; left:0; right:0; z-index:100;
  height:clamp(56px,8vh,72px);
  background:linear-gradient(180deg,rgba(10,10,15,0.95) 0%,rgba(10,10,15,0.7) 70%,transparent 100%);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 clamp(12px,3vw,24px); backdrop-filter:blur(12px);
}
.top-bar .logo-text {
  font-family:'Orbitron',sans-serif; font-size:clamp(16px,3vw,22px);
  font-weight:700; color:#fff; letter-spacing:1px;
}
.top-bar .user-info { display:flex; align-items:center; gap:12px; }
.top-bar .avatar {
  width:36px; height:36px; border-radius:50%;
  background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:14px; color:#fff;
  border:2px solid rgba(255,255,255,0.1);
}
.top-bar .logout-btn {
  padding:8px 16px; border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.7);
  border-radius:10px; font-size:13px; cursor:pointer; transition:all 0.3s;
}
.top-bar .logout-btn:hover { background:rgba(255,100,100,0.15); border-color:rgba(255,100,100,0.3); color:#ff8888; }

/* Side Panel — Users */
.side-panel {
  position:fixed; top:clamp(56px,8vh,72px); left:0; bottom:0; z-index:90;
  width:clamp(260px,30vw,340px);
  background:rgba(10,10,15,0.85); backdrop-filter:blur(20px);
  border-right:1px solid rgba(255,255,255,0.06);
  transform:translateX(-100%); transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);
  display:flex; flex-direction:column;
}
.side-panel.open { transform:translateX(0); }
.panel-header {
  padding:clamp(16px,3vw,24px); border-bottom:1px solid rgba(255,255,255,0.06);
}
.panel-header h3 {
  font-family:'Orbitron',sans-serif; font-size:clamp(14px,2.5vw,18px);
  color:#fff; margin-bottom:12px;
}
.search-box {
  width:100%; padding:12px 16px;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
  border-radius:12px; color:#fff; font-size:14px; outline:none;
}
.search-box::placeholder { color:rgba(255,255,255,0.3); }
.users-list { flex:1; overflow-y:auto; padding:8px; }
.user-item {
  display:flex; align-items:center; gap:12px;
  padding:12px; border-radius:14px; cursor:pointer;
  transition:all 0.2s; margin-bottom:4px;
}
.user-item:hover { background:rgba(255,255,255,0.06); }
.user-item.active { background:rgba(102,126,234,0.15); border:1px solid rgba(102,126,234,0.3); }
.user-item .u-avatar {
  width:44px; height:44px; border-radius:50%;
  background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:16px; color:#fff; flex-shrink:0;
}
.user-item .u-info { flex:1; min-width:0; }
.user-item .u-name { color:#fff; font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.user-item .u-username { color:rgba(255,255,255,0.4); font-size:12px; }
.user-item .u-status {
  width:10px; height:10px; border-radius:50%; background:#22c55e;
  box-shadow:0 0 8px #22c55e; flex-shrink:0;
}
.user-item .u-status.offline { background:#6b7280; box-shadow:none; }

/* Toggle Panel Button */
.panel-toggle {
  position:fixed; top:50%; left:0; z-index:95;
  transform:translateY(-50%);
  width:40px; height:80px;
  background:rgba(102,126,234,0.2); border:1px solid rgba(102,126,234,0.3);
  border-radius:0 12px 12px 0; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:18px; transition:all 0.3s;
  backdrop-filter:blur(10px);
}
.panel-toggle:hover { background:rgba(102,126,234,0.35); }
.panel-toggle.open { left:clamp(260px,30vw,340px); }

/* 3D Room Canvas */
#room-canvas {
  position:fixed; inset:0; z-index:1;
  width:100%; height:100%;
}

/* Bottom Input Bar */
.input-bar {
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  padding:clamp(8px,2vh,16px) clamp(12px,3vw,24px);
  background:linear-gradient(0deg,rgba(10,10,15,0.95) 0%,rgba(10,10,15,0.7) 60%,transparent 100%);
  display:flex; align-items:center; gap:12px; backdrop-filter:blur(12px);
}
.input-bar .msg-input {
  flex:1; padding:14px 20px;
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  border-radius:16px; color:#fff; font-size:15px; outline:none;
  transition:all 0.3s; font-family:'Inter',sans-serif;
}
.input-bar .msg-input:focus { border-color:rgba(102,126,234,0.5); box-shadow:0 0 20px rgba(102,126,234,0.1); }
.input-bar .msg-input::placeholder { color:rgba(255,255,255,0.3); }
.input-bar .send-btn, .input-bar .attach-btn {
  width:48px; height:48px; border-radius:50%;
  border:none; cursor:pointer; display:flex;
  align-items:center; justify-content:center;
  font-size:20px; transition:all 0.3s; flex-shrink:0;
}
.input-bar .attach-btn {
  background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.6);
  border:1px solid rgba(255,255,255,0.1);
}
.input-bar .attach-btn:hover { background:rgba(255,255,255,0.15); color:#fff; }
.input-bar .send-btn {
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff; box-shadow:0 4px 20px rgba(102,126,234,0.3);
}
.input-bar .send-btn:hover { transform:scale(1.05); box-shadow:0 6px 30px rgba(102,126,234,0.5); }
.input-bar .send-btn:active { transform:scale(0.95); }

/* Chat Partner Name (centered above input) */
.chat-partner {
  position:fixed; bottom:clamp(72px,10vh,90px); left:50%; transform:translateX(-50%);
  z-index:80; text-align:center; pointer-events:none;
}
.chat-partner .partner-name {
  font-family:'Orbitron',sans-serif; font-size:clamp(14px,2.5vw,20px);
  color:rgba(255,255,255,0.8); text-shadow:0 0 30px rgba(102,126,234,0.5);
  letter-spacing:2px;
}
.chat-partner .partner-hint {
  color:rgba(255,255,255,0.3); font-size:12px; margin-top:4px;
}

/* ===== MISIDE TEXT EFFECT ===== */
.miside-text-container {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:50; pointer-events:none; text-align:center;
}
.miside-letter {
  display:inline-block; font-family:'Orbitron',sans-serif;
  font-size:clamp(48px,10vw,120px); font-weight:900;
  color:#fff; text-shadow:
    0 0 10px rgba(255,255,255,0.5),
    0 0 40px rgba(102,126,234,0.4),
    0 0 80px rgba(102,126,234,0.2);
  opacity:0; transform:scale(0.5) translateY(30px);
}

/* ===== 3D MEDIA VIEWER ===== */
.media-viewer {
  position:fixed; inset:0; z-index:200;
  background:rgba(0,0,0,0.9); backdrop-filter:blur(20px);
  display:none; align-items:center; justify-content:center;
}
.media-viewer.active { display:flex; }
.media-viewer .media-3d {
  width:min(80vw,600px); height:min(60vh,500px);
  border-radius:16px; overflow:hidden;
  box-shadow:0 0 60px rgba(102,126,234,0.3);
  cursor:grab; transform-style:preserve-3d;
  perspective:1000px;
}
.media-viewer .media-3d:active { cursor:grabbing; }
.media-viewer .media-3d img, .media-viewer .media-3d video {
  width:100%; height:100%; object-fit:cover; pointer-events:none;
}
.media-viewer .close-media {
  position:absolute; top:20px; right:20px;
  width:48px; height:48px; border-radius:50%;
  background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
  color:#fff; font-size:24px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.3s;
}
.media-viewer .close-media:hover { background:rgba(255,100,100,0.3); }
.media-viewer .media-hint {
  position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,0.5); font-size:13px; text-align:center;
}

/* Typing indicator */
.typing-indicator {
  position:fixed; bottom:clamp(100px,14vh,120px); left:50%; transform:translateX(-50%);
  z-index:80; display:none; align-items:center; gap:6px;
  background:rgba(0,0,0,0.5); padding:8px 16px; border-radius:20px;
}
.typing-indicator.active { display:flex; }
.typing-indicator span {
  width:6px; height:6px; border-radius:50%; background:#667eea;
  animation:typingBounce 1.4s infinite ease-in-out both;
}
.typing-indicator span:nth-child(1) { animation-delay:-0.32s; }
.typing-indicator span:nth-child(2) { animation-delay:-0.16s; }
@keyframes typingBounce {
  0%,80%,100% { transform:scale(0); }
  40% { transform:scale(1); }
}

/* Scrollbar */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:4px; }

/* Loading */
.loading-overlay {
  position:fixed; inset:0; z-index:9999;
  background:#0a0a0f; display:flex;
  align-items:center; justify-content:center; flex-direction:column;
  transition:opacity 0.5s;
}
.loading-overlay.hidden { opacity:0; pointer-events:none; }
.loading-overlay .loader {
  width:60px; height:60px; border:3px solid rgba(102,126,234,0.2);
  border-top-color:#667eea; border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.loading-overlay p { color:rgba(255,255,255,0.5); margin-top:16px; font-size:14px; }

/* Responsive */
@media (max-width:600px) {
  .side-panel { width:80vw; }
  .panel-toggle.open { left:80vw; }
}
</style>
</head>
<body>

<!-- Loading -->
<div class="loading-overlay" id="loading"><div class="loader"></div><p>Загрузка 3D мира...</p></div>

<!-- Auth Screen -->
<div class="auth-screen" id="authScreen">
  <div class="auth-container">
    <div class="auth-logo">3D MESSENGER</div>
    <div class="auth-sub">Miside Style · Realtime · 3D Room</div>

    <!-- Login -->
    <div class="auth-mode active" id="loginMode">
      <input type="email" class="auth-input" id="loginEmail" placeholder="Email" autocomplete="email">
      <input type="password" class="auth-input" id="loginPass" placeholder="Пароль" autocomplete="current-password">
      <button class="auth-btn" onclick="doLogin()">Войти</button>
      <div class="auth-error" id="loginError"></div>
      <div class="auth-toggle">Нет аккаунта? <span onclick="switchAuth('register')">Создать</span></div>
    </div>

    <!-- Register -->
    <div class="auth-mode" id="registerMode">
      <input type="text" class="auth-input" id="regUsername" placeholder="Username (для поиска)" maxlength="20">
      <input type="email" class="auth-input" id="regEmail" placeholder="Email" autocomplete="email">
      <input type="password" class="auth-input" id="regPass" placeholder="Пароль (мин. 6 символов)" autocomplete="new-password">
      <button class="auth-btn" onclick="doRegister()">Создать аккаунт</button>
      <div class="auth-error" id="regError"></div>
      <div class="auth-toggle">Уже есть аккаунт? <span onclick="switchAuth('login')">Войти</span></div>
    </div>
  </div>
</div>

<!-- Main UI -->
<div class="main-ui" id="mainUI">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="logo-text">3D MESSENGER</div>
    <div class="user-info">
      <div class="avatar" id="userAvatar">?</div>
      <button class="logout-btn" onclick="doLogout()">Выйти</button>
    </div>
  </div>

  <!-- Panel Toggle -->
  <div class="panel-toggle" id="panelToggle" onclick="togglePanel()">›</div>

  <!-- Side Panel -->
  <div class="side-panel" id="sidePanel">
    <div class="panel-header">
      <h3>👥 Пользователи</h3>
      <input type="text" class="search-box" id="userSearch" placeholder="Поиск по username..." oninput="searchUsers()">
    </div>
    <div class="users-list" id="usersList"></div>
  </div>

  <!-- 3D Room Canvas -->
  <canvas id="room-canvas"></canvas>

  <!-- Chat Partner -->
  <div class="chat-partner" id="chatPartner">
    <div class="partner-name" id="partnerName">Выберите собеседника</div>
    <div class="partner-hint">Сообщения появятся в 3D пространстве</div>
  </div>

  <!-- Typing -->
  <div class="typing-indicator" id="typingIndicator">
    <span></span><span></span><span></span>
  </div>

  <!-- Input Bar -->
  <div class="input-bar">
    <button class="attach-btn" onclick="triggerFile()" title="Фото/Видео">📎</button>
    <input type="file" id="fileInput" accept="image/*,video/*" style="display:none" onchange="handleFile(this)">
    <input type="text" class="msg-input" id="msgInput" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter')sendMessage()" oninput="onTyping()">
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- Media Viewer -->
<div class="media-viewer" id="mediaViewer">
  <button class="close-media" onclick="closeMedia()">✕</button>
  <div class="media-3d" id="media3d"></div>
  <div class="media-hint">🖱 Перетаскивайте для вращения · 📱 Свайпайте</div>
</div>

<!-- Miside Text Container -->
<div class="miside-text-container" id="misideContainer"></div>

<script>
// ===== FIREBASE INIT =====
const firebaseConfig = {
  apiKey: "AIzaSyBm0mIvHVznIeF2PoFk6dtdaiT5r877wyA",
  authDomain: "meow-874ce.firebaseapp.com",
  databaseURL: "https://meow-874ce-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "meow-874ce",
  storageBucket: "meow-874ce.firebasestorage.app",
  messagingSenderId: "471541334599",
  appId: "1:471541334599:web:567af3e7dbe70a37572762"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const storage = firebase.storage();

// ===== STATE =====
let currentUser = null;
let currentPartner = null;
let chatId = null;
let typingTimeout = null;
let scene, camera, renderer, roomGroup;
let messages3D = [];
let mediaObjects = [];
let animationId;
let isPanelOpen = false;

// ===== AUTH =====
function switchAuth(mode) {
  document.querySelectorAll('.auth-mode').forEach(m=>m.classList.remove('active'));
  document.getElementById(mode+'Mode').classList.add('active');
  document.getElementById('loginError').textContent='';
  document.getElementById('regError').textContent='';
}

function doRegister() {
  const username = document.getElementById('regUsername').value.trim().toLowerCase();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  const err = document.getElementById('regError');
  if(!username||!email||!pass){err.textContent='Заполните все поля';return;}
  if(pass.length<6){err.textContent='Пароль минимум 6 символов';return;}
  if(!/^[a-z0-9_]+$/.test(username)){err.textContent='Username: a-z, 0-9, _';return;}

  db.ref('usernames/'+username).once('value').then(snap=>{
    if(snap.exists()){err.textContent='Username занят';return;}
    auth.createUserWithEmailAndPassword(email,pass).then(cred=>{
      const uid = cred.user.uid;
      db.ref('users/'+uid).set({
        username: username,
        email: email,
        displayName: username,
        createdAt: Date.now(),
        online: true
      });
      db.ref('usernames/'+username).set(uid);
    }).catch(e=>err.textContent=e.message);
  });
}

function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  auth.signInWithEmailAndPassword(email,pass)
    .catch(e=>err.textContent=e.message);
}

function doLogout() {
  if(currentUser) db.ref('users/'+currentUser.uid+'/online').set(false);
  auth.signOut();
}

auth.onAuthStateChanged(user=>{
  if(user){
    currentUser = user;
    db.ref('users/'+user.uid).once('value').then(snap=>{
      const data = snap.val()||{};
      const name = data.displayName || data.username || user.email.split('@')[0];
      document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
      db.ref('users/'+user.uid+'/online').set(true);
      db.ref('users/'+user.uid+'/lastSeen').set(Date.now());
    });
    document.getElementById('authScreen').classList.add('hidden');
    setTimeout(()=>{
      document.getElementById('authScreen').style.display='none';
      document.getElementById('mainUI').classList.add('active');
      init3DRoom();
      loadUsers();
      document.getElementById('loading').classList.add('hidden');
    },800);
  } else {
    currentUser = null;
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('authScreen').classList.remove('hidden');
    document.getElementById('mainUI').classList.remove('active');
    document.getElementById('loading').classList.remove('hidden');
    if(renderer) { renderer.dispose(); cancelAnimationFrame(animationId); }
  }
});

// ===== USERS =====
function loadUsers() {
  db.ref('users').on('value',snap=>{
    const users = snap.val()||{};
    const list = document.getElementById('usersList');
    list.innerHTML = '';
    Object.entries(users).forEach(([uid,data])=>{
      if(uid===currentUser.uid) return;
      const div = document.createElement('div');
      div.className = 'user-item';
      div.dataset.uid = uid;
      div.dataset.username = (data.username||'').toLowerCase();
      div.onclick = ()=>selectUser(uid,data);
      div.innerHTML = `
        <div class="u-avatar">${(data.displayName||data.username||'U').charAt(0).toUpperCase()}</div>
        <div class="u-info">
          <div class="u-name">${data.displayName||data.username||'User'}</div>
          <div class="u-username">@${data.username||'user'}</div>
        </div>
        <div class="u-status ${data.online?'':'offline'}"></div>
      `;
      list.appendChild(div);
    });
  });
}

function searchUsers() {
  const q = document.getElementById('userSearch').value.toLowerCase();
  document.querySelectorAll('.user-item').forEach(item=>{
    const uname = item.dataset.username;
    item.style.display = uname.includes(q) ? 'flex' : 'none';
  });
}

function selectUser(uid,data) {
  currentPartner = {uid,...data};
  document.querySelectorAll('.user-item').forEach(i=>i.classList.remove('active'));
  document.querySelector(`.user-item[data-uid="${uid}"]`).classList.add('active');
  document.getElementById('partnerName').textContent = data.displayName||data.username;

  const ids = [currentUser.uid,uid].sort();
  chatId = ids.join('_');

  // Clear old messages
  messages3D.forEach(m=>roomGroup.remove(m.mesh));
  messages3D = [];
  mediaObjects.forEach(m=>roomGroup.remove(m.mesh));
  mediaObjects = [];

  // Load chat history
  db.ref('chats/'+chatId).off();
  db.ref('chats/'+chatId).limitToLast(20).on('child_added',snap=>{
    const msg = snap.val();
    if(msg.sender!==currentUser.uid) showMisideText(msg.text||'📎 Медиа');
    if(msg.mediaUrl) create3DMedia(msg.mediaUrl, msg.mediaType, msg.sender===currentUser.uid);
  });

  // Typing listener
  db.ref('typing/'+uid+'/'+currentUser.uid).on('value',snap=>{
    document.getElementById('typingIndicator').classList.toggle('active', snap.val()===true);
  });
}

function togglePanel() {
  isPanelOpen = !isPanelOpen;
  document.getElementById('sidePanel').classList.toggle('open', isPanelOpen);
  document.getElementById('panelToggle').classList.toggle('open', isPanelOpen);
  document.getElementById('panelToggle').textContent = isPanelOpen ? '‹' : '›';
}

// ===== MESSAGING =====
function onTyping() {
  if(!currentPartner) return;
  db.ref('typing/'+currentUser.uid+'/'+currentPartner.uid).set(true);
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(()=>{
    db.ref('typing/'+currentUser.uid+'/'+currentPartner.uid).set(false);
  },2000);
}

function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text || !chatId) return;

  const msg = {
    text: text,
    sender: currentUser.uid,
    timestamp: Date.now()
  };
  db.ref('chats/'+chatId).push(msg);
  input.value = '';
  showMisideText(text);
}

// ===== MISIDE TEXT EFFECT =====
function showMisideText(text) {
  const container = document.getElementById('misideContainer');
  container.innerHTML = '';

  const chars = text.split('');
  const spans = [];

  chars.forEach((char,i)=>{
    const span = document.createElement('span');
    span.className = 'miside-letter';
    span.textContent = char === ' ' ? ' ' : char;
    span.style.color = `hsl(${200 + Math.random()*60}, 80%, 70%)`;
    container.appendChild(span);
    spans.push(span);
  });

  // Appear animation
  spans.forEach((span,i)=>{
    gsap.to(span, {
      opacity:1, scale:1, y:0,
      duration:0.3, delay:i*0.05,
      ease:'back.out(1.7)'
    });
  });

  // Disappear animation (Miside style)
  const totalTime = Math.max(2000, chars.length * 300);
  setTimeout(()=>{
    spans.forEach((span,i)=>{
      gsap.to(span, {
        opacity:0, scale:0.3, y:-50,
        duration:0.4, delay:i*0.08,
        ease:'power2.in',
        onComplete:()=>{ if(i===spans.length-1) container.innerHTML=''; }
      });
    });
  }, totalTime);

  // Also add to 3D room as floating text
  add3DTextBubble(text);
}

// ===== 3D ROOM =====
function init3DRoom() {
  const canvas = document.getElementById('room-canvas');
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0a0f, 0.02);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 3, 8);
  camera.lookAt(0, 1, 0);

  renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;

  roomGroup = new THREE.Group();
  scene.add(roomGroup);

  // Floor
  const floorGeo = new THREE.PlaneGeometry(30, 30);
  const floorMat = new THREE.MeshStandardMaterial({
    color:0x0d0d15, roughness:0.8, metalness:0.3,
    transparent:true, opacity:0.9
  });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  roomGroup.add(floor);

  // Grid on floor
  const gridHelper = new THREE.GridHelper(30, 30, 0x333344, 0x1a1a2e);
  gridHelper.position.y = 0.01;
  roomGroup.add(gridHelper);

  // Walls (semi-transparent)
  const wallMat = new THREE.MeshStandardMaterial({
    color:0x0a0a12, transparent:true, opacity:0.3, side:THREE.DoubleSide
  });
  [-15,15].forEach(x=>{
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(30,15), wallMat);
    wall.position.set(x,7.5,0);
    wall.rotation.y = x>0?-Math.PI/2:Math.PI/2;
    roomGroup.add(wall);
  });
  [-15,15].forEach(z=>{
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(30,15), wallMat);
    wall.position.set(0,7.5,z);
    wall.rotation.y = z>0?Math.PI:0;
    roomGroup.add(wall);
  });

  // Floating particles
  const particlesGeo = new THREE.BufferGeometry();
  const particleCount = 200;
  const posArray = new Float32Array(particleCount*3);
  for(let i=0;i<particleCount*3;i++){
    posArray[i] = (Math.random()-0.5)*30;
  }
  particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray,3));
  const particlesMat = new THREE.PointsMaterial({
    size:0.05, color:0x667eea, transparent:true, opacity:0.6
  });
  const particles = new THREE.Points(particlesGeo, particlesMat);
  roomGroup.add(particles);

  // Lights
  const ambientLight = new THREE.AmbientLight(0x404080, 0.5);
  scene.add(ambientLight);

  const pointLight = new THREE.PointLight(0x667eea, 1, 20);
  pointLight.position.set(0, 8, 0);
  pointLight.castShadow = true;
  scene.add(pointLight);

  const pointLight2 = new THREE.PointLight(0xff6b6b, 0.5, 15);
  pointLight2.position.set(5, 5, 5);
  scene.add(pointLight2);

  const pointLight3 = new THREE.PointLight(0x4ecdc4, 0.5, 15);
  pointLight3.position.set(-5, 5, -5);
  scene.add(pointLight3);

  // Animate
  animate();

  // Resize
  window.addEventListener('resize',()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Touch/mouse orbit
  let isDragging = false;
  let prevX = 0, prevY = 0;
  let rotX = 0, rotY = 0;

  canvas.addEventListener('mousedown',e=>{isDragging=true;prevX=e.clientX;prevY=e.clientY;});
  canvas.addEventListener('mousemove',e=>{
    if(!isDragging) return;
    const dx = e.clientX-prevX;
    const dy = e.clientY-prevY;
    rotY += dx*0.005;
    rotX += dy*0.005;
    rotX = Math.max(-0.5, Math.min(0.5, rotX));
    camera.position.x = Math.sin(rotY)*8;
    camera.position.z = Math.cos(rotY)*8;
    camera.position.y = 3 + rotX*4;
    camera.lookAt(0,1,0);
    prevX=e.clientX; prevY=e.clientY;
  });
  canvas.addEventListener('mouseup',()=>isDragging=false);
  canvas.addEventListener('touchstart',e=>{
    isDragging=true;
    prevX=e.touches[0].clientX;
    prevY=e.touches[0].clientY;
  },{passive:true});
  canvas.addEventListener('touchmove',e=>{
    if(!isDragging) return;
    const dx = e.touches[0].clientX-prevX;
    const dy = e.touches[0].clientY-prevY;
    rotY += dx*0.005;
    rotX += dy*0.005;
    rotX = Math.max(-0.5, Math.min(0.5, rotX));
    camera.position.x = Math.sin(rotY)*8;
    camera.position.z = Math.cos(rotY)*8;
    camera.position.y = 3 + rotX*4;
    camera.lookAt(0,1,0);
    prevX=e.touches[0].clientX; prevY=e.touches[0].clientY;
  },{passive:true});
  canvas.addEventListener('touchend',()=>isDragging=false);
}

function animate() {
  animationId = requestAnimationFrame(animate);
  const time = Date.now()*0.001;

  // Float messages
  messages3D.forEach((m,i)=>{
    m.mesh.position.y = m.baseY + Math.sin(time+i)*0.3;
    m.mesh.rotation.y = Math.sin(time*0.5+i)*0.1;
  });

  // Float media
  mediaObjects.forEach((m,i)=>{
    m.mesh.position.y = m.baseY + Math.sin(time*0.8+i)*0.2;
    m.mesh.rotation.y += 0.005;
  });

  // Rotate particles
  roomGroup.children.forEach(child=>{
    if(child.isPoints) child.rotation.y = time*0.05;
  });

  renderer.render(scene, camera);
}

function add3DTextBubble(text) {
  if(!roomGroup) return;

  const canvas2d = document.createElement('canvas');
  const ctx = canvas2d.getContext('2d');
  canvas2d.width = 512; canvas2d.height = 128;
  ctx.fillStyle = 'rgba(102,126,234,0.2)';
  ctx.fillRect(0,0,512,128);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 32px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(text.substring(0,30), 256, 75);

  const texture = new THREE.CanvasTexture(canvas2d);
  const geo = new THREE.PlaneGeometry(4,1);
  const mat = new THREE.MeshBasicMaterial({map:texture, transparent:true, side:THREE.DoubleSide});
  const mesh = new THREE.Mesh(geo, mat);

  mesh.position.set(
    (Math.random()-0.5)*8,
    1.5 + Math.random()*3,
    (Math.random()-0.5)*8
  );
  mesh.lookAt(camera.position);

  roomGroup.add(mesh);
  messages3D.push({mesh, baseY:mesh.position.y});

  // Limit bubbles
  if(messages3D.length>10){
    const old = messages3D.shift();
    roomGroup.remove(old.mesh);
    old.mesh.geometry.dispose();
    old.mesh.material.dispose();
  }
}

// ===== MEDIA =====
function triggerFile() {
  document.getElementById('fileInput').click();
}

function handleFile(input) {
  const file = input.files[0];
  if(!file || !chatId) return;

  const isVideo = file.type.startsWith('video');
  const path = `media/${chatId}/${Date.now()}_${file.name}`;
  const ref = storage.ref(path);

  ref.put(file).then(()=>ref.getDownloadURL()).then(url=>{
    db.ref('chats/'+chatId).push({
      mediaUrl: url,
      mediaType: isVideo?'video':'image',
      sender: currentUser.uid,
      timestamp: Date.now()
    });
    create3DMedia(url, isVideo?'video':'image', true);
  });
  input.value = '';
}

function create3DMedia(url, type, isOwn) {
  if(!roomGroup) return;

  const loader = new THREE.TextureLoader();
  loader.load(url, texture=>{
    const aspect = texture.image.width / texture.image.height;
    const w = 3;
    const h = w / aspect;

    const geo = new THREE.PlaneGeometry(w, h);
    const mat = new THREE.MeshBasicMaterial({map:texture, side:THREE.DoubleSide});
    const mesh = new THREE.Mesh(geo, mat);

    mesh.position.set(
      (Math.random()-0.5)*6,
      2 + Math.random()*2,
      (Math.random()-0.5)*6
    );

    roomGroup.add(mesh);
    mediaObjects.push({mesh, baseY:mesh.position.y, url, type});

    // Click to view
    mesh.userData = {url, type};
  });
}

// Raycaster for clicking 3D media
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

document.getElementById('room-canvas').addEventListener('click',e=>{
  mouse.x = (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(roomGroup.children);
  for(let hit of intersects){
    if(hit.object.userData && hit.object.userData.url){
      openMedia(hit.object.userData.url, hit.object.userData.type);
      break;
    }
  }
});

function openMedia(url, type) {
  const viewer = document.getElementById('mediaViewer');
  const container = document.getElementById('media3d');
  container.innerHTML = '';

  if(type==='video'){
    const vid = document.createElement('video');
    vid.src = url; vid.controls = true; vid.autoplay = true;
    vid.loop = true; container.appendChild(vid);
  } else {
    const img = document.createElement('img');
    img.src = url; container.appendChild(img);
  }

  viewer.classList.add('active');

  // 3D rotation with GSAP Draggable
  let rotX=0, rotY=0;
  const el = container;

  const onMove = (e)=>{
    const clientX = e.touches?e.touches[0].clientX:e.clientX;
    const clientY = e.touches?e.touches[0].clientY:e.clientY;
    if(el.dataset.startX){
      rotY += (clientX - parseFloat(el.dataset.startX))*0.5;
      rotX -= (clientY - parseFloat(el.dataset.startY))*0.5;
      el.style.transform = `perspective(1000px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    }
    el.dataset.startX = clientX;
    el.dataset.startY = clientY;
  };

  const onStart = (e)=>{
    const clientX = e.touches?e.touches[0].clientX:e.clientX;
    const clientY = e.touches?e.touches[0].clientY:e.clientY;
    el.dataset.startX = clientX;
    el.dataset.startY = clientY;
  };

  const onEnd = ()=>{ delete el.dataset.startX; delete el.dataset.startY; };

  el.addEventListener('mousedown',onStart);
  el.addEventListener('mousemove',onMove);
  el.addEventListener('mouseup',onEnd);
  el.addEventListener('mouseleave',onEnd);
  el.addEventListener('touchstart',onStart,{passive:true});
  el.addEventListener('touchmove',onMove,{passive:true});
  el.addEventListener('touchend',onEnd);
}

function closeMedia() {
  document.getElementById('mediaViewer').classList.remove('active');
}

// ===== INIT =====
window.addEventListener('load',()=>{
  setTimeout(()=>document.getElementById('loading').classList.add('hidden'), 1000);
});
