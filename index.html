<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Minecraft Mobile 3D RTDB Fix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.0/firebase-auth-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.0/firebase-database-compat.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #87ceeb; font-family: 'Press Start 2P', cursive; }

        canvas { display: block; width: 100%; height: 100%; touch-action: none; }

        /* UI */
        #ui { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; }
        #ui * { pointer-events: auto; }

        /* Auth */
        #auth-screen {
            position: fixed; inset: 0; background: #222; 
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .auth-box {
            background: #444; border: 6px solid #000; padding: 25px; width: 90%; max-width: 400px;
            box-shadow: inset -4px -4px #222, inset 4px 4px #666; text-align: center;
        }
        .auth-box h2 { color: #fff; font-size: 12px; margin-bottom: 20px; text-shadow: 2px 2px #000; }
        input { 
            width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 2px solid #555; 
            color: #fff; font-family: 'Press Start 2P'; font-size: 8px; outline: none;
        }
        button {
            width: 100%; padding: 16px; margin-top: 10px; background: #888; border: 3px solid #000;
            color: #fff; font-family: 'Press Start 2P'; font-size: 10px; cursor: pointer;
            box-shadow: inset -3px -3px #444, inset 3px 3px #aaa;
        }
        .btn-green { background: #3c8527; box-shadow: inset -3px -3px #1e4213, inset 3px 3px #5db33e; }
        button:active { transform: translateY(2px); box-shadow: none; }

        /* Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 20px; height: 20px; mix-blend-mode: difference; pointer-events: none;
            display: flex; align-items: center; justify-content: center; color: white; font-size: 20px;
        }

        /* Joystick */
        #controls { position: absolute; bottom: 40px; left: 40px; width: 140px; height: 140px; }
        #joystick-base { width: 100%; height: 100%; background: rgba(0,0,0,0.4); border-radius: 50%; border: 3px solid rgba(255,255,255,0.3); position: relative; }
        #joystick-knob { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); opacity: 0.6; }

        /* Actions */
        #actions { position: absolute; bottom: 40px; right: 20px; display: flex; flex-direction: column; gap: 10px; }
        .action-btn {
            width: 70px; height: 70px; background: rgba(0,0,0,0.6); border: 4px solid #fff;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 8px; text-align: center;
        }

        /* Hotbar */
        #hotbar {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; background: rgba(0,0,0,0.8); padding: 5px; border: 4px solid #333;
        }
        .slot { width: 45px; height: 45px; border: 2px solid #555; background-size: cover; image-rendering: pixelated; }
        .slot.active { border: 4px solid #fff; }

        #loading {
            position: fixed; inset: 0; background: #000; z-index: 2000;
            display: flex; align-items: center; justify-content: center; color: #fff;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="loading">ЗАГРУЗКА МИРА...</div>

<div id="auth-screen">
    <div class="auth-box">
        <h2>MINECRAFT 3D REALTIME</h2>
        <div id="auth-err" style="color: #ff5555; font-size: 8px; margin-bottom: 10px;"></div>
        <input type="email" id="email" placeholder="EMAIL">
        <input type="password" id="pass" placeholder="PASSWORD">
        <button class="btn-green" onclick="authAction('login')">ВОЙТИ</button>
        <button onclick="authAction('reg')">РЕГИСТРАЦИЯ</button>
    </div>
</div>

<div id="ui" class="hidden">
    <div id="crosshair">+</div>
    <div id="controls">
        <div id="joystick-base">
            <div id="joystick-knob"></div>
        </div>
    </div>
    <div id="actions">
        <div class="action-btn" id="jump-btn">JUMP</div>
        <div class="action-btn" id="place-btn" style="background: #3c8527;">PLACE</div>
        <div class="action-btn" id="break-btn" style="background: #852727;">BREAK</div>
    </div>
    <div id="hotbar">
        <div class="slot active" data-id="1"></div>
        <div class="slot" data-id="2"></div>
        <div class="slot" data-id="3"></div>
        <div class="slot" data-id="4"></div>
        <div class="slot" data-id="5"></div>
    </div>
</div>

<script>
// --- FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyBm0mIvHVznIeF2PoFk6dtdaiT5r877wyA",
    authDomain: "meow-874ce.firebaseapp.com",
    databaseURL: "https://meow-874ce-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "meow-874ce",
    storageBucket: "meow-874ce.firebasestorage.app",
    messagingSenderId: "471541334599",
    appId: "1:471541334599:web:567af3e7dbe70a37572762"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// --- GLOBALS ---
let scene, camera, renderer, clock, player;
let velocity = new THREE.Vector3();
let moveDirection = { x: 0, z: 0 };
let blocks = {}, otherPlayers = {};
let selectedBlock = 1;
let canJump = false;
let currentUser = null;

// --- PIXEL TEXTURE GENERATOR ---
function getMinecraftTexture(type) {
    const canvas = document.createElement('canvas');
    canvas.width = 16; canvas.height = 16;
    const ctx = canvas.getContext('2d');
    
    let colors = [];
    if(type === 'grass') colors = ['#5e9d34', '#4e8d24', '#6eb044'];
    else if(type === 'stone') colors = ['#7c7c7c', '#8c8c8c', '#6c6c6c'];
    else if(type === 'wood') colors = ['#5c3a21', '#4d301c', '#6b4427'];
    else if(type === 'planks') colors = ['#967e5d', '#866e4d', '#a68e6d'];
    else if(type === 'bricks') colors = ['#9b3a30', '#8b2a20', '#ab4a40'];

    for(let i=0; i<16; i++) {
        for(let j=0; j<16; j++) {
            ctx.fillStyle = colors[Math.floor(Math.random()*colors.length)];
            ctx.fillRect(i, j, 1, 1);
        }
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    return tex;
}

const blockMaterials = {
    1: new THREE.MeshBasicMaterial({ map: getMinecraftTexture('grass') }),
    2: new THREE.MeshBasicMaterial({ map: getMinecraftTexture('stone') }),
    3: new THREE.MeshBasicMaterial({ map: getMinecraftTexture('wood') }),
    4: new THREE.MeshBasicMaterial({ map: getMinecraftTexture('planks') }),
    5: new THREE.MeshBasicMaterial({ map: getMinecraftTexture('bricks') })
};

// Fill Hotbar
window.onload = () => {
    const slots = document.querySelectorAll('.slot');
    slots.forEach(slot => {
        const id = slot.dataset.id;
        slot.style.backgroundImage = `url(${blockMaterials[id].map.image.toDataURL()})`;
        slot.onclick = () => {
            slots.forEach(s => s.classList.remove('active'));
            slot.classList.add('active');
            selectedBlock = id;
        };
    });
};

// --- AUTH ---
function authAction(mode) {
    const e = document.getElementById('email').value;
    const p = document.getElementById('pass').value;
    const op = mode === 'login' ? auth.signInWithEmailAndPassword(e, p) : auth.createUserWithEmailAndPassword(e, p);
    op.catch(err => document.getElementById('auth-err').innerText = err.message);
}

auth.onAuthStateChanged(user => {
    if(user) {
        currentUser = user;
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('ui').classList.remove('hidden');
        init();
    }
});

// --- CORE ---
function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    document.body.appendChild(renderer.domElement);

    player = new THREE.Group();
    player.position.set(0, 10, 0);
    player.add(camera);
    scene.add(player);

    clock = new THREE.Clock();

    // Sync World
    db.ref('mc_world').on('child_added', snap => {
        const d = snap.val();
        createBlock(d.x, d.y, d.z, d.type, snap.key);
    });
    db.ref('mc_world').on('child_removed', snap => {
        if(blocks[snap.key]) { scene.remove(blocks[snap.key]); delete blocks[snap.key]; }
    });

    // Sync Players
    db.ref('mc_players').on('child_added', snap => {
        if(snap.key !== currentUser.uid) createRemotePlayer(snap.key);
    });
    db.ref('mc_players').on('child_changed', snap => {
        if(snap.key !== currentUser.uid && otherPlayers[snap.key]) {
            const d = snap.val();
            otherPlayers[snap.key].position.set(d.x, d.y, d.z);
            otherPlayers[snap.key].rotation.y = d.ry;
        }
    });
    db.ref('mc_players').on('child_removed', snap => {
        if(otherPlayers[snap.key]) { scene.remove(otherPlayers[snap.key]); delete otherPlayers[snap.key]; }
    });

    setupControls();
    document.getElementById('loading').classList.add('hidden');
    animate();
}

function createBlock(x, y, z, type, key) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), blockMaterials[type]);
    mesh.position.set(x, y, z);
    scene.add(mesh);
    blocks[key] = mesh;
}

function createRemotePlayer(id) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.8, 0.6), new THREE.MeshBasicMaterial({color: 0xff0000}));
    scene.add(mesh);
    otherPlayers[id] = mesh;
}

// --- CONTROLS ---
function setupControls() {
    const knob = document.getElementById('joystick-knob');
    const base = document.getElementById('joystick-base');

    base.addEventListener('touchmove', e => {
        e.preventDefault();
        const r = base.getBoundingClientRect();
        const t = e.touches[0];
        const dx = t.clientX - r.left - r.width/2;
        const dy = t.clientY - r.top - r.height/2;
        const dist = Math.min(60, Math.sqrt(dx*dx + dy*dy));
        const angle = Math.atan2(dy, dx);
        
        knob.style.left = `calc(50% + ${Math.cos(angle)*dist}px)`;
        knob.style.top = `calc(50% + ${Math.sin(angle)*dist}px)`;

        // ВАЖНО: dy < 0 это вперед (движение по -Z)
        moveDirection.z = dy / 60; 
        moveDirection.x = dx / 60;
    });

    base.addEventListener('touchend', () => {
        knob.style.left = '50%'; knob.style.top = '50%';
        moveDirection = { x: 0, z: 0 };
    });

    // Осмотр
    let lastX, lastY;
    renderer.domElement.addEventListener('touchmove', e => {
        const t = e.touches[0];
        if(lastX) {
            player.rotation.y -= (t.clientX - lastX) * 0.005;
            camera.rotation.x -= (t.clientY - lastY) * 0.005;
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
        }
        lastX = t.clientX; lastY = t.clientY;
    });
    renderer.domElement.addEventListener('touchend', () => { lastX = null; lastY = null; });

    document.getElementById('jump-btn').onclick = () => { if(canJump) { velocity.y = 5; canJump = false; } };
    document.getElementById('place-btn').onclick = () => {
        const ray = new THREE.Raycaster();
        ray.setFromCamera({x:0, y:0}, camera);
        const hits = ray.intersectObjects(Object.values(blocks));
        if(hits.length > 0) {
            const p = hits[0].point.add(hits[0].face.normal.multiplyScalar(0.5));
            db.ref('mc_world').push({x: Math.round(p.x), y: Math.round(p.y), z: Math.round(p.z), type: selectedBlock});
        }
    };
    document.getElementById('break-btn').onclick = () => {
        const ray = new THREE.Raycaster();
        ray.setFromCamera({x:0, y:0}, camera);
        const hits = ray.intersectObjects(Object.values(blocks));
        if(hits.length > 0) {
            const obj = hits[0].object;
            for(let key in blocks) if(blocks[key] === obj) { db.ref('mc_world').child(key).remove(); break; }
        }
    };
}

// --- LOOP ---
function animate() {
    requestAnimationFrame(animate);
    const d = clock.getDelta();

    // Gravity
    velocity.y -= 12 * d;
    player.position.y += velocity.y * d;
    if(player.position.y < 1.8) { player.position.y = 1.8; velocity.y = 0; canJump = true; }

    // Move (Вперед/Назад/Влево/Вправо)
    if(moveDirection.z !== 0 || moveDirection.x !== 0) {
        const speed = 6;
        player.translateZ(moveDirection.z * speed * d);
        player.translateX(moveDirection.x * speed * d);
    }

    // Sync Me
    if(currentUser) {
        db.ref('mc_players/'+currentUser.uid).set({
            x: player.position.x, y: player.position.y, z: player.position.z, ry: player.rotation.y
        });
    }

    renderer.render(scene, camera);
}

window.onresize = () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
};

</script>
</body>
</html>
