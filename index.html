<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VK Meow - Firebase Edition</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        /* СТРОГО СОХРАНЕННЫЙ ДИЗАЙН */
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#000;color:#fff;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
        .app{height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden}

        /* Login/Auth Screen */
        .login-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:800;animation:fadeIn 0.2s ease-out}
        .login-screen h1{font-size:32px;margin-bottom:6px;font-weight:900;color:#fff;letter-spacing:1.5px}
        .login-screen p{color:#888;margin-bottom:24px;font-size:13px;text-align:center;max-width:320px}
        .auth-logs{font-family:monospace;font-size:11px;color:#34c759;margin-bottom:15px;height:20px;text-align:center}
        
        .badge-e2e{background:#1c1c1e;color:#8e8e93;border:1px solid #2c2c2e;padding:6px 12px;border-radius:14px;font-size:12px;font-weight:600;margin-bottom:20px;display:inline-flex;align-items:center;gap:6px}
        .input-group{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
        .token-input,.pass-input{width:100%;padding:14px 16px;border:none;border-radius:14px;background:#161616;color:#fff;font-size:15px;outline:none;border:1px solid #2c2c2c;transition:border-color 0.2s}
        .token-input:focus,.pass-input:focus{border-color:#555}
        
        .btn{width:100%;max-width:360px;padding:14px;border:none;border-radius:14px;background:#fff;color:#000;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px;transition:all 0.1s active}
        .btn:active{transform:scale(0.97);opacity:.85}
        .btn-secondary{background:transparent;color:#fff;border:1px solid #333}
        .btn-text{background:none;color:#8e8e93;font-size:13px;margin-top:15px;text-decoration:underline}

        /* Header */
        .header{height:56px;background:#0d0d0d;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #1c1c1c;flex-shrink:0}
        .header-menu-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;margin-right:10px;background:rgba(255,255,255,0.08);color:#fff}
        .header-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;margin-right:10px;background:#222}
        .header-info{flex:1;min-width:0}
        .header-title-main{font-size:20px;font-weight:900;letter-spacing:0.8px;color:#fff}
        .header-subtitle{font-size:12px;color:#8e8e93}

        /* Dialogs */
        .dialogs-screen{flex:1;display:flex;flex-direction:column;overflow:hidden}
        .dialogs-list{flex:1;overflow-y:auto}
        .dialog{display:flex;align-items:center;padding:12px 14px;cursor:pointer;border-bottom:1px solid #111}
        .dialog:active{background:#111}
        .dialog-avatar{width:50px;height:50px;border-radius:50%;margin-right:12px;background:#222}
        .dialog-info{flex:1;min-width:0}
        .dialog-name{font-size:15px;font-weight:600}
        .dialog-preview{font-size:13px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

        /* Chat Screen */
        .chat-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:flex;flex-direction:column;z-index:100;transform:translateX(100%);transition:transform 0.22s cubic-bezier(0.1, 0.9, 0.2, 1)}
        .chat-screen.active{transform:translateX(0)}
        .messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px}
        
        /* Messages Styling */
        .msg{max-width:85%;padding:8px 14px;border-radius:18px;font-size:14px;line-height:1.4;position:relative}
        .msg-in{align-self:flex-start;background:#1c1c1e;border-bottom-left-radius:4px}
        .msg-out{align-self:flex-end;background:#2c2c2e;border-bottom-right-radius:4px}
        .msg-time{font-size:10px;color:#666;margin-top:4px;text-align:right}
        .msg-media{max-width:100%;border-radius:10px;margin-top:5px;display:block}

        /* Input Area */
        .input-area{padding:8px;background:#0d0d0d;border-top:1px solid #1a1a1a;display:flex;align-items:flex-end;gap:8px}
        .message-input{flex:1;padding:10px 15px;border-radius:20px;background:#1c1c1e;color:#fff;border:1px solid #2a2a2c;outline:none;font-size:14px;max-height:100px;resize:none}
        .icon-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;flex-shrink:0}
        .send-btn{background:#fff;color:#000;border-radius:50%}

        /* Search Bar */
        .search-container{padding:10px;background:#0d0d0d}
        .search-input{width:100%;padding:10px 15px;border-radius:12px;background:#1c1c1e;border:none;color:#fff;font-size:14px}

        /* Helpers */
        .hidden{display:none !important}
        .loader{border:2px solid #333;border-top:2px solid #fff;border-radius:50%;width:14px;height:14px;animation:spin 0.6s linear infinite;display:inline-block}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    </style>
</head>
<body>

<div class="app">
    <!-- AUTH SCREEN -->
    <div class="login-screen" id="authScreen">
        <h1>Meow RTDB</h1>
        <div class="badge-e2e">Firebase Edition • End-to-End</div>
        <div class="auth-logs" id="authLogs">Ожидание...</div>
        
        <div class="input-group" id="loginFields">
            <input type="email" class="token-input" id="email" placeholder="Электронная почта">
            <input type="password" class="pass-input" id="password" placeholder="Пароль">
            <input type="text" class="token-input hidden" id="username" placeholder="Уникальный @юзернейм">
            <input type="text" class="token-input hidden" id="fullname" placeholder="Ваше Имя">
            
            <button class="btn" id="mainAuthBtn" onclick="handleAuth()">Войти</button>
            <button class="btn btn-secondary" onclick="toggleAuthMode()" id="switchBtn">Нет аккаунта? Регистрация</button>
        </div>
    </div>

    <!-- MAIN DIALOGS SCREEN -->
    <div class="dialogs-screen hidden" id="mainScreen">
        <div class="header">
            <div class="header-menu-btn" onclick="logout()">⚙️</div>
            <div class="header-info">
                <div class="header-title-main">Meow</div>
                <div class="header-subtitle" id="myHandle">@username</div>
            </div>
        </div>

        <div class="search-container">
            <input type="text" class="search-input" id="userSearch" placeholder="Поиск по @юзернейму..." onkeypress="searchUser(event)">
        </div>

        <div class="dialogs-list" id="dialogsList">
            <!-- Список чатов -->
        </div>
    </div>

    <!-- CHAT SCREEN -->
    <div class="chat-screen" id="chatScreen">
        <div class="header">
            <div class="header-menu-btn" onclick="closeChat()">←</div>
            <img class="header-avatar" id="chatAvatar" src="https://i.pinimg.com/originals/f1/0f/f7/f10ff70a715548f16668882798f567a4.png">
            <div class="header-info">
                <div class="header-title" id="chatTitle">Собеседник</div>
                <div class="header-subtitle">RTDB шифрование активен</div>
            </div>
        </div>

        <div class="messages" id="messageList"></div>

        <div class="input-area">
            <label class="icon-btn">
                📎
                <input type="file" class="hidden" id="fileInput" onchange="sendFile(event)" accept="image/*,video/*">
            </label>
            <textarea class="message-input" id="msgInput" placeholder="Сообщение..." rows="1"></textarea>
            <div class="icon-btn send-btn" onclick="sendTextMessage()">▲</div>
        </div>
    </div>
</div>

<script>
    // --- КОНФИГУРАЦИЯ FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIzaSyBm0mIvHVznIeF2PoFk6dtdaiT5r877wyA",
        authDomain: "meow-874ce.firebaseapp.com",
        databaseURL: "https://meow-874ce-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "meow-874ce",
        storageBucket: "meow-874ce.firebasestorage.app",
        messagingSenderId: "471541334599",
        appId: "1:471541334599:web:567af3e7dbe70a37572762"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let activeChatId = null;
    let isRegisterMode = false;

    // --- АУТЕНТИФИКАЦИЯ ---

    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        document.getElementById('username').classList.toggle('hidden', !isRegisterMode);
        document.getElementById('fullname').classList.toggle('hidden', !isRegisterMode);
        document.getElementById('mainAuthBtn').textContent = isRegisterMode ? 'Создать аккаунт' : 'Войти';
        document.getElementById('switchBtn').textContent = isRegisterMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Регистрация';
    }

    async function handleAuth() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const log = document.getElementById('authLogs');

        if (!email || !password) return alert("Заполни поля!");

        if (isRegisterMode) {
            const handle = document.getElementById('username').value.replace('@', '').toLowerCase();
            const name = document.getElementById('fullname').value;
            if (!handle || !name) return alert("Укажи ник и имя!");

            log.textContent = "Проверка уникальности @...";
            const snapshot = await db.ref('usernames/' + handle).once('value');
            if (snapshot.exists()) return alert("Никнейм занят!");

            log.textContent = "Регистрация в Firebase...";
            try {
                const res = await auth.createUserWithEmailAndPassword(email, password);
                await db.ref('users/' + res.user.uid).set({
                    uid: res.user.uid,
                    handle: handle,
                    name: name,
                    photo: "https://i.pinimg.com/originals/f1/0f/f7/f10ff70a715548f16668882798f567a4.png"
                });
                await db.ref('usernames/' + handle).set(res.user.uid);
                log.textContent = "Успешно!";
            } catch (e) { alert(e.message); }
        } else {
            log.textContent = "Вхожу в сессию...";
            try {
                await auth.signInWithEmailAndPassword(email, password);
                log.textContent = "Вход выполнен!";
            } catch (e) { 
                log.textContent = "Ошибка входа";
                alert(e.message); 
            }
        }
    }

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
            loadProfile();
            listenDialogs();
        } else {
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('mainScreen').classList.add('hidden');
        }
    });

    async function loadProfile() {
        const snap = await db.ref('users/' + currentUser.uid).once('value');
        const data = snap.val();
        if (data) {
            document.getElementById('myHandle').textContent = '@' + data.handle;
        }
    }

    function logout() { auth.signOut(); }

    // --- ЛОГИКА ЧАТОВ ---

    function listenDialogs() {
        const listDiv = document.getElementById('dialogsList');
        db.ref('user_chats/' + currentUser.uid).on('value', async (snap) => {
            listDiv.innerHTML = "";
            const chats = snap.val();
            if (!chats) return;

            for (let peerId in chats) {
                const peerSnap = await db.ref('users/' + peerId).once('value');
                const peer = peerSnap.val();
                const lastMsg = chats[peerId].lastMessage || "Сообщений нет";

                const div = document.createElement('div');
                div.className = 'dialog';
                div.onclick = () => openChat(peerId, peer.name, peer.photo);
                div.innerHTML = `
                    <img class="dialog-avatar" src="${peer.photo}">
                    <div class="dialog-info">
                        <div class="dialog-name">${peer.name}</div>
                        <div class="dialog-preview">${lastMsg}</div>
                    </div>
                `;
                listDiv.appendChild(div);
            }
        });
    }

    async function searchUser(e) {
        if (e.key === 'Enter') {
            const handle = e.target.value.replace('@', '').toLowerCase();
            const snap = await db.ref('usernames/' + handle).once('value');
            if (snap.exists()) {
                const peerId = snap.val();
                if (peerId === currentUser.uid) return alert("Это вы!");
                const peerSnap = await db.ref('users/' + peerId).once('value');
                const peer = peerSnap.val();
                openChat(peerId, peer.name, peer.photo);
            } else {
                alert("Пользователь не найден");
            }
        }
    }

    function openChat(peerId, name, photo) {
        activeChatId = peerId;
        document.getElementById('chatTitle').textContent = name;
        document.getElementById('chatAvatar').src = photo;
        document.getElementById('chatScreen').classList.add('active');
        loadMessages(peerId);
    }

    function closeChat() {
        document.getElementById('chatScreen').classList.remove('active');
        activeChatId = null;
    }

    function getChatKey(uid1, uid2) {
        return uid1 < uid2 ? uid1 + '_' + uid2 : uid2 + '_' + uid1;
    }

    function loadMessages(peerId) {
        const chatKey = getChatKey(currentUser.uid, peerId);
        const msgList = document.getElementById('messageList');
        db.ref('messages/' + chatKey).off(); // Очистка старых подписок
        db.ref('messages/' + chatKey).on('value', snap => {
            msgList.innerHTML = "";
            const msgs = snap.val();
            if (!msgs) return;

            for (let id in msgs) {
                const m = msgs[id];
                const isOut = m.sender === currentUser.uid;
                const div = document.createElement('div');
                div.className = `msg ${isOut ? 'msg-out' : 'msg-in'}`;
                
                let content = `<div>${m.text}</div>`;
                if (m.type === 'image') content += `<img src="${m.data}" class="msg-media">`;
                if (m.type === 'video') content += `<video src="${m.data}" controls class="msg-media"></video>`;
                
                div.innerHTML = `${content}<div class="msg-time">${new Date(m.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>`;
                msgList.appendChild(div);
            }
            msgList.scrollTop = msgList.scrollHeight;
        });
    }

    async function sendTextMessage() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text || !activeChatId) return;

        const chatKey = getChatKey(currentUser.uid, activeChatId);
        const msgData = {
            sender: currentUser.uid,
            text: text,
            timestamp: Date.now(),
            type: 'text'
        };

        input.value = "";
        await db.ref('messages/' + chatKey).push(msgData);
        updateChatMeta(activeChatId, text);
    }

    // --- ОТПРАВКА ФОТО/ВИДЕО ЧЕРЕЗ RTDB (BASE64) ---

    async function sendFile(e) {
        const file = e.target.files[0];
        if (!file || !activeChatId) return;

        // Ограничение RTDB на размер одного узла ~10МБ, поэтому сжимаем или предупреждаем
        if (file.size > 5 * 1024 * 1024) return alert("Файл слишком большой для RTDB (лимит 5MB)");

        const reader = new FileReader();
        reader.onload = async (event) => {
            const base64Data = event.target.result;
            const type = file.type.startsWith('image') ? 'image' : 'video';
            const chatKey = getChatKey(currentUser.uid, activeChatId);

            const msgData = {
                sender: currentUser.uid,
                text: type === 'image' ? "🖼 Фотография" : "🎥 Видео",
                data: base64Data,
                timestamp: Date.now(),
                type: type
            };

            await db.ref('messages/' + chatKey).push(msgData);
            updateChatMeta(activeChatId, msgData.text);
        };
        reader.readAsDataURL(file);
    }

    function updateChatMeta(peerId, lastMsg) {
        const update = { lastMessage: lastMsg, timestamp: Date.now() };
        db.ref('user_chats/' + currentUser.uid + '/' + peerId).update(update);
        db.ref('user_chats/' + peerId + '/' + currentUser.uid).update(update);
    }

</script>
</body>
</html>
