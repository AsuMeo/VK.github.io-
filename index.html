<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meow P2P Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0f0f0f; color: #fff; overflow: hidden; height: 100vh; }
        .gradient-text { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .chat-bubble { max-width: 75%; padding: 12px 16px; border-radius: 20px; word-break: break-word; position: relative; animation: slideIn 0.3s ease; }
        .chat-bubble.sent { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-bubble.received { background: #2a2a2a; align-self: flex-start; border-bottom-left-radius: 4px; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pulse-ring { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(102, 126, 234, 0); } 100% { box-shadow: 0 0 0 0 rgba(102, 126, 234, 0); } }
        .typing-dot { width: 6px; height: 6px; background: #667eea; border-radius: 50%; display: inline-block; animation: typing 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
        .online-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; }
        .offline-dot { width: 8px; height: 8px; background: #6b7280; border-radius: 50%; display: inline-block; }
        .scroll-hidden::-webkit-scrollbar { display: none; }
        .scroll-hidden { -ms-overflow-style: none; scrollbar-width: none; }
        .glass { background: rgba(30, 30, 30, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .media-preview { max-width: 250px; max-height: 300px; border-radius: 12px; cursor: pointer; transition: transform 0.2s; }
        .media-preview:hover { transform: scale(1.02); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: flex; align-items: center; justify-content: center; }
        .modal-content { max-width: 90vw; max-height: 90vh; }
        .sidebar-item { transition: all 0.2s; cursor: pointer; }
        .sidebar-item:hover { background: rgba(102, 126, 234, 0.1); }
        .sidebar-item.active { background: rgba(102, 126, 234, 0.2); border-left: 3px solid #667eea; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 10px 24px; border-radius: 12px; border: none; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4); }
        .input-field { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px 16px; border-radius: 12px; width: 100%; outline: none; transition: all 0.3s; }
        .input-field:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        #app { height: 100vh; display: flex; }
        .sidebar { width: 320px; min-width: 320px; background: #111; border-right: 1px solid #222; display: flex; flex-direction: column; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0a0a0a; }
        @media (max-width: 768px) {
            .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 50; transform: translateX(-100%); transition: transform 0.3s; width: 85vw; max-width: 320px; }
            .sidebar.open { transform: translateX(0); }
            .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; display: none; }
            .overlay.show { display: block; }
        }
        .file-input-label { cursor: pointer; padding: 8px; border-radius: 8px; transition: all 0.2s; }
        .file-input-label:hover { background: rgba(102, 126, 234, 0.1); }
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid transparent; }
        .avatar.online { border-color: #10b981; }
        .avatar.offline { border-color: #6b7280; }
        .time-text { font-size: 11px; color: #888; }
        .message-status { font-size: 11px; color: #aaa; margin-left: 4px; }
        .encryption-badge { background: rgba(16, 185, 129, 0.2); color: #10b981; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1a1a1a; border: 1px solid #333; padding: 12px 24px; border-radius: 12px; z-index: 200; transition: transform 0.3s; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .spinner { width: 20px; height: 20px; border: 2px solid #333; border-top-color: #667eea; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .video-container { position: relative; }
        .video-container video { max-width: 250px; max-height: 300px; border-radius: 12px; }
        .video-play-btn { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); border-radius: 12px; cursor: pointer; }
        .video-play-btn i { font-size: 40px; color: white; opacity: 0.9; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Auth Screen -->
        <div id="authScreen" class="fixed inset-0 z-50 flex items-center justify-center" style="background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);">
            <div class="w-full max-w-md p-8">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                        <i class="fas fa-comments text-3xl text-white"></i>
                    </div>
                    <h1 class="text-3xl font-bold gradient-text mb-2">Meow P2P</h1>
                    <p class="text-gray-400">Сквозное шифрование · P2P · Реалтайм</p>
                </div>
                <div id="authForm">
                    <div class="mb-4">
                        <label class="block text-sm text-gray-400 mb-2">Email</label>
                        <input type="email" id="authEmail" class="input-field" placeholder="your@email.com" autocomplete="email">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm text-gray-400 mb-2">Пароль</label>
                        <input type="password" id="authPassword" class="input-field" placeholder="••••••••" autocomplete="current-password">
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm text-gray-400 mb-2">Никнейм (@username)</label>
                        <input type="text" id="authUsername" class="input-field" placeholder="@username" maxlength="20">
                    </div>
                    <button id="authBtn" class="btn-primary w-full mb-4">
                        <span id="authBtnText">Войти / Зарегистрироваться</span>
                    </button>
                    <p class="text-center text-sm text-gray-500">Нет аккаунта? Введите данные — он создастся автоматически</p>
                </div>
                <div id="authLoading" class="hidden text-center py-8">
                    <div class="spinner mx-auto mb-4"></div>
                    <p class="text-gray-400">Подключение...</p>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="p-4 border-b border-gray-800">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-bold gradient-text">Meow P2P</h2>
                    <button id="mobileMenuClose" class="md:hidden text-gray-400 hover:text-white">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="flex items-center gap-3 mb-4">
                    <img id="currentUserAvatar" src="https://ui-avatars.com/api/?name=User&background=667eea&color=fff" class="avatar" alt="Avatar">
                    <div class="flex-1 min-w-0">
                        <p id="currentUserName" class="font-semibold text-sm truncate">Загрузка...</p>
                        <p id="currentUserHandle" class="text-xs text-gray-500 truncate">@user</p>
                    </div>
                    <button id="logoutBtn" class="text-gray-400 hover:text-red-400 transition-colors" title="Выйти">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
                    <input type="text" id="searchUsers" class="input-field pl-10 text-sm" placeholder="Поиск по @username...">
                </div>
            </div>
            <div class="flex-1 overflow-y-auto scroll-hidden" id="usersList">
                <!-- Users will be populated here -->
            </div>
            <div class="p-3 border-t border-gray-800 text-center">
                <span class="encryption-badge"><i class="fas fa-lock mr-1"></i>P2P E2E Шифрование</span>
            </div>
        </div>

        <!-- Mobile Overlay -->
        <div class="overlay" id="mobileOverlay"></div>

        <!-- Chat Area -->
        <div class="chat-area">
            <!-- Chat Header -->
            <div class="glass p-4 flex items-center justify-between border-b border-gray-800">
                <div class="flex items-center gap-3">
                    <button id="mobileMenuBtn" class="md:hidden text-gray-400 hover:text-white mr-2">
                        <i class="fas fa-bars"></i>
                    </button>
                    <img id="chatAvatar" src="https://ui-avatars.com/api/?name=Chat&background=333&color=fff" class="avatar" alt="Avatar">
                    <div>
                        <p id="chatName" class="font-semibold">Выберите собеседника</p>
                        <p id="chatStatus" class="text-xs text-gray-500 flex items-center gap-1">
                            <span class="offline-dot"></span> Офлайн
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="callBtn" class="hidden text-gray-400 hover:text-white p-2 rounded-lg hover:bg-gray-800 transition-all" title="Звонок (скоро)">
                        <i class="fas fa-phone"></i>
                    </button>
                    <button id="videoCallBtn" class="hidden text-gray-400 hover:text-white p-2 rounded-lg hover:bg-gray-800 transition-all" title="Видеозвонок (скоро)">
                        <i class="fas fa-video"></i>
                    </button>
                </div>
            </div>

            <!-- Messages Area -->
            <div class="flex-1 overflow-y-auto scroll-hidden p-4" id="messagesContainer">
                <div id="emptyState" class="h-full flex flex-col items-center justify-center text-gray-500">
                    <i class="fas fa-comments text-6xl mb-4 opacity-20"></i>
                    <p class="text-lg">Выберите пользователя из списка</p>
                    <p class="text-sm mt-2">Все сообщения шифруются P2P сквозным шифрованием</p>
                </div>
                <div id="messagesList" class="flex flex-col gap-3 hidden"></div>
            </div>

            <!-- Typing Indicator -->
            <div id="typingIndicator" class="hidden px-4 pb-2">
                <div class="flex items-center gap-2 text-gray-500 text-sm">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span>печатает...</span>
                </div>
            </div>

            <!-- Input Area -->
            <div class="glass p-3 border-t border-gray-800">
                <div class="flex items-end gap-2">
                    <label class="file-input-label flex-shrink-0">
                        <input type="file" id="fileInput" class="hidden" accept="image/*,video/*">
                        <i class="fas fa-paperclip text-gray-400 hover:text-white text-lg"></i>
                    </label>
                    <div class="flex-1 relative">
                        <textarea id="messageInput" class="input-field resize-none pr-10" rows="1" placeholder="Введите сообщение..." style="min-height: 44px; max-height: 120px;"></textarea>
                    </div>
                    <button id="sendBtn" class="btn-primary flex-shrink-0" style="padding: 10px 16px;">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div id="filePreview" class="hidden mt-2 flex items-center gap-2 p-2 bg-gray-900 rounded-lg">
                    <i class="fas fa-file text-gray-400"></i>
                    <span id="filePreviewName" class="text-sm text-gray-400 flex-1 truncate"></span>
                    <button id="removeFile" class="text-red-400 hover:text-red-300">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Image/Video Modal -->
    <div id="mediaModal" class="modal-overlay hidden">
        <div class="modal-content relative">
            <button id="closeModal" class="absolute -top-10 right-0 text-white text-2xl hover:text-gray-300">
                <i class="fas fa-times"></i>
            </button>
            <img id="modalImage" class="max-w-full max-h-full rounded-lg hidden" alt="Full size">
            <video id="modalVideo" class="max-w-full max-h-full rounded-lg hidden" controls></video>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">
        <span id="toastText"></span>
    </div>

    <script>
        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {
            apiKey: "AIzaSyBm0mIvHVznIeF2PoFk6dtdaiT5r877wyA",
            authDomain: "meow-874ce.firebaseapp.com",
            databaseURL: "https://meow-874ce-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "meow-874ce",
            storageBucket: "meow-874ce.firebasestorage.app",
            messagingSenderId: "471541334599",
            appId: "1:471541334599:web:567af3e7dbe70a37572762"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // ==================== GLOBAL STATE ====================
        let currentUser = null;
        let currentChatUser = null;
        let sharedKey = null;
        let usersRef = null;
        let messagesRef = null;
        let typingRef = null;
        let presenceRef = null;
        let fileToSend = null;
        let isTyping = false;
        let typingTimeout = null;
        let messageListeners = [];
        let typingListener = null;
        let presenceListener = null;

        // ==================== CRYPTO UTILITIES ====================
        const Crypto = {
            async generateKeyPair() {
                return await window.crypto.subtle.generateKey(
                    { name: "ECDH", namedCurve: "P-256" },
                    true,
                    ["deriveKey"]
                );
            },

            async exportPublicKey(key) {
                const exported = await window.crypto.subtle.exportKey("raw", key.publicKey);
                return btoa(String.fromCharCode(...new Uint8Array(exported)));
            },

            async importPublicKey(base64Key) {
                const binary = atob(base64Key);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                return await window.crypto.subtle.importKey(
                    "raw", bytes, { name: "ECDH", namedCurve: "P-256" }, true, []
                );
            },

            async deriveSharedKey(privateKey, publicKey) {
                return await window.crypto.subtle.deriveKey(
                    { name: "ECDH", public: publicKey },
                    privateKey,
                    { name: "AES-GCM", length: 256 },
                    false,
                    ["encrypt", "decrypt"]
                );
            },

            async encrypt(text, key) {
                const encoder = new TextEncoder();
                const iv = window.crypto.getRandomValues(new Uint8Array(12));
                const encrypted = await window.crypto.subtle.encrypt(
                    { name: "AES-GCM", iv },
                    key,
                    encoder.encode(text)
                );
                const combined = new Uint8Array(iv.length + encrypted.byteLength);
                combined.set(iv);
                combined.set(new Uint8Array(encrypted), iv.length);
                return btoa(String.fromCharCode(...combined));
            },

            async decrypt(base64Ciphertext, key) {
                const binary = atob(base64Ciphertext);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                const iv = bytes.slice(0, 12);
                const ciphertext = bytes.slice(12);
                const decrypted = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv },
                    key,
                    ciphertext
                );
                return new TextDecoder().decode(decrypted);
            },

            async encryptFile(arrayBuffer, key) {
                const iv = window.crypto.getRandomValues(new Uint8Array(12));
                const encrypted = await window.crypto.subtle.encrypt(
                    { name: "AES-GCM", iv },
                    key,
                    arrayBuffer
                );
                const combined = new Uint8Array(iv.length + encrypted.byteLength);
                combined.set(iv);
                combined.set(new Uint8Array(encrypted), iv.length);
                return btoa(String.fromCharCode(...combined));
            },

            async decryptFile(base64Ciphertext, key) {
                const binary = atob(base64Ciphertext);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                const iv = bytes.slice(0, 12);
                const ciphertext = bytes.slice(12);
                return await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv },
                    key,
                    ciphertext
                );
            }
        };

        // ==================== UI UTILITIES ====================
        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toastText').textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            const now = new Date();
            const isToday = date.toDateString() === now.toDateString();
            if (isToday) return 'Сегодня';
            return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
        }

        // ==================== AUTH ====================
        document.getElementById('authBtn').addEventListener('click', async () => {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            const username = document.getElementById('authUsername').value.trim().replace(/^@/, '');

            if (!email || !password) {
                showToast('Введите email и пароль');
                return;
            }
            if (!username) {
                showToast('Введите никнейм');
                return;
            }

            document.getElementById('authForm').classList.add('hidden');
            document.getElementById('authLoading').classList.remove('hidden');

            try {
                let userCredential;
                try {
                    userCredential = await auth.signInWithEmailAndPassword(email, password);
                } catch (e) {
                    if (e.code === 'auth/user-not-found') {
                        userCredential = await auth.createUserWithEmailAndPassword(email, password);
                        const keyPair = await Crypto.generateKeyPair();
                        const publicKey = await Crypto.exportPublicKey(keyPair);

                        await db.ref('users/' + userCredential.user.uid).set({
                            email: email,
                            username: username,
                            displayName: username,
                            avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=667eea&color=fff`,
                            publicKey: publicKey,
                            createdAt: firebase.database.ServerValue.TIMESTAMP,
                            lastSeen: firebase.database.ServerValue.TIMESTAMP,
                            online: true
                        });
                        showToast('Аккаунт создан!');
                    } else {
                        throw e;
                    }
                }
            } catch (error) {
                showToast('Ошибка: ' + error.message);
                document.getElementById('authForm').classList.remove('hidden');
                document.getElementById('authLoading').classList.add('hidden');
            }
        });

        // ==================== PRESENCE ====================
        function setupPresence(userId) {
            const userStatusRef = db.ref('users/' + userId);
            const connectedRef = db.ref('.info/connected');

            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    userStatusRef.update({
                        online: true,
                        lastSeen: firebase.database.ServerValue.TIMESTAMP
                    });
                    userStatusRef.onDisconnect().update({
                        online: false,
                        lastSeen: firebase.database.ServerValue.TIMESTAMP
                    });
                }
            });
        }

        // ==================== AUTH STATE ====================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authScreen').classList.add('hidden');
                setupPresence(user.uid);

                const userSnap = await db.ref('users/' + user.uid).once('value');
                const userData = userSnap.val() || {};

                document.getElementById('currentUserName').textContent = userData.displayName || userData.username || 'User';
                document.getElementById('currentUserHandle').textContent = '@' + (userData.username || 'user');
                document.getElementById('currentUserAvatar').src = userData.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(userData.username || 'User')}&background=667eea&color=fff`;

                loadUsers();
            } else {
                currentUser = null;
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('authForm').classList.remove('hidden');
                document.getElementById('authLoading').classList.add('hidden');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth.signOut();
        });

        // ==================== USERS LIST ====================
        function loadUsers() {
            if (usersRef) usersRef.off();

            usersRef = db.ref('users');
            usersRef.on('value', (snapshot) => {
                const users = snapshot.val() || {};
                const list = document.getElementById('usersList');
                list.innerHTML = '';

                const searchTerm = document.getElementById('searchUsers').value.toLowerCase();

                Object.entries(users).forEach(([uid, data]) => {
                    if (uid === currentUser.uid) return;
                    if (searchTerm && !data.username?.toLowerCase().includes(searchTerm)) return;

                    const isOnline = data.online === true;
                    const lastSeen = data.lastSeen ? formatTime(data.lastSeen) : '';

                    const item = document.createElement('div');
                    item.className = 'sidebar-item p-3 flex items-center gap-3';
                    item.dataset.uid = uid;
                    item.innerHTML = `
                        <div class="relative">
                            <img src="${data.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(data.username || 'User')}&background=333&color=fff`}" 
                                 class="avatar ${isOnline ? 'online' : 'offline'}" alt="">
                            ${isOnline ? '<span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 rounded-full border-2 border-black"></span>' : ''}
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="font-medium text-sm truncate">${data.displayName || data.username || 'User'}</p>
                            <p class="text-xs text-gray-500 truncate">@${data.username || 'user'}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-gray-600">${isOnline ? '<span class="text-green-500">онлайн</span>' : lastSeen}</p>
                        </div>
                    `;
                    item.addEventListener('click', () => startChat(uid, data));
                    list.appendChild(item);
                });
            });
        }

        document.getElementById('searchUsers').addEventListener('input', () => {
            loadUsers();
        });

        // ==================== CHAT ====================
        async function startChat(uid, userData) {
            currentChatUser = { uid, ...userData };

            // Cleanup previous listeners
            messageListeners.forEach(ref => ref.off());
            messageListeners = [];
            if (typingListener) { typingListener.off(); typingListener = null; }
            if (presenceListener) { presenceListener.off(); presenceListener = null; }

            // UI update
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('messagesList').classList.remove('hidden');
            document.getElementById('chatName').textContent = userData.displayName || userData.username || 'User';
            document.getElementById('chatAvatar').src = userData.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(userData.username || 'User')}&background=333&color=fff`;
            document.getElementById('messagesList').innerHTML = '';

            document.getElementById('callBtn').classList.remove('hidden');
            document.getElementById('videoCallBtn').classList.remove('hidden');

            // Close mobile sidebar
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('mobileOverlay').classList.remove('show');

            // Setup presence for chat user
            presenceListener = db.ref('users/' + uid);
            presenceListener.on('value', (snap) => {
                const data = snap.val();
                if (data) {
                    const isOnline = data.online === true;
                    const lastSeen = data.lastSeen ? new Date(data.lastSeen).toLocaleTimeString('ru-RU') : '';
                    document.getElementById('chatStatus').innerHTML = `
                        <span class="${isOnline ? 'online-dot pulse-ring' : 'offline-dot'}"></span>
                        ${isOnline ? 'онлайн' : 'был(а) в ' + lastSeen}
                    `;
                }
            });

            // Generate shared key
            await generateSharedKey(uid);

            // Load messages
            const chatId = getChatId(currentUser.uid, uid);
            const messagesQuery = db.ref('messages/' + chatId).orderByChild('timestamp');

            messageListeners.push(messagesQuery);
            messagesQuery.on('child_added', async (snapshot) => {
                const msg = snapshot.val();
                await displayMessage(msg, snapshot.key);
            });

            // Typing indicator
            typingRef = db.ref('typing/' + chatId + '/' + uid);
            typingListener = typingRef;
            typingRef.on('value', (snap) => {
                document.getElementById('typingIndicator').classList.toggle('hidden', !snap.val());
            });
        }

        function getChatId(uid1, uid2) {
            return uid1 < uid2 ? uid1 + '_' + uid2 : uid2 + '_' + uid1;
        }

        async function generateSharedKey(otherUid) {
            const mySnap = await db.ref('users/' + currentUser.uid).once('value');
            const myData = mySnap.val();
            const otherSnap = await db.ref('users/' + otherUid).once('value');
            const otherData = otherSnap.val();

            if (!myData.publicKey || !otherData.publicKey) {
                showToast('Ошибка: отсутствует публичный ключ');
                return;
            }

            // Get or create my key pair
            let myKeyPair;
            const storedPrivate = sessionStorage.getItem('privateKey_' + currentUser.uid);
            if (storedPrivate) {
                const binary = atob(storedPrivate);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                myKeyPair = {
                    privateKey: await window.crypto.subtle.importKey(
                        "pkcs8", bytes, { name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]
                    ),
                    publicKey: await Crypto.importPublicKey(myData.publicKey)
                };
            } else {
                myKeyPair = await Crypto.generateKeyPair();
                const exportedPriv = await window.crypto.subtle.exportKey("pkcs8", myKeyPair.privateKey);
                sessionStorage.setItem('privateKey_' + currentUser.uid, 
                    btoa(String.fromCharCode(...new Uint8Array(exportedPriv))));
                const newPubKey = await Crypto.exportPublicKey(myKeyPair);
                await db.ref('users/' + currentUser.uid).update({ publicKey: newPubKey });
            }

            const otherPublicKey = await Crypto.importPublicKey(otherData.publicKey);
            sharedKey = await Crypto.deriveSharedKey(myKeyPair.privateKey, otherPublicKey);
        }

        async function displayMessage(msg, msgId) {
            const isSent = msg.sender === currentUser.uid;
            const div = document.createElement('div');
            div.className = 'flex ' + (isSent ? 'justify-end' : 'justify-start');
            div.id = 'msg_' + msgId;

            let content = '';

            try {
                if (msg.type === 'text') {
                    const decrypted = await Crypto.decrypt(msg.content, sharedKey);
                    content = `<p>${escapeHtml(decrypted)}</p>`;
                } else if (msg.type === 'image') {
                    const decrypted = await Crypto.decryptFile(msg.content, sharedKey);
                    const blob = new Blob([decrypted], { type: msg.mimeType || 'image/jpeg' });
                    const url = URL.createObjectURL(blob);
                    content = `<img src="${url}" class="media-preview" onclick="openModal('image', '${url}')" alt="Image">`;
                } else if (msg.type === 'video') {
                    const decrypted = await Crypto.decryptFile(msg.content, sharedKey);
                    const blob = new Blob([decrypted], { type: msg.mimeType || 'video/mp4' });
                    const url = URL.createObjectURL(blob);
                    content = `
                        <div class="video-container">
                            <video class="media-preview" id="vid_${msgId}" preload="metadata">
                                <source src="${url}" type="${msg.mimeType || 'video/mp4'}">
                            </video>
                            <div class="video-play-btn" onclick="playVideo('vid_${msgId}', this)">
                                <i class="fas fa-play-circle"></i>
                            </div>
                        </div>
                    `;
                }
            } catch (e) {
                content = '<p class="text-red-400 text-sm"><i class="fas fa-lock"></i> Не удалось расшифровать</p>';
            }

            div.innerHTML = `
                <div class="chat-bubble ${isSent ? 'sent' : 'received'}">
                    ${content}
                    <div class="flex items-center justify-end gap-1 mt-1">
                        <span class="time-text">${formatTime(msg.timestamp)}</span>
                        ${isSent ? `<span class="message-status"><i class="fas fa-check-double"></i></span>` : ''}
                    </div>
                </div>
            `;

            document.getElementById('messagesList').appendChild(div);
            scrollToBottom();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }

        // ==================== SEND MESSAGE ====================
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            if (!currentChatUser || !sharedKey) return;

            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text && !fileToSend) return;

            const chatId = getChatId(currentUser.uid, currentChatUser.uid);
            const msgRef = db.ref('messages/' + chatId).push();

            let msgData = {
                sender: currentUser.uid,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                read: false
            };

            if (fileToSend) {
                const arrayBuffer = await fileToSend.arrayBuffer();
                const encrypted = await Crypto.encryptFile(arrayBuffer, sharedKey);
                msgData.type = fileToSend.type.startsWith('video/') ? 'video' : 'image';
                msgData.content = encrypted;
                msgData.mimeType = fileToSend.type;
                msgData.fileName = fileToSend.name;

                // Reset file
                fileToSend = null;
                document.getElementById('filePreview').classList.add('hidden');
                document.getElementById('fileInput').value = '';
            } else {
                const encrypted = await Crypto.encrypt(text, sharedKey);
                msgData.type = 'text';
                msgData.content = encrypted;
            }

            input.value = '';
            input.style.height = 'auto';

            await msgRef.set(msgData);

            // Update last message for both users
            const lastMsgData = {
                lastMessage: fileToSend ? (fileToSend.type.startsWith('video/') ? '🎬 Видео' : '📷 Фото') : text.substring(0, 50),
                lastMessageTime: firebase.database.ServerValue.TIMESTAMP,
                lastMessageSender: currentUser.uid
            };

            db.ref('userChats/' + currentUser.uid + '/' + currentChatUser.uid).update(lastMsgData);
            db.ref('userChats/' + currentChatUser.uid + '/' + currentUser.uid).update(lastMsgData);
        }

        // ==================== FILE HANDLING ====================
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                showToast('Файл слишком большой (макс. 5MB)');
                e.target.value = '';
                return;
            }

            fileToSend = file;
            document.getElementById('filePreviewName').textContent = file.name;
            document.getElementById('filePreview').classList.remove('hidden');
        });

        document.getElementById('removeFile').addEventListener('click', () => {
            fileToSend = null;
            document.getElementById('filePreview').classList.add('hidden');
            document.getElementById('fileInput').value = '';
        });

        // ==================== TYPING INDICATOR ====================
        document.getElementById('messageInput').addEventListener('input', () => {
            if (!currentChatUser) return;

            const chatId = getChatId(currentUser.uid, currentChatUser.uid);

            if (!isTyping) {
                isTyping = true;
                db.ref('typing/' + chatId + '/' + currentUser.uid).set(true);
            }

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                isTyping = false;
                db.ref('typing/' + chatId + '/' + currentUser.uid).set(false);
            }, 2000);
        });

        // ==================== MODAL ====================
        function openModal(type, src) {
            const modal = document.getElementById('mediaModal');
            const img = document.getElementById('modalImage');
            const video = document.getElementById('modalVideo');

            if (type === 'image') {
                img.src = src;
                img.classList.remove('hidden');
                video.classList.add('hidden');
            } else {
                video.src = src;
                video.classList.remove('hidden');
                img.classList.add('hidden');
            }

            modal.classList.remove('hidden');
        }

        function playVideo(videoId, btn) {
            const video = document.getElementById(videoId);
            video.play();
            btn.style.display = 'none';
            video.setAttribute('controls', '');
        }

        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('mediaModal').classList.add('hidden');
            document.getElementById('modalVideo').pause();
        });

        document.getElementById('mediaModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('mediaModal')) {
                document.getElementById('mediaModal').classList.add('hidden');
                document.getElementById('modalVideo').pause();
            }
        });

        // ==================== MOBILE MENU ====================
        document.getElementById('mobileMenuBtn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('mobileOverlay').classList.add('show');
        });

        document.getElementById('mobileMenuClose').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('mobileOverlay').classList.remove('show');
        });

        document.getElementById('mobileOverlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('mobileOverlay').classList.remove('show');
        });

        // ==================== TEXTAREA AUTO-RESIZE ====================
        document.getElementById('messageInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // ==================== CALL BUTTONS (PLACEHOLDERS) ====================
        document.getElementById('callBtn').addEventListener('click', () => showToast('Голосовые звонки скоро...'));
        document.getElementById('videoCallBtn').addEventListener('click', () => showToast('Видеозвонки скоро...'));

        // ==================== CLEANUP ON PAGE CLOSE ====================
        window.addEventListener('beforeunload', () => {
            if (currentUser) {
                db.ref('users/' + currentUser.uid).update({
                    online: false,
                    lastSeen: firebase.database.ServerValue.TIMESTAMP
                });
            }
        });
    </script>
</body>
</html>
