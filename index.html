<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FontCraft Studio Pro - Создай свой TTF шрифт</title>
    <!-- CDN библиотеки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-black: #050505;
            --panel-bg: #121216;
            --panel-border: #22222a;
            --accent: #00f0ff;
            --accent-green: #00ff88;
            --accent-danger: #ff3366;
            --text-main: #f0f0f5;
            --text-muted: #888899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: rgba(18, 18, 22, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--panel-border);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .logo i { color: var(--accent); }

        .btn-export {
            background: linear-gradient(135deg, var(--accent), #0088ff);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            cursor: pointer;
        }

        .btn-export:active { transform: scale(0.96); }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: rgba(0, 240, 255, 0.03);
        }

        /* Main Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
            padding: 12px;
            gap: 12px;
        }

        .tab-content.active { display: flex; }

        /* Character Carousel Selector */
        .char-selector-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .category-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .category-tabs::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            white-space: nowrap;
        }

        .cat-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 700;
        }

        .char-grid {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0;
            scrollbar-width: none;
        }
        .char-grid::-webkit-scrollbar { display: none; }

        .char-card {
            min-width: 44px;
            height: 48px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-main);
            position: relative;
            cursor: pointer;
        }

        .char-card.active {
            border-color: var(--accent);
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent);
        }

        .char-card.has-data::after {
            content: '';
            position: absolute;
            top: 4px;
            right: 4px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 6px var(--accent-green);
        }

        /* Canvas Drawing Area */
        .canvas-container {
            flex: 1;
            min-height: 320px;
            background: #000000;
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        canvas {
            touch-action: none;
            background: transparent;
            cursor: crosshair;
        }

        .canvas-guides {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 0;
            opacity: 0.25;
        }

        .guide-line {
            width: 100%;
            border-bottom: 1px dashed var(--accent);
            position: relative;
        }
        .guide-line.baseline { border-bottom-style: solid; border-color: var(--accent-green); }
        .guide-line::after {
            position: absolute;
            right: 8px;
            top: -12px;
            font-size: 0.65rem;
            color: #fff;
            text-transform: uppercase;
        }
        .guide-line.cap::after { content: 'Cap Height'; }
        .guide-line.baseline::after { content: 'Baseline'; color: var(--accent-green); }

        /* Canvas Controls Toolbar */
        .toolbar {
            display: flex;
            gap: 8px;
            background: var(--panel-bg);
            padding: 8px 12px;
            border-radius: 14px;
            border: 1px solid var(--panel-border);
            align-items: center;
            justify-content: space-between;
        }

        .tool-group { display: flex; gap: 6px; align-items: center; }

        .tool-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #1a1a22;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .tool-btn.active {
            background: var(--accent);
            color: #000;
        }

        .brush-size-slider {
            width: 80px;
            accent-color: var(--accent);
        }

        /* Preview Tab */
        .preview-box {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .preview-input {
            width: 100%;
            background: #000;
            border: 1px solid var(--panel-border);
            padding: 12px;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .preview-text-render {
            min-height: 120px;
            word-break: break-all;
            font-size: 2rem;
            color: #fff;
            padding: 12px;
            background: #08080c;
            border-radius: 10px;
            border: 1px dashed var(--panel-border);
            line-height: 1.3;
        }

        /* Photo Editor Tab */
        .photo-editor-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--panel-bg);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--panel-border);
        }

        .file-input-btn {
            background: rgba(255,255,255,0.05);
            border: 1px dashed var(--accent);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            color: var(--accent);
            font-size: 0.85rem;
            cursor: pointer;
        }

        .photo-canvas-wrapper {
            flex: 1;
            min-height: 280px;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border: 1px solid var(--panel-border);
        }

        #photoCanvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .row-inputs {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .row-inputs label {
            font-size: 0.75rem;
            color: var(--text-muted);
            min-width: 60px;
        }

        .row-inputs input[type="range"] {
            flex: 1;
            accent-color: var(--accent);
        }

        .btn-full {
            width: 100%;
            background: var(--accent-green);
            color: #000;
            font-weight: bold;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Helpers */
        .hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <i data-lucide="type"></i>
            <span>FontCraft Mobile</span>
        </div>
        <button class="btn-export" onclick="downloadTTF()">
            <i data-lucide="download"></i>
            <span>.TTF</span>
        </button>
    </header>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('draw')">
            <i data-lucide="pen-tool"></i> Рисование
        </button>
        <button class="tab-btn" onclick="switchTab('preview')">
            <i data-lucide="eye"></i> Просмотр
        </button>
        <button class="tab-btn" onclick="switchTab('photo')">
            <i data-lucide="image"></i> Фото и Галерея
        </button>
    </div>

    <!-- Main Content -->
    <main>
        <!-- TAB 1: DRAWING -->
        <div id="tab-draw" class="tab-content active">
            
            <div class="char-selector-wrapper">
                <div class="category-tabs">
                    <button class="cat-btn active" onclick="selectCategory('ru_cap')">РУС (А-Я)</button>
                    <button class="cat-btn" onclick="selectCategory('ru_low')">рус (а-я)</button>
                    <button class="cat-btn" onclick="selectCategory('en_cap')">ENG (A-Z)</button>
                    <button class="cat-btn" onclick="selectCategory('en_low')">eng (a-z)</button>
                    <button class="cat-btn" onclick="selectCategory('num')">123 и Знаки</button>
                </div>

                <div class="char-grid" id="charGrid">
                    <!-- Dynamic Char Cards -->
                </div>
            </div>

            <!-- Canvas Touch Area -->
            <div class="canvas-container" id="canvasContainer">
                <div class="canvas-guides">
                    <div class="guide-line cap"></div>
                    <div class="guide-line baseline"></div>
                </div>
                <canvas id="paintCanvas"></canvas>
            </div>

            <!-- Controls Toolbar -->
            <div class="toolbar">
                <div class="tool-group">
                    <button class="tool-btn active" id="btnBrush" onclick="setTool('brush')">
                        <i data-lucide="edit-2"></i>
                    </button>
                    <button class="tool-btn" id="btnEraser" onclick="setTool('eraser')">
                        <i data-lucide="eraser"></i>
                    </button>
                    <button class="tool-btn" onclick="undoStroke()">
                        <i data-lucide="undo-2"></i>
                    </button>
                    <button class="tool-btn" onclick="clearCurrentCanvas()">
                        <i data-lucide="trash-2"></i>
                    </button>
                </div>

                <div class="tool-group">
                    <i data-lucide="circle" style="width: 14px; color: var(--text-muted)"></i>
                    <input type="range" class="brush-size-slider" id="brushSize" min="8" max="45" value="22" oninput="updateBrushSize(this.value)">
                </div>

                <div class="tool-group">
                    <button class="tool-btn" onclick="navigateChar(-1)"><i data-lucide="chevron-left"></i></button>
                    <button class="tool-btn" onclick="navigateChar(1)"><i data-lucide="chevron-right"></i></button>
                </div>
            </div>
            <div class="hint">Рисуйте пальцем по центру кадра. Данные сохраняются автоматически.</div>
        </div>

        <!-- TAB 2: LIVE PREVIEW -->
        <div id="tab-preview" class="tab-content">
            <div class="preview-box">
                <label style="font-size: 0.8rem; color: var(--text-muted);">Введите текст для проверки шрифта:</label>
                <input type="text" class="preview-input" id="previewInput" value="Привет World 123!" oninput="renderLivePreview()">
            </div>
            <div class="preview-box" style="flex: 1;">
                <label style="font-size: 0.8rem; color: var(--text-muted);">Результат вашей гарнитуры:</label>
                <div class="preview-text-render" id="previewRender">Привет World 123!</div>
            </div>
        </div>

        <!-- TAB 3: PHOTO EDITOR -->
        <div id="tab-photo" class="tab-content">
            <div class="photo-editor-controls">
                <label class="file-input-btn">
                    <i data-lucide="upload"></i> Выбрать картинку из галереи
                    <input type="file" id="imageUploader" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                </label>

                <div class="row-inputs">
                    <label>Текст:</label>
                    <input type="text" class="preview-input" id="photoText" value="Мой Настоящий Шрифт" oninput="drawPhotoCard()">
                </div>

                <div class="row-inputs">
                    <label>Размер:</label>
                    <input type="range" id="photoFontSize" min="20" max="150" value="60" oninput="drawPhotoCard()">
                </div>

                <div class="row-inputs">
                    <label>Позиция Y:</label>
                    <input type="range" id="photoTextY" min="0" max="100" value="50" oninput="drawPhotoCard()">
                </div>

                <div class="row-inputs">
                    <label>Цвет:</label>
                    <input type="color" id="photoTextColor" value="#ffffff" onchange="drawPhotoCard()">
                </div>
            </div>

            <div class="photo-canvas-wrapper">
                <canvas id="photoCanvas"></canvas>
            </div>

            <button class="btn-full" onclick="downloadPhotoResult()">
                <i data-lucide="download"></i> Скачать Готовое Фото
            </button>
        </div>
    </main>

    <script>
        // --- DATA MAPS ---
        const CHAR_SETS = {
            ru_cap: "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ".split(""),
            ru_low: "абвгдеёжзийклмнопрстуфхцчшщъыьэюя".split(""),
            en_cap: "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""),
            en_low: "abcdefghijklmnopqrstuvwxyz".split(""),
            num: "0123456789!?,.-+#@%&*()".split("")
        };

        let currentCategory = 'ru_cap';
        let currentChar = 'А';
        let strokeData = {}; // Storage for glyph paths: { 'A': [ {width: 20, points: [{x,y}]}, ... ] }

        // Canvas State
        let canvas, ctx;
        let isDrawing = false;
        let currentStroke = null;
        let activeTool = 'brush'; // 'brush' or 'eraser'
        let brushRadius = 22;

        // Photo Editor State
        let loadedImage = null;

        // --- INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initCanvas();
            selectCategory('ru_cap');
            window.addEventListener('resize', resizeCanvas);
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            event.currentTarget.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');

            if (tabId === 'preview') {
                updateCustomFontInDOM(renderLivePreview);
            } else if (tabId === 'photo') {
                updateCustomFontInDOM(drawPhotoCard);
            }
        }

        // --- CHARACTER SELECTION ---
        function selectCategory(catKey) {
            currentCategory = catKey;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event?.target?.classList.add('active');

            const grid = document.getElementById('charGrid');
            grid.innerHTML = '';

            CHAR_SETS[catKey].forEach(char => {
                const card = document.createElement('div');
                card.className = `char-card ${char === currentChar ? 'active' : ''} ${strokeData[char] && strokeData[char].length > 0 ? 'has-data' : ''}`;
                card.innerText = char;
                card.onclick = () => selectChar(char);
                grid.appendChild(card);
            });

            if (!CHAR_SETS[catKey].includes(currentChar)) {
                selectChar(CHAR_SETS[catKey][0]);
            }
        }

        function selectChar(char) {
            currentChar = char;
            document.querySelectorAll('.char-card').forEach(c => {
                c.classList.toggle('active', c.innerText === char);
            });
            redrawCurrentGlyph();
        }

        function navigateChar(dir) {
            const list = CHAR_SETS[currentCategory];
            let idx = list.indexOf(currentChar) + dir;
            if (idx >= 0 && idx < list.length) {
                selectChar(list[idx]);
            }
        }

        // --- DRAWING CANVAS LOGIC ---
        function initCanvas() {
            canvas = document.getElementById('paintCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();

            // Touch Listeners for Finger Drawing
            canvas.addEventListener('touchstart', handleStart, { passive: false });
            canvas.addEventListener('touchmove', handleMove, { passive: false });
            canvas.addEventListener('touchend', handleEnd, { passive: false });

            // Mouse Listeners for Desktop testing
            canvas.addEventListener('mousedown', handleStart);
            canvas.addEventListener('mousemove', handleMove);
            canvas.addEventListener('mouseup', handleEnd);
        }

        function resizeCanvas() {
            const container = document.getElementById('canvasContainer');
            const rect = container.getBoundingClientRect();
            const size = Math.min(rect.width - 20, rect.height - 20, 400);

            canvas.width = size;
            canvas.height = size;
            redrawCurrentGlyph();
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function handleStart(e) {
            e.preventDefault();
            isDrawing = true;
            const pos = getPos(e);

            if (!strokeData[currentChar]) {
                strokeData[currentChar] = [];
            }

            if (activeTool === 'eraser') {
                erasePoint(pos);
            } else {
                currentStroke = {
                    width: brushRadius,
                    points: [pos]
                };
                strokeData[currentChar].push(currentStroke);
            }
            redrawCurrentGlyph();
        }

        function handleMove(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPos(e);

            if (activeTool === 'eraser') {
                erasePoint(pos);
            } else if (currentStroke) {
                currentStroke.points.push(pos);
            }
            redrawCurrentGlyph();
        }

        function handleEnd(e) {
            e.preventDefault();
            isDrawing = false;
            currentStroke = null;
            markCharHasData();
        }

        function erasePoint(pos) {
            if (!strokeData[currentChar]) return;
            strokeData[currentChar] = strokeData[currentChar].filter(stroke => {
                return !stroke.points.some(pt => Math.hypot(pt.x - pos.x, pt.y - pos.y) < brushRadius);
            });
        }

        function setTool(tool) {
            activeTool = tool;
            document.getElementById('btnBrush').classList.toggle('active', tool === 'brush');
            document.getElementById('btnEraser').classList.toggle('active', tool === 'eraser');
        }

        function updateBrushSize(val) {
            brushRadius = parseInt(val);
        }

        function clearCurrentCanvas() {
            strokeData[currentChar] = [];
            redrawCurrentGlyph();
            markCharHasData();
        }

        function undoStroke() {
            if (strokeData[currentChar] && strokeData[currentChar].length > 0) {
                strokeData[currentChar].pop();
                redrawCurrentGlyph();
                markCharHasData();
            }
        }

        function markCharHasData() {
            const hasData = strokeData[currentChar] && strokeData[currentChar].length > 0;
            document.querySelectorAll('.char-card').forEach(c => {
                if (c.innerText === currentChar) {
                    c.classList.toggle('has-data', hasData);
                }
            });
        }

        function redrawCurrentGlyph() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const strokes = strokeData[currentChar] || [];

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            strokes.forEach(stroke => {
                if (stroke.points.length < 1) return;
                ctx.beginPath();
                ctx.lineWidth = stroke.width;
                ctx.strokeStyle = '#ffffff';

                ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
                for (let i = 1; i < stroke.points.length; i++) {
                    ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
                }
                ctx.stroke();
            });
        }

        // --- VECTOR CONVERSION & TTF GENERATION ENGINE ---

        // Converts finger stroke centerlines into vector outline contours
        function strokeToContour(points, strokeWidth, scaleX, scaleY, offsetY) {
            if (points.length < 2) return null;

            const lefts = [];
            const rights = [];
            const halfW = strokeWidth / 2;

            for (let i = 0; i < points.length; i++) {
                const p = points[i];
                const prev = points[Math.max(0, i - 1)];
                const next = points[Math.min(points.length - 1, i + 1)];

                let dx = next.x - prev.x;
                let dy = next.y - prev.y;
                let len = Math.hypot(dx, dy) || 1;

                let nx = -dy / len;
                let ny = dx / len;

                lefts.push({ x: p.x + nx * halfW, y: p.y + ny * halfW });
                rights.push({ x: p.x - nx * halfW, y: p.y - ny * halfW });
            }

            function toFontCoord(pt) {
                return {
                    x: pt.x * scaleX,
                    y: offsetY - (pt.y * scaleY)
                };
            }

            const path = new opentype.Path();
            let start = toFontCoord(lefts[0]);
            path.moveTo(start.x, start.y);

            for (let i = 1; i < lefts.length; i++) {
                let pt = toFontCoord(lefts[i]);
                path.lineTo(pt.x, pt.y);
            }
            for (let i = rights.length - 1; i >= 0; i--) {
                let pt = toFontCoord(rights[i]);
                path.lineTo(pt.x, pt.y);
            }
            path.close();
            return path;
        }

        function buildOpenTypeFont() {
            const unitsPerEm = 1000;
            const ascender = 800;
            const descender = -200;
            const glyphs = [];

            // Standard Notdef Glyph
            const notdefPath = new opentype.Path();
            notdefPath.moveTo(100, 0);
            notdefPath.lineTo(100, 700);
            notdefPath.lineTo(500, 700);
            notdefPath.lineTo(500, 0);
            notdefPath.close();
            glyphs.push(new opentype.Glyph({
                name: '.notdef',
                unicode: 0,
                advanceWidth: 600,
                path: notdefPath
            }));

            // Space
            glyphs.push(new opentype.Glyph({
                name: 'space',
                unicode: 32,
                advanceWidth: 400,
                path: new opentype.Path()
            }));

            const canvasSize = canvas.width || 300;
            const scaleX = 800 / canvasSize;
            const scaleY = 1000 / canvasSize;

            for (const [char, strokes] of Object.entries(strokeData)) {
                if (!strokes || strokes.length === 0) continue;

                const fontPath = new opentype.Path();

                strokes.forEach(stroke => {
                    const contour = strokeToContour(stroke.points, stroke.width, scaleX, scaleY, ascender);
                    if (contour) {
                        contour.commands.forEach(cmd => {
                            if (cmd.type === 'M') fontPath.moveTo(cmd.x, cmd.y);
                            else if (cmd.type === 'L') fontPath.lineTo(cmd.x, cmd.y);
                            else if (cmd.type === 'Z') fontPath.close();
                        });
                    }
                });

                glyphs.push(new opentype.Glyph({
                    name: 'glyph_' + char.charCodeAt(0),
                    unicode: char.charCodeAt(0),
                    advanceWidth: 750,
                    path: fontPath
                }));
            }

            return new opentype.Font({
                familyName: 'MyCustomHandFont',
                styleName: 'Regular',
                unitsPerEm: unitsPerEm,
                ascender: ascender,
                descender: descender,
                glyphs: glyphs
            });
        }

        function downloadTTF() {
            try {
                const font = buildOpenTypeFont();
                font.download();
            } catch (err) {
                alert("Ошибка генерации TTF: Нарисуйте хотя бы один символ!");
                console.error(err);
            }
        }

        function updateCustomFontInDOM(callback) {
            try {
                const font = buildOpenTypeFont();
                const arrayBuffer = font.toArrayBuffer();
                const fontFace = new FontFace('CustomHandFont', arrayBuffer);

                fontFace.load().then(loadedFont => {
                    document.fonts.add(loadedFont);
                    if (callback) callback();
                }).catch(err => {
                    console.log("Font load issue:", err);
                    if (callback) callback();
                });
            } catch (e) {
                if (callback) callback();
            }
        }

        // --- LIVE PREVIEW ---
        function renderLivePreview() {
            const val = document.getElementById('previewInput').value;
            const renderBox = document.getElementById('previewRender');
            renderBox.style.fontFamily = "'CustomHandFont', sans-serif";
            renderBox.innerText = val || "Начни рисовать...";
        }

        // --- PHOTO EDITOR & GALLERY ---
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    loadedImage = img;
                    drawPhotoCard();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function drawPhotoCard() {
            const pCanvas = document.getElementById('photoCanvas');
            const pCtx = pCanvas.getContext('2d');

            if (!loadedImage) {
                pCanvas.width = 600;
                pCanvas.height = 400;
                pCtx.fillStyle = '#111';
                pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);
                pCtx.fillStyle = '#666';
                pCtx.font = '20px sans-serif';
                pCtx.textAlign = 'center';
                pCtx.fillText('Загрузите фото из галереи', pCanvas.width / 2, pCanvas.height / 2);
                return;
            }

            pCanvas.width = loadedImage.width;
            pCanvas.height = loadedImage.height;

            pCtx.drawImage(loadedImage, 0, 0);

            const text = document.getElementById('photoText').value;
            const fontSize = parseInt(document.getElementById('photoFontSize').value) * (pCanvas.width / 500);
            const posYRatio = parseInt(document.getElementById('photoTextY').value) / 100;
            const color = document.getElementById('photoTextColor').value;

            pCtx.font = `${fontSize}px 'CustomHandFont', sans-serif`;
            pCtx.fillStyle = color;
            pCtx.textAlign = 'center';
            pCtx.textBaseline = 'middle';

            pCtx.fillText(text, pCanvas.width / 2, pCanvas.height * posYRatio);
        }

        function downloadPhotoResult() {
            const pCanvas = document.getElementById('photoCanvas');
            const link = document.createElement('a');
            link.download = 'custom-font-photo.jpg';
            link.href = pCanvas.toDataURL('image/jpeg', 0.9);
            link.click();
        }
    </script>
</body>
