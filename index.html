          const ctx = canvas.getContext('2d');

    // Chunked Base64 converters to avoid maximum call stack size exceeded on large files
    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      const len = bytes.byteLength;
      for (let i = 0; i < len; i += 8192) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + 8192, len)));
      }
      return btoa(binary);
    }

    function base64ToArrayBuffer(base64) {
      const binaryString = atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    // ================= SEEDABLE PRNG FOR OBSTACLED STEGANOGRAPHY =================
    function mulberry32(a) {
      return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
    }

    function getPRNG(seedString) {
      let h = 2166136261;
      for (let i = 0; i < seedString.length; i++) {
        h = Math.imul(h ^ seedString.charCodeAt(i), 16777619);
      }
      return mulberry32(h >>> 0);
    }

      return new Promise((resolve, reject) => {
        const request = indexedDB.open(dbName, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(storeName)) {
            db.createObjectStore(storeName);
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

        const req = store.put(value, key);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);

    // ================= HIGH-PERFORMANCE CRYPTO UTILS =================

    async function calcSafetyNumber(myPubKeyJWKB64, peerPubKeyJWKB64) {
      try {
        const myKeyStr = atob(myPubKeyJWKB64);
        const peerKeyStr = atob(peerPubKeyJWKB64);
        const sorted = [myKeyStr, peerKeyStr].sort();
        const combined = sorted[0] + sorted[1];
        
        const encoder = new TextEncoder();
        const data = encoder.encode(combined);
        const hashBuffer = await window.crypto.subtle.digest("SHA-256", data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        
        let digits = '';
        for (let i = 0; i < hashArray.length - 1; i += 2) {
          const val = (hashArray[i] << 8) | hashArray[i + 1];
          digits += val.toString().padStart(5, '0');
        }
        digits = digits.slice(0, 60);
        const groups = digits.match(/.{1,5}/g);
        return groups ? groups.join(' ') : digits;
      } catch (e) {
        console.error("Safety number calculation failed: ", e);
        return "ERROR GENERATING FINGERPRINT";
      }
    }

    // ================= ADVANCED DETERMINISTIC STEGANOGRAPHY ENGINE =================
    async function embedKeyInImage(imgDataUrl, textPayload, seedString) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const imgData = ctx.getImageData(0, 0, img.width, img.height);
          const data = imgData.data;

          const payloadBytes = new TextEncoder().encode(textPayload);
          const totalLength = payloadBytes.length;
          
          const buffer = new Uint8Array(4 + totalLength);
          buffer[0] = (totalLength >>> 24) & 0xFF;
          buffer[1] = (totalLength >>> 16) & 0xFF;
          buffer[2] = (totalLength >>> 8) & 0xFF;
          buffer[3] = totalLength & 0xFF;
          buffer.set(payloadBytes, 4);

          const totalBits = buffer.length * 8;
          if (totalBits > (data.length * 3) / 4) {
            reject(new Error("Картинка слишком мала для скрытия ключа!"));
            return;
          }

          const prng = getPRNG(seedString);
          let bitPtr = 0;
          let pixelIdx = 0;

          while (bitPtr < totalBits) {
            const jump = Math.floor(prng() * 4) + 1;
            pixelIdx += jump;
            const channel = Math.floor(prng() * 3);
            
            const dataIdx = (pixelIdx * 4) + channel;
            if (dataIdx >= data.length) {
              reject(new Error("Изображение переполнено. Возьмите картинку большего разрешения!"));
              return;
            }

            const byteIdx = Math.floor(bitPtr / 8);
            const bitShift = 7 - (bitPtr % 8);
            const bit = (buffer[byteIdx] >>> bitShift) & 1;

            data[dataIdx] = (data[dataIdx] & 0xFE) | bit;
            bitPtr++;
          }

          ctx.putImageData(imgData, 0, 0);
          resolve(canvas.toDataURL("image/png"));
        };
        img.onerror = () => reject(new Error("Не удалось прочитать исходную картинку."));
        img.src = imgDataUrl;
      });
    }

      return new Promise((resolve, reject) => {
        const img = new Image();

          const imgData = ctx.getImageData(0, 0, img.width, img.height);
          const data = imgData.data;

          const prng = getPRNG(seedString);
          let pixelIdx = 0;

          const headerBuffer = new Uint8Array(4);
          let bitPtr = 0;
          while (bitPtr < 32) {
            const jump = Math.floor(prng() * 4) + 1;
            pixelIdx += jump;
            const channel = Math.floor(prng() * 3);
            const dataIdx = (pixelIdx * 4) + channel;
            if (dataIdx >= data.length) {
              reject(new Error("Не удалось прочитать заголовок стего-контейнера!"));
              return;
            }
            const bit = data[dataIdx] & 1;
            const byteIdx = Math.floor(bitPtr / 8);
            const bitShift = 7 - (bitPtr % 8);
            headerBuffer[byteIdx] |= (bit << bitShift);
            bitPtr++;
          }

          const payloadLength = (headerBuffer[0] << 24) | (headerBuffer[1] << 16) | (headerBuffer[2] << 8) | headerBuffer[3];
          if (payloadLength <= 0 || payloadLength > 100000) {
            reject(new Error("Ключ не найден. Проверьте правильность ID (Seed) или целостность картинки."));
            return;
          }

          const payloadBuffer = new Uint8Array(payloadLength);
          let payloadBitPtr = 0;
          const totalPayloadBits = payloadLength * 8;
          while (payloadBitPtr < totalPayloadBits) {
            const jump = Math.floor(prng() * 4) + 1;
            pixelIdx += jump;
            const channel = Math.floor(prng() * 3);
            const dataIdx = (pixelIdx * 4) + channel;
            if (dataIdx >= data.length) {
              reject(new Error("Стего-изображение повреждено или обрезано!"));

            }
            const bit = data[dataIdx] & 1;
            const byteIdx = Math.floor(payloadBitPtr / 8);
            const bitShift = 7 - (payloadBitPtr % 8);
            payloadBuffer[byteIdx] |= (bit << bitShift);
            payloadBitPtr++;
          }

          try {
            const decoded = new TextDecoder().decode(payloadBuffer);
            resolve(decoded);
          } catch (e) {
            reject(new Error("Сбой декодирования байт."));
          }
        };
        img.onerror = () => reject(new Error("Не удалось открыть стего-файл."));
        img.src = imgDataUrl;

    // ================= DECRYPTED MEDIA VIEWER CORE COMPONENT (100% E2EE Base64) =================
    function DecryptedMediaViewer({ msgId, docUrl, fileData, sequence, iv, name, mime, myId, partnerId, peerKeyB64, privKeyObj, computeSharedSecret, deriveRatchetMessageKey }) {
      const [localUrl, setLocalUrl] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(false);

      useEffect(() => {
        let isMounted = true;
        async function decrypt() {
          if ((!docUrl && !fileData) || !peerKeyB64 || !privKeyObj) {
            setLoading(false);
            return;
          }
          try {
            let base64Text = fileData;
            if (!base64Text && docUrl) {
              const response = await fetch(docUrl);
              base64Text = await response.text();
            }

            if (!base64Text) {
              throw new Error("Empty file payload");
            }

            const sharedBits = await computeSharedSecret(peerKeyB64, privKeyObj);
            const aesKey = await deriveRatchetMessageKey(sharedBits, parseInt(sequence), myId, partnerId);

            const encryptedBuffer = base64ToArrayBuffer(base64Text);

            const ivBytes = base64ToArrayBuffer(iv); 
            const decryptedBytes = await window.crypto.subtle.decrypt(
              { name: "AES-GCM", iv: new Uint8Array(ivBytes) }, 
              aesKey,
              encryptedBuffer
            );

            let finalMime = mime;
            if (name.endsWith('.mur')) finalMime = 'image/png';
            else if (name.endsWith('.meow')) finalMime = 'video/mp4';
            else if (name.endsWith('.meo')) finalMime = 'audio/webm';
            else if (name.endsWith('.me')) finalMime = 'video/webm';
            else if (!finalMime || finalMime === 'application/octet-stream' || finalMime === 'text/plain') {
                if (name.toLowerCase().endsWith('.jpg') || name.toLowerCase().endsWith('.jpeg')) finalMime = 'image/jpeg';
                else if (name.toLowerCase().endsWith('.png')) finalMime = 'image/png';
                else if (name.toLowerCase().endsWith('.gif')) finalMime = 'image/gif';
                else if (name.toLowerCase().endsWith('.mp4')) finalMime = 'video/mp4';
                else if (name.toLowerCase().endsWith('.webm')) finalMime = 'video/webm';
                else if (name.toLowerCase().endsWith('.mp3')) finalMime = 'audio/mpeg';
                else if (name.toLowerCase().endsWith('.wav')) finalMime = 'audio/wav';
                else if (name.toLowerCase().endsWith('.ogg')) finalMime = 'audio/ogg';
            }

            const blob = new Blob([decryptedBytes], { type: finalMime });
            const localObjUrl = URL.createObjectURL(blob);
            if (isMounted) {
              setLocalUrl(localObjUrl);
              setLoading(false);
            }
          } catch (e) {
            console.error("Inline decryption failed:", e);
            if (isMounted) {
              setError(true);
              setLoading(false);
            }
          }
        }
        decrypt();
        return () => {
          isMounted = false;
          if (localUrl) URL.revokeObjectURL(localUrl); 
        };
      }, [docUrl, fileData, sequence, iv, name, mime, peerKeyB64, privKeyObj, myId, partnerId]);

      // ================= CRYPTOGRAPHIC ADVANCED ENGINE (HASH-CHAIN RATCHET) =================

      async function deriveMasterKey(password, salt) {
        const encoder = new TextEncoder();
        const baseKey = await window.crypto.subtle.importKey(
          "raw",
          encoder.encode(password),
          { name: "PBKDF2" },
          false,
          ["deriveKey"]
        );
        return await window.crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: salt,
            iterations: 600000,
            hash: "SHA-256"
          },
          baseKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"]
        );
      }

      async function computeSharedSecret(peerPubKeyB64, myPrivKeyObj) {
        const partnerJwk = JSON.parse(atob(peerPubKeyB64));
        const partnerPublicKeyObj = await window.crypto.subtle.importKey(
          "jwk",
          partnerJwk,
          { name: "ECDH", namedCurve: "P-256" },
          true,
          []
        );
        return await window.crypto.subtle.deriveBits(
          { name: "ECDH", public: partnerPublicKeyObj },
          myPrivKeyObj,
          256
        );
      }

      async function deriveRatchetMessageKey(initialSharedSecret, sequenceNum, myId, peerId) {
        const sortedIds = [String(myId), String(peerId)].sort();
        
        const salt = new TextEncoder().encode(`ratchet-salt-${sortedIds[0]}`);
        const info = new TextEncoder().encode(`vktg-msg-chain|${sortedIds[0]}|${sortedIds[1]}|${sequenceNum}`);
        
        const rawSecretKey = await window.crypto.subtle.importKey(
          "raw",
          initialSharedSecret,
          { name: "HKDF" },
          false,
          ["deriveKey"]
        );
        
        const chainStartKey = await window.crypto.subtle.deriveKey(
          {
            name: "HKDF",
            hash: "SHA-256",
            salt: salt,
            info: info
          },
          rawSecretKey,
          { name: "HMAC", hash: "SHA-256", length: 256 },
          true,
          ["sign"]
        );
        
        const exportedChainKey = await window.crypto.subtle.exportKey("raw", chainStartKey);
        let currentChainKeyBytes = new Uint8Array(exportedChainKey);
        
        const enc = new TextEncoder();
        const msgConstant = enc.encode("msg-key");
        const chainConstant = enc.encode("chain-key");
        
        let lastMsgKeyBytes = null;
        
        for (let i = 0; i < sequenceNum; i++) {
          const keyObj = await window.crypto.subtle.importKey(
            "raw",
            currentChainKeyBytes,
            { name: "HMAC", hash: "SHA-256" },
            false,
            ["sign"]
          );
          
          const msgSignature = await window.crypto.subtle.sign("HMAC", keyObj, msgConstant);
          lastMsgKeyBytes = new Uint8Array(msgSignature);
          
          const chainSignature = await window.crypto.subtle.sign("HMAC", keyObj, chainConstant);
          currentChainKeyBytes = new Uint8Array(chainSignature);
        }
        
        return await window.crypto.subtle.importKey(
          "raw",
          lastMsgKeyBytes,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"]
        );
      }

      async function handleUnlockVault() {
        if (!passwordInput.trim()) {
          setVaultError("Пароль не может быть пустым!");
          return;
        }

        try {
          const storedSalt = await getSecureKey("vault_salt");
          const storedEncryptedPriv = await getSecureKey("encrypted_private_key");
          const storedPub = await getSecureKey("public_key_jwk");

          if (!storedEncryptedPriv || !storedSalt) {
            const salt = window.crypto.getRandomValues(new Uint8Array(16));
            const newKeys = await window.crypto.subtle.generateKey(
              { name: "ECDH", namedCurve: "P-256" },
              true,
              ["deriveKey", "deriveBits"]
            );

            const pubJwk = await window.crypto.subtle.exportKey("jwk", newKeys.publicKey);
            const privJwk = await window.crypto.subtle.exportKey("jwk", newKeys.privateKey);

            const mKey = await deriveMasterKey(passwordInput, salt);
            const rawPrivBytes = new TextEncoder().encode(JSON.stringify(privJwk));
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const encryptedPriv = await window.crypto.subtle.encrypt(
              { name: "AES-GCM", iv: iv },
              mKey,
              rawPrivBytes
            );

            await saveSecureKey("vault_salt", salt);
            await saveSecureKey("encrypted_private_key", { ciphertext: encryptedPriv, iv: iv });
            await saveSecureKey("public_key_jwk", pubJwk);

            setIdentityKeyPair(newKeys);
            setMyPublicJWK(btoa(JSON.stringify(pubJwk)));
          } else {
            const mKey = await deriveMasterKey(passwordInput, storedSalt);
            try {
              const decryptedPrivBytes = await window.crypto.subtle.decrypt(
                { name: "AES-GCM", iv: storedEncryptedPriv.iv },
                mKey,
                storedEncryptedPriv.ciphertext
              );
              
              const privJwk = JSON.parse(new TextDecoder().decode(decryptedPrivBytes));
              const pub = await window.crypto.subtle.importKey("jwk", storedPub, { name: "ECDH", namedCurve: "P-256" }, true, []);
              const priv = await window.crypto.subtle.importKey("jwk", privJwk, { name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey", "deriveBits"]);

              setIdentityKeyPair({ publicKey: pub, privateKey: priv });
              setMyPublicJWK(btoa(String(JSON.stringify(storedPub))));
            } catch (decErr) {
              setVaultError("Неверный пароль разблокировки!");
              return;
            }
          }

          setMasterPassword(passwordInput);
          setIsVaultLocked(false);
          setVaultError('');
        } catch (err) {
          setVaultError("Критическая ошибка хранилища: " + err.message);
        }
      }

      async function encryptDataPFS(recipientPubJWKB64, arrayBufferOrBytes, sequenceNum) {
        if (!identityKeyPair || !myProfile) throw new Error("Ключ шифрования не разблокирован.");
        const sharedBits = await computeSharedSecret(recipientPubJWKB64, identityKeyPair.privateKey);
        const aesKey = await deriveRatchetMessageKey(sharedBits, sequenceNum, myProfile.id, activePartner.id);

        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const ciphertext = await window.crypto.subtle.encrypt(
          { name: "AES-GCM", iv: iv },
          aesKey,
          arrayBufferOrBytes
        );

        return {
          ivB64: arrayBufferToBase64(iv.buffer), 
          ciphertextBuffer: ciphertext
        };
      }

      async function encryptPFS(recipientPubJWKB64, messageText) {
        const savedSeq = await getSecureKey(`seq_sent_${activePartner.id}`);
        const sequence = (savedSeq ? parseInt(savedSeq) : 0) + 1;
        await saveSecureKey(`seq_sent_${activePartner.id}`, sequence);

        const randomPadBytes = window.crypto.getRandomValues(new Uint8Array(Math.floor(Math.random() * 128) + 16));
        const payloadData = {
          text: messageText,
          timestamp: Date.now(),
          sender_id: myProfile.id,
          recipient_id: activePartner.id,
          sequence: sequence,
          _pad: btoa(String.fromCharCode(...randomPadBytes))
        };

        const payloadBytes = new TextEncoder().encode(JSON.stringify(payloadData));
        const encrypted = await encryptDataPFS(recipientPubJWKB64, payloadBytes, sequence);

        return {
          sequence,
          ivB64: encrypted.ivB64,
          ciphertextB64: arrayBufferToBase64(encrypted.ciphertextBuffer)
        };
      }

      async function decryptPFS(sequence, ivB64, ciphertextB64, item) {
        if (!identityKeyPair || !myProfile) return null;
        try {
          const partnerId = item.from_id;
          const partnerKeyB64 = peerKeys[partnerId] || (activePartner && activePartner.id === partnerId ? activePartner.public_key : null);
          if (!partnerKeyB64) return null;

          const sharedBits = await computeSharedSecret(partnerKeyB64, identityKeyPair.privateKey);
          const aesKey = await deriveRatchetMessageKey(sharedBits, parseInt(sequence), myProfile.id, partnerId);

          const iv = new Uint8Array(base64ToArrayBuffer(ivB64)); 
          const ciphertext = new Uint8Array(base64ToArrayBuffer(ciphertextB64)); 

          const decryptedBytes = await window.crypto.subtle.decrypt(
            { name: "AES-GCM", iv: iv },
            aesKey,
            ciphertext
          );

          const payload = JSON.parse(new TextDecoder().decode(decryptedBytes));
          
          if (String(payload.recipient_id) !== String(myProfile.id)) { 
            return { error: "Нарушение адресации! Сообщение заблокировано." };
          }

          const lastVerifiedSeqKey = `vktg_last_verified_seq_${partnerId}`;
          const lastVerifiedSeq = parseInt(await getSecureKey(lastVerifiedSeqKey) || '0');

          if (payload.sequence <= lastVerifiedSeq) {
            return { error: "Обнаружена атака повторного воспроизведения (Replay Attack)!" };
          }
          await saveSecureKey(lastVerifiedSeqKey, payload.sequence.toString());

          return payload;
        } catch (e) {
          console.error("Decryption failed", e);
          return null;
        }
      }

      // Reset Ratchet to avoid decryption sequence desynchronization bugs
      const handleResetRatchet = async () => {
        if (!activePartner) return;
        try {
          await saveSecureKey(`seq_sent_${activePartner.id}`, 0);

          {/* ================= ANDROID DRAWER MENU ================= */}
          {drawerOpen && (
            <div className="absolute inset-0 bg-black/75 z-50 flex">
              <div className="w-[80%] max-w-[300px] bg-[#0d121e] h-full flex flex-col border-r border-[#1c2a3d] shadow-2xl relative animate-slide-right">
                
                {/* Drawer Header Banner */}
                <div className="bg-[#121b26] p-5 space-y-3.5 border-b border-[#1c2a3d]">
                  <div className="w-16 h-16 rounded-full overflow-hidden bg-sky-950 border-2 border-sky-500/25 relative shrink-0">
                    <img src={customAvatar || (myProfile && myProfile.photo_100)} className="w-full h-full object-cover animate-fade-in" />
                  </div>
                  <div className="min-w-0">
                    <h3 className="font-bold text-white text-sm truncate">
                      {customName || (myProfile && `${myProfile.first_name}`)}
                    </h3>
                    <p className="text-xs text-emerald-400 font-semibold truncate mt-0.5">@{myProfile && myProfile.id}</p>
                    <p className="text-[10px] text-gray-400 truncate mt-1 italic font-light">"{customBio || (myProfile && myProfile.bio)}"</p>
                  </div>
                </div>

                {/* Navigation Options */}
                <div className="flex-1 py-4 overflow-y-auto space-y-1">
                  
                  {/* TG SAVED MESSAGES */}
                  <div 
                    onClick={handleOpenSavedMessages}
                    className="flex items-center gap-4 px-5 py-3.5 text-sky-400 text-xs font-semibold hover:bg-white/5 active:bg-white/10 cursor-pointer transition"
                  >
                    <Icons.LockOpen className="w-5 h-5 text-sky-400" />
                    Избранное (Saved Messages)
                  </div>

                  <div 
                    onClick={() => { setDrawerOpen(false); setSettingsOpen(true); }}
                    className="flex items-center gap-4 px-5 py-3.5 text-gray-300 text-xs font-semibold hover:bg-white/5 active:bg-white/10 cursor-pointer transition"
                  >
                    <Icons.Settings />
                    Настройки профиля
                  </div>

                  <div 
                    onClick={() => {
                      if (identityKeyPair && myPublicJWK && myProfile) {
                        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(myPublicJWK));
                        const dl = document.createElement('a');
                        dl.setAttribute("href", dataStr);
                        dl.setAttribute("download", `pub_identity_${myProfile.id}.json`);
                        dl.click();
                      } else {
                         alert("Публичный ключ еще не сгенерирован или не доступен.");
                      }
                    }}
                    className="flex items-center gap-4 px-5 py-3.5 text-gray-300 text-xs font-semibold hover:bg-white/5 active:bg-white/10 cursor-pointer transition"
                  >
                    <Icons.Key />
                    Резервная копия ключей
                  </div>

                  <div 
                    onClick={handleLogout}
                    className="flex items-center gap-4 px-5 py-3.5 text-rose-400 text-xs font-semibold hover:bg-rose-950/20 active:bg-rose-950/30 cursor-pointer transition border-t border-[#1b2533]/40"
                  >
                    <Icons.Logout />
                    Выйти из аккаунта
                  </div>
                </div>

                <div className="p-4 border-t border-[#1b2533]/80 text-center text-[10px] text-gray-500 font-medium animate-pulse">
                  Realtime Messenger v4.0 Ultimate
                </div>

              </div>
              <div onClick={() => setDrawerOpen(false)} className="flex-1 h-full"></div>
            </div>
          )}

          {/* ================= PROFILE SETTINGS MODAL ================= */}
          {settingsOpen && (
            <div className="absolute inset-0 bg-black/85 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-[#0d121e] w-full max-w-sm rounded-2xl p-5 border border-[#1b2533] space-y-4 max-h-[90vh] overflow-y-auto animate-slide-up">
                <div className="flex items-center justify-between border-b border-[#1b2533] pb-2">
                  <h3 className="font-bold text-white text-sm">Профиль</h3>
                  <button onClick={() => setSettingsOpen(false)} className="text-gray-400 p-1">
                    <Icons.Close />
                  </button>
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="block text-[10px] text-gray-400 mb-1.5 font-bold uppercase tracking-wider">Никнейм / Имя</label>
                    <input 
                      type="text" 
                      value={customName}
                      onChange={(e) => setCustomName(e.target.value)}
                      className="w-full bg-[#05070c] text-xs text-white p-3 rounded-xl border border-[#1b2533] focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-[10px] text-gray-400 mb-1.5 font-bold uppercase tracking-wider">О себе (Био)</label>
                    <input 
                      type="text" 
                      value={customBio}
                      onChange={(e) => setCustomBio(e.target.value)}
                      placeholder="О себе"
                      className="w-full bg-[#05070c] text-xs text-white p-3 rounded-xl border border-[#1b2533] focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-[10px] text-gray-400 mb-1.5 font-bold uppercase tracking-wider">Аватар (из галереи)</label>
                    <div className="flex items-center gap-4 bg-[#05070c] p-3 rounded-xl border border-[#1b2533]">
                      <div className="w-12 h-12 rounded-full overflow-hidden bg-[#0d121e] border border-[#212f45] shrink-0">
                        <img src={customAvatar || "https://vk.com/images/camera_100.png"} className="w-full h-full object-cover" />
                      </div>
                      <div className="flex-1 flex flex-col gap-2">
                        <label className="py-2 px-3 bg-[#1e293b] hover:bg-[#334155] border border-white/5 rounded-lg text-center cursor-pointer text-[10px] font-bold tracking-wider text-white transition">
                          ОБНОВИТЬ ФОТО
                          <input type="file" accept="image/*" onChange={handleSettingsAvatarUpload} className="hidden" />
                        </label>
                        <button 
                          onClick={handleDeleteSettingsAvatar}
                          className="py-1.5 px-3 bg-rose-950/30 hover:bg-rose-950/50 text-rose-400 rounded-lg text-[9px] font-bold tracking-wider transition border border-rose-900/40"
                        >
                          УДАЛИТЬ ФОТО
                        </button>
                      </div>
                    </div>
                  </div>
                  
                  <button 
                    onClick={handleSaveLocalProfile}
                    className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl transition mt-2"
                  >
                    СОХРАНИТЬ ИЗМЕНЕНИЯ
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= NEW CHAT MODAL ================= */}
          {newChatModal && (
            <div className="absolute inset-0 bg-black/85 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-[#0d121e] w-full max-w-sm rounded-2xl p-5 border border-[#1b2533] space-y-4">
                <div className="flex items-center justify-between border-b border-[#1b2533] pb-2">
                  <h3 className="font-bold text-white text-sm">Новый чат E2EE</h3>
                  <button onClick={() => setNewChatModal(false)} className="text-gray-400 p-1">
                    <Icons.Close />
                  </button>
                </div>

                <p className="text-[11px] text-[#7d8fa3] leading-relaxed">
                  Введите уникальный юзернейм собеседника, чтобы открыть прямой зашифрованный чат.
                </p>

                <div>
                  <label className="block text-[10px] text-gray-400 mb-1.5 uppercase tracking-wider">Имя пользователя (Юзернейм)</label>
                  <div className="relative">
                    <span className="absolute inset-y-0 left-0 pl-3 flex items-center text-sky-400 text-xs font-semibold">@</span>
                    <input 
                      type="text" 
                      value={targetUserId}
                      onChange={(e) => setTargetUserId(e.target.value.toLowerCase().replace(/[^a-z0-9_]/g, ''))}
                      placeholder="username"
                      className="w-full bg-[#05070c] text-xs text-white pl-7 pr-3.5 py-3.5 rounded-xl border border-[#1b2533] focus:outline-none"
                    />
                  </div>
                </div>

                <div className="flex justify-end gap-2 text-xs pt-2">
                  <button 
                    onClick={() => setNewChatModal(false)}
                    className="px-4 py-2 text-gray-400 hover:bg-white/5 rounded-lg transition"
                  >
                    Отмена
                  </button>
                  <button 
                    onClick={handleStartNewChat}
                    className="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-lg transition"
                  >
                    ОТКРЫТЬ
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= SAFETY NUMBERS MODAL ================= */}
          {safetyNumberModal && activePartner && (
            <div className="absolute inset-0 bg-black/85 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-[#0d121e] w-full max-w-sm rounded-2xl p-5 border border-emerald-950 text-center space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-[#1b2533]">
                  <span className="text-xs font-bold text-emerald-400 flex items-center gap-1.5 uppercase">
                    <Icons.Lock className="w-3.5 h-3.5" />
                    ВЕРИФИКАЦИЯ КАНАЛА
                  </span>
                  <button onClick={() => setSafetyNumberModal(false)} className="text-gray-400 p-1">
                    <Icons.Close />
                  </button>
                </div>

                <div className="space-y-1 text-left">
                  <h4 className="text-xs font-bold text-white uppercase tracking-wider">О собеседнике:</h4>
                  <p className="text-xs text-[#7d8fa3]">Имя: <span className="text-white font-bold">{activePartner.first_name}</span></p>
                  <p className="text-xs text-[#7d8fa3]">О себе (Био): <span className="text-white italic">"{activePartner.bio || 'Нет описания'}"</span></p>
                </div>

                <p className="text-[11px] text-[#7d8fa3] leading-relaxed">
                  Для предотвращения атак перехвата сравните эти 60 чисел с числами на экране собеседника {activePartner.first_name}:
                </p>

                <div className="bg-[#05070c] p-4 rounded-xl border border-[#1b2533] font-mono text-xs text-emerald-400 tracking-widest break-words leading-relaxed select-all">
                  {safetyNumber}
                </div>

                <div className="text-[9px] text-gray-500 leading-relaxed">
                  Протокол: Forward-Secure Symmetric Ratchet on ECDH (P-256) + HMAC-SHA256 + AES-GCM 256.
                </div>
              </div>
            </div>
          )}

          {/* ================= ATTACHMENT BOTTOM SHEET ================= */}
          {attachmentSheet && (
            <div className="absolute inset-0 bg-black/75 z-50 flex flex-col justify-end">
              <div onClick={() => setAttachmentSheet(false)} className="flex-1 w-full"></div>
              
              <div className="bg-[#0d121e] rounded-t-3xl p-5 space-y-4 border-t border-[#1e293b] shadow-2xl relative animate-slide-up">
                <div className="w-12 h-1 bg-white/10 rounded-full mx-auto mb-1"></div>
                <h4 className="text-xs font-bold text-white uppercase tracking-wider text-center">Шифрованная отправка E2EE</h4>
                
                <div className="grid grid-cols-2 gap-4 pt-2">
                  <label className="flex flex-col items-center justify-center p-4 bg-[#05070c] hover:bg-[#121822] rounded-xl cursor-pointer border border-[#1b2533] space-y-1.5 transition">
                    <span className="text-emerald-400"><Icons.Edit /></span>
                    <span className="text-[10px] text-white font-semibold">Галерея / Файлы</span>
                    <input type="file" onChange={handleFileSelectionDirect} className="hidden" />
                  </label>

                  <div 
                    onClick={() => { setAttachmentSheet(false); startCircleRecording(); }}
                    className="flex flex-col items-center justify-center p-4 bg-[#05070a] hover:bg-[#121822] rounded-xl cursor-pointer border border-[#1b2533] space-y-1.5 transition text-center"
                  >
                    <Icons.CircleVideo />
                    <span className="text-[10px] text-white font-semibold">Записать кружочек (.me)</span>
                  </div>
                </div>

                <button 
                  onClick={() => setAttachmentSheet(false)}
                  className="w-full py-3 bg-[#1e293b] hover:bg-[#28384d] text-white text-xs font-bold rounded-xl transition"
                >
                  ОТМЕНА
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    function formatTimestamp(timestamp) {
      if (!timestamp) return '';
      const date = new Date(timestamp * 1000);
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    function formatLastSeen(timestamp) {
      if (!timestamp) return "был(а) недавно";
      const date = new Date(timestamp);
      const now = new Date();
      const timeStr = String(date.getHours()).padStart(2, '0') + ":" + String(date.getMinutes()).padStart(2, '0');
      
      if (date.toDateString() === now.toDateString()) {
        return `был(а) в сети сегодня в ${timeStr}`;
      }
      const yesterday = new Date(now);
      yesterday.setDate(now.getDate() - 1);
      if (date.toDateString() === yesterday.toDateString()) {
        return `был(а) в сети вчера в ${timeStr}`;
      }
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      return `был(а) в сети ${day}.${month} в ${timeStr}`;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
