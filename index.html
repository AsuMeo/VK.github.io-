<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>3D Кинотеатр - Реалтайм</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.0/firebase-database-compat.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Inter',sans-serif; }

/* AUTH */
.auth-screen {
  position:fixed; inset:0; z-index:1000;
  background:radial-gradient(ellipse at 30% 20%, #1a0a2e 0%, #0f0520 60%, #050210 100%);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  transition:opacity 0.8s ease; padding:16px;
}
.auth-screen.hidden { opacity:0; pointer-events:none; }
.auth-container {
  width:100%; max-width:380px; padding:28px 20px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:20px; backdrop-filter:blur(20px);
  box-shadow:0 10px 40px rgba(138,43,226,0.2);
}
.auth-logo {
  font-family:'Orbitron',sans-serif; font-size:28px;
  font-weight:900; text-align:center; margin-bottom:6px;
  background:linear-gradient(135deg,#ff3366,#8a2be2,#00d4ff);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text; letter-spacing:2px;
}
.auth-sub { text-align:center; color:rgba(255,255,255,0.5); font-size:13px; margin-bottom:24px; }
.auth-input {
  width:100%; padding:14px 16px; margin-bottom:12px;
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1);
  border-radius:12px; color:#fff; font-size:15px; outline:none;
  transition:all 0.3s; font-family:'Inter',sans-serif;
  -webkit-appearance:none;
}
.auth-input:focus { border-color:rgba(138,43,226,0.5); box-shadow:0 0 20px rgba(138,43,226,0.15); }
.auth-input::placeholder { color:rgba(255,255,255,0.3); }
.auth-btn {
  width:100%; padding:14px; border:none; border-radius:12px;
  background:linear-gradient(135deg,#8a2be2,#ff3366);
  color:#fff; font-size:15px; font-weight:600; cursor:pointer;
  transition:all 0.3s; margin-top:6px; font-family:'Inter',sans-serif;
  box-shadow:0 4px 20px rgba(138,43,226,0.4);
}
.auth-btn:active { transform:scale(0.97); }
.auth-toggle { text-align:center; color:rgba(255,255,255,0.4); font-size:12px; margin-top:16px; cursor:pointer; }
.auth-toggle span { color:#ff3366; font-weight:600; }
.auth-error { color:#ff3366; font-size:12px; text-align:center; margin-top:10px; min-height:18px; }
.auth-mode { display:none; }
.auth-mode.active { display:block; }

/* MAIN */
.main-ui { display:none; width:100%; height:100%; position:relative; }
.main-ui.active { display:block; }

#game-canvas { position:fixed; inset:0; z-index:1; width:100%; height:100%; }

/* TOP BAR */
.top-bar {
  position:fixed; top:0; left:0; right:0; z-index:100;
  height:52px; padding:env(safe-area-inset-top) 12px 0 12px;
  background:linear-gradient(180deg,rgba(0,0,0,0.8) 0%,rgba(0,0,0,0.4) 70%,transparent 100%);
  display:flex; align-items:center; justify-content:space-between;
  backdrop-filter:blur(12px);
  pointer-events:none;
}
.top-bar > * { pointer-events:auto; }
.top-bar .logo-text {
  font-family:'Orbitron',sans-serif; font-size:14px;
  font-weight:900; color:#ff3366; letter-spacing:1px;
}
.top-bar .user-info { display:flex; align-items:center; gap:10px; }
.top-bar .avatar {
  width:34px; height:34px; border-radius:50%;
  background:linear-gradient(135deg,#8a2be2,#ff3366);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:13px; color:#fff;
  border:2px solid rgba(255,255,255,0.3);
  overflow:hidden; cursor:pointer; flex-shrink:0;
}
.top-bar .online-count {
  color:rgba(255,255,255,0.6); font-size:11px;
  background:rgba(255,255,255,0.08); padding:4px 10px;
  border-radius:10px; border:1px solid rgba(255,255,255,0.1);
}
.top-bar .logout-btn {
  padding:6px 12px; border:1px solid rgba(255,50,100,0.3);
  background:rgba(255,255,255,0.08); color:#ff3366;
  border-radius:8px; font-size:12px; cursor:pointer;
}

/* MOBILE CONTROLS */
.controls-overlay {
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom)) 10px;
  pointer-events:none;
  display:flex; justify-content:space-between; align-items:flex-end;
}
.controls-overlay > * { pointer-events:auto; }

.joystick-zone {
  position:relative; width:140px; height:140px;
  touch-action:none;
}
.joystick-base {
  position:absolute; inset:0;
  border-radius:50%;
  background:rgba(255,255,255,0.08);
  border:2px solid rgba(255,255,255,0.15);
  backdrop-filter:blur(10px);
}
.joystick-stick {
  position:absolute; width:50px; height:50px;
  border-radius:50%;
  background:linear-gradient(135deg,#8a2be2,#ff3366);
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 4px 20px rgba(138,43,226,0.5);
  pointer-events:none;
}

.action-buttons {
  display:flex; flex-direction:column; gap:10px; align-items:flex-end;
}
.action-btn {
  width:56px; height:56px; border-radius:50%;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(10px);
  color:#fff; font-size:22px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all 0.15s;
  -webkit-appearance:none;
}
.action-btn:active { transform:scale(0.9); background:rgba(138,43,226,0.3); }
.action-btn.jump-btn {
  background:linear-gradient(135deg,#ff3366,#ff6b6b);
  box-shadow:0 4px 20px rgba(255,51,102,0.4);
}
.action-btn.menu-btn {
  background:linear-gradient(135deg,#8a2be2,#6a0dad);
  box-shadow:0 4px 20px rgba(138,43,226,0.4);
}

/* VIDEO PANEL */
.video-panel {
  position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%) scale(0.9);
  z-index:200; width:min(92vw,400px);
  background:rgba(10,5,20,0.98); backdrop-filter:blur(20px);
  border:1px solid rgba(138,43,226,0.3); border-radius:20px;
  padding:20px; display:none; opacity:0;
  transition:all 0.3s;
  box-shadow:0 10px 40px rgba(0,0,0,0.8);
}
.video-panel.active { display:block; opacity:1; transform:translate(-50%,-50%) scale(1); }
.video-panel h3 {
  font-family:'Orbitron',sans-serif; font-size:16px;
  color:#ff3366; text-align:center; margin-bottom:16px;
}
.video-panel input[type="text"] {
  width:100%; padding:12px 14px; margin-bottom:12px;
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1);
  border-radius:12px; color:#fff; font-size:14px; outline:none;
}
.video-panel .file-btn {
  width:100%; padding:14px; margin-bottom:12px;
  background:rgba(138,43,226,0.2); border:1px dashed rgba(138,43,226,0.4);
  border-radius:12px; color:#8a2be2; font-size:14px;
  text-align:center; cursor:pointer;
}
.video-panel .video-row {
  display:flex; gap:8px; margin-bottom:10px;
}
.video-panel .video-row button {
  flex:1; padding:12px; border:none; border-radius:12px;
  background:linear-gradient(135deg,#8a2be2,#ff3366);
  color:#fff; font-size:13px; font-weight:600; cursor:pointer;
}
.video-panel .video-row button.secondary {
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15); color:#fff;
}
.video-panel .close-btn {
  position:absolute; top:10px; right:10px;
  width:32px; height:32px; border-radius:50%;
  background:rgba(255,255,255,0.1); border:none;
  color:#fff; font-size:16px; cursor:pointer;
}
.video-panel .size-warning {
  color:rgba(255,255,255,0.4); font-size:11px;
  text-align:center; margin-top:8px;
}

/* VIDEO CONTROLS BAR */
.video-controls {
  position:fixed; bottom:170px; left:50%; transform:translateX(-50%);
  z-index:90; display:none; align-items:center; gap:10px;
  background:rgba(0,0,0,0.7); backdrop-filter:blur(10px);
  padding:8px 16px; border-radius:20px;
  border:1px solid rgba(255,255,255,0.1);
}
.video-controls.active { display:flex; }
.video-controls button {
  width:36px; height:36px; border-radius:50%;
  background:rgba(255,255,255,0.1); border:none;
  color:#fff; font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.video-controls button:active { background:rgba(138,43,226,0.4); }
.video-controls .time-slider {
  width:120px; -webkit-appearance:none; height:4px;
  border-radius:2px; background:rgba(255,255,255,0.2); outline:none;
}
.video-controls .time-slider::-webkit-slider-thumb {
  -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
  background:#ff3366; cursor:pointer;
}
.video-controls .time-label {
  color:rgba(255,255,255,0.6); font-size:11px; min-width:70px;
  text-align:center;
}

/* PLAYERS PANEL */
.players-panel {
  position:fixed; top:52px; right:0; bottom:0; z-index:90;
  width:70vw; max-width:280px;
  background:rgba(10,5,20,0.98); backdrop-filter:blur(20px);
  border-left:1px solid rgba(138,43,226,0.2);
  transform:translateX(100%); transition:transform 0.35s;
  display:flex; flex-direction:column;
}
.players-panel.open { transform:translateX(0); }
.players-header {
  padding:16px; border-bottom:1px solid rgba(255,255,255,0.1);
  display:flex; align-items:center; justify-content:space-between;
}
.players-header h3 {
  font-family:'Orbitron',sans-serif; font-size:14px; color:#ff3366;
}
.players-header .close-btn {
  width:32px; height:32px; border-radius:50%;
  background:rgba(255,255,255,0.1); border:none;
  color:#fff; font-size:16px; cursor:pointer;
}
.players-list { flex:1; overflow-y:auto; padding:10px; }
.player-item {
  display:flex; align-items:center; gap:10px;
  padding:10px; border-radius:12px;
  background:rgba(255,255,255,0.03);
  margin-bottom:6px;
}
.player-item .p-avatar {
  width:36px; height:36px; border-radius:50%;
  background:linear-gradient(135deg,#8a2be2,#ff3366);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:14px; color:#fff; flex-shrink:0;
}
.player-item .p-name { color:#fff; font-size:13px; font-weight:600; }
.player-item .p-status { font-size:10px; color:#22c55e; margin-left:auto; }

/* NICKNAME MODAL */
.nickname-modal {
  position:fixed; inset:0; z-index:500;
  background:rgba(0,0,0,0.9); backdrop-filter:blur(20px);
  display:none; align-items:center; justify-content:center;
  padding:16px;
}
.nickname-modal.active { display:flex; }
.nickname-card {
  width:100%; max-width:340px;
  background:rgba(10,5,20,0.98);
  border:1px solid rgba(138,43,226,0.3);
  border-radius:20px; padding:24px; text-align:center;
}
.nickname-card h3 {
  font-family:'Orbitron',sans-serif; font-size:18px;
  color:#ff3366; margin-bottom:16px;
}
.nickname-card input {
  width:100%; padding:14px 16px;
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1);
  border-radius:12px; color:#fff; font-size:15px; outline:none;
  margin-bottom:16px; text-align:center;
}
.nickname-card button {
  width:100%; padding:14px; border:none; border-radius:12px;
  background:linear-gradient(135deg,#8a2be2,#ff3366);
  color:#fff; font-size:15px; font-weight:600; cursor:pointer;
}

/* NAME TAGS */
.name-tag {
  position:fixed; pointer-events:none;
  color:#fff; font-size:11px; font-weight:600;
  text-shadow:0 0 10px rgba(0,0,0,0.8), 0 0 20px rgba(138,43,226,0.5);
  background:rgba(0,0,0,0.5); padding:2px 8px;
  border-radius:6px; border:1px solid rgba(138,43,226,0.3);
  white-space:nowrap; transform:translate(-50%,-100%);
  z-index:50;
}

/* HINT OVERLAY */
.hint-overlay {
  position:fixed; top:60px; left:50%; transform:translateX(-50%);
  z-index:80; background:rgba(0,0,0,0.6);
  color:rgba(255,255,255,0.7); font-size:12px;
  padding:8px 16px; border-radius:10px;
  pointer-events:none; text-align:center;
}

/* LOADING */
.loading-overlay {
  position:fixed; inset:0; z-index:9999;
  background:#000; display:flex;
  align-items:center; justify-content:center; flex-direction:column;
  transition:opacity 0.5s;
}
.loading-overlay.hidden { opacity:0; pointer-events:none; }
.loading-overlay .loader {
  width:50px; height:50px; border:3px solid rgba(138,43,226,0.2);
  border-top-color:#8a2be2; border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.loading-overlay p { color:#8a2be2; margin-top:12px; font-size:14px; }
</style>
</head>
<body>

<div class="loading-overlay" id="loading"><div class="loader"></div><p>Загрузка 3D Кинотеатра...</p></div>

<!-- AUTH -->
<div class="auth-screen" id="authScreen">
  <div class="auth-container">
    <div class="auth-logo">3D КИНОТЕАТР</div>
    <div class="auth-sub">Реалтайм · Мультиплеер · 3D</div>
    <div class="auth-mode active" id="loginMode">
      <input type="email" class="auth-input" id="loginEmail" placeholder="Email" autocomplete="email">
      <input type="password" class="auth-input" id="loginPass" placeholder="Пароль" autocomplete="current-password">
      <button class="auth-btn" onclick="doLogin()">Войти</button>
      <div class="auth-error" id="loginError"></div>
      <div class="auth-toggle">Нет аккаунта? <span onclick="switchAuth('register')">Создать</span></div>
    </div>
    <div class="auth-mode" id="registerMode">
      <input type="text" class="auth-input" id="regUsername" placeholder="Никнейм" maxlength="16">
      <input type="email" class="auth-input" id="regEmail" placeholder="Email" autocomplete="email">
      <input type="password" class="auth-input" id="regPass" placeholder="Пароль (мин. 6)" autocomplete="new-password">
      <button class="auth-btn" onclick="doRegister()">Создать</button>
      <div class="auth-error" id="regError"></div>
      <div class="auth-toggle">Уже есть? <span onclick="switchAuth('login')">Войти</span></div>
    </div>
  </div>
</div>

<!-- NICKNAME -->
<div class="nickname-modal" id="nicknameModal">
  <div class="nickname-card">
    <h3>🎭 Ваш никнейм</h3>
    <input type="text" id="nicknameInput" placeholder="Введите ник..." maxlength="16">
    <button onclick="saveNickname()">Войти в кинотеатр</button>
  </div>
</div>

<!-- MAIN -->
<div class="main-ui" id="mainUI">
  <div class="top-bar">
    <div class="logo-text">3D КИНОТЕАТР</div>
    <div class="user-info">
      <div class="online-count" id="onlineCount">1 онлайн</div>
      <div class="avatar" id="userAvatar" onclick="togglePlayersPanel()">?</div>
      <button class="logout-btn" onclick="doLogout()">Выйти</button>
    </div>
  </div>

  <div class="hint-overlay" id="hintOverlay">👆 Тапни на большой экран чтобы выбрать видео</div>

  <canvas id="game-canvas"></canvas>
  <div id="nameTagsContainer"></div>

  <div class="video-controls" id="videoControls">
    <button onclick="toggleVideoPlay()" id="playPauseBtn">▶</button>
    <span class="time-label" id="timeLabel">0:00 / 0:00</span>
    <input type="range" class="time-slider" id="timeSlider" min="0" max="100" value="0" oninput="seekVideo(this.value)">
  </div>

  <div class="controls-overlay">
    <div class="joystick-zone" id="joystickZone">
      <div class="joystick-base"></div>
      <div class="joystick-stick" id="joystickStick"></div>
    </div>
    <div class="action-buttons">
      <button class="action-btn menu-btn" onclick="toggleVideoPanel()" title="Видео">🎬</button>
      <button class="action-btn jump-btn" id="jumpBtn" title="Прыжок">⬆️</button>
    </div>
  </div>
</div>

<!-- VIDEO PANEL -->
<div class="video-panel" id="videoPanel">
  <button class="close-btn" onclick="toggleVideoPanel()">✕</button>
  <h3>🎬 Выбор видео</h3>
  <input type="text" id="videoUrlInput" placeholder="Прямая ссылка на видео (.mp4)...">
  <div class="video-row">
    <button onclick="loadVideoFromUrl()">🌐 Загрузить</button>
    <button class="secondary" onclick="document.getElementById('videoFileInput').click()">📁 Галерея</button>
  </div>
  <input type="file" id="videoFileInput" accept="video/*" onchange="handleVideoFile(this)">
  <div class="size-warning">⚠️ Макс 8 МБ. Большие — через ссылку.</div>
</div>

<!-- PLAYERS PANEL -->
<div class="players-panel" id="playersPanel">
  <div class="players-header">
    <h3>👥 Игроки</h3>
    <button class="close-btn" onclick="togglePlayersPanel()">✕</button>
  </div>
  <div class="players-list" id="playersList"></div>
</div>

<script>
// ===== FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyBm0mIvHVznIeF2PoFk6dtdaiT5r877wyA",
  authDomain: "meow-874ce.firebaseapp.com",
  databaseURL: "https://meow-874ce-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "meow-874ce",
  storageBucket: "meow-874ce.firebasestorage.app",
  messagingSenderId: "471541334599",
  appId: "1:471541334599:web:567af3e7dbe70a37572762"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// ===== STATE =====
let currentUser = null, userData = {}, myNickname = 'Игрок';
let scene, camera, renderer, clock;
let myPlayerMesh;
let otherPlayers = {};
let cinemaScreenMesh, cinemaVideo, cinemaTexture;
let isVideoPanelOpen = false, isPlayersPanelOpen = false;
let animationId;
let joystickActive = false, joystickVector = { x:0, y:0 };
let myPlayerRef = null;
let isSeeking = false;
let gameInitialized = false;

// Physics
const SPEED = 5;
const JUMP_FORCE = 6;
const GRAVITY = 18;
const FRICTION = 0.88;
const GROUND_Y = 0.9;

let playerState = {
  x: 0, y: GROUND_Y, z: 8,
  vx: 0, vy: 0, vz: 0,
  rotY: 0,
  onGround: true,
  jumping: false
};

// ===== AUTH =====
function switchAuth(mode) {
  document.querySelectorAll('.auth-mode').forEach(m=>m.classList.remove('active'));
  document.getElementById(mode+'Mode').classList.add('active');
  document.getElementById('loginError').textContent='';
  document.getElementById('regError').textContent='';
}

function doRegister() {
  const username = document.getElementById('regUsername').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  const err = document.getElementById('regError');
  if(!username||!email||!pass){err.textContent='Заполните все поля';return;}
  if(pass.length<6){err.textContent='Пароль мин. 6 симв.';return;}

  auth.createUserWithEmailAndPassword(email,pass).then(cred=>{
    db.ref('users/'+cred.user.uid).set({
      username: username, email: email, displayName: username,
      createdAt: Date.now(), online: true, lastSeen: Date.now()
    });
  }).catch(e=>err.textContent=e.message);
}

function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  auth.signInWithEmailAndPassword(email,pass).catch(e=>err.textContent=e.message);
}

function doLogout() {
  if(currentUser && myPlayerRef) myPlayerRef.remove();
  auth.signOut();
  location.reload();
}

auth.onAuthStateChanged(user=>{
  if(user){
    currentUser = user;
    db.ref('users/'+user.uid).once('value').then(snap=>{
      userData = snap.val()||{};
      myNickname = userData.displayName || userData.username || user.email.split('@')[0];
      document.getElementById('userAvatar').textContent = myNickname.charAt(0).toUpperCase();
      document.getElementById('authScreen').classList.add('hidden');
      setTimeout(()=>{
        document.getElementById('authScreen').style.display='none';
        document.getElementById('nicknameModal').classList.add('active');
        document.getElementById('nicknameInput').value = myNickname;
      },800);
    });
  } else {
    currentUser = null;
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('authScreen').classList.remove('hidden');
    document.getElementById('mainUI').classList.remove('active');
  }
});

function saveNickname() {
  const nick = document.getElementById('nicknameInput').value.trim();
  if(nick) myNickname = nick;
  document.getElementById('nicknameModal').classList.remove('active');
  document.getElementById('mainUI').classList.add('active');
  document.getElementById('loading').classList.add('hidden');

  // INIT GAME
  init3D();
  setupJoystick();
  setupJump();
  setupPlayerSync();
  listenOtherPlayers();
  listenVideoSync();
  gameInitialized = true;
}

// ===== INIT 3D =====
function init3D() {
  const canvas = document.getElementById('game-canvas');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050510);
  scene.fog = new THREE.FogExp2(0x050510, 0.015);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 2.5, 10);

  renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;

  clock = new THREE.Clock();

  // ===== ROOM =====
  // Floor
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 40),
    new THREE.MeshStandardMaterial({ color:0x1a1a2e, roughness:0.8 })
  );
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  scene.add(floor);

  // Carpet
  const carpet = new THREE.Mesh(
    new THREE.PlaneGeometry(3, 30),
    new THREE.MeshStandardMaterial({ color:0x4a148c, roughness:0.9 })
  );
  carpet.rotation.x = -Math.PI/2;
  carpet.position.set(0, 0.01, 0);
  scene.add(carpet);

  // Walls
  const wallMat = new THREE.MeshStandardMaterial({ color:0x0a0a1a, roughness:0.9 });

  const backWall = new THREE.Mesh(new THREE.PlaneGeometry(30, 12), wallMat);
  backWall.position.set(0, 6, -15);
  scene.add(backWall);

  const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 12), wallMat);
  leftWall.position.set(-15, 6, 0);
  leftWall.rotation.y = Math.PI/2;
  scene.add(leftWall);

  const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 12), wallMat);
  rightWall.position.set(15, 6, 0);
  rightWall.rotation.y = -Math.PI/2;
  scene.add(rightWall);

  // Ceiling
  const ceiling = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 40),
    new THREE.MeshStandardMaterial({ color:0x050510 })
  );
  ceiling.position.set(0, 12, 0);
  ceiling.rotation.x = Math.PI/2;
  scene.add(ceiling);

  // ===== CINEMA SCREEN =====
  const screenFrame = new THREE.Mesh(
    new THREE.BoxGeometry(14, 8.5, 0.3),
    new THREE.MeshStandardMaterial({ color:0x111111 })
  );
  screenFrame.position.set(0, 5, -14.8);
  scene.add(screenFrame);

  // Video texture
  cinemaVideo = document.createElement('video');
  cinemaVideo.crossOrigin = 'anonymous';
  cinemaVideo.loop = true;
  cinemaVideo.muted = true;
  cinemaVideo.playsInline = true;
  cinemaVideo.src = 'https://assets.mixkit.co/videos/preview/mixkit-animation-of-a-futuristic-city-31846-large.mp4';

  cinemaTexture = new THREE.VideoTexture(cinemaVideo);
  cinemaTexture.minFilter = THREE.LinearFilter;
  cinemaTexture.magFilter = THREE.LinearFilter;

  cinemaScreenMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(13.5, 7.8),
    new THREE.MeshBasicMaterial({ map: cinemaTexture })
  );
  cinemaScreenMesh.position.set(0, 5, -14.6);
  cinemaScreenMesh.name = 'cinemaScreen';
  scene.add(cinemaScreenMesh);

  // Screen glow
  const glow = new THREE.Mesh(
    new THREE.PlaneGeometry(15, 9),
    new THREE.MeshBasicMaterial({ 
      color:0x8a2be2, transparent:true, opacity:0.08, 
      blending:THREE.AdditiveBlending, side:THREE.DoubleSide 
    })
  );
  glow.position.set(0, 5, -14.4);
  scene.add(glow);

  // ===== SEATS =====
  const seatColor = new THREE.MeshStandardMaterial({ color:0x6a1b9a, roughness:0.7 });
  const seatBackColor = new THREE.MeshStandardMaterial({ color:0x4a148c, roughness:0.7 });

  for(let row=0; row<5; row++) {
    for(let col=-4; col<=4; col++) {
      if(col === 0) continue;
      const g = new THREE.Group();
      const seat = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.3, 1.2), seatColor);
      seat.position.set(col*2, 0.6+row*0.25, -6+row*3);
      g.add(seat);
      const back = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.3, 0.15), seatBackColor);
      back.position.set(col*2, 1.25+row*0.25, -6.5+row*3);
      g.add(back);
      scene.add(g);
    }
  }

  // ===== LIGHTS =====
  scene.add(new THREE.AmbientLight(0x1a0a2e, 0.4));

  const screenLight = new THREE.PointLight(0x8a2be2, 0.6, 25);
  screenLight.position.set(0, 5, -8);
  scene.add(screenLight);

  for(let i=-2; i<=2; i++) {
    const l = new THREE.PointLight(0xff3366, 0.15, 12);
    l.position.set(i*5, 9, 2);
    scene.add(l);
  }

  // ===== MY PLAYER =====
  const bodyGeo = new THREE.CapsuleGeometry(0.35, 0.9, 4, 8);
  const bodyMat = new THREE.MeshStandardMaterial({ 
    color:0xff3366, emissive:0xff3366, emissiveIntensity:0.4 
  });
  myPlayerMesh = new THREE.Mesh(bodyGeo, bodyMat);
  myPlayerMesh.position.set(0, GROUND_Y, 8);
  myPlayerMesh.castShadow = true;
  scene.add(myPlayerMesh);

  // My name tag
  createNameTag(myNickname + ' (Вы)', true);

  // Start loop
  animate();

  // Resize
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Click on screen
  canvas.addEventListener('click', onCanvasClick);
  canvas.addEventListener('touchstart', onCanvasTouch, {passive:true});
}

// ===== ANIMATION LOOP =====
function animate() {
  animationId = requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(!gameInitialized) {
    renderer.render(scene, camera);
    return;
  }

  // Movement from joystick
  if(joystickActive) {
    const forward = -joystickVector.y;
    const right = joystickVector.x;

    playerState.vx += right * SPEED * 8 * dt;
    playerState.vz += forward * SPEED * 8 * dt;

    if(Math.abs(forward) > 0.1 || Math.abs(right) > 0.1) {
      playerState.rotY = Math.atan2(right, forward);
    }
  }

  // Friction
  playerState.vx *= FRICTION;
  playerState.vz *= FRICTION;

  // Gravity
  if(!playerState.onGround) {
    playerState.vy -= GRAVITY * dt;
  }

  // Apply velocity
  playerState.x += playerState.vx * dt;
  playerState.z += playerState.vz * dt;
  playerState.y += playerState.vy * dt;

  // Ground
  if(playerState.y <= GROUND_Y) {
    playerState.y = GROUND_Y;
    playerState.vy = 0;
    playerState.onGround = true;
    playerState.jumping = false;
  }

  // Bounds
  playerState.x = Math.max(-13.5, Math.min(13.5, playerState.x));
  playerState.z = Math.max(-13.5, Math.min(13.5, playerState.z));

  // Update mesh
  myPlayerMesh.position.set(playerState.x, playerState.y, playerState.z);
  myPlayerMesh.rotation.y = playerState.rotY;

  // Camera follow (third person behind)
  const camDist = 4.5;
  const camHeight = 2.2;
  const targetCamX = playerState.x - Math.sin(playerState.rotY) * camDist;
  const targetCamZ = playerState.z - Math.cos(playerState.rotY) * camDist;

  camera.position.x += (targetCamX - camera.position.x) * 0.1;
  camera.position.z += (targetCamZ - camera.position.z) * 0.1;
  camera.position.y += ((playerState.y + camHeight) - camera.position.y) * 0.1;
  camera.lookAt(playerState.x, playerState.y + 1, playerState.z);

  // Sync to Firebase
  syncPosition();

  // Update others
  updateOtherPlayers(dt);

  // Update name tags
  updateNameTags();

  // Video texture
  if(cinemaTexture) cinemaTexture.needsUpdate = true;

  // Video controls UI
  updateVideoUI();

  renderer.render(scene, camera);
}

// ===== JOYSTICK =====
function setupJoystick() {
  const zone = document.getElementById('joystickZone');
  const stick = document.getElementById('joystickStick');
  let startX = 0, startY = 0;
  const maxDist = 40;

  zone.addEventListener('touchstart', function(e) {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = zone.getBoundingClientRect();
    startX = rect.left + rect.width/2;
    startY = rect.top + rect.height/2;
    joystickActive = true;
    moveStick(touch.clientX, touch.clientY);
  }, {passive:false});

  zone.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if(!joystickActive) return;
    moveStick(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:false});

  zone.addEventListener('touchend', function(e) {
    e.preventDefault();
    joystickActive = false;
    joystickVector = {x:0, y:0};
    stick.style.transform = 'translate(-50%,-50%)';
  }, {passive:false});

  zone.addEventListener('touchcancel', function(e) {
    e.preventDefault();
    joystickActive = false;
    joystickVector = {x:0, y:0};
    stick.style.transform = 'translate(-50%,-50%)';
  }, {passive:false});

  function moveStick(cx, cy) {
    let dx = cx - startX;
    let dy = cy - startY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(dist > maxDist) {
      dx = (dx/dist) * maxDist;
      dy = (dy/dist) * maxDist;
    }
    stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    joystickVector = { x: dx/maxDist, y: dy/maxDist };
  }
}

// ===== JUMP =====
function setupJump() {
  const btn = document.getElementById('jumpBtn');

  function doJump(e) {
    if(e) e.preventDefault();
    if(playerState.onGround && !playerState.jumping) {
      playerState.vy = JUMP_FORCE;
      playerState.jumping = true;
      playerState.onGround = false;
    }
  }

  btn.addEventListener('touchstart', doJump, {passive:false});
  btn.addEventListener('mousedown', doJump);
}

// ===== FIREBASE SYNC =====
function setupPlayerSync() {
  if(!currentUser) return;
  myPlayerRef = db.ref('cinema/players/' + currentUser.uid);
  myPlayerRef.onDisconnect().remove();
}

let lastSync = 0;
function syncPosition() {
  if(!myPlayerRef || !currentUser) return;
  const now = Date.now();
  if(now - lastSync < 50) return;
  lastSync = now;

  myPlayerRef.set({
    x: playerState.x,
    y: playerState.y,
    z: playerState.z,
    rotY: playerState.rotY,
    nickname: myNickname,
    timestamp: now
  });
}

function listenOtherPlayers() {
  db.ref('cinema/players').on('value', snap => {
    const players = snap.val() || {};
    const list = document.getElementById('playersList');
    list.innerHTML = '';
    let count = 1; // me

    Object.entries(players).forEach(([uid, data]) => {
      if(uid === currentUser.uid) return;
      count++;

      if(!otherPlayers[uid]) {
        createOtherPlayer(uid, data);
      } else {
        otherPlayers[uid].target = data;
      }

      // List item
      const div = document.createElement('div');
      div.className = 'player-item';
      div.innerHTML = `
        <div class="p-avatar">${(data.nickname||'U').charAt(0).toUpperCase()}</div>
        <div class="p-name">${data.nickname || 'Игрок'}</div>
        <div class="p-status">●</div>
      `;
      list.appendChild(div);
    });

    // Remove disconnected
    Object.keys(otherPlayers).forEach(uid => {
      if(!players[uid]) removeOtherPlayer(uid);
    });

    document.getElementById('onlineCount').textContent = count + ' онлайн';
  });
}

function createOtherPlayer(uid, data) {
  const geo = new THREE.CapsuleGeometry(0.35, 0.9, 4, 8);
  const mat = new THREE.MeshStandardMaterial({ 
    color:0x00d4ff, emissive:0x00d4ff, emissiveIntensity:0.4 
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(data.x||0, data.y||GROUND_Y, data.z||0);
  mesh.castShadow = true;
  scene.add(mesh);

  const tag = createNameTag(data.nickname || 'Игрок', false, uid);

  otherPlayers[uid] = {
    mesh: mesh,
    tag: tag,
    target: data,
    current: { x:data.x||0, y:data.y||GROUND_Y, z:data.z||0 }
  };
}

function updateOtherPlayers(dt) {
  Object.values(otherPlayers).forEach(p => {
    if(!p.target) return;
    // Smooth lerp
    p.current.x += (p.target.x - p.current.x) * 0.15;
    p.current.y += (p.target.y - p.current.y) * 0.15;
    p.current.z += (p.target.z - p.current.z) * 0.15;
    p.mesh.position.set(p.current.x, p.current.y, p.current.z);
    p.mesh.rotation.y = p.target.rotY || 0;
  });
}

function removeOtherPlayer(uid) {
  const p = otherPlayers[uid];
  if(!p) return;
  scene.remove(p.mesh);
  if(p.tag) p.tag.remove();
  delete otherPlayers[uid];
}

// ===== NAME TAGS =====
const nameTags = {};
function createNameTag(name, isMe, uid) {
  const container = document.getElementById('nameTagsContainer');
  const tag = document.createElement('div');
  tag.className = 'name-tag';
  tag.textContent = isMe ? name + ' (Вы)' : name;
  container.appendChild(tag);

  const key = uid || 'me';
  nameTags[key] = { element: tag, isMe: isMe };
  return tag;
}

function updateNameTags() {
  // My tag
  if(nameTags['me']) updateTagPos(nameTags['me'].element, myPlayerMesh.position);

  // Others
  Object.entries(otherPlayers).forEach(([uid, p]) => {
    if(nameTags[uid]) updateTagPos(nameTags[uid].element, p.mesh.position);
  });
}

function updateTagPos(el, pos) {
  const v = pos.clone();
  v.y += 1.3;
  v.project(camera);

  const x = (v.x * 0.5 + 0.5) * window.innerWidth;
  const y = (-v.y * 0.5 + 0.5) * window.innerHeight;

  if(v.z < 1 && x > 0 && x < window.innerWidth && y > 0 && y < window.innerHeight) {
    el.style.display = 'block';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  } else {
    el.style.display = 'none';
  }
}

// ===== VIDEO =====
function onCanvasClick(e) {
  const mouse = new THREE.Vector2();
  mouse.x = (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/window.innerHeight)*2+1;

  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(scene.children, true);

  for(let h of hits) {
    if(h.object === cinemaScreenMesh || h.object.name === 'cinemaScreen') {
      toggleVideoPanel();
      break;
    }
  }
}

function onCanvasTouch(e) {
  if(e.touches.length !== 1) return;
  const touch = e.touches[0];
  const mouse = new THREE.Vector2();
  mouse.x = (touch.clientX/window.innerWidth)*2-1;
  mouse.y = -(touch.clientY/window.innerHeight)*2+1;

  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(scene.children, true);

  for(let h of hits) {
    if(h.object === cinemaScreenMesh || h.object.name === 'cinemaScreen') {
      setTimeout(()=>toggleVideoPanel(), 100);
      break;
    }
  }
}

function toggleVideoPanel() {
  isVideoPanelOpen = !isVideoPanelOpen;
  document.getElementById('videoPanel').classList.toggle('active', isVideoPanelOpen);
}

function loadVideoFromUrl() {
  const url = document.getElementById('videoUrlInput').value.trim();
  if(!url) return;
  syncVideoState(url, false, 0);
  toggleVideoPanel();
}

function handleVideoFile(input) {
  const file = input.files[0];
  if(!file) return;
  if(file.size > 8 * 1024 * 1024) {
    alert('Файл слишком большой! Макс 8 МБ.');
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    syncVideoState(e.target.result, false, 0);
    toggleVideoPanel();
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function syncVideoState(url, playing, time) {
  db.ref('cinema/video').set({
    url: url,
    playing: playing,
    time: time,
    lastUpdate: firebase.database.ServerValue.TIMESTAMP,
    by: currentUser.uid
  });
}

function listenVideoSync() {
  db.ref('cinema/video').on('value', snap => {
    const state = snap.val();
    if(!state || !cinemaVideo) return;

    if(state.url && cinemaVideo.src !== state.url) {
      cinemaVideo.src = state.url;
      cinemaVideo.load();
    }

    if(state.playing) {
      const elapsed = (Date.now() - state.lastUpdate) / 1000;
      const target = state.time + (state.by !== currentUser.uid ? elapsed : 0);
      if(Math.abs(cinemaVideo.currentTime - target) > 1.5) {
        cinemaVideo.currentTime = target;
      }
      cinemaVideo.play().catch(()=>{});
    } else {
      cinemaVideo.pause();
      if(Math.abs(cinemaVideo.currentTime - state.time) > 0.5) {
        cinemaVideo.currentTime = state.time;
      }
    }
  });
}

function toggleVideoPlay() {
  if(!cinemaVideo) return;
  if(cinemaVideo.paused) {
    syncVideoState(null, true, cinemaVideo.currentTime);
  } else {
    syncVideoState(null, false, cinemaVideo.currentTime);
  }
}

function seekVideo(val) {
  if(!cinemaVideo || !cinemaVideo.duration) return;
  isSeeking = true;
  const time = (val/100) * cinemaVideo.duration;
  cinemaVideo.currentTime = time;
  syncVideoState(null, !cinemaVideo.paused, time);
  setTimeout(()=>isSeeking=false, 500);
}

function updateVideoUI() {
  if(!cinemaVideo || !cinemaVideo.duration) return;

  const controls = document.getElementById('videoControls');
  const slider = document.getElementById('timeSlider');
  const label = document.getElementById('timeLabel');
  const playBtn = document.getElementById('playPauseBtn');

  if(cinemaVideo.src && cinemaVideo.src !== '') {
    controls.classList.add('active');
  }

  if(!isSeeking) {
    slider.value = (cinemaVideo.currentTime / cinemaVideo.duration) * 100;
  }

  playBtn.textContent = cinemaVideo.paused ? '▶' : '⏸';

  const cm = Math.floor(cinemaVideo.currentTime/60);
  const cs = Math.floor(cinemaVideo.currentTime%60).toString().padStart(2,'0');
  const dm = Math.floor(cinemaVideo.duration/60);
  const ds = Math.floor(cinemaVideo.duration%60).toString().padStart(2,'0');
  label.textContent = `${cm}:${cs} / ${dm}:${ds}`;
}

// ===== PLAYERS PANEL =====
function togglePlayersPanel() {
  isPlayersPanelOpen = !isPlayersPanelOpen;
  document.getElementById('playersPanel').classList.toggle('open', isPlayersPanelOpen);
}

// Hide hint after 5 sec
setTimeout(()=>{
  const hint = document.getElementById('hintOverlay');
  if(hint) hint.style.opacity = '0';
}, 5000);
</script>
