<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Telegram 2026 Android - VK E2EE Messenger</title>
  
  <!-- TailWind CSS for Android UI components styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone to compile JSX in real-time -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Fonts: Roboto & Material icons/symbols for 100% Android UI accuracy -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #0b0e14;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Lock viewport to strict mobile layout for Android emulator feel on desktop and perfect native fit on mobile */
    .mobile-viewport {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: -webkit-fill-available;
      margin: 0 auto;
      background-color: #0e1621;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }

    /* Telegram Chat Wallpaper Pattern */
    .chat-wallpaper {
      background-color: #0e1621;
      background-image: radial-gradient(rgba(82, 136, 193, 0.05) 1.5px, transparent 0);
      background-size: 24px 24px;
    }

    /* Ripple Effect simulation for Telegram buttons */
    .android-ripple {
      position: relative;
      overflow: hidden;
      transition: background 0.2s ease;
    }
    .android-ripple:active {
      background-color: rgba(255, 255, 255, 0.08) !important;
    }

    /* Hide standard scrollbars */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div id="root" class="mobile-viewport"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Const E2EE Prefixes
    const PREFIX_KEY_EXCHANGE = "🔑[VKTG_KEY]:";
    const PREFIX_E2EE_TEXT = "🔒[VKTG_E2EE]:";
    const PREFIX_E2EE_FILE = "🔒[VKTG_FILE_E2EE]:";

    function App() {
      // Auth & VK Connection state
      const [token, setToken] = useState(localStorage.getItem('vk_token') || '');
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [myProfile, setMyProfile] = useState(null);
      const [tokenInput, setTokenInput] = useState('');
      const [authError, setAuthError] = useState('');

      // Navigation & Layout states
      const [activeScreen, setActiveScreen] = useState('chats'); // 'chats' | 'chat_room'
      const [activeTab, setActiveTab] = useState('all'); // 'all' | 'secret' | 'channels'
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [newChatModal, setNewChatModal] = useState(false);
      const [keyVerifyModal, setKeyVerifyModal] = useState(false);
      const [attachmentSheet, setAttachmentSheet] = useState(false);

      // Search & Data cache
      const [searchQuery, setSearchQuery] = useState('');
      const [conversations, setConversations] = useState([]);
      const [messages, setMessages] = useState([]);
      const [activePartner, setActivePartner] = useState(null);
      const [peerKeys, setPeerKeys] = useState(JSON.parse(localStorage.getItem('vktg_peer_keys') || '{}'));
      const [localContacts, setLocalContacts] = useState(JSON.parse(localStorage.getItem('vktg_contacts') || '{}'));

      // New Chat state
      const [targetUserId, setTargetUserId] = useState('');

      // Local Custom Profile Overrides
      const [customName, setCustomName] = useState('');
      const [customAvatar, setCustomAvatar] = useState('');

      // Crypto states
      const [myKeys, setMyKeys] = useState(null);

      // Android Status bar mock dynamic clock
      const [currentTime, setCurrentTime] = useState('');

      // Input Message & Attachments
      const [messageInput, setMessageInput] = useState('');
      const [attachedFile, setAttachedFile] = useState(null); // { name, type, arrayBuffer }
      const [selfDestructTimer, setSelfDestructTimer] = useState(0); // 0 = off, N = seconds

      // Ref for scrolling messages
      const messagesEndRef = useRef(null);

      // Polling & Timing effects
      useEffect(() => {
        // Run Dynamic clock
        const updateClock = () => {
          const now = new Date();
          setCurrentTime(now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
        };
        updateClock();
        const clockInterval = setInterval(updateClock, 10000);

        if (token) {
          verifyAndLogin(token);
        }

        return () => clearInterval(clockInterval);
      }, []);

      // Polling message histories & dialogs
      useEffect(() => {
        if (!isLoggedIn) return;

        refreshAllDialogs();
        const syncInterval = setInterval(() => {
          refreshAllDialogs();
          if (activePartner) {
            refreshChatHistory(activePartner.id);
          }
        }, 3500);

        return () => clearInterval(syncInterval);
      }, [isLoggedIn, activePartner]);

      // Auto-scroll when messages update
      useEffect(() => {
        if (messagesEndRef.current) {
          messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [messages]);

      // Robust JSONP VK Requester
      const vkRequest = (method, params = {}) => {
        return new Promise((resolve, reject) => {
          const callbackName = 'vk_callback_' + Math.round(1000000 * Math.random());
          params.access_token = token || localStorage.getItem('vk_token');
          params.v = '5.131';
          params.callback = callbackName;

          const queryString = Object.keys(params)
            .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(params[key]))
            .join('&');

          const script = document.createElement('script');
          script.src = `https://api.vk.com/method/${method}?${queryString}`;

          window[callbackName] = function(data) {
            delete window[callbackName];
            document.body.removeChild(script);
            if (data.error) {
              reject(data.error);
            } else {
              resolve(data.response);
            }
          };

          script.onerror = function() {
            delete window[callbackName];
            document.body.removeChild(script);
            reject({ error_msg: 'Сетевая ошибка JSONP (CORS-блокировка на стороне VK или отсутствие интернета).' });
          };

          document.body.appendChild(script);
        });
      };

      // Crypto Engine Implementation
      const initKeys = async (storedToken) => {
        const stored = localStorage.getItem('vktg_my_keys');
        if (stored) {
          try {
            const parsed = JSON.parse(stored);
            const pub = await window.crypto.subtle.importKey("jwk", parsed.publicKey, { name: "RSA-OAEP", hash: {name: "SHA-256"} }, true, ["encrypt"]);
            const priv = await window.crypto.subtle.importKey("jwk", parsed.privateKey, { name: "RSA-OAEP", hash: {name: "SHA-256"} }, true, ["decrypt"]);
            setMyKeys({ publicKey: pub, privateKey: priv, jwk: parsed });
          } catch (e) {
            await generateKeys();
          }
        } else {
          await generateKeys();
        }
      };

      const generateKeys = async () => {
        const keyPair = await window.crypto.subtle.generateKey(
          {
            name: "RSA-OAEP",
            modulusLength: 2048,
            publicExponent: new Uint8Array([1, 0, 1]),
            hash: {name: "SHA-256"},
          },
          true,
          ["encrypt", "decrypt"]
        );

        const pubJwk = await window.crypto.subtle.exportKey("jwk", keyPair.publicKey);
        const privJwk = await window.crypto.subtle.exportKey("jwk", keyPair.privateKey);

        const keysObj = { publicKey: pubJwk, privateKey: privJwk };
        setMyKeys({
          publicKey: keyPair.publicKey,
          privateKey: keyPair.privateKey,
          jwk: keysObj
        });
        localStorage.setItem('vktg_my_keys', JSON.stringify(keysObj));
      };

      // Encrypt & Decrypt Helpers
      const encryptData = async (partnerPubKeyB64, rawBytes) => {
        const partnerJwk = JSON.parse(atob(partnerPubKeyB64));
        const partnerKey = await window.crypto.subtle.importKey(
          "jwk",
          partnerJwk,
          { name: "RSA-OAEP", hash: {name: "SHA-256"} },
          true,
          ["encrypt"]
        );

        const aesKey = await window.crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const ciphertext = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, aesKey, rawBytes);

        const rawAesKey = await window.crypto.subtle.exportKey("raw", aesKey);
        const encryptedAesKey = await window.crypto.subtle.encrypt({ name: "RSA-OAEP" }, partnerKey, rawAesKey);

        return {
          aesKeyB64: btoa(String.fromCharCode(...new Uint8Array(encryptedAesKey))),
          ivB64: btoa(String.fromCharCode(...iv)),
          ciphertextB64: btoa(String.fromCharCode(...new Uint8Array(ciphertext)))
        };
      };

      const decryptData = async (aesKeyB64, ivB64, ciphertextB64) => {
        if (!myKeys) return null;
        try {
          const encryptedAesKey = new Uint8Array(atob(aesKeyB64).split("").map(c => c.charCodeAt(0)));
          const iv = new Uint8Array(atob(ivB64).split("").map(c => c.charCodeAt(0)));
          const ciphertext = new Uint8Array(atob(ciphertextB64).split("").map(c => c.charCodeAt(0)));

          const rawAesKey = await window.crypto.subtle.decrypt({ name: "RSA-OAEP" }, myKeys.privateKey, encryptedAesKey);
          const aesKey = await window.crypto.subtle.importKey("raw", rawAesKey, { name: "AES-GCM" }, true, ["decrypt"]);
          
          return await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, aesKey, ciphertext);
        } catch (e) {
          return null;
        }
      };

      // Extract Token helper
      const parseToken = (input) => {
        input = input.trim();
        if (input.includes('access_token=')) {
          const normalized = input.replace('#', '?');
          try {
            const urlObj = new URL(normalized);
            const tok = urlObj.searchParams.get('access_token');
            if (tok) return tok;
          } catch (e) {
            const match = input.match(/access_token=([^&]+)/);
            if (match) return match[1];
          }
        }
        return input;
      };

      const verifyAndLogin = async (rawTok) => {
        const cleanTok = parseToken(rawTok);
        if (!cleanTok) return;

        try {
          // Temporarily set token to run verification
          localStorage.setItem('vk_token', cleanTok);
          const profileResponse = await vkRequest('users.get', { fields: 'photo_100,status', access_token: cleanTok });
          if (profileResponse && profileResponse.length > 0) {
            setToken(cleanTok);
            setMyProfile(profileResponse[0]);
            setIsLoggedIn(true);
            setTokenInput('');
            setAuthError('');
            
            // Set custom profile fields
            const over = localContacts[profileResponse[0].id] || {};
            setCustomName(over.name || `${profileResponse[0].first_name} ${profileResponse[0].last_name}`);
            setCustomAvatar(over.photo || profileResponse[0].photo_100);

            // Init Cryptography keys
            await initKeys(cleanTok);
          } else {
            setAuthError("ВК не вернул профиль. Попробуйте обновить токен.");
          }
        } catch (err) {
          setAuthError(`Ошибка входа: ${err.error_msg || JSON.stringify(err)}`);
          localStorage.removeItem('vk_token');
        }
      };

      // VK Data Sync
      const refreshAllDialogs = async () => {
        try {
          const response = await vkRequest('messages.getConversations', { count: 40, extended: 1 });
          if (!response || !response.items) return;

          const profilesMap = {};
          if (response.profiles) {
            response.profiles.forEach(p => { profilesMap[p.id] = p; });
          }

          const items = response.items.map(item => {
            const peer = item.conversation.peer;
            let partner = profilesMap[peer.id] || { id: peer.id, first_name: `Пользователь ${peer.id}`, last_name: '' };
            if (localContacts[peer.id]) {
              partner = { ...partner, ...localContacts[peer.id] };
            }
            return {
              id: peer.id,
              partner,
              lastMessage: item.last_message,
              unreadCount: item.conversation.unread_count || 0
            };
          });

          setConversations(items);
        } catch (e) {
          console.error("Диалоги не обновились: ", e);
        }
      };

      const refreshChatHistory = async (partnerId) => {
        try {
          const response = await vkRequest('messages.getHistory', { peer_id: partnerId, count: 40 });
          if (!response || !response.items) return;

          const decryptedMessages = [];
          for (let item of response.items) {
            const isMe = item.from_id === myProfile.id;
            let text = item.text || '';
            let payload = null;

            if (text.startsWith(PREFIX_KEY_EXCHANGE)) {
              const rawKey = text.replace(PREFIX_KEY_EXCHANGE, "").trim();
              peerKeys[item.from_id] = rawKey;
              localStorage.setItem('vktg_peer_keys', JSON.stringify(peerKeys));
              payload = { isSystem: true, text: "🔑 Собеседник обновил/передал свой публичный ключ безопасности. Защищенный E2EE чат готов!" };
              
              if (!isMe && !localStorage.getItem(`replied_${item.from_id}`)) {
                await sendKeyExchangeMessage(partnerId);
                localStorage.setItem(`replied_${item.from_id}`, 'true');
              }
            } else if (text.startsWith(PREFIX_E2EE_TEXT)) {
              const parts = text.replace(PREFIX_E2EE_TEXT, "").trim().split(":");
              if (parts.length === 3) {
                const [aes, iv, cipher] = parts;
                const decBytes = await decryptData(aes, iv, cipher);
                if (decBytes) {
                  payload = { isText: true, text: new TextDecoder().decode(decBytes) };
                } else {
                  payload = { isError: true, text: "🔒 Ошибка дешифрования. Возможно, ключ устарел." };
                }
              }
            } else if (text.startsWith(PREFIX_E2EE_FILE)) {
              const parts = text.replace(PREFIX_E2EE_FILE, "").trim().split(":");
              if (parts.length >= 4) {
                const [aes, iv, b64Name, mime] = parts;
                let docUrl = null;
                if (item.attachments) {
                  const docObj = item.attachments.find(a => a.type === 'doc');
                  if (docObj && docObj.doc) docUrl = docObj.doc.url;
                }
                payload = { isFile: true, name: atob(b64Name), mime, docUrl, aes, iv };
              }
            }

            decryptedMessages.push({
              id: item.id,
              fromId: item.from_id,
              date: item.date,
              rawText: text,
              isMe,
              decrypted: payload
            });
          }

          setMessages(decryptedMessages);
        } catch (e) {
          console.error("История переписки не обновилась: ", e);
        }
      };

      const sendKeyExchangeMessage = async (peerId) => {
        if (!myKeys) return;
        const pubB64 = btoa(JSON.stringify(myKeys.jwk.publicKey));
        await vkRequest('messages.send', {
          peer_id: peerId,
          message: `${PREFIX_KEY_EXCHANGE}${pubB64}`,
          random_id: Math.floor(Math.random() * 10000000)
        });
      };

      // Main Message Send Handler
      const handleSendMessage = async () => {
        if (!activePartner) return;
        const msgText = messageInput.trim();
        if (!msgText && !attachedFile) return;

        const partnerKeyB64 = peerKeys[activePartner.id];
        if (!partnerKeyB64) {
          alert("Для отправки шифрованного сообщения необходимо обменяться публичными ключами! Нажмите кнопку обмена сверху.");
          return;
        }

        try {
          if (attachedFile) {
            // Document upload logic
            const encrypted = await encryptData(partnerKeyB64, new Uint8Array(attachedFile.arrayBuffer));
            const server = await vkRequest('docs.getMessagesUploadServer', { type: 'doc', peer_id: activePartner.id });
            
            const encBlob = new Blob([new Uint8Array(atob(encrypted.ciphertextB64).split("").map(c => c.charCodeAt(0)))], { type: 'application/octet-stream' });
            const formData = new FormData();
            formData.append('file', encBlob, 'secure_doc.bin');

            const uploadResp = await fetch(server.upload_url, { method: 'POST', body: formData });
            const uploadData = await uploadResp.json();

            const saved = await vkRequest('docs.save', { file: uploadData.file, title: 'secure_payload.bin' });
            const docObj = saved.doc || saved[0];
            const attachStr = `doc${docObj.owner_id}_${docObj.id}`;

            const b64Name = btoa(attachedFile.name);
            const header = `${PREFIX_E2EE_FILE}${encrypted.aesKeyB64}:${encrypted.ivB64}:${b64Name}:${attachedFile.type}`;

            await vkRequest('messages.send', {
              peer_id: activePartner.id,
              message: header,
              attachment: attachStr,
              random_id: Math.floor(Math.random() * 10000000)
            });

            setAttachedFile(null);
          } else {
            const bytes = new TextEncoder().encode(msgText);
            const encrypted = await encryptData(partnerKeyB64, bytes);
            const payload = `${PREFIX_E2EE_TEXT}${encrypted.aesKeyB64}:${encrypted.ivB64}:${encrypted.ciphertextB64}`;

            await vkRequest('messages.send', {
              peer_id: activePartner.id,
              message: payload,
              random_id: Math.floor(Math.random() * 10000000)
            });

            setMessageInput('');
          }

          // Trigger local Self-destruct if active
          if (selfDestructTimer > 0) {
            const timerVal = selfDestructTimer;
            setTimeout(() => {
              // Delete message logic or clear UI locally
              setMessages(prev => prev.filter(m => m.fromId !== myProfile.id || (Date.now() / 1000 - m.date) < timerVal));
            }, timerVal * 1000);
          }

          await refreshChatHistory(activePartner.id);
        } catch (e) {
          alert("Ошибка отправки: " + JSON.stringify(e));
        }
      };

      // Select Chat Room transition
      const handleSelectChat = (partner) => {
        setActivePartner(partner);
        setActiveScreen('chat_room');
        setMessages([]);
        refreshChatHistory(partner.id);
      };

      // Launch Key verification modal showing Telegram Emojis matrix
      const generateSecretEmojis = () => {
        if (!activePartner || !peerKeys[activePartner.id] || !myKeys) return ["❓", "❓", "❓", "❓"];
        const keysSumStr = peerKeys[activePartner.id].substring(0, 40) + myKeys.jwk.publicKey.n.substring(0, 40);
        
        // Map characters to emojis dynamically for a verification visually matching Telegram
        const emojiSet = ["🔑", "🔒", "🛡️", "💎", "🚀", "🌌", "🦊", "🍀", "💡", "🔥", "🌈", "🍉", "🍒", "⚽", "🐱", "🦉"];
        const chars = keysSumStr.substring(0, 4).split("");
        return chars.map((char, index) => {
          const indexCode = (char.charCodeAt(0) + index) % emojiSet.length;
          return emojiSet[indexCode];
        });
      };

      // File handling upload trigger
      const handleFileSelection = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
          setAttachedFile({
            name: file.name,
            type: file.type || 'application/octet-stream',
            arrayBuffer: evt.target.result
          });
          setAttachmentSheet(false);
        };
        reader.readAsArrayBuffer(file);
      };

      // Local Profile Customization
      const handleSaveLocalProfile = () => {
        if (!myProfile) return;
        const copy = { ...localContacts };
        copy[myProfile.id] = {
          id: myProfile.id,
          first_name: customName,
          last_name: '',
          photo_100: customAvatar || myProfile.photo_100
        };
        localStorage.setItem('vktg_contacts', JSON.stringify(copy));
        setLocalContacts(copy);
        setMyProfile(prev => ({
          ...prev,
          first_name: customName,
          photo_100: customAvatar
        }));
        setSettingsOpen(false);
        alert("Профиль успешно сохранен!");
      };

      const handleStartNewChat = async () => {
        const parsedId = parseInt(targetUserId);
        if (!parsedId || isNaN(parsedId)) {
          alert("Пожалуйста, введите числовой ID");
          return;
        }

        try {
          const resp = await vkRequest('users.get', { user_ids: parsedId, fields: 'photo_100' });
          if (resp && resp.length > 0) {
            let partner = resp[0];
            if (localContacts[parsedId]) {
              partner = { ...partner, ...localContacts[parsedId] };
            }
            setNewChatModal(false);
            setTargetUserId('');
            handleSelectChat(partner);
          } else {
            alert("Пользователь не найден.");
          }
        } catch (e) {
          alert("Не удалось загрузить пользователя: " + JSON.stringify(e));
        }
      };

      const handleLogout = () => {
        if (confirm("Выйти из аккаунта?")) {
          localStorage.removeItem('vk_token');
          setToken('');
          setIsLoggedIn(false);
          setMyProfile(null);
          setActivePartner(null);
          setActiveScreen('chats');
        }
      };

      // Filters & Searching inside dialogues
      const filteredConversations = conversations.filter(item => {
        const name = `${item.partner.first_name} ${item.partner.last_name}`.toLowerCase();
        const matchesQuery = name.includes(searchQuery.toLowerCase());
        
        if (activeTab === 'secret') {
          // Only show conversations that already have peerKeys or active secure tags
          return matchesQuery && peerKeys[item.partner.id];
        }
        return matchesQuery;
      });

      // Render Auth screen if not logged in
      if (!isLoggedIn) {
        return (
          <div className="h-screen w-full flex items-center justify-center bg-[#0e1621] p-4 text-white">
            <div className="w-full max-w-sm bg-[#17212b] rounded-2xl p-6 border border-gray-800 shadow-2xl flex flex-col items-center">
              
              <div className="w-16 h-16 bg-[#2f6ca5] rounded-2xl flex items-center justify-center mb-4">
                <span className="material-icons-round text-4xl">verified_user</span>
              </div>
              
              <h2 className="text-xl font-bold tracking-tight mb-1 text-center">Telegram 2026 E2EE</h2>
              <p className="text-xs text-[#7f91a4] mb-6 text-center">Сквозное шифрование поверх неограниченного API VK</p>

              <div className="w-full space-y-4">
                <div>
                  <label className="block text-xs text-[#7f91a4] font-semibold mb-1 uppercase tracking-wider">Шаг 1: Получите ВК Токен</label>
                  <a 
                    href="https://oauth.vk.com/authorize?client_id=2685278&scope=messages,audio,photos,video,docs,notes,pages,status,wall,groups,email,stats,notifications,offline&redirect_uri=https://oauth.vk.com/blank.html&display=page&response_type=token"
                    target="_blank"
                    className="w-full flex items-center justify-center gap-2 bg-[#2f6ca5] hover:bg-[#3d83c4] text-white py-2.5 rounded-xl font-medium text-xs transition duration-150"
                  >
                    <span className="material-icons-round text-sm">vpn_key</span>
                    Запросить Токен Авторизации
                  </a>
                </div>

                <div>
                  <label className="block text-xs text-[#7f91a4] font-semibold mb-1 uppercase tracking-wider">Шаг 2: Вставьте токен или ссылку</label>
                  <textarea 
                    value={tokenInput}

                  Метод шифрования: RSA-OAEP 2048 SHA-256 + AES-GCM 256. Взлом невозможен.
                </div>
              </div>
            </div>
          )}

          {/* ================= FILE ATTACHMENT BOTTOM SHEET ================= */}
          {attachmentSheet && (
            <div className="absolute inset-0 bg-black/60 z-50 flex flex-col justify-end">
              <div onClick={() => setAttachmentSheet(false)} className="flex-1 w-full"></div>
              
              <div className="bg-[#17212b] rounded-t-3xl p-5 space-y-4 shadow-2xl relative animate-slide-up">
                <div className="w-12 h-1 bg-white/20 rounded-full mx-auto mb-2"></div>
                <h4 className="text-xs font-bold text-white uppercase tracking-wider text-center">Прикрепить защищенный файл</h4>
                
                <div className="grid grid-cols-3 gap-3">
                  <label className="flex flex-col items-center justify-center p-3 bg-[#0e1621] hover:bg-[#203040] rounded-xl cursor-pointer border border-white/5 space-y-1">
                    <span className="material-icons-round text-2xl text-emerald-400">image</span>
                    <span className="text-[10px] text-white">Фото/Видео</span>
                    <input type="file" onChange={handleFileSelection} className="hidden" accept="image/*,video/*" />
                  </label>

                  <label className="flex flex-col items-center justify-center p-3 bg-[#0e1621] hover:bg-[#203040] rounded-xl cursor-pointer border border-white/5 space-y-1">
                    <span className="material-icons-round text-2xl text-blue-400">insert_drive_file</span>
                    <span className="text-[10px] text-white">Документ</span>
                    <input type="file" onChange={handleFileSelection} className="hidden" />
                  </label>

                  <div 
                    onClick={() => {
                      setAttachmentSheet(false);
                      alert("Аудиозапись будет зашифрована перед отправкой в следующем обновлении!");
                    }}
                    className="flex flex-col items-center justify-center p-3 bg-[#0e1621] hover:bg-[#203040] rounded-xl cursor-pointer border border-white/5 space-y-1"
                  >
                    <span className="material-icons-round text-2xl text-purple-400">audiotrack</span>
                    <span className="text-[10px] text-white">Аудио</span>
                  </div>
                </div>

                <button 
                  onClick={() => setAttachmentSheet(false)}
                  className="w-full py-2.5 bg-red-900/30 text-red-400 text-xs font-bold rounded-xl"
                >
                  Отмена
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Direct helper functions outside component for performance
    async function downloadAndDecryptFile(docUrl, aesKeyB64, ivB64, originalName, mimeType) {
      if (!docUrl) {
        alert("Документ не загружен в ВК. Проверьте права и отправку.");
        return;
      }

      try {
        const proxiedUrl = `https://cors-anywhere.herokuapp.com/${docUrl}`;
        let response;
        try {
          response = await fetch(proxiedUrl);
        } catch (e) {
          response = await fetch(docUrl);
        }

        const encryptedBuffer = await response.arrayBuffer();
        
        // Decrypt logic wrapper using dynamic runtime storage references
        const storedKeys = JSON.parse(localStorage.getItem('vktg_my_keys'));
        const privKeyObj = await window.crypto.subtle.importKey("jwk", storedKeys.privateKey, { name: "RSA-OAEP", hash: {name: "SHA-256"} }, true, ["decrypt"]);

        const encryptedAesKey = new Uint8Array(atob(aesKeyB64).split("").map(c => c.charCodeAt(0)));
        const iv = new Uint8Array(atob(ivB64).split("").map(c => c.charCodeAt(0)));
        const ciphertext = new Uint8Array(encryptedBuffer);

        const rawAesKey = await window.crypto.subtle.decrypt({ name: "RSA-OAEP" }, privKeyObj, encryptedAesKey);
        const aesKey = await window.crypto.subtle.importKey("raw", rawAesKey, { name: "AES-GCM" }, true, ["decrypt"]);
        
        const decryptedBytes = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, aesKey, ciphertext);

        const blob = new Blob([decryptedBytes], { type: mimeType });
        const blobUrl = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = originalName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (err) {
        alert("Ошибка скачивания или дешифрования: " + err.message);
      }
    }

    function formatTimestamp(timestamp) {
      const date = new Date(timestamp * 1000);
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
