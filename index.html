<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VKTG Secure — Firebase + SolidJS</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SolidJS UMD -->
  <script src="https://unpkg.com/solid-js@1.8/dist/solid.umd.js" crossorigin></script>
  <script src="https://unpkg.com/solid-js@1.8/dist/solid-jsx.umd.js" crossorigin></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- Roboto Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #05070a;
      margin: 0;
      padding: 0;
      overflow: hidden;
      color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    .mobile-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      background-color: #0b0e14;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.85);
      border-left: 1px solid #1a2230;
      border-right: 1px solid #1a2230;
    }
    @media (max-width: 768px) {
      .mobile-container { max-width: 100% !important; height: 100vh; border: none; }
    }
    .tg-chat-wallpaper {
      background-color: #080c10;
      background-image: radial-gradient(rgba(82,136,193,0.03) 1.5px, transparent 0);
      background-size: 32px 32px;
    }
    .scrollable-area { overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .scrollable-area::-webkit-scrollbar { display: none; }
    .bubble-out {
      background: linear-gradient(135deg, #1e3550 0%, #172a40 100%);
      border-radius: 16px 16px 4px 16px;
      border: 1px solid rgba(82,136,193,0.15);
    }
    .bubble-in {
      background: linear-gradient(135deg, #161f2c 0%, #111822 100%);
      border-radius: 16px 16px 16px 4px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    @keyframes slide-right {
      from { transform: translateX(-100%); }
      to   { transform: translateX(0); }
    }
    .animate-slide-right { animation: slide-right 0.24s cubic-bezier(0.1,0.9,0.2,1) forwards; }
    @keyframes slide-up {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    .animate-slide-up { animation: slide-up 0.22s cubic-bezier(0.1,0.9,0.2,1) forwards; }
    .secure-indicator-pulse { animation: pulse-secure 2.5s infinite ease-in-out; }
    @keyframes pulse-secure { 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.04); opacity:0.85; } }
  </style>
</head>
<body>
  <div id="root" class="mobile-container"></div>

  <!-- Load modules in order -->
  <script src="firebase-config.js"></script>
  <script src="crypto-utils.js"></script>
  <script src="design.js"></script>
  <script src="app.js"></script>
</body>
</html>
