<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PhotoForge Pro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; color: #e8e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  #app { width: 100%; height: 100%; display: flex; flex-direction: column; }

  /* Header */
  .header { flex-shrink: 0; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: rgba(10,10,15,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 100; }
  .header-title { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .btn-icon { width: 36px; height: 36px; border-radius: 10px; border: none; background: rgba(255,255,255,0.06); color: #b0b0c0; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; }
  .btn-icon:active { background: rgba(255,255,255,0.12); transform: scale(0.92); }
  .btn-icon svg { width: 18px; height: 18px; }
  .btn-primary { padding: 8px 16px; border-radius: 10px; border: none; background: linear-gradient(135deg, #667eea, #764ba2); color: white; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-primary:active { opacity: 0.8; transform: scale(0.96); }

  /* Canvas Area */
  .canvas-wrapper { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #0d0d14; }
  #canvas { max-width: 100%; max-height: 100%; touch-action: none; }

  /* Empty State */
  .empty-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
  .empty-state svg { width: 64px; height: 64px; opacity: 0.3; }
  .empty-state h2 { font-size: 18px; color: #8888a0; font-weight: 500; }
  .empty-state p { font-size: 13px; color: #555; }
  .upload-btn { padding: 14px 32px; border-radius: 14px; border: none; background: linear-gradient(135deg, #667eea, #764ba2); color: white; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  .upload-btn:active { transform: scale(0.95); }

  /* Tools Panel */
  .tools-panel { flex-shrink: 0; background: rgba(10,10,15,0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.05); z-index: 100; }

  /* Tool Tabs */
  .tool-tabs { display: flex; overflow-x: auto; padding: 8px 12px; gap: 6px; scrollbar-width: none; }
  .tool-tabs::-webkit-scrollbar { display: none; }
  .tool-tab { flex-shrink: 0; padding: 8px 14px; border-radius: 10px; border: none; background: rgba(255,255,255,0.04); color: #8888a0; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
  .tool-tab.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
  .tool-tab:active { transform: scale(0.95); }

  /* Tool Content */
  .tool-content { padding: 8px 12px 12px; display: none; }
  .tool-content.active { display: block; }

  /* Brush Tool */
  .brush-preview { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .brush-preview-canvas { width: 48px; height: 48px; border-radius: 10px; background: rgba(255,255,255,0.04); flex-shrink: 0; }
  .brush-controls { flex: 1; }
  .slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .slider-row label { font-size: 11px; color: #8888a0; width: 50px; flex-shrink: 0; }
  .slider-row input[type="range"] { flex: 1; -webkit-appearance: none; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1); outline: none; }
  .slider-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); cursor: pointer; }
  .slider-row span { font-size: 11px; color: #b0b0c0; width: 30px; text-align: right; }

  .color-palette { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .color-swatch { width: 28px; height: 28px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; transition: all 0.15s; }
  .color-swatch.active { border-color: #667eea; transform: scale(1.15); }
  .color-swatch:active { transform: scale(0.9); }

  /* Adjustments */
  .adjust-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .adjust-item { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 10px; }
  .adjust-item label { font-size: 11px; color: #8888a0; display: block; margin-bottom: 6px; }
  .adjust-item input[type="range"] { width: 100%; -webkit-appearance: none; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1); outline: none; }
  .adjust-item input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); cursor: pointer; }
  .adjust-value { font-size: 11px; color: #b0b0c0; text-align: right; margin-top: 4px; }

  /* Filters */
  .filters-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .filter-item { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 10px 6px; text-align: center; cursor: pointer; transition: all 0.15s; border: 2px solid transparent; }
  .filter-item.active { border-color: #667eea; background: rgba(102,126,234,0.1); }
  .filter-item:active { transform: scale(0.95); }
  .filter-item .filter-preview { width: 100%; aspect-ratio: 1; border-radius: 8px; background: linear-gradient(135deg, #1a1a2e, #16213e); margin-bottom: 6px; position: relative; overflow: hidden; }
  .filter-item .filter-preview img { width: 100%; height: 100%; object-fit: cover; }
  .filter-item span { font-size: 10px; color: #8888a0; }

  /* Effects */
  .effects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .effect-item { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.15s; border: 2px solid transparent; }
  .effect-item.active { border-color: #667eea; background: rgba(102,126,234,0.1); }
  .effect-item:active { transform: scale(0.95); }
  .effect-item svg { width: 24px; height: 24px; margin-bottom: 6px; color: #667eea; }
  .effect-item span { font-size: 10px; color: #8888a0; display: block; }

  /* Crop & Rotate */
  .crop-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .crop-item { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; transition: all 0.15s; }
  .crop-item:active { transform: scale(0.95); }
  .crop-item svg { width: 20px; height: 20px; color: #8888a0; }
  .crop-item span { font-size: 10px; color: #8888a0; display: block; margin-top: 4px; }

  /* Undo/Redo bar */
  .undo-bar { display: flex; justify-content: center; gap: 16px; padding: 6px 0; border-top: 1px solid rgba(255,255,255,0.03); }

  /* Loading */
  .loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 999; }
  .loading-overlay.active { display: flex; }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(30,30,45,0.95); color: white; padding: 10px 20px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 1000; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Hidden file input */
  #fileInput { display: none; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-title">PhotoForge Pro</div>
    <div class="header-actions">
      <button class="btn-icon" onclick="uploadPhoto()" title="Загрузить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <button class="btn-icon" onclick="undo()" title="Отменить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      </button>
      <button class="btn-icon" onclick="redo()" title="Повторить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
      <button class="btn-icon" onclick="resetAll()" title="Сбросить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
      <button class="btn-primary" onclick="downloadImage()">Сохранить</button>
    </div>
  </div>

  <div class="canvas-wrapper" id="canvasWrapper">
    <canvas id="canvas"></canvas>
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <h2>Нет фото</h2>
      <p>Загрузите фото из галереи, чтобы начать редактирование</p>
      <button class="upload-btn" onclick="uploadPhoto()">Выбрать фото</button>
    </div>
  </div>

  <div class="tools-panel">
    <div class="tool-tabs" id="toolTabs">
      <button class="tool-tab active" data-tab="brush">Кисть</button>
      <button class="tool-tab" data-tab="adjust">Настройки</button>
      <button class="tool-tab" data-tab="filters">Фильтры</button>
      <button class="tool-tab" data-tab="effects">Эффекты</button>
      <button class="tool-tab" data-tab="crop">Кадр</button>
    </div>

    <div class="tool-content active" id="tab-brush">
      <div class="brush-preview">
        <canvas class="brush-preview-canvas" id="brushPreview"></canvas>
        <div class="brush-controls">
          <div class="slider-row">
            <label>Размер</label>
            <input type="range" id="brushSize" min="1" max="100" value="20" oninput="updateBrush()">
            <span id="brushSizeVal">20</span>
          </div>
          <div class="slider-row">
            <label>Непрозрач.</label>
            <input type="range" id="brushOpacity" min="1" max="100" value="100" oninput="updateBrush()">
            <span id="brushOpacityVal">100</span>
          </div>
          <div class="slider-row">
            <label>Размытие</label>
            <input type="range" id="brushBlur" min="0" max="20" value="0" oninput="updateBrush()">
            <span id="brushBlurVal">0</span>
          </div>
        </div>
      </div>
      <div class="color-palette" id="colorPalette">
        <div class="color-swatch active" style="background:#ff0000" data-color="#ff0000"></div>
        <div class="color-swatch" style="background:#00ff00" data-color="#00ff00"></div>
        <div class="color-swatch" style="background:#0000ff" data-color="#0000ff"></div>
        <div class="color-swatch" style="background:#ffff00" data-color="#ffff00"></div>
        <div class="color-swatch" style="background:#ff00ff" data-color="#ff00ff"></div>
        <div class="color-swatch" style="background:#00ffff" data-color="#00ffff"></div>
        <div class="color-swatch" style="background:#ffffff" data-color="#ffffff"></div>
        <div class="color-swatch" style="background:#000000" data-color="#000000"></div>
        <div class="color-swatch" style="background:#ff8800" data-color="#ff8800"></div>
        <div class="color-swatch" style="background:#8800ff" data-color="#8800ff"></div>
        <div class="color-swatch" style="background:#ff5555" data-color="#ff5555"></div>
        <div class="color-swatch" style="background:#55ff55" data-color="#55ff55"></div>
      </div>
    </div>

    <div class="tool-content" id="tab-adjust">
      <div class="adjust-grid">
        <div class="adjust-item">
          <label>Яркость</label>
          <input type="range" id="brightness" min="-100" max="100" value="0" oninput="applyAdjustments()">
          <div class="adjust-value" id="brightnessVal">0</div>
        </div>
        <div class="adjust-item">
          <label>Контраст</label>
          <input type="range" id="contrast" min="-100" max="100" value="0" oninput="applyAdjustments()">
          <div class="adjust-value" id="contrastVal">0</div>
        </div>
        <div class="adjust-item">
          <label>Насыщенность</label>
          <input type="range" id="saturation" min="-100" max="100" value="0" oninput="applyAdjustments()">
          <div class="adjust-value" id="saturationVal">0</div>
        </div>
        <div class="adjust-item">
          <label>Теплота</label>
          <input type="range" id="warmth" min="-100" max="100" value="0" oninput="applyAdjustments()">
          <div class="adjust-value" id="warmthVal">0</div>
        </div>
        <div class="adjust-item">
          <label>Резкость</label>
          <input type="range" id="sharpness" min="0" max="100" value="0" oninput="applyAdjustments()">
          <div class="adjust-value" id="sharpnessVal">0</div>
        </div>
        <div class="adjust-item">
          <label>Экспозиция</label>
          <input type="range" id="exposure" min="-100" max="100" value="0" oninput="applyAdjustments()">
          <div class="adjust-value" id="exposureVal">0</div>
        </div>
        <div class="adjust-item">
          <label>Тени</label>
          <input type="range" id="shadows" min="-100" max="100" value="0" oninput="applyAdjustments()">
          <div class="adjust-value" id="shadowsVal">0</div>
        </div>
        <div class="adjust-item">
          <label>Света</label>
          <input type="range" id="highlights" min="-100" max="100" value="0" oninput="applyAdjustments()">
          <div class="adjust-value" id="highlightsVal">0</div>
        </div>
      </div>
    </div>

    <div class="tool-content" id="tab-filters">
      <div class="filters-grid" id="filtersGrid"></div>
    </div>

    <div class="tool-content" id="tab-effects">
      <div class="effects-grid">
        <div class="effect-item" onclick="applyEffect('blur')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
          <span>Размытие</span>
        </div>
        <div class="effect-item" onclick="applyEffect('pixelate')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          <span>Пиксель</span>
        </div>
        <div class="effect-item" onclick="applyEffect('vignette')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/></svg>
          <span>Виньетка</span>
        </div>
        <div class="effect-item" onclick="applyEffect('noise')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          <span>Шум</span>
        </div>
        <div class="effect-item" onclick="applyEffect('oil')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
          <span>Масло</span>
        </div>
        <div class="effect-item" onclick="applyEffect('sketch')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
          <span>Эскиз</span>
        </div>
        <div class="effect-item" onclick="applyEffect('invert')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20z"/></svg>
          <span>Инверсия</span>
        </div>
        <div class="effect-item" onclick="applyEffect('sepia')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <span>Сепия</span>
        </div>
        <div class="effect-item" onclick="applyEffect('emboss')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l16 16"/><path d="M4 20l16-16"/></svg>

    <div class="tool-content" id="tab-crop">
      <div class="crop-grid">
        <div class="crop-item" onclick="rotateImage(90)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          <span>Повернуть 90°</span>
        </div>
        <div class="crop-item" onclick="rotateImage(-90)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          <span>Повернуть -90°</span>
        </div>
        <div class="crop-item" onclick="flipImage('h')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V4"/><path d="M5 10l7-6 7 6"/></svg>
          <span>Отразить Г</span>
        </div>
        <div class="crop-item" onclick="flipImage('v')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16"/><path d="M14 6l6 6-6 6"/></svg>
          <span>Отразить В</span>
        </div>
        <div class="crop-item" onclick="cropRatio(1,1)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
          <span>1:1</span>
        </div>
        <div class="crop-item" onclick="cropRatio(4,3)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/></svg>
          <span>4:3</span>
        </div>
        <div class="crop-item" onclick="cropRatio(16,9)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="22" height="12" rx="2"/></svg>
          <span>16:9</span>
        </div>
        <div class="crop-item" onclick="cropRatio(3,4)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/></svg>
          <span>3:4</span>
        </div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)">
<div class="loading-overlay" id="loading"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<script>
// ===== STATE =====
let canvas, ctx, originalImage = null, currentImage = null;
let historyStack = [], historyIndex = -1;
let isDrawing = false, lastX = 0, lastY = 0;
let brushColor = '#ff0000', brushSize = 20, brushOpacity = 1, brushBlur = 0;
let adjustments = { brightness:0, contrast:0, saturation:0, warmth:0, sharpness:0, exposure:0, shadows:0, highlights:0 };
let currentFilter = 'none';
let rotation = 0, flipH = 1, flipV = 1;

// ===== INIT =====
window.onload = function() {
  canvas = document.getElementById('canvas');
  ctx = canvas.getContext('2d');
  initTabs();
  initColorPalette();
  updateBrush();
  generateFilterPreviews();

  // Touch events for drawing
  canvas.addEventListener('touchstart', handleTouchStart, {passive:false});
  canvas.addEventListener('touchmove', handleTouchMove, {passive:false});
  canvas.addEventListener('touchend', handleTouchEnd, {passive:false});
  canvas.addEventListener('touchcancel', handleTouchEnd, {passive:false});
};

function initTabs() {
  document.querySelectorAll('.tool-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tool-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tool-content').forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
  });
}

function initColorPalette() {
  document.querySelectorAll('.color-swatch').forEach(swatch => {
    swatch.addEventListener('click', () => {
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      swatch.classList.add('active');
      brushColor = swatch.dataset.color;
      updateBrush();
    });
  });
}

// ===== FILE UPLOAD =====
function uploadPhoto() {
  document.getElementById('fileInput').click();
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  showLoading(true);
  const reader = new FileReader();
  reader.onload = function(evt) {
    const img = new Image();
    img.onload = function() {
      originalImage = img;
      currentImage = img;
      resetState();
      fitCanvas();
      renderCanvas();
      document.getElementById('emptyState').style.display = 'none';
      showLoading(false);
      showToast('Фото загружено!');
      pushHistory();
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
}

function fitCanvas() {
  if (!currentImage) return;
  const wrapper = document.getElementById('canvasWrapper');
  const maxW = wrapper.clientWidth - 20;
  const maxH = wrapper.clientHeight - 20;
  let w = currentImage.width;
  let h = currentImage.height;
  const ratio = Math.min(maxW / w, maxH / h, 1);
  canvas.width = w;
  canvas.height = h;
  canvas.style.width = (w * ratio) + 'px';
  canvas.style.height = (h * ratio) + 'px';
}

// ===== RENDER =====
function renderCanvas() {
  if (!currentImage) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.rotate(rotation * Math.PI / 180);
  ctx.scale(flipH, flipV);
  ctx.translate(-canvas.width/2, -canvas.height/2);
  ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
  ctx.restore();
}

// ===== HISTORY =====
function pushHistory() {
  if (historyIndex < historyStack.length - 1) {
    historyStack = historyStack.slice(0, historyIndex + 1);
  }
  historyStack.push(canvas.toDataURL());
  historyIndex++;
  if (historyStack.length > 20) {
    historyStack.shift();
    historyIndex--;
  }
}

function undo() {
  if (historyIndex > 0) {
    historyIndex--;
    loadFromHistory();
  }
}

function redo() {
  if (historyIndex < historyStack.length - 1) {
    historyIndex++;
    loadFromHistory();
  }
}

function loadFromHistory() {
  const img = new Image();
  img.onload = function() {
    currentImage = img;
    fitCanvas();
    renderCanvas();
  };
  img.src = historyStack[historyIndex];
}

function resetAll() {
  if (!originalImage) return;
  currentImage = originalImage;
  resetState();
  fitCanvas();
  renderCanvas();
  pushHistory();
  showToast('Сброшено');
}

function resetState() {
  rotation = 0; flipH = 1; flipV = 1;
  adjustments = { brightness:0, contrast:0, saturation:0, warmth:0, sharpness:0, exposure:0, shadows:0, highlights:0 };
  currentFilter = 'none';
  document.querySelectorAll('.tool-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.tool-tab[data-tab="brush"]').classList.add('active');
  document.querySelectorAll('.tool-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-brush').classList.add('active');
  document.querySelectorAll('.filter-item').forEach(f => f.classList.remove('active'));
  document.querySelectorAll('.effect-item').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('input[type="range"]').forEach(s => {
    if (s.id !== 'brushSize' && s.id !== 'brushOpacity' && s.id !== 'brushBlur') {
      s.value = 0;
      const valId = s.id + 'Val';
      if (document.getElementById(valId)) document.getElementById(valId).textContent = '0';
    }
  });
}

// ===== BRUSH DRAWING =====
function getTouchPos(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (touch.clientX - rect.left) * scaleX,
    y: (touch.clientY - rect.top) * scaleY
  };
}

function handleTouchStart(e) {
  if (!currentImage) return;
  if (document.querySelector('.tool-tab.active').dataset.tab !== 'brush') return;
  e.preventDefault();
  isDrawing = true;
  const pos = getTouchPos(e);
  lastX = pos.x;
  lastY = pos.y;
  drawPoint(pos.x, pos.y);
}

function handleTouchMove(e) {
  if (!isDrawing) return;
  e.preventDefault();
  const pos = getTouchPos(e);
  drawLine(lastX, lastY, pos.x, pos.y);
  lastX = pos.x;
  lastY = pos.y;
}

function handleTouchEnd(e) {
  if (isDrawing) {
    isDrawing = false;
    pushHistory();
  }
}

function drawPoint(x, y) {
  ctx.save();
  ctx.globalAlpha = brushOpacity;
  ctx.filter = 'blur(' + brushBlur + 'px)';
  ctx.beginPath();
  ctx.arc(x, y, brushSize / 2, 0, Math.PI * 2);
  ctx.fillStyle = brushColor;
  ctx.fill();
  ctx.restore();
}

function drawLine(x1, y1, x2, y2) {
  ctx.save();
  ctx.globalAlpha = brushOpacity;
  ctx.filter = 'blur(' + brushBlur + 'px)';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = brushColor;
  ctx.lineWidth = brushSize;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.restore();
}

function updateBrush() {
  brushSize = parseInt(document.getElementById('brushSize').value);
  brushOpacity = parseInt(document.getElementById('brushOpacity').value) / 100;
  brushBlur = parseInt(document.getElementById('brushBlur').value);
  document.getElementById('brushSizeVal').textContent = brushSize;
  document.getElementById('brushOpacityVal').textContent = document.getElementById('brushOpacity').value;
  document.getElementById('brushBlurVal').textContent = brushBlur;

  const preview = document.getElementById('brushPreview');
  const pctx = preview.getContext('2d');
  preview.width = 48; preview.height = 48;
  pctx.clearRect(0, 0, 48, 48);
  pctx.save();
  pctx.globalAlpha = brushOpacity;
  pctx.filter = 'blur(' + brushBlur + 'px)';
  pctx.beginPath();
  pctx.arc(24, 24, Math.min(brushSize/2, 20), 0, Math.PI * 2);
  pctx.fillStyle = brushColor;
  pctx.fill();
  pctx.restore();
}

// ===== ADJUSTMENTS =====
function applyAdjustments() {
  if (!originalImage) return;
  adjustments.brightness = parseInt(document.getElementById('brightness').value);
  adjustments.contrast = parseInt(document.getElementById('contrast').value);
  adjustments.saturation = parseInt(document.getElementById('saturation').value);
  adjustments.warmth = parseInt(document.getElementById('warmth').value);
  adjustments.sharpness = parseInt(document.getElementById('sharpness').value);
  adjustments.exposure = parseInt(document.getElementById('exposure').value);
  adjustments.shadows = parseInt(document.getElementById('shadows').value);
  adjustments.highlights = parseInt(document.getElementById('highlights').value);

  document.getElementById('brightnessVal').textContent = adjustments.brightness;
  document.getElementById('contrastVal').textContent = adjustments.contrast;
  document.getElementById('saturationVal').textContent = adjustments.saturation;
  document.getElementById('warmthVal').textContent = adjustments.warmth;
  document.getElementById('sharpnessVal').textContent = adjustments.sharpness;
  document.getElementById('exposureVal').textContent = adjustments.exposure;
  document.getElementById('shadowsVal').textContent = adjustments.shadows;
  document.getElementById('highlightsVal').textContent = adjustments.highlights;

  applyAllEffects();
}

// ===== FILTERS =====
const filters = [
  {name:'Оригинал', filter:'none'},
  {name:'Ч/Б', filter:'grayscale(100%)'},
  {name:'Сепия', filter:'sepia(100%)'},
  {name:'Винтаж', filter:'sepia(30%) contrast(1.2) brightness(0.9)'},
  {name:'Кино', filter:'contrast(1.3) saturate(1.2)'},
  {name:'Холодный', filter:'hue-rotate(180deg) saturate(0.7)'},
  {name:'Теплый', filter:'hue-rotate(-15deg) saturate(1.3)'},
  {name:'Неон', filter:'saturate(2) contrast(1.3) brightness(1.1)'},
  {name:'Пастель', filter:'saturate(0.5) brightness(1.1)'},
  {name:'Драма', filter:'contrast(1.5) brightness(0.8) saturate(0.8)'},
  {name:'Мягкий', filter:'brightness(1.1) contrast(0.9) saturate(0.9)'},
  {name:'HDR', filter:'contrast(1.4) saturate(1.3)'}
];

function generateFilterPreviews() {
  const grid = document.getElementById('filtersGrid');
  filters.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'filter-item' + (i === 0 ? ' active' : '');
    div.innerHTML = '<div class="filter-preview" style="filter:' + f.filter + '"><div style="width:100%;height:100%;background:linear-gradient(135deg,#667eea,#764ba2)"></div></div><span>' + f.name + '</span>';
    div.onclick = () => applyFilter(f.filter, div);
    grid.appendChild(div);
  });
}

function applyFilter(filterStr, el) {
  currentFilter = filterStr;
  document.querySelectorAll('.filter-item').forEach(f => f.classList.remove('active'));
  if (el) el.classList.add('active');
  applyAllEffects();
  pushHistory();
}

// ===== EFFECTS =====
function applyEffect(type) {
  if (!currentImage) { showToast('Сначала загрузите фото'); return; }
  showLoading(true);
  setTimeout(() => {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    const tctx = tempCanvas.getContext('2d');
    tctx.drawImage(canvas, 0, 0);

    switch(type) {
      case 'blur':
        tctx.filter = 'blur(5px)';
        tctx.drawImage(tempCanvas, 0, 0);
        break;
      case 'pixelate':
        pixelate(tctx, tempCanvas.width, tempCanvas.height, 10);
        break;
      case 'vignette':
        applyVignette(tctx, tempCanvas.width, tempCanvas.height);
        break;
      case 'noise':
        applyNoise(tctx, tempCanvas.width, tempCanvas.height);
        break;
      case 'invert':
        tctx.filter = 'invert(100%)';
        tctx.drawImage(tempCanvas, 0, 0);
        break;
      case 'sepia':
        tctx.filter = 'sepia(100%)';
        tctx.drawImage(tempCanvas, 0, 0);
        break;
      case 'emboss':
        applyEmboss(tctx, tempCanvas.width, tempCanvas.height);
        break;
      case 'sketch':
        applySketch(tctx, tempCanvas.width, tempCanvas.height);
        break;
      case 'oil':
        applyOil(tctx, tempCanvas.width, tempCanvas.height);
        break;
    }

    const img = new Image();
    img.onload = function() {
      currentImage = img;
      renderCanvas();
      pushHistory();
      showLoading(false);
      showToast('Эффект применен');
    };
    img.src = tempCanvas.toDataURL();
  }, 50);
}

function pixelate(ctx, w, h, blockSize) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  for (let y = 0; y < h; y += blockSize) {
    for (let x = 0; x < w; x += blockSize) {
      let r = 0, g = 0, b = 0, count = 0;
      for (let dy = 0; dy < blockSize && y + dy < h; dy++) {
        for (let dx = 0; dx < blockSize && x + dx < w; dx++) {
          const i = ((y + dy) * w + (x + dx)) * 4;
          r += data[i]; g += data[i+1]; b += data[i+2]; count++;
        }
      }
      r /= count; g /= count; b /= count;
      for (let dy = 0; dy < blockSize && y + dy < h; dy++) {
        for (let dx = 0; dx < blockSize && x + dx < w; dx++) {
          const i = ((y + dy) * w + (x + dx)) * 4;
          data[i] = r; data[i+1] = g; data[i+2] = b;
        }
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function applyVignette(ctx, w, h) {
  const grad = ctx.createRadialGradient(w/2, h/2, w*0.3, w/2, h/2, w*0.8);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
}

function applyNoise(ctx, w, h) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const noise = (Math.random() - 0.5) * 40;
    data[i] = Math.min(255, Math.max(0, data[i] + noise));
    data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
    data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
  }
  ctx.putImageData(imgData, 0, 0);
}

function applyEmboss(ctx, w, h) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const copy = new Uint8ClampedArray(data);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = (y * w + x) * 4;
      const upLeft = ((y-1) * w + (x-1)) * 4;
      const downRight = ((y+1) * w + (x+1)) * 4;
      for (let c = 0; c < 3; c++) {
        data[i+c] = 128 + copy[upLeft+c] - copy[downRight+c];
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function applySketch(ctx, w, h) {
  ctx.filter = 'grayscale(100%) contrast(200%)';
  ctx.drawImage(canvas, 0, 0);
  ctx.filter = 'none';
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const v = 255 - data[i];
    data[i] = data[i+1] = data[i+2] = v;
  }
  ctx.putImageData(imgData, 0, 0);
}

function applyOil(ctx, w, h) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const copy = new Uint8ClampedArray(data);
  const radius = 3;
  for (let y = radius; y < h - radius; y++) {
    for (let x = radius; x < w - radius; x++) {
      const hist = new Array(256).fill(0);
      let maxCount = 0, maxVal = 0;
      for (let dy = -radius; dy <= radius; dy++) {
        for (let dx = -radius; dx <= radius; dx++) {
          const i = ((y + dy) * w + (x + dx)) * 4;
          const gray = Math.round((copy[i] + copy[i+1] + copy[i+2]) / 3);
          hist[gray]++;
          if (hist[gray] > maxCount) { maxCount = hist[gray]; maxVal = gray; }
        }
      }
      const i = (y * w + x) * 4;
      data[i] = data[i+1] = data[i+2] = maxVal;
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

// ===== APPLY ALL =====
function applyAllEffects() {
  if (!originalImage) return;
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = originalImage.width;
  tempCanvas.height = originalImage.height;
  const tctx = tempCanvas.getContext('2d');

  let filterStr = '';
  if (adjustments.brightness !== 0) filterStr += ' brightness(' + (100 + adjustments.brightness) + '%)';
  if (adjustments.contrast !== 0) filterStr += ' contrast(' + (100 + adjustments.contrast) + '%)';
  if (adjustments.saturation !== 0) filterStr += ' saturate(' + (100 + adjustments.saturation) + '%)';
  if (adjustments.exposure !== 0) filterStr += ' brightness(' + (100 + adjustments.exposure * 0.5) + '%)';
  if (currentFilter !== 'none') filterStr += ' ' + currentFilter;

  tctx.filter = filterStr.trim() || 'none';
  tctx.drawImage(originalImage, 0, 0);
  tctx.filter = 'none';

  if (adjustments.sharpness > 0) {
    applySharpen(tctx, tempCanvas.width, tempCanvas.height, adjustments.sharpness);
  }

  const img = new Image();
  img.onload = function() {
    currentImage = img;
    fitCanvas();
    renderCanvas();
  };
  img.src = tempCanvas.toDataURL();
}

function applySharpen(ctx, w, h, amount) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const copy = new Uint8ClampedArray(data);
  const factor = amount / 100;
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = (y * w + x) * 4;
      for (let c = 0; c < 3; c++) {
        const val = copy[i+c] * (1 + 4*factor) - factor * (
          copy[((y-1)*w+x)*4+c] + copy[((y+1)*w+x)*4+c] +
          copy[(y*w+x-1)*4+c] + copy[(y*w+x+1)*4+c]
        );
        data[i+c] = Math.min(255, Math.max(0, val));
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

// ===== CROP & ROTATE =====
function rotateImage(deg) {
  if (!currentImage) return;
  rotation = (rotation + deg) % 360;
  renderCanvas();
  pushHistory();
}

function flipImage(axis) {
  if (!currentImage) return;
  if (axis === 'h') flipH *= -1;
  else flipV *= -1;
  renderCanvas();
  pushHistory();
}

function cropRatio(w, h) {
  if (!currentImage) return;
  showLoading(true);
  setTimeout(() => {
    const currentW = canvas.width;
    const currentH = canvas.height;
    const targetRatio = w / h;
    const currentRatio = currentW / currentH;
    let newW, newH, sx, sy;
    if (currentRatio > targetRatio) {
      newH = currentH;
      newW = currentH * targetRatio;
      sx = (currentW - newW) / 2;
      sy = 0;
    } else {
      newW = currentW;
      newH = currentW / targetRatio;
      sx = 0;
      sy = (currentH - newH) / 2;
    }
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = newW;
    tempCanvas.height = newH;
    const tctx = tempCanvas.getContext('2d');
    tctx.drawImage(canvas, sx, sy, newW, newH, 0, 0, newW, newH);
    const img = new Image();
    img.onload = function() {
      currentImage = img;
      originalImage = img;
      fitCanvas();
      renderCanvas();
      pushHistory();
      showLoading(false);
      showToast('Обрезано ' + w + ':' + h);
    };
    img.src = tempCanvas.toDataURL();
  }, 50);
}

// ===== DOWNLOAD =====
function downloadImage() {
  if (!currentImage) { showToast('Нет фото для сохранения'); return; }
  const link = document.createElement('a');
  link.download = 'photoforge_' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  showToast('Фото сохранено!');
}

// ===== UTILS =====
function showLoading(show) {
  document.getElementById('loading').classList.toggle('active', show);
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// Prevent zoom on double tap
let lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, false);
</script>
